// 渲染出口（在renderMap后调用）
function renderExits() {
  for (const ex of room.exits) {
    const sc  = toScreen(ex.x, ex.y);
    const sc2 = toScreen(ex.x + ex.w, ex.y + ex.h);

    // 出口门框：等距投影下画一条竖线+发光
    const locked = ex.locked;
    ctx.save();
    ctx.strokeStyle = locked ? '#602020' : '#ffe080';
    ctx.lineWidth   = locked ? 3 : 4;
    ctx.shadowColor = locked ? '#800000' : '#ffc000';
    ctx.shadowBlur  = locked ? 8 : 20;
    ctx.globalAlpha = locked ? 0.5 : 0.9 + 0.1 * Math.sin(now * 0.003);

    // 在出口处画一个发光矩形提示
    const ex1 = toScreen(ex.x, ex.y);
    const ex2 = toScreen(ex.x, ex.y + ex.h);
    // 画出口标记线（垂直方向的发光条）
    ctx.beginPath();
    ctx.moveTo(ex1.x, ex1.y - WALL_H);
    ctx.lineTo(ex2.x, ex2.y - WALL_H);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(ex1.x, ex1.y);
    ctx.lineTo(ex2.x, ex2.y);
    ctx.stroke();

    if (!locked) {
      // 解锁时加箭头提示
      const midSc = toScreen(ex.x, ex.y + ex.h / 2);
      ctx.fillStyle = '#ffe080';
      ctx.font      = 'bold 18px Courier New';
      ctx.textAlign = 'center';
      ctx.shadowBlur = 15;
      ctx.fillText('▶', midSc.x + 20, midSc.y);
    }
    ctx.restore();
  }
}

function tileAt(wx, wy) {
  const col = Math.floor(wx / TILE);
  const row = Math.floor(wy / TILE);
  if (col < 0 || col >= ROOM_COLS || row < 0 || row >= ROOM_ROWS) return 1;
  return room.tiles[row][col];
}
function isWall(wx, wy) { return tileAt(wx, wy) !== 0; }

function renderMap() {
  const pal = ZONE_PALETTES[run.zone] || ZONE_PALETTES[0];
  const ts  = TILE;

  function tileCorners(wx, wy) {
    return [
      toScreen(wx,      wy),
      toScreen(wx + ts, wy),
      toScreen(wx + ts, wy + ts),
      toScreen(wx,      wy + ts),
    ];
  }

  function fillDiamond(corners) {
    ctx.beginPath();
    ctx.moveTo(corners[0].x, corners[0].y);
    ctx.lineTo(corners[1].x, corners[1].y);
    ctx.lineTo(corners[2].x, corners[2].y);
    ctx.lineTo(corners[3].x, corners[3].y);
    ctx.closePath();
    ctx.fill();
  }
  function strokeDiamond(corners) {
    ctx.beginPath();
    ctx.moveTo(corners[0].x, corners[0].y);
    ctx.lineTo(corners[1].x, corners[1].y);
    ctx.lineTo(corners[2].x, corners[2].y);
    ctx.lineTo(corners[3].x, corners[3].y);
    ctx.closePath();
    ctx.stroke();
  }

  // 收集 + 排序
  const visible = [];
  for (let r = 0; r < ROOM_ROWS; r++) {
    for (let c = 0; c < ROOM_COLS; c++) {
      const s = toScreen(c * ts + ts/2, r * ts + ts/2);
      if (s.x > W + ts*3 || s.x < -ts*3) continue;
      if (s.y > H + WALL_H + ts*2 || s.y < -ts*2) continue;
      visible.push({ r, c, t: room.tiles[r][c] });
    }
  }
  visible.sort((a, b) => (a.r + a.c) - (b.r + b.c) || a.r - b.r);

  for (const { r, c, t } of visible) {
    const wx = c * ts, wy = r * ts;
    const co = tileCorners(wx, wy);
    // 中心屏幕坐标（用于纹理偏移）
    const cx = (co[0].x + co[1].x + co[2].x + co[3].x) / 4;
    const cy = (co[0].y + co[1].y + co[2].y + co[3].y) / 4;

    if (t === 0) {
      // ── 地板 ──────────────────────────────────────────
      const checker = (r + c) % 2 === 0;

      // 基础色
      ctx.fillStyle = checker ? pal.floor : pal.floorDark;
      fillDiamond(co);

      // 大理石纹路（用canvas路径模拟斜纹）
      ctx.save();
      ctx.beginPath();
      ctx.moveTo(co[0].x, co[0].y);
      ctx.lineTo(co[1].x, co[1].y);
      ctx.lineTo(co[2].x, co[2].y);
      ctx.lineTo(co[3].x, co[3].y);
      ctx.closePath();
      ctx.clip();

      // 2-3条随机角度的淡金色纹路
      const seed = r * 31 + c * 17;
      const veinCount = 2 + (seed % 2);
      for (let v = 0; v < veinCount; v++) {
        const vAngle = (seed * 0.37 + v * 1.1) % Math.PI;
        const vOff   = ((seed * 13 + v * 7) % 30) - 15;
        const vx1 = cx + Math.cos(vAngle) * 40 + Math.sin(vAngle) * vOff;
        const vy1 = cy + Math.sin(vAngle) * 40 - Math.cos(vAngle) * vOff;
        const vx2 = cx - Math.cos(vAngle) * 40 + Math.sin(vAngle) * vOff;
        const vy2 = cy - Math.sin(vAngle) * 40 - Math.cos(vAngle) * vOff;
        ctx.beginPath();
        ctx.moveTo(vx1, vy1);
        ctx.lineTo(vx2, vy2);
        ctx.strokeStyle = pal.floorVein;
        ctx.lineWidth   = 1 + (seed % 3) * 0.5;
        ctx.stroke();
      }
      ctx.restore();

      // 格线
      ctx.save();
      ctx.globalAlpha = 0.4;
      ctx.strokeStyle = pal.floorLine;
      ctx.lineWidth   = 0.8;
      strokeDiamond(co);
      ctx.restore();

      // 墙投影
      const wallN = r > 0 && room.tiles[r-1][c] === 1;
      const wallW = c > 0 && room.tiles[r][c-1] === 1;
      if (wallN || wallW) {
        ctx.save();
        ctx.beginPath();
        ctx.moveTo(co[0].x, co[0].y);
        ctx.lineTo(co[1].x, co[1].y);
        ctx.lineTo(co[2].x, co[2].y);
        ctx.lineTo(co[3].x, co[3].y);
        ctx.closePath();
        ctx.clip();
        const sg = ctx.createLinearGradient(co[0].x, co[0].y, cx, cy + 10);
        sg.addColorStop(0,   'rgba(0,0,0,0.38)');
        sg.addColorStop(0.6, 'rgba(0,0,0,0)');
        ctx.fillStyle = sg;
        ctx.fill();
        ctx.restore();
      }

    } else {
      // ── 墙块 ──────────────────────────────────────────
      const floorS = r < ROOM_ROWS-1 && room.tiles[r+1][c] === 0;
      const floorE = c < ROOM_COLS-1 && room.tiles[r][c+1] === 0;
      const floorN = r > 0 && room.tiles[r-1][c] === 0;
      const floorW = c > 0 && room.tiles[r][c-1] === 0;
      // 四向都是墙（内部块）不画侧面，也不加轮廓
      const isInner = !floorS && !floorE && !floorN && !floorW;

      // 顶面（大理石白）
      ctx.fillStyle = pal.wallTop;
      fillDiamond(co);

      // 顶面大理石纹
      ctx.save();
      ctx.beginPath();
      ctx.moveTo(co[0].x, co[0].y); ctx.lineTo(co[1].x, co[1].y);
      ctx.lineTo(co[2].x, co[2].y); ctx.lineTo(co[3].x, co[3].y);
      ctx.closePath(); ctx.clip();
      const seed2 = r * 29 + c * 23 + 100;
      ctx.strokeStyle = 'rgba(180,160,100,0.2)';
      ctx.lineWidth   = 1;
      for (let v = 0; v < 2; v++) {
        const va = (seed2 * 0.41 + v * 1.3) % Math.PI;
        ctx.beginPath();
        ctx.moveTo(cx + Math.cos(va)*30, cy + Math.sin(va)*30);
        ctx.lineTo(cx - Math.cos(va)*30, cy - Math.sin(va)*30);
        ctx.stroke();
      }
      ctx.restore();

      // 顶面轮廓：外边缘边界块才画，让柱子轮廓清晰
      if (!isInner) {
        // 亮边（左上两边）
        ctx.save();
        ctx.strokeStyle = 'rgba(255,245,220,0.55)';
        ctx.lineWidth   = 1.5;
        ctx.beginPath();
        ctx.moveTo(co[0].x, co[0].y); ctx.lineTo(co[1].x, co[1].y); // 北→东
        ctx.moveTo(co[0].x, co[0].y); ctx.lineTo(co[3].x, co[3].y); // 北→西
        ctx.stroke();
        // 暗边（右下两边）
        ctx.strokeStyle = 'rgba(0,0,0,0.35)';
        ctx.lineWidth   = 1.5;
        ctx.beginPath();
        ctx.moveTo(co[1].x, co[1].y); ctx.lineTo(co[2].x, co[2].y); // 东→南
        ctx.moveTo(co[3].x, co[3].y); ctx.lineTo(co[2].x, co[2].y); // 西→南
        ctx.stroke();
        // 金色顶线
        ctx.strokeStyle = pal.wallGold;
        ctx.lineWidth   = 1;
        ctx.globalAlpha = 0.5;
        strokeDiamond(co);
        ctx.restore();
      }

      // 正面（南向，玩家正对）
      if (floorS) {
        const tl = co[3], tr = co[2];
        const bl = { x: tl.x, y: tl.y + WALL_H };
        const br = { x: tr.x, y: tr.y + WALL_H };

        // 正面底色（米白石）
        const faceGrad = ctx.createLinearGradient(tl.x, tl.y, bl.x, bl.y);
        faceGrad.addColorStop(0,   pal.wallFace);
        faceGrad.addColorStop(0.7, pal.wallFace);
        faceGrad.addColorStop(1,   'rgba(0,0,0,0.4)');
        ctx.fillStyle = faceGrad;
        ctx.beginPath();
        ctx.moveTo(tl.x, tl.y); ctx.lineTo(tr.x, tr.y);
        ctx.lineTo(br.x, br.y); ctx.lineTo(bl.x, bl.y);
        ctx.closePath(); ctx.fill();

        // 正面顶部金色亮线
        ctx.strokeStyle = pal.wallGold;
        ctx.lineWidth   = 2.5;
        ctx.globalAlpha = 0.85;
        ctx.beginPath();
        ctx.moveTo(tl.x, tl.y); ctx.lineTo(tr.x, tr.y);
        ctx.stroke();
        ctx.globalAlpha = 1;

        // 正面左边缘暗线（立体感）
        ctx.strokeStyle = 'rgba(0,0,0,0.5)';
        ctx.lineWidth   = 1.5;
        ctx.beginPath();
        ctx.moveTo(tl.x, tl.y); ctx.lineTo(bl.x, bl.y);
        ctx.stroke();

        // 正面砖缝（横线）
        ctx.save();
        ctx.strokeStyle = 'rgba(0,0,0,0.18)';
        ctx.lineWidth = 1;
        const fw = tr.x - tl.x;
        for (let row = 1; row <= 2; row++) {
          const ly = tl.y + row * (WALL_H / 3);
          ctx.beginPath();
          ctx.moveTo(tl.x, ly); ctx.lineTo(tr.x, ly);
          ctx.stroke();
        }
        // 竖缝（交错）
        for (let row = 0; row < 3; row++) {
          const off = row % 2 === 0 ? fw * 0.5 : fw * 0.25;
          const ly  = tl.y + row * (WALL_H / 3);
          ctx.beginPath();
          ctx.moveTo(tl.x + off, ly);
          ctx.lineTo(tl.x + off, Math.min(ly + WALL_H/3, bl.y));
          ctx.stroke();
        }
        ctx.restore();

        // 底部地面阴影（更重）
        const sg = ctx.createLinearGradient(0, br.y - 4, 0, br.y + 22);
        sg.addColorStop(0, 'rgba(0,0,0,0.55)');
        sg.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = sg;
        ctx.fillRect(tl.x, br.y - 2, fw, 24);
      }

      // 右侧面（东向）
      if (floorE) {
        const tl = co[1], tr = co[2];
        const bl = { x: tl.x, y: tl.y + WALL_H };
        const br = { x: tr.x, y: tr.y + WALL_H };

        const sideGrad = ctx.createLinearGradient(tl.x, tl.y, bl.x, bl.y);
        sideGrad.addColorStop(0,   pal.wallLeft);
        sideGrad.addColorStop(1,   'rgba(0,0,0,0.5)');
        ctx.fillStyle = sideGrad;
        ctx.beginPath();
        ctx.moveTo(tl.x, tl.y); ctx.lineTo(tr.x, tr.y);
        ctx.lineTo(br.x, br.y); ctx.lineTo(bl.x, bl.y);
        ctx.closePath(); ctx.fill();

        // 右侧顶金线
        ctx.strokeStyle = pal.wallGold;
        ctx.lineWidth   = 1.5;
        ctx.globalAlpha = 0.6;
        ctx.beginPath();
        ctx.moveTo(tl.x, tl.y); ctx.lineTo(tr.x, tr.y);
        ctx.stroke();
        ctx.globalAlpha = 1;

        // 横砖缝
        ctx.save();
        ctx.strokeStyle = 'rgba(0,0,0,0.15)';
        ctx.lineWidth = 1;
        for (let row = 1; row <= 2; row++) {
          const ly = tl.y + row * (WALL_H / 3);
          ctx.beginPath();
          ctx.moveTo(tl.x, ly); ctx.lineTo(tr.x, ly);
          ctx.stroke();
        }
        ctx.restore();

        // 右侧面右边缘暗线
        ctx.strokeStyle = 'rgba(0,0,0,0.55)';
        ctx.lineWidth   = 1.5;
        ctx.beginPath();
        ctx.moveTo(tr.x, tr.y); ctx.lineTo(br.x, br.y);
        ctx.stroke();
      }
    }
  }
}

// ═══════════════════════════════════════════════════════════
// ═══ TITLE SCREEN FX ═══════════════════════════════════════
// ═══════════════════════════════════════════════════════════

// 标题屏飘落的光粒子（羽毛感）
const titleParticles = [];
function initTitleParticles() {
  titleParticles.length = 0;
  for (let i = 0; i < 60; i++) {
    titleParticles.push(makeTitleParticle(true));
  }
}
function makeTitleParticle(randomY) {
  return {
    x:     Math.random() * W,
    y:     randomY ? Math.random() * H : -10,
    vx:    rnd(-0.3, 0.3),
    vy:    rnd(0.3, 0.9),
    size:  rnd(1, 3.5),
    alpha: rnd(0.15, 0.7),
    // 每个粒子独立摇摆
    wobble:      Math.random() * Math.PI * 2,
    wobbleSpeed: rnd(0.01, 0.03),
    wobbleAmt:   rnd(0.2, 0.8),
    // 颜色：白/淡紫/淡金
    col: ['#ffffff','#e0c8ff','#ffd8a0','#c0a8ff'][rndI(0,3)],
  };
}

let titleSweepX = -300; // 扫光X位置

function renderTitleFx(timestamp) {
  const t = timestamp * 0.001;

  // 背景渐变（深紫→纯黑）
  const grad = ctx.createRadialGradient(W/2, H*0.45, 0, W/2, H*0.45, H*0.7);
  grad.addColorStop(0, '#1a0828');
  grad.addColorStop(1, '#060208');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);

  // 底部光晕
  const glowGrad = ctx.createRadialGradient(W/2, H, 0, W/2, H, H*0.6);
  glowGrad.addColorStop(0, 'rgba(80,20,120,0.18)');
  glowGrad.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = glowGrad;
  ctx.fillRect(0, 0, W, H);

  // 飘落粒子
  for (let i = 0; i < titleParticles.length; i++) {
    const p = titleParticles[i];
    p.wobble += p.wobbleSpeed;
    p.x += p.vx + Math.sin(p.wobble) * p.wobbleAmt;
    p.y += p.vy;
    if (p.y > H + 10) {
      titleParticles[i] = makeTitleParticle(false);
      continue;
    }
    ctx.save();
    ctx.globalAlpha = p.alpha * (0.6 + 0.4 * Math.sin(p.wobble * 2));
    ctx.fillStyle   = p.col;
    ctx.shadowColor = p.col;
    ctx.shadowBlur  = 6;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  // 扫光（从左到右扫一遍，然后重置）
  titleSweepX += 3.5;
  if (titleSweepX > W + 300) titleSweepX = -300;
  const sweep = ctx.createLinearGradient(titleSweepX - 120, 0, titleSweepX + 120, 0);
  sweep.addColorStop(0,   'rgba(255,220,255,0)');
  sweep.addColorStop(0.5, 'rgba(255,220,255,0.04)');
  sweep.addColorStop(1,   'rgba(255,220,255,0)');
  ctx.fillStyle = sweep;
  ctx.fillRect(0, 0, W, H);

  // 标题字（canvas里画，叠在DOM文字之上增强光效）
  // 用canvas画脉动光晕圆，DOM文字本身叠在上面
  const pulse = 0.7 + 0.3 * Math.sin(t * 1.4);
  const haloGrad = ctx.createRadialGradient(W/2, H*0.42, 0, W/2, H*0.42, 200);
  haloGrad.addColorStop(0, `rgba(120,40,200,${0.22 * pulse})`);
  haloGrad.addColorStop(0.5, `rgba(80,20,140,${0.1 * pulse})`);
  haloGrad.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = haloGrad;
  ctx.fillRect(0, 0, W, H);

  // 细横线装饰（标题上下各一条）
  const lineY1 = H * 0.38, lineY2 = H * 0.55;
  const lineAlpha = 0.12 + 0.06 * Math.sin(t * 0.7);
  ctx.strokeStyle = `rgba(180,120,220,${lineAlpha})`;
  ctx.lineWidth = 1;
  const lineW = 320;
  ctx.beginPath();
  ctx.moveTo(W/2 - lineW, lineY1); ctx.lineTo(W/2 + lineW, lineY1);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(W/2 - lineW, lineY2); ctx.lineTo(W/2 + lineW, lineY2);
  ctx.stroke();
}

// ═══════════════════════════════════════════════════════════
// ═══ GAME LOOP ══════════════════════════════════════════════
// ═══════════════════════════════════════════════════════════
function loop(timestamp) {
  requestAnimationFrame(loop);
  now = timestamp;

  // 标题/死亡/胜利等非playing状态：渲染标题特效背景
  if (gameState === S.TITLE || gameState === S.DEAD || gameState === S.WIN) {
    renderTitleFx(timestamp);
    needResetDelta = true;
    return;
  }
  if (gameState === S.BUFF || gameState === S.PAUSE || gameState === S.WEAPON) {
    needResetDelta = true;
    ctx.fillStyle = '#0e0c0a';
    ctx.fillRect(0, 0, W, H);
    return;
  }
  if (gameState === S.ROUTE || gameState === S.SHOP) {
    needResetDelta = true;
    // 渲染游戏场景做暗色背景
    const zoneBg = ['#2a2848,#0e0c1e', '#1a1604,#060400', '#080a18,#020408'][run.zone] || '#2a2848,#0e0c1e';
    const [bgC0r, bgC1r] = zoneBg.split(',');
    const bgGr = ctx.createRadialGradient(W/2, H/2, 0, W/2, H/2, Math.max(W,H)*0.75);
    bgGr.addColorStop(0, bgC0r); bgGr.addColorStop(1, bgC1r);
    ctx.fillStyle = bgGr;
    ctx.fillRect(0, 0, W, H);
    renderMap();
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(0, 0, W, H);
    return;
  }
  if (gameState === S.DIALOG) {
    needResetDelta = true;
    // 渲染游戏场景做背景（不更新逻辑），然后叠暗色遮罩
    const zoneBg = ['#2a2848,#0e0c1e', '#1a1604,#060400', '#080a18,#020408'][run.zone] || '#2a2848,#0e0c1e';
    const [bgC0, bgC1] = zoneBg.split(',');
    const bgGrad = ctx.createRadialGradient(W/2, H/2, 0, W/2, H/2, Math.max(W,H)*0.75);
    bgGrad.addColorStop(0, bgC0);
    bgGrad.addColorStop(1, bgC1);
    ctx.fillStyle = bgGrad;
    ctx.fillRect(0, 0, W, H);
    renderMap();
    renderExits();
    renderEnemies();
    renderPlayer();
    // 半透明暗遮罩增强对话框可读性
    ctx.fillStyle = 'rgba(0,0,0,0.55)';
    ctx.fillRect(0, 0, W, H);
    // 立绘
    renderPortrait(currentLine());
    updateDialog(1);   // fd=1：固定速度打字，不依赖真实帧时间（DIALOG下游戏冻结）
    return;
  }

  // PLAYING
  if (needResetDelta) {
    lastTime = timestamp;
    needResetDelta = false;
    return;
  }
  const rawDelta = Math.min(timestamp - lastTime, 50);
  lastTime = timestamp;
  const fd = rawDelta / (1000 / 60);

  // ── UPDATE ──
  // 鼠标等距反算世界坐标
  const mw = fromScreen(mouse.x, mouse.y);
  mouse.worldX = mw.x;
  mouse.worldY = mw.y;

  // 命中顿帧——冻结游戏逻辑几帧
  if (hitStopTimer > 0) { hitStopTimer -= fd; return; }

  movePlayer(fd);
  // 冲刺尾迹：每帧持续喷出粒子
  if (player.dashTimer > 0) {
    spawnParticles(player.x, player.y, '#a060ff', 2, {
      angle: Math.atan2(-player.dashVy, -player.dashVx), spread: 0.5,
      spdMin: 1, spdMax: 3.5, rMin: 1, rMax: 2.5,
      decayMin: 0.06, decayMax: 0.12,
    });
  }
  updateAttacks(fd);
  updateEnemies(fd);
  updateProjectiles(fd);
  updateParticles(fd);
  updateFloatingTexts(fd);
  checkExitUnlock();
  checkExitTrigger();
  updateFade(fd);
  if (player.flashTimer > 0) player.flashTimer -= fd;
  if (player.invincible > 0) player.invincible -= fd;
  screenShake *= 0.82;
  updateCamera();
  updateHUD();

  // ── RENDER ──
  ctx.save();
  if (screenShake > 0.5) {
    ctx.translate(rnd(-screenShake, screenShake), rnd(-screenShake, screenShake));
  }
  // 背景渐变（按区域调色板）
  const zoneBg = ['#2a2848,#0e0c1e', '#1a1604,#060400', '#080a18,#020408'][run.zone] || '#2a2848,#0e0c1e';
  const [bgC0, bgC1] = zoneBg.split(',');
  const bgGrad = ctx.createRadialGradient(W/2, H/2, 0, W/2, H/2, Math.max(W,H)*0.75);
  bgGrad.addColorStop(0, bgC0);
  bgGrad.addColorStop(1, bgC1);
  ctx.fillStyle = bgGrad;
  ctx.fillRect(0, 0, W, H);
  renderMap();
  renderExits();
  renderAttacks();
  renderProjectiles();
  renderEnemies();
  renderParticles();
  renderPlayer();
  renderFloatingTexts();
  ctx.restore();

  // 房间切换淡入淡出覆盖层（在shake之外，全屏覆盖）
  if (fadeAlpha > 0) {
    ctx.save();
    ctx.globalAlpha = fadeAlpha;
    ctx.fillStyle   = '#000000';
    ctx.fillRect(0, 0, W, H);
    ctx.restore();
  }
}

initTitleParticles();
setGameState(S.TITLE);
requestAnimationFrame(loop);
</script>
