function renderAttacks() {
  for (const a of attacks) {
    const alpha = a.life / a.maxLife;
    if (alpha <= 0) continue;
    const sc = toScreen(a.cx, a.cy);
    const sx = sc.x, sy = sc.y;

    ctx.save();

    if (a.isSpin) {
      // ── 旋转斩：360°全圆渲染 ──────────────────────────
      // 最外层超大光晕（新增，范围感）
      ctx.globalAlpha = alpha * 0.15;
      ctx.strokeStyle = '#ffcc40';
      ctx.lineWidth   = 60;
      ctx.shadowColor = '#ff8000';
      ctx.shadowBlur  = 80;
      ctx.beginPath();
      ctx.arc(sx, sy, a.range, 0, Math.PI * 2);
      ctx.stroke();
      // 外层宽发光圆
      ctx.globalAlpha = alpha * 0.40;
      ctx.strokeStyle = '#ffe080';
      ctx.lineWidth   = 28;
      ctx.shadowColor = '#ffa000';
      ctx.shadowBlur  = 50;
      ctx.beginPath();
      ctx.arc(sx, sy, a.range, 0, Math.PI * 2);
      ctx.stroke();
      // 中层
      ctx.globalAlpha = alpha * 0.80;
      ctx.strokeStyle = '#fff0a0';
      ctx.lineWidth   = 10;
      ctx.shadowBlur  = 22;
      ctx.beginPath();
      ctx.arc(sx, sy, a.range, 0, Math.PI * 2);
      ctx.stroke();
      // 内层锐边
      ctx.globalAlpha = alpha;
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth   = 2.5;
      ctx.shadowColor = '#ffffff';
      ctx.shadowBlur  = 10;
      ctx.beginPath();
      ctx.arc(sx, sy, a.range, 0, Math.PI * 2);
      ctx.stroke();
      // 旋转射线（8条均匀射线增强圣光感）
      ctx.globalAlpha = alpha * 0.45;
      ctx.lineWidth   = 1.5;
      ctx.shadowBlur  = 8;
      ctx.strokeStyle = '#ffe080';
      for (let i = 0; i < 8; i++) {
        const ra = (i / 8) * Math.PI * 2;
        ctx.beginPath();
        ctx.moveTo(sx, sy);
        ctx.lineTo(sx + Math.cos(ra) * a.range, sy + Math.sin(ra) * a.range);
        ctx.stroke();
      }
      // 中心光晕
      ctx.globalAlpha = alpha * 0.35;
      const haloGrad = ctx.createRadialGradient(sx, sy, 0, sx, sy, a.range * 0.6);
      haloGrad.addColorStop(0,   'rgba(255,220,100,0.7)');
      haloGrad.addColorStop(0.5, 'rgba(255,180,40,0.2)');
      haloGrad.addColorStop(1,   'rgba(255,140,0,0)');
      ctx.fillStyle = haloGrad;
      ctx.beginPath();
      ctx.arc(sx, sy, a.range * 0.6, 0, Math.PI * 2);
      ctx.fill();

    } else {
      // ── 普通挥斩：扇形渲染 ────────────────────────────
      // 外层宽发光弧
      ctx.globalAlpha = alpha * 0.35;
      ctx.strokeStyle = a.step === 2 ? '#ffd080' : '#c080ff';
      ctx.lineWidth   = 28;
      ctx.shadowColor = a.step === 2 ? '#ffaa00' : '#8040ff';
    ctx.shadowBlur  = 40;
    ctx.lineCap     = 'round';
    ctx.beginPath();
    ctx.arc(sx, sy, a.range, a.angle - a.arc/2, a.angle + a.arc/2);
    ctx.stroke();
    // 中层
    ctx.globalAlpha = alpha * 0.7;
    ctx.strokeStyle = a.step === 2 ? '#ffe8a0' : '#d0a0ff';
    ctx.lineWidth   = 8;
    ctx.shadowBlur  = 20;
    ctx.beginPath();
    ctx.arc(sx, sy, a.range, a.angle - a.arc/2, a.angle + a.arc/2);
    ctx.stroke();
    // 内层锐边
    ctx.globalAlpha = alpha;
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth   = 2;
    ctx.shadowColor = '#ffffff';
    ctx.shadowBlur  = 8;
    ctx.beginPath();
    ctx.arc(sx, sy, a.range, a.angle - a.arc/2, a.angle + a.arc/2);
    ctx.stroke();
    // 扇形射线
    ctx.globalAlpha = alpha * 0.6;
    ctx.lineWidth   = 2;
    ctx.shadowBlur  = 12;
    for (const side of [-1, 1]) {
      const ea = a.angle + side * a.arc / 2;
      ctx.beginPath();
      ctx.moveTo(sx, sy);
      ctx.lineTo(sx + Math.cos(ea) * a.range, sy + Math.sin(ea) * a.range);
      ctx.stroke();
    }
    } // end else (普通挥斩)

    ctx.restore();
  }
}

// ═══════════════════════════════════════════════════════════
// ═══ ENEMIES ═══════════════════════════════════════════════
// ═══════════════════════════════════════════════════════════
let enemies = [];

// ── 工厂 ─────────────────────────────────────────────────
function makeEnemy(type, x, y) {
  const def = ENEMY_DEFS[type];
  return {
    id:          Math.random(),   // 供 attack.hit Set 去重
    type, x, y,
    r:           def.r,
    hp:          def.hp,
    maxHp:       def.hp,
    speed:       def.speed,
    vx: 0, vy: 0,               // 击退速度
    flashTimer:  0,
    atkCd:       0,
    state:       'patrol',
    // patrol 专用
    patrolTimer: 0,
    patrolAngle: Math.random() * Math.PI * 2,
    // windup 专用
    windupTimer: 0,
    // spear_angel 专用
    fireCd:       type === 'spear_angel' ? rnd(30, 80) : 0,  // 初始CD随机，防止群体同时开火
    retreatTimer: 0,
    aimX: 0, aimY: 0,
    // buff 用
    slowMul: 1, slowTimer: 0,
    // 击杀掉落金币
    goldDrop: rndI(def.goldDrop[0], def.goldDrop[1]),
  };
}

// ── guardian AI ──────────────────────────────────────────
// state: patrol → chase → windup → cooldown
function updateGuardian(e, fd) {
  const def = ENEMY_DEFS.guardian;
  const d   = dist(e, player);

  if (e.slowTimer > 0) { e.slowTimer -= fd; if (e.slowTimer <= 0) e.slowMul = 1; }

  // 击退衰减（贴墙滑动）
  if (Math.hypot(e.vx, e.vy) > 0.1) {
    const kbSpd = Math.hypot(e.vx, e.vy);
    const kbNx  = e.x + e.vx * fd;
    const kbNy  = e.y + e.vy * fd;
    if (!isWall(kbNx, e.y)) e.x = kbNx; else e.vx = 0;
    if (!isWall(e.x, kbNy)) e.y = kbNy; else e.vy = 0;
    e.vx *= 0.68; e.vy *= 0.68;
    if (kbSpd < 0.5) { e.vx = 0; e.vy = 0; }
  }

  if (e.state === 'patrol') {
    // 随机游走
    e.patrolTimer -= fd;
    if (e.patrolTimer <= 0) {
      e.patrolTimer = rnd(60, 150);
      e.patrolAngle = Math.random() * Math.PI * 2;
    }
    const spd = def.speed * 0.45 * e.slowMul * fd;
    const nx = e.x + Math.cos(e.patrolAngle) * spd;
    const ny = e.y + Math.sin(e.patrolAngle) * spd;
    if (!isWall(nx, e.y)) e.x = nx; else e.patrolAngle = Math.random() * Math.PI * 2;
    if (!isWall(e.x, ny)) e.y = ny;

    if (d < def.aggroRange) e.state = 'chase';

  } else if (e.state === 'chase') {
    if (d > def.aggroRange * 1.3) { e.state = 'patrol'; return; }
    const spd = def.speed * e.slowMul * fd;
    const ang = Math.atan2(player.y - e.y, player.x - e.x);
    const nx = e.x + Math.cos(ang) * spd;
    const ny = e.y + Math.sin(ang) * spd;
    if (!isWall(nx, e.y)) e.x = nx;
    if (!isWall(e.x, ny)) e.y = ny;

    // 进入攻击范围：完全停下来开始蓄力，绝不在chase时造成伤害
    if (d <= def.atkRange + e.r + player.r + 10) {
      e.state = 'windup';
      e.windupTimer = def.windupFrames;
      // 蓄力起手：停止移动，施加微小后退
      e.vx = Math.cos(ang) * -1.5;
      e.vy = Math.sin(ang) * -1.5;
    }

  } else if (e.state === 'windup') {
    // windup期间原地静止，只做动画，不移动不伤害
    e.windupTimer -= fd;
    if (e.windupTimer <= 0) {
      // 扇形近战：仅在这一刻判定，与windup过程无关
      spawnParticles(e.x, e.y, '#e0b050', 8, {
        angle: Math.atan2(player.y - e.y, player.x - e.x),
        spread: 0.8, spdMin: 2, spdMax: 7,
      });
      const ang = Math.atan2(player.y - e.y, player.x - e.x);
      if (player.invincible <= 0 && inArc(
        { cx: e.x, cy: e.y, angle: ang, arc: 1.4, range: def.atkRange + e.r + player.r },
        player.x, player.y, player.r
      )) {
        damagePlayer(def.damage, ang);
      }
      e.atkCd = def.atkCdMax;
      e.state  = 'cooldown';
    }

  } else if (e.state === 'cooldown') {
    e.atkCd -= fd;
    if (e.atkCd <= 0) e.state = 'chase';
  }
}

function updateEnemies(fd) {
  for (const e of enemies) {
    if (e.type === 'guardian')    updateGuardian(e, fd);
    if (e.type === 'spear_angel') updateSpearAngel(e, fd);
    if (e.type === 'archangel')   updateArchangel(e, fd);
    if (e.type === 'michael_boss') updateMichaelBoss(e, fd);
    if (e.flashTimer > 0) e.flashTimer -= fd;

    // 灼烧tick（纯洁旋 buff）
    if (e.burnTimer > 0) {
      e.burnTimer -= fd;
      e.burnDmgCd = (e.burnDmgCd || 0) - fd;
      if (e.burnDmgCd <= 0) {
        e.burnDmgCd = 30;  // 每0.5秒8伤
        e.hp -= 8;
        e.flashTimer = 4;
        spawnParticles(e.x, e.y, '#80ffc0', 4, { spdMin:1, spdMax:4, rMin:1, rMax:2.5, decayMin:0.05, decayMax:0.10 });
        if (e.hp <= 0) { killEnemy(e); continue; }
      }
    }
  }
  updateBossBeams(fd);

  // ── 敌人间分离力 (O(n²)) ─────────────────────────────
  for (let i = 0; i < enemies.length; i++) {
    for (let j = i + 1; j < enemies.length; j++) {
      const a = enemies[i], b = enemies[j];
      const dx = b.x - a.x, dy = b.y - a.y;
      const d  = Math.hypot(dx, dy);
      const mn = a.r + b.r;
      if (d < mn && d > 0.01) {
        const p = (mn - d) / 2;
        a.x -= dx / d * p; a.y -= dy / d * p;
        b.x += dx / d * p; b.y += dy / d * p;
      }
    }
  }
}

// ── 玩家受伤（供敌人调用） ────────────────────────────
function damagePlayer(dmg, fromAngle) {
  if (player.invincible > 0) return;
  // 圣光之体：15%概率完全抵消
  if (player.mods.blockChance > 0 && Math.random() < player.mods.blockChance) {
    showFloatingText('格挡！', '#80ffc0');
    spawnParticles(player.x, player.y, '#80ffc0', 10, { spdMin:2, spdMax:6, rMin:1, rMax:3, decayMin:0.06, decayMax:0.12 });
    player.invincible = 10;
    return;
  }
  // divine_ward buff：冲刺后防御窗口减伤60%
  let finalDmg = dmg;
  if (player.dashDefWindow > 0) finalDmg = Math.round(dmg * 0.4);
  // 圣洁冲：冲刺后受伤15%转HP
  if (player.mods.dashLifeConvert && player.mods.dashLifeConvertTimer > 0) {
    const lifeGet = Math.round(finalDmg * 0.15);
    player.hp = Math.min(player.maxHp, player.hp + lifeGet);
    finalDmg = Math.round(finalDmg * 0.85);
  }
  player.hp       -= finalDmg;
  player.flashTimer = 8;
  player.invincible = 8;
  screenShake       = Math.max(screenShake, 5);
  // lastStand buff
  if (player.hp <= 0 && player.mods.lastStand && !player.mods.lastStandUsed) {
    player.hp = 1;
    player.mods.lastStandUsed = true;
    showFloatingText('殉道者意志！', '#ff6060');
  }
  if (player.hp <= 0) setGameState(S.DEAD);
}

// ── 渲染：guardian ────────────────────────────────────
function renderGuardian(e) {
  const sc = toScreen(e.x, e.y);
  const sx = sc.x, sy = sc.y;
  const flashing = e.flashTimer > 0;
  const windingUp = e.state === 'windup';

  ctx.save();
  ctx.translate(sx, sy);

  // 脚下椭圆阴影
  ctx.save();
  ctx.globalAlpha = 0.28;
  ctx.fillStyle   = '#000000';
  ctx.scale(1, 0.38);
  ctx.beginPath();
  ctx.ellipse(0, e.r * 0.9, e.r * 1.2, e.r * 0.7, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  // 外发光（蓄力时增强）
  ctx.save();
  ctx.shadowColor = flashing ? '#ffffff' : (windingUp ? '#ffcc00' : '#c8902a');
  ctx.shadowBlur  = windingUp ? 30 : 18;

  // 主圆体（暖金色）
  const bodyCol = flashing ? '#ffffff' : '#d4962a';
  ctx.fillStyle  = bodyCol;
  ctx.beginPath();
  ctx.arc(0, 0, e.r, 0, Math.PI * 2);
  ctx.fill();

  // 圆体内高光
  ctx.globalAlpha = 0.35;
  ctx.fillStyle   = '#ffe8a0';
  ctx.beginPath();
  ctx.arc(-e.r * 0.28, -e.r * 0.32, e.r * 0.45, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  // 十字剑装饰（2条交叉线）
  if (!flashing) {
    ctx.save();
    ctx.strokeStyle = '#7a5010';
    ctx.lineWidth   = 2.5;
    ctx.globalAlpha = 0.85;
    ctx.lineCap     = 'round';
    const arm = e.r * 0.62;
    // 竖线
    ctx.beginPath();
    ctx.moveTo(0, -arm); ctx.lineTo(0,  arm); ctx.stroke();
    // 横线（十字偏上）
    ctx.beginPath();
    ctx.moveTo(-arm * 0.7, -arm * 0.25); ctx.lineTo(arm * 0.7, -arm * 0.25); ctx.stroke();
    ctx.restore();

    // 十字高光
    ctx.save();
    ctx.strokeStyle = 'rgba(255,220,120,0.5)';
    ctx.lineWidth   = 1;
    ctx.beginPath();
    ctx.moveTo(0, -arm); ctx.lineTo(0, arm); ctx.stroke();
    ctx.restore();
  }

  // windup 预警圈（橙红扩散，更明显让玩家来得及闪）
  if (windingUp) {
    const prog = 1 - e.windupTimer / ENEMY_DEFS.guardian.windupFrames;
    ctx.save();
    // 外层大范围扩散圈（攻击半径预示）
    ctx.globalAlpha = 0.28 * prog;
    ctx.strokeStyle = '#ff6600';
    ctx.lineWidth   = 3;
    ctx.shadowColor = '#ff4400';
    ctx.shadowBlur  = 20;
    const atkR = ENEMY_DEFS.guardian.atkRange + e.r + PLAYER_R;
    ctx.beginPath();
    ctx.arc(0, 0, atkR, 0, Math.PI * 2);
    ctx.stroke();
    // 内层收缩闪烁圈
    ctx.globalAlpha = 0.6 * prog;
    ctx.strokeStyle = '#ffcc00';
    ctx.lineWidth   = 2.5;
    ctx.shadowColor = '#ff8800';
    ctx.shadowBlur  = 16;
    ctx.beginPath();
    ctx.arc(0, 0, e.r + 6 + prog * 20, 0, Math.PI * 2);
    ctx.stroke();
    ctx.restore();
  }

  // HP 条（血量不满时显示）
  if (e.hp < e.maxHp) {
    const bw = e.r * 2.4, bh = 3;
    const bx = -bw / 2, by = e.r + 5;
    ctx.fillStyle = '#1a0808';
    ctx.fillRect(bx, by, bw, bh);
    ctx.fillStyle = '#d03030';
    ctx.fillRect(bx, by, bw * (e.hp / e.maxHp), bh);
  }

  ctx.restore();
}

function renderEnemies() {
  for (const e of enemies) {
    if (e.type === 'guardian')    renderGuardian(e);
    if (e.type === 'spear_angel') renderSpearAngel(e);
    if (e.type === 'archangel')   renderArchangel(e);
    if (e.type === 'michael_boss') renderMichaelBoss(e);
  }
  renderBossBeams();
}

// ═══════════════════════════════════════════════════════════
// ═══ SPEAR ANGEL ═══════════════════════════════════════════
// ═══════════════════════════════════════════════════════════

// ── spear_angel AI ────────────────────────────────────────
// state: kite → windup → fire → retreat
function updateSpearAngel(e, fd) {
  const def = ENEMY_DEFS.spear_angel;
  const d   = dist(e, player);

  if (e.slowTimer > 0) { e.slowTimer -= fd; if (e.slowTimer <= 0) e.slowMul = 1; }

  // 击退衰减
  if (Math.hypot(e.vx, e.vy) > 0.1) {
    const kbSpd = Math.hypot(e.vx, e.vy);
    const kbNx  = e.x + e.vx * fd;
    const kbNy  = e.y + e.vy * fd;
    if (!isWall(kbNx, e.y)) e.x = kbNx; else e.vx = 0;
    if (!isWall(e.x, kbNy)) e.y = kbNy; else e.vy = 0;
    e.vx *= 0.68; e.vy *= 0.68;
    if (kbSpd < 0.5) { e.vx = 0; e.vy = 0; }
  }

  // fireCd 和 windupTimer 倒计时
  if (e.fireCd > 0)      e.fireCd      -= fd;
  if (e.windupTimer > 0) e.windupTimer -= fd;

  const ang = Math.atan2(player.y - e.y, player.x - e.x);

  if (e.state === 'kite') {
    // 保持 keepDist 距离：太近则退，太远则靠近，刚好则横向绕行
    const keepDist = def.keepDist;
    if (d < def.retreatDist) {
      // 太近：后退
      const nx = e.x - Math.cos(ang) * def.speed * 1.4 * e.slowMul * fd;
      const ny = e.y - Math.sin(ang) * def.speed * 1.4 * e.slowMul * fd;
      if (!isWall(nx, e.y)) e.x = nx;
      if (!isWall(e.x, ny)) e.y = ny;
    } else if (d > keepDist + 40) {
      // 太远：靠近
      const nx = e.x + Math.cos(ang) * def.speed * e.slowMul * fd;
      const ny = e.y + Math.sin(ang) * def.speed * e.slowMul * fd;
      if (!isWall(nx, e.y)) e.x = nx;
      if (!isWall(e.x, ny)) e.y = ny;
    } else {
      // 合适距离：横向绕行（顺时针）
      const sideAng = ang + Math.PI / 2;
      const nx = e.x + Math.cos(sideAng) * def.speed * 0.6 * e.slowMul * fd;
      const ny = e.y + Math.sin(sideAng) * def.speed * 0.6 * e.slowMul * fd;
      if (!isWall(nx, e.y)) e.x = nx;
      if (!isWall(e.x, ny)) e.y = ny;
    }

    // fireCd归零且距离合适→开始蓄力
    if (e.fireCd <= 0 && d < keepDist + 60 && d > def.retreatDist) {
      e.state       = 'windup';
      e.windupTimer = def.windupFrames;
      e.aimX        = player.x;   // 蓄力时记录瞄准点（锁定，不跟踪）
      e.aimY        = player.y;
    }

  } else if (e.state === 'windup') {
    // 蓄力期间原地不动
    if (e.windupTimer <= 0) {
      // 发射长矛
      fireSpear(e);
      e.fireCd = def.fireCdMax;
      e.state  = 'retreat';
      e.retreatTimer = 30;  // 射完后短暂后退
    }

  } else if (e.state === 'retreat') {
    // 射完短暂后退，再回kite
    e.retreatTimer -= fd;
    const nx = e.x - Math.cos(ang) * def.speed * 1.2 * e.slowMul * fd;
    const ny = e.y - Math.sin(ang) * def.speed * 1.2 * e.slowMul * fd;
    if (!isWall(nx, e.y)) e.x = nx;
    if (!isWall(e.x, ny)) e.y = ny;
    if (e.retreatTimer <= 0) e.state = 'kite';
  }
}

// 发射长矛
function fireSpear(e) {
  const tx  = e.aimX || player.x;
  const ty  = e.aimY || player.y;
  const ang = Math.atan2(ty - e.y, tx - e.x);
  const spd = 5.5;
  projectiles.push({
    id:    Math.random(),
    x: e.x, y: e.y,
    vx: Math.cos(ang) * spd,
    vy: Math.sin(ang) * spd,
    angle: ang,
    r: 5, dmg: 18,
    life: 200,       // 最多飞200帧
    isEnemy: true,
    ownerId: e.id,   // 防止回头打自己（预留）
  });
  // 发射特效
  spawnParticles(e.x, e.y, '#a0c8ff', 6, {
    angle: ang, spread: 0.4,
    spdMin: 2, spdMax: 5, rMin: 1, rMax: 2.5,
    decayMin: 0.05, decayMax: 0.10,
  });
}

// 更新所有投矛
function updateProjectiles(fd) {
  for (let i = projectiles.length - 1; i >= 0; i--) {
    const p = projectiles[i];
    p.life -= fd;
    if (p.life <= 0) { projectiles.splice(i, 1); continue; }

    // ── 投矛往返逻辑 ──────────────────────────────────
    if (p.isSpear) {
      if (!p.returning) {
        p.dist += Math.hypot(p.vx, p.vy) * fd;
        const nx = p.x + p.vx * fd;
        const ny = p.y + p.vy * fd;
        if (isWall(nx, p.y) || isWall(p.x, ny) || p.dist >= p.maxDist) {
          // 折返
          p.vx = -p.vx; p.vy = -p.vy;
          p.returning = true;
          spawnParticles(p.x, p.y, '#d0a060', 6, { spdMin: 1, spdMax: 4, rMin: 1, rMax: 3, decayMin: 0.05, decayMax: 0.10 });
        } else {
          p.x = nx; p.y = ny;
          // 去程命中
          for (const e of enemies) {
            if (p.returnHit.has(e.id + '_go')) continue;
            if (dist(p, e) < e.r + p.r) {
              p.returnHit.add(e.id + '_go');
              hitEnemy(e, p.dmg, 10, Math.atan2(e.y - p.y, e.x - p.x), player.mods.holyDmg);
            }
          }
        }
      } else {
        // 折返阶段：飞回玩家
        const nx = p.x + p.vx * fd;
        const ny = p.y + p.vy * fd;
        if (isWall(nx, p.y) || isWall(p.x, ny)) { projectiles.splice(i, 1); continue; }
        p.x = nx; p.y = ny;
        // 回程命中
        for (const e of enemies) {
          if (p.returnHit.has(e.id + '_ret')) continue;
          if (dist(p, e) < e.r + p.r) {
            p.returnHit.add(e.id + '_ret');
            hitEnemy(e, Math.round(p.dmg * 0.8), 8, Math.atan2(e.y - p.y, e.x - p.x), player.mods.holyDmg);
          }
        }
        // 回到玩家则消失
        if (dist(p, player) < player.r + p.r + 4) { projectiles.splice(i, 1); }
      }
      continue;
    }

    // ── 链刃钩锁逻辑 ─────────────────────────────────
    if (p.isChainHook) {
      p.dist += Math.hypot(p.vx, p.vy) * fd;
      const nx = p.x + p.vx * fd;
      const ny = p.y + p.vy * fd;
      if (isWall(nx, p.y) || isWall(p.x, ny) || p.dist >= p.maxDist) {
        projectiles.splice(i, 1); continue;
      }
      p.x = nx; p.y = ny;
      // 命中第一个敌人：拉近
      for (const e of enemies) {
        if (dist(p, e) < e.r + p.r + 4) {
          // 将敌人拉向玩家（强制位移）
          const pullDur = 12;
          const dx = player.x - e.x, dy = player.y - e.y;
          const dd = Math.hypot(dx, dy) || 1;
          e.vx += (dx / dd) * 18;
          e.vy += (dy / dd) * 18;
          hitEnemy(e, 15, 0, Math.atan2(dy, dx), player.mods.holyDmg);
          spawnParticles(e.x, e.y, '#c060ff', 10, { spdMin: 2, spdMax: 7, rMin: 1, rMax: 3, decayMin: 0.04, decayMax: 0.09 });
          projectiles.splice(i, 1);
          break;
        }
      }
      continue;
    }

    const nx = p.x + p.vx * fd;
    const ny = p.y + p.vy * fd;

    // 撞墙消失
    if (isWall(nx, p.y) || isWall(p.x, ny)) {
      spawnParticles(p.x, p.y, '#8090c0', 5, { spdMin: 1, spdMax: 4, rMin: 1, rMax: 2.5, decayMin: 0.05, decayMax: 0.10 });
      projectiles.splice(i, 1);
      continue;
    }
    p.x = nx; p.y = ny;

    // 命中玩家
    if (p.isEnemy && player.invincible <= 0 &&
        dist(p, player) < player.r + p.r) {
      damagePlayer(p.dmg, Math.atan2(player.y - p.y, player.x - p.x));
      spawnParticles(p.x, p.y, '#a0c8ff', 8, { spdMin: 2, spdMax: 7, rMin: 1.5, rMax: 3, decayMin: 0.04, decayMax: 0.09 });
      projectiles.splice(i, 1);
    }
  }
}

// 渲染所有投矛
function renderProjectiles() {
  for (const p of projectiles) {
    // ── 投矛渲染 ──────────────────────────────────────
    if (p.isSpear) {
      const tailX = p.x - Math.cos(p.returning ? p.angle + Math.PI : p.angle) * 48;
      const tailY = p.y - Math.sin(p.returning ? p.angle + Math.PI : p.angle) * 48;
      const sc1 = toScreen(tailX, tailY);
      const sc2 = toScreen(p.x, p.y);
      ctx.save();
      ctx.strokeStyle = p.returning ? '#ffd080' : '#d0a060';
      ctx.lineWidth   = 9;
      ctx.shadowColor = p.returning ? '#ffaa00' : '#a07030';
      ctx.shadowBlur  = p.returning ? 22 : 16;
      ctx.globalAlpha = 0.45;
      ctx.lineCap     = 'round';
      ctx.beginPath(); ctx.moveTo(sc1.x, sc1.y); ctx.lineTo(sc2.x, sc2.y); ctx.stroke();
      ctx.globalAlpha = 1;
      ctx.strokeStyle = '#f0e0a0';
      ctx.lineWidth   = 4;
      ctx.shadowBlur  = 10;
      ctx.beginPath(); ctx.moveTo(sc1.x, sc1.y); ctx.lineTo(sc2.x, sc2.y); ctx.stroke();
      ctx.restore();
      continue;
    }

    // ── 链刃钩锁渲染 ──────────────────────────────────
    if (p.isChainHook) {
      // 从玩家到钩锁头的链条线
      const scP = toScreen(player.x, player.y);
      const scH = toScreen(p.x, p.y);
      ctx.save();
      ctx.setLineDash([6, 4]);
      ctx.strokeStyle = '#a060d0';
      ctx.lineWidth   = 2.5;
      ctx.shadowColor = '#8040b0';
      ctx.shadowBlur  = 10;
      ctx.globalAlpha = 0.7;
      ctx.beginPath(); ctx.moveTo(scP.x, scP.y); ctx.lineTo(scH.x, scH.y); ctx.stroke();
      ctx.setLineDash([]);
      // 钩头
      ctx.globalAlpha = 1;
      ctx.fillStyle = '#d080ff';
      ctx.shadowColor = '#c060ff';
      ctx.shadowBlur = 14;
      ctx.beginPath(); ctx.arc(scH.x, scH.y, 5, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
      continue;
    }

    // ── 普通长矛（spear_angel发射）渲染 ───────────────
    const tailX = p.x - Math.cos(p.angle) * 18;
    const tailY = p.y - Math.sin(p.angle) * 18;
    const sc1 = toScreen(tailX, tailY);
    const sc2 = toScreen(p.x,   p.y);

    ctx.save();
    ctx.strokeStyle = '#a0c8ff';
    ctx.lineWidth   = 5;
    ctx.shadowColor = '#6090ff';
    ctx.shadowBlur  = 14;
    ctx.globalAlpha = 0.45;
    ctx.lineCap     = 'round';
    ctx.beginPath(); ctx.moveTo(sc1.x, sc1.y); ctx.lineTo(sc2.x, sc2.y); ctx.stroke();
    ctx.globalAlpha = 1;
    ctx.strokeStyle = '#e0ecff';
    ctx.lineWidth   = 2.5;
    ctx.shadowBlur  = 8;
    ctx.beginPath(); ctx.moveTo(sc1.x, sc1.y); ctx.lineTo(sc2.x, sc2.y); ctx.stroke();
    const tipX = p.x + Math.cos(p.angle) * 5;
    const tipY = p.y + Math.sin(p.angle) * 5;
    const scTip = toScreen(tipX, tipY);
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth   = 1.5;
    ctx.shadowBlur  = 12;
    ctx.beginPath(); ctx.moveTo(sc2.x, sc2.y); ctx.lineTo(scTip.x, scTip.y); ctx.stroke();
    ctx.restore();
  }
}

// ── spear_angel 渲染 ──────────────────────────────────────
function renderSpearAngel(e) {
  const sc = toScreen(e.x, e.y);
  const sx = sc.x, sy = sc.y;
  const flashing   = e.flashTimer > 0;
  const windingUp  = e.state === 'windup';
  const ang        = Math.atan2(
    (e.aimY || player.y) - e.y,
    (e.aimX || player.x) - e.x
  );

  ctx.save();
  ctx.translate(sx, sy);

  // 脚下阴影
  ctx.save();
  ctx.globalAlpha = 0.22;
  ctx.fillStyle   = '#000000';
  ctx.scale(1, 0.38);
  ctx.beginPath();
  ctx.ellipse(0, e.r * 0.9, e.r * 1.1, e.r * 0.65, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  // 主体：冰蓝色三角形（朝向玩家）
  ctx.save();
  ctx.rotate(ang);
  ctx.shadowColor = flashing ? '#ffffff' : (windingUp ? '#00aaff' : '#4080c0');
  ctx.shadowBlur  = windingUp ? 28 : 16;
  ctx.fillStyle   = flashing ? '#ffffff' : '#60a0d8';

  ctx.beginPath();
  ctx.moveTo(e.r + 2, 0);               // 尖端朝玩家
  ctx.lineTo(-e.r * 0.7,  e.r * 0.85);
  ctx.lineTo(-e.r * 0.7, -e.r * 0.85);
  ctx.closePath();
  ctx.fill();

  // 三角内高光
  ctx.globalAlpha = 0.4;
  ctx.fillStyle   = '#c0e0ff';
  ctx.beginPath();
  ctx.moveTo(e.r * 0.6, 0);
  ctx.lineTo(-e.r * 0.3,  e.r * 0.4);
  ctx.lineTo(-e.r * 0.3, -e.r * 0.4);
  ctx.closePath();
  ctx.fill();
  ctx.restore();

  // 矛形装饰（横穿三角中心的细线）
  if (!flashing) {
    ctx.save();
    ctx.rotate(ang);
    ctx.strokeStyle = '#a0c8f0';
    ctx.lineWidth   = 1.5;
    ctx.globalAlpha = 0.7;
    ctx.lineCap     = 'round';
    ctx.beginPath();
    ctx.moveTo(-e.r * 0.6, 0);
    ctx.lineTo(e.r * 1.2, 0);
    ctx.stroke();
    // 矛尖小三角
    ctx.fillStyle = '#d0eaff';
    ctx.beginPath();
    ctx.moveTo(e.r * 1.5, 0);
    ctx.lineTo(e.r * 1.0,  e.r * 0.25);
    ctx.lineTo(e.r * 1.0, -e.r * 0.25);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  // windup 蓄力：瞄准线 + 扩散圈
  if (windingUp) {
    const prog = 1 - e.windupTimer / ENEMY_DEFS.spear_angel.windupFrames;
    // 瞄准虚线（从敌人指向蓄力锁定点）
    const lockDist = dist(e, { x: e.aimX || player.x, y: e.aimY || player.y });
    ctx.save();
    ctx.rotate(ang);
    ctx.strokeStyle = `rgba(160,200,255,${0.3 + 0.4 * prog})`;
    ctx.lineWidth   = 1.5;
    ctx.setLineDash([6, 5]);
    ctx.shadowColor = '#80c0ff';
    ctx.shadowBlur  = 10;
    ctx.beginPath();
    ctx.moveTo(e.r + 4, 0);
    ctx.lineTo(Math.min(lockDist, 220), 0);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.restore();

    // 蓄力扩散圈
    ctx.save();
    ctx.globalAlpha = 0.5 * prog;
    ctx.strokeStyle = '#60a0ff';
    ctx.lineWidth   = 2;
    ctx.shadowColor = '#4080ff';
    ctx.shadowBlur  = 12;
    ctx.beginPath();
    ctx.arc(0, 0, e.r + 4 + prog * 12, 0, Math.PI * 2);
    ctx.stroke();
    ctx.restore();
  }

  // HP 条
  if (e.hp < e.maxHp) {
    const bw = e.r * 2.4, bh = 3;
    const bx = -bw / 2, by = e.r + 5;
    ctx.fillStyle = '#081828';
    ctx.fillRect(bx, by, bw, bh);
    ctx.fillStyle = '#3060c0';
    ctx.fillRect(bx, by, bw * (e.hp / e.maxHp), bh);
  }

  ctx.restore();
}

// ═══════════════════════════════════════════════════════════
// ═══ ARCHANGEL（精英/BOSS）══════════════════════════════════
// ═══════════════════════════════════════════════════════════

function makeArchangel(x, y) {
  const def = ENEMY_DEFS.archangel;
  return {
    id:          Math.random(),
    type:        'archangel',
    x, y,
    r:           def.r,
    hp:          def.hp, maxHp: def.hp,
    shieldHp:    def.shieldHp, maxShieldHp: def.shieldHp,
    speed:       def.speed,
    phase:       1,           // 1=有护盾, 2=无护盾
    guardAngle:  0,           // 护盾面朝向（每帧lerp向玩家）
    vx: 0, vy: 0,
    flashTimer:  0,
    atkCd:       0,
    spinCd:      0,
    state:       'approach',
    windupTimer: 0,
    slowMul: 1, slowTimer: 0,
    isBoss:      false,       // 是否作为BOSS登场（HP/scale由调用方覆盖）
    goldDrop:    rndI(def.goldDrop[0], def.goldDrop[1]),
  };
}

function updateArchangel(e, fd) {
  const def = ENEMY_DEFS.archangel;
  const d   = dist(e, player);

  if (e.slowTimer > 0) { e.slowTimer -= fd; if (e.slowTimer <= 0) e.slowMul = 1; }

  // 击退衰减
  if (Math.hypot(e.vx, e.vy) > 0.1) {
    const nx = e.x + e.vx * fd, ny = e.y + e.vy * fd;
    if (!isWall(nx, e.y)) e.x = nx; else e.vx = 0;
    if (!isWall(e.x, ny)) e.y = ny; else e.vy = 0;
    e.vx *= 0.68; e.vy *= 0.68;
  }

  // 护盾角度跟踪（每帧 lerp 向玩家方向）
  const ang = Math.atan2(player.y - e.y, player.x - e.x);
  let diff = ang - e.guardAngle;
  // 标准化到 [-π, π]
  diff = ((diff + Math.PI * 3) % (Math.PI * 2)) - Math.PI;
  e.guardAngle += diff * 0.06 * fd;

  // Phase切换
  if (e.phase === 1 && e.shieldHp <= 0) {
    e.phase = 2;
    e.speed *= 1.4;
    e.spinCd = 120;
    spawnParticles(e.x, e.y, '#ffe080', 20, { spdMin: 3, spdMax: 10 });
    screenShake = Math.max(screenShake, 8);
  }

  if (e.phase === 1) {
    // Phase1：靠近→突进扇形
    if (e.atkCd > 0) { e.atkCd -= fd; }
    if (e.state === 'approach') {
      const spd = e.speed * e.slowMul * fd;
      const nx  = e.x + Math.cos(ang) * spd;
      const ny  = e.y + Math.sin(ang) * spd;
      if (!isWall(nx, e.y)) e.x = nx;
      if (!isWall(e.x, ny)) e.y = ny;
      if (d < def.approachDist + e.r + player.r && e.atkCd <= 0) {
        e.state = 'windup';
        e.windupTimer = 30;
      }
    } else if (e.state === 'windup') {
      e.windupTimer -= fd;
      if (e.windupTimer <= 0) {
        // 突进攻击
        const kAng = Math.atan2(player.y - e.y, player.x - e.x);
        e.vx = Math.cos(kAng) * 12;
        e.vy = Math.sin(kAng) * 12;
        // 扇形判定
        if (player.invincible <= 0) {
          const pAng = Math.atan2(player.y - e.y, player.x - e.x);
          // 受护盾角度影响：玩家在护盾正面来的攻击减伤80%
          const shieldDiff = Math.abs(((pAng - e.guardAngle + Math.PI * 3) % (Math.PI * 2)) - Math.PI);
          const dmgMul = (shieldDiff < Math.PI / 3) ? 0.2 : 1;
          if (d < 80) damagePlayer(Math.round(def.damage * dmgMul), kAng);
        }
        e.atkCd   = def.atkCdMax;
        e.state   = 'approach';
        spawnParticles(e.x, e.y, '#ffe080', 12, { angle: ang, spread: 0.8, spdMin: 3, spdMax: 8 });
        screenShake = Math.max(screenShake, 5);
      }
    }
  } else {
    // Phase2：追击+360°扫击
    if (e.atkCd > 0)  e.atkCd  -= fd;
    if (e.spinCd > 0) e.spinCd -= fd;
    const spd = e.speed * e.slowMul * fd;
    const nx  = e.x + Math.cos(ang) * spd;
    const ny  = e.y + Math.sin(ang) * spd;
    if (!isWall(nx, e.y)) e.x = nx;
    if (!isWall(e.x, ny)) e.y = ny;

    // 近身普攻
    if (d < e.r + player.r + 30 && e.atkCd <= 0) {
      if (player.invincible <= 0) damagePlayer(def.damage, ang);
      e.atkCd = 50;
      spawnParticles(e.x, e.y, '#ffd080', 8, { angle: ang, spread: 0.6, spdMin: 2, spdMax: 6 });
    }

    // 360°扫击（spinCd归零）
    if (e.spinCd <= 0) {
      attacks.push({
        id: Math.random(), cx: e.x, cy: e.y,
        angle: 0, arc: Math.PI * 2, range: 110,
        dmg: 28, knockback: 14,
        life: 16, maxLife: 16, hit: new Set(),
        holyDmg: 0, isSpin: true, isEnemy: true, step: -1,
      });
      e.spinCd = 160;
      spawnParticles(e.x, e.y, '#ffe080', 24, { spdMin: 4, spdMax: 12 });
      screenShake = Math.max(screenShake, 10);
    }
  }
}

// 护盾受击判定（在 hitEnemy 里调用）
function applyArchangelShield(e, dmg) {
  if (e.type !== 'archangel' || e.phase !== 1) return dmg;
  // 检查攻击角度（玩家→敌人方向）vs 护盾面朝向
  const atkAng = Math.atan2(e.y - player.y, e.x - player.x);
  const shDiff = Math.abs(((atkAng - e.guardAngle + Math.PI * 3) % (Math.PI * 2)) - Math.PI);
  if (shDiff < Math.PI / 3) {
    // 正面格挡：护盾扣血，主体减伤80%
    e.shieldHp -= dmg;
    spawnParticles(e.x, e.y, '#a0d0ff', 6, { spdMin: 2, spdMax: 5 });
    return dmg * 0.2;
  }
  return dmg;
}

function renderArchangel(e) {
  const sc = toScreen(e.x, e.y);
  const sx = sc.x, sy = sc.y;
  const flashing = e.flashTimer > 0;
  const hasShield = e.phase === 1 && e.shieldHp > 0;

  ctx.save();
  ctx.translate(sx, sy);

  // 阴影
  ctx.save();
  ctx.globalAlpha = 0.3;
  ctx.fillStyle   = '#000000';
  ctx.scale(1, 0.38);
  ctx.beginPath();
  ctx.ellipse(0, e.r * 0.9, e.r * 1.4, e.r * 0.8, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  // 护盾弧线（Phase1）
  if (hasShield) {
    const shPct = e.shieldHp / e.maxShieldHp;
    ctx.save();
    ctx.rotate(e.guardAngle);
    // 护盾大弧（正面120°）
    ctx.strokeStyle = `rgba(100,180,255,${0.4 + 0.4 * shPct})`;
    ctx.lineWidth   = 8 + 4 * shPct;
    ctx.shadowColor = '#60a0ff';
    ctx.shadowBlur  = 20;
    ctx.beginPath();
    ctx.arc(0, 0, e.r + 14, -Math.PI / 3, Math.PI / 3);
    ctx.stroke();
    // 护盾内光
    ctx.strokeStyle = `rgba(200,230,255,${0.6 * shPct})`;
    ctx.lineWidth   = 3;
    ctx.shadowBlur  = 10;
    ctx.beginPath();
    ctx.arc(0, 0, e.r + 14, -Math.PI / 4, Math.PI / 4);
    ctx.stroke();
    ctx.restore();
  }

  // 主体（金色六边形）
  ctx.save();
  ctx.shadowColor = flashing ? '#ffffff' : (hasShield ? '#a0c0ff' : '#d08020');
  ctx.shadowBlur  = hasShield ? 24 : 16;
  ctx.fillStyle   = flashing ? '#ffffff' : '#c88028';
  ctx.beginPath();
  for (let i = 0; i < 6; i++) {
    const a = (i / 6) * Math.PI * 2 - Math.PI / 6;
    const px = Math.cos(a) * e.r;
    const py = Math.sin(a) * e.r;
    i === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
  }
  ctx.closePath();
  ctx.fill();
  // 六边形描边
  ctx.strokeStyle = hasShield ? '#80c0ff' : '#f0c060';
  ctx.lineWidth = 2;
  ctx.shadowBlur = 8;
  ctx.stroke();
  ctx.restore();

  // boss标记（金冠）
  if (e.isBoss) {
    ctx.save();
    ctx.fillStyle = '#ffd040';
    ctx.shadowColor = '#ffaa00';
    ctx.shadowBlur = 14;
    ctx.font = 'bold 16px Courier New';
    ctx.textAlign = 'center';
    ctx.fillText('👑', 0, -e.r - 12);
    ctx.restore();
  }

  // HP条
  const bw = e.r * 3, bh = 4;
  const bx = -bw / 2, by2 = e.r + 8;
  // 护盾HP（蓝色）
  if (hasShield) {
    ctx.fillStyle = '#1a2838';
    ctx.fillRect(bx, by2, bw, bh);
    ctx.fillStyle = '#4090ff';
    ctx.fillRect(bx, by2, bw * (e.shieldHp / e.maxShieldHp), bh);
  }
  // 主HP（橙色）
  if (e.hp < e.maxHp) {
    ctx.fillStyle = '#1a0808';
    ctx.fillRect(bx, by2 + (hasShield ? bh + 2 : 0), bw, bh);
    ctx.fillStyle = e.isBoss ? '#ff4020' : '#d06020';
    ctx.fillRect(bx, by2 + (hasShield ? bh + 2 : 0), bw * (e.hp / e.maxHp), bh);
  }

  if (e.flashTimer > 0) e.flashTimer -= 0; // handled in updateEnemies

  ctx.restore();
}

// ═══════════════════════════════════════════════════════════
// ═══ MICHAEL BOSS ═══════════════════════════════════════════
// ═══════════════════════════════════════════════════════════

function makeMichaelBoss(x, y) {
  const def = ENEMY_DEFS.michael_boss;
  return {
    id:          Math.random(),
    type:        'michael_boss',
    x, y,
    r:           def.r,
    hp:          def.hp, maxHp: def.hp,
    speed:       def.speed,
    vx: 0, vy: 0,
    flashTimer:  0,
    atkCd:       0,
    phase:       1,          // 1/2/3
    patternCd:   80,
    beams:       [],         // 光柱（预警+爆炸）
    slowMul: 1, slowTimer: 0,
    goldDrop:    0,
  };
}

// 光柱对象 {x, y, r, timer, maxTimer, exploded}
let bossBeams = [];

function updateMichaelBoss(e, fd) {
  const def = ENEMY_DEFS.michael_boss;
  const d   = dist(e, player);
  const ang = Math.atan2(player.y - e.y, player.x - e.x);

  if (e.slowTimer > 0) { e.slowTimer -= fd; if (e.slowTimer <= 0) e.slowMul = 1; }

  // 击退衰减
  if (Math.hypot(e.vx, e.vy) > 0.1) {
    const nx = e.x + e.vx * fd, ny = e.y + e.vy * fd;
    if (!isWall(nx, e.y)) e.x = nx; else e.vx = 0;
    if (!isWall(e.x, ny)) e.y = ny; else e.vy = 0;
    e.vx *= 0.7; e.vy *= 0.7;
  }

  // Phase切换
  const pct = e.hp / e.maxHp;
  if (pct <= 0.3 && e.phase < 3) {
    e.phase = 3;
    e.speed *= 1.5;
    e.atkCd = 0;
    screenShake = Math.max(screenShake, 14);
    spawnParticles(e.x, e.y, '#ffffff', 30, { spdMin: 5, spdMax: 18 });
  } else if (pct <= 0.6 && e.phase < 2) {
    e.phase = 2;
    e.speed *= 1.2;
    screenShake = Math.max(screenShake, 10);
    spawnParticles(e.x, e.y, '#c0d8ff', 20, { spdMin: 4, spdMax: 12 });
  }

  // 靠近玩家
  const chaseSpd = e.speed * e.slowMul * fd;
  if (d > e.r + player.r + 60) {
    const nx = e.x + Math.cos(ang) * chaseSpd;
    const ny = e.y + Math.sin(ang) * chaseSpd;
    if (!isWall(nx, e.y)) e.x = nx;
    if (!isWall(e.x, ny)) e.y = ny;
  }

  // CD
  if (e.atkCd > 0)    e.atkCd    -= fd;
  if (e.patternCd > 0) e.patternCd -= fd;

  // Phase1/2：放光柱
  if ((e.phase === 1 || e.phase === 2) && e.patternCd <= 0) {
    const count = e.phase === 2 ? 3 : 2;
    for (let i = 0; i < count; i++) {
      // 在玩家周围随机位置放光柱
      const bx = player.x + rnd(-120, 120);
      const by = player.y + rnd(-120, 120);
      bossBeams.push({ x: bx, y: by, r: 36, timer: 80, maxTimer: 80, exploded: false });
    }
    e.patternCd = e.phase === 2 ? 160 : 240;
  }

  // Phase3：近战狂暴
  if (e.phase === 3) {
    if (d < e.r + player.r + 40 && e.atkCd <= 0) {
      if (player.invincible <= 0) {
        damagePlayer(def.damage, ang);
        spawnParticles(e.x, e.y, '#c0d8ff', 12, { angle: ang, spread: 0.8, spdMin: 4, spdMax: 10 });
        screenShake = Math.max(screenShake, 7);
      }
      e.atkCd = 25;   // 狂暴：攻速翻倍
    }
  } else {
    // Phase1/2 普攻
    if (d < e.r + player.r + 50 && e.atkCd <= 0) {
      if (player.invincible <= 0) {
        damagePlayer(def.damage, ang);
        spawnParticles(e.x, e.y, '#c0d8ff', 10, { angle: ang, spread: 0.7, spdMin: 3, spdMax: 8 });
        screenShake = Math.max(screenShake, 6);
      }
      e.atkCd = def.atkCdMax;
    }
  }
}

function updateBossBeams(fd) {
  for (let i = bossBeams.length - 1; i >= 0; i--) {
    const b = bossBeams[i];
    b.timer -= fd;
    if (!b.exploded && b.timer <= 0) {
      // 爆炸
      b.exploded = true;
      if (player.invincible <= 0 && dist({x: b.x, y: b.y}, player) < b.r + player.r) {
        damagePlayer(40, Math.atan2(player.y - b.y, player.x - b.x));
      }
      spawnParticles(b.x, b.y, '#ffe080', 20, { spdMin: 4, spdMax: 14, rMin: 3, rMax: 7, decayMin: 0.03, decayMax: 0.06 });
      spawnParticles(b.x, b.y, '#ffffff', 10, { spdMin: 6, spdMax: 18, rMin: 1, rMax: 3 });
      screenShake = Math.max(screenShake, 6);
      // 爆炸后粒子显示完 —— 延迟0.5秒移除（用timer = -30标记等待消散）
      b.timer = -30;
    }
    if (b.timer < -30) { bossBeams.splice(i, 1); }
  }
}

function renderBossBeams() {
  for (const b of bossBeams) {
    if (b.exploded) continue;
    const sc = toScreen(b.x, b.y);
    const prog = 1 - b.timer / b.maxTimer; // 0→1
    ctx.save();
    // 预警圆（橙色扩散）
    ctx.globalAlpha = 0.3 + 0.4 * prog;
    ctx.strokeStyle = `rgb(${Math.round(255)},${Math.round(200 - 150 * prog)},0)`;
    ctx.lineWidth   = 3 + 2 * prog;
    ctx.shadowColor = '#ff6000';
    ctx.shadowBlur  = 20;
    ctx.beginPath();
    ctx.arc(sc.x, sc.y, b.r, 0, Math.PI * 2);
    ctx.stroke();
    // 内部填充
    ctx.globalAlpha = 0.08 + 0.12 * prog;
    ctx.fillStyle   = '#ff8800';
    ctx.beginPath();
    ctx.arc(sc.x, sc.y, b.r, 0, Math.PI * 2);
    ctx.fill();
    // 中心十字（高进度时更明显）
    if (prog > 0.5) {
      ctx.globalAlpha = (prog - 0.5) * 1.5;
      ctx.strokeStyle = '#ffcc00';
      ctx.lineWidth   = 2;
      ctx.shadowBlur  = 10;
      ctx.beginPath();
      ctx.moveTo(sc.x - 12, sc.y); ctx.lineTo(sc.x + 12, sc.y);
      ctx.moveTo(sc.x, sc.y - 12); ctx.lineTo(sc.x, sc.y + 12);
      ctx.stroke();
    }
    ctx.restore();
  }
}

function renderMichaelBoss(e) {
  const sc = toScreen(e.x, e.y);
  const sx = sc.x, sy = sc.y;
  const flashing = e.flashTimer > 0;
  const t = now * 0.001;

  ctx.save();
  ctx.translate(sx, sy);

  // 脚下阴影
  ctx.save();
  ctx.globalAlpha = 0.4;
  ctx.fillStyle   = '#000000';
  ctx.scale(1, 0.35);
  ctx.beginPath();
  ctx.ellipse(0, e.r * 1.0, e.r * 1.8, e.r * 1.0, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  // 旋转光环碎片（6条短线绕中心旋转）
  ctx.save();
  ctx.rotate(t * 0.8);
  const ringR = e.r + 18;
  ctx.strokeStyle = flashing ? '#ffffff' : '#c0d8ff';
  ctx.lineWidth   = 2.5;
  ctx.shadowColor = '#8090ff';
  ctx.shadowBlur  = 16;
  for (let i = 0; i < 6; i++) {
    const ra = (i / 6) * Math.PI * 2;
    const len = 14 + (i % 2) * 8;
    ctx.globalAlpha = 0.7 + 0.3 * Math.sin(t * 2 + i);
    ctx.beginPath();
    ctx.moveTo(Math.cos(ra) * ringR,           Math.sin(ra) * ringR);
    ctx.lineTo(Math.cos(ra) * (ringR + len),   Math.sin(ra) * (ringR + len));
    ctx.stroke();
  }
  ctx.restore();

  // 主体（大白圆）
  ctx.shadowColor = flashing ? '#ffffff' : (e.phase === 3 ? '#ff6040' : '#a0b8ff');
  ctx.shadowBlur  = e.phase === 3 ? 35 : 24;
  ctx.fillStyle   = flashing ? '#ffffff' : (e.phase === 3 ? '#ffe0d0' : '#e8ecff');
  ctx.beginPath();
  ctx.arc(0, 0, e.r, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = e.phase === 3 ? '#ff8060' : '#a0c0ff';
  ctx.lineWidth   = 2.5;
  ctx.stroke();

  // 十字剑纹（Phase3变为红色）
  if (!flashing) {
    ctx.save();
    ctx.strokeStyle = e.phase === 3 ? '#ff4020' : '#5068c0';
    ctx.lineWidth   = 3;
    ctx.shadowBlur  = 10;
    ctx.lineCap     = 'round';
    const arm = e.r * 0.6;
    ctx.beginPath(); ctx.moveTo(0, -arm); ctx.lineTo(0, arm); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-arm, 0); ctx.lineTo(arm, 0); ctx.stroke();
    ctx.restore();
  }

  // HP条（大血条，显示phase分隔线）
  const bw = e.r * 3.5, bh = 6;
  const bx = -bw / 2, by2 = e.r + 10;
  ctx.fillStyle = '#080810';
  ctx.fillRect(bx, by2, bw, bh);
  // HP颜色随phase
  const hpCol = e.phase === 3 ? '#ff4020' : (e.phase === 2 ? '#ff8040' : '#4080ff');
  ctx.fillStyle = hpCol;
  ctx.fillRect(bx, by2, bw * (e.hp / e.maxHp), bh);
  // Phase分隔线
  ctx.fillStyle = 'rgba(0,0,0,0.7)';
  ctx.fillRect(bx + bw * 0.6 - 1, by2, 2, bh);
  ctx.fillRect(bx + bw * 0.3 - 1, by2, 2, bh);
  // HP文字
  ctx.fillStyle = '#a0b0e0';
  ctx.font = '10px Courier New';
  ctx.textAlign = 'center';
  ctx.fillText(`BOSS  ${Math.max(0, Math.ceil(e.hp))} / ${e.maxHp}`, 0, by2 + bh + 12);

  ctx.restore();
}

function initEnemies() {
  enemies = [];
  enemies.push(makeEnemy('guardian', WORLD_W * 0.35, WORLD_H * 0.38));
  enemies.push(makeEnemy('guardian', WORLD_W * 0.65, WORLD_H * 0.38));
  enemies.push(makeEnemy('guardian', WORLD_W * 0.50, WORLD_H * 0.60));
}

// ═══ HUD UPDATE ════════════════════════════════════════════

const elHpFill  = document.getElementById('hp-fill');
const elHpText  = document.getElementById('hp-text');
const elCombo   = document.getElementById('hud-combo');
const elComboN  = document.getElementById('combo-count');
const cdCanvas  = document.getElementById('cd-canvas');
const cdCtx     = cdCanvas.getContext('2d');
const elGoldText = document.getElementById('gold-text');

function updateGoldHUD() {
  elGoldText.textContent = run.gold;
}

function updateHUD() {
  // ── HP条 ─────────────────────────────────────────────
  const pct = Math.max(0, player.hp / player.maxHp * 100);
  elHpFill.style.width = pct + '%';
  if (pct <= 30) {
    elHpFill.style.background = '#ff2040';
    elHpFill.style.boxShadow  = '0 0 8px #ff2040';
  } else if (pct <= 60) {
    elHpFill.style.background = '#d03060';
    elHpFill.style.boxShadow  = 'none';
  } else {
    elHpFill.style.background = '#c03060';
    elHpFill.style.boxShadow  = 'none';
  }
  elHpText.textContent = Math.max(0, Math.ceil(player.hp)) + ' / ' + player.maxHp;

  // ── 连击显示 ─────────────────────────────────────────
  if (player.comboStep > 0 && player.comboTimer > 0) {
    elCombo.style.opacity = '1';
    elComboN.textContent  = '×' + player.comboStep;
    elComboN.style.color      = player.comboStep === 2 ? '#ffd080' : '#e0c0ff';
    elComboN.style.textShadow = player.comboStep === 2
      ? '0 0 16px #ff8000' : '0 0 12px #8040ff';
  } else {
    elCombo.style.opacity = '0';
  }

  // ── CD环：三个技能（右上角小canvas）────────────────────
  // 冲刺(蓝) | 突刺(金白) | 旋转斩(金)，横排
  const cw = cdCanvas.width, ch = cdCanvas.height;
  cdCtx.clearRect(0, 0, cw, ch);

  drawCdArc(cdCtx, 20, ch/2, 16, player.dashCd,   DASH_CD_MAX,   '#40c0ff', '#1a4060', '冲');
  drawCdArc(cdCtx, 55, ch/2, 16, player.thrustCd, Math.round(THRUST_CD_MAX * player.mods.thrustCdMul), '#ffe8a0', '#403820', '刺');
  drawCdArc(cdCtx, 90, ch/2, 16, player.spinCd,   SPIN_CD_MAX,   '#ffe080', '#403010', '旋');
}

function drawCdArc(c, cx, cy, r, cd, cdMax, colReady, colCd, label) {
  const ready = cd <= 0;
  const prog  = ready ? 1 : 1 - cd / cdMax;

  // 背景圆
  c.save();
  c.beginPath();
  c.arc(cx, cy, r, 0, Math.PI * 2);
  c.fillStyle = '#0d0810';
  c.fill();

  // 进度弧（从顶部-π/2开始顺时针）
  c.beginPath();
  c.moveTo(cx, cy);
  c.arc(cx, cy, r, -Math.PI/2, -Math.PI/2 + Math.PI*2*prog);
  c.closePath();
  c.fillStyle = ready ? colReady : colCd;
  c.globalAlpha = ready ? 0.9 : 0.55;
  c.fill();

  // 边框
  c.globalAlpha = 1;
  c.beginPath();
  c.arc(cx, cy, r, 0, Math.PI * 2);
  c.strokeStyle = ready ? colReady : '#302030';
  c.lineWidth   = ready ? 2 : 1.5;
  if (ready) { c.shadowColor = colReady; c.shadowBlur = 8; }
  c.stroke();

  // 标签
  c.fillStyle   = ready ? '#ffffff' : '#604050';
  c.font        = '10px Courier New';
  c.textAlign   = 'center';
  c.textBaseline = 'middle';
  c.shadowBlur  = 0;
  c.fillText(label, cx, cy);
  c.restore();
}

// 立绘风格：深色剪影 + 彩色边缘发光 + 简单几何

function drawPortraitLucifer(c, x, y) {
  const cx = x + 90, bY = y + 220;
  c.save();

  // 背景光晕
  const aura = c.createRadialGradient(cx, y + 120, 20, cx, y + 120, 110);
  aura.addColorStop(0, 'rgba(255,100,20,0.18)');
  aura.addColorStop(1, 'rgba(0,0,0,0)');
  c.fillStyle = aura;
  c.fillRect(x, y, 180, 220);

  // 翅膀（两侧，深红折叠）
  c.globalAlpha = 0.55;
  c.fillStyle = '#3a0808';
  // 左翼
  c.beginPath();
  c.moveTo(cx - 10, y + 80);
  c.quadraticCurveTo(x - 30, y + 120, x + 10, bY - 20);
  c.quadraticCurveTo(x + 40, y + 160, cx - 20, y + 140);
  c.fill();
  // 右翼
  c.beginPath();
  c.moveTo(cx + 10, y + 80);
  c.quadraticCurveTo(x + 210, y + 120, x + 170, bY - 20);
  c.quadraticCurveTo(x + 140, y + 160, cx + 20, y + 140);
  c.fill();

  // 翅膀发光边缘
  c.globalAlpha = 0.7;
  c.strokeStyle = '#ff5010';
  c.lineWidth = 1.5;
  c.shadowColor = '#ff4000';
  c.shadowBlur = 12;
  c.beginPath();
  c.moveTo(cx - 10, y + 80);
  c.quadraticCurveTo(x - 20, y + 130, x + 15, bY - 30);
  c.stroke();
  c.beginPath();
  c.moveTo(cx + 10, y + 80);
  c.quadraticCurveTo(x + 200, y + 130, x + 165, bY - 30);
  c.stroke();

  // 长袍身体
  c.globalAlpha = 0.9;
  c.shadowBlur = 0;
  c.fillStyle = '#1a0808';
  c.beginPath();
  c.moveTo(cx - 28, y + 95);
  c.lineTo(cx + 28, y + 95);
  c.lineTo(cx + 35, bY);
  c.lineTo(cx - 35, bY);
  c.closePath();
  c.fill();

  // 轮廓发光
  c.strokeStyle = '#ff6020';
  c.lineWidth = 1.5;
  c.shadowColor = '#ff4000';
  c.shadowBlur = 10;
  c.stroke();

  // 头部
  c.shadowBlur = 15;
  c.fillStyle = '#200808';
  c.beginPath();
  c.arc(cx, y + 68, 26, 0, Math.PI * 2);
  c.fill();
  c.strokeStyle = '#ff8030';
  c.lineWidth = 1.5;
  c.stroke();

  // 角冠（两支）
  c.shadowColor = '#ff3000';
  c.shadowBlur = 8;
  c.strokeStyle = '#cc3010';
  c.lineWidth = 2;
  c.beginPath();
  c.moveTo(cx - 10, y + 48); c.lineTo(cx - 20, y + 20);
  c.stroke();
  c.beginPath();
  c.moveTo(cx + 10, y + 48); c.lineTo(cx + 20, y + 20);
  c.stroke();

  // 眼睛（橙红点）
  c.shadowBlur = 6;
  c.fillStyle = '#ff6000';
  c.beginPath(); c.arc(cx - 9, y + 66, 3, 0, Math.PI * 2); c.fill();
  c.beginPath(); c.arc(cx + 9, y + 66, 3, 0, Math.PI * 2); c.fill();

  c.restore();
}

  // 头部
  c.fillStyle = '#100818';
  c.shadowBlur = 10;
  c.beginPath();
  c.arc(cx, y + 67, 25, 0, Math.PI * 2);

  // 左半黑

  c.beginPath(); c.ellipse(cx+6,y+55,4.5,3,0,0,Math.PI*2); c.fill();
  c.fillStyle='#ffffff'; c.shadowBlur=0;
  c.beginPath(); c.arc(cx-5,y+54,1.5,0,Math.PI*2); c.fill();
  c.beginPath(); c.arc(cx+7,y+54,1.5,0,Math.PI*2); c.fill();
  // 眼部高亮线（闪电感）
  c.strokeStyle='rgba(255,220,100,0.5)'; c.lineWidth=1.2;
  c.beginPath(); c.moveTo(cx-12,y+51); c.lineTo(cx-8,y+53); c.stroke();
  c.beginPath(); c.moveTo(cx+12,y+51); c.lineTo(cx+8,y+53); c.stroke();
  c.restore();
}

// ─── 扎奇尔（#80ffc0，纯白衣，双手摊开，圣光柱） ────────
function drawPortraitZaqiel(c, x, y) {
  c.save();
  const cx = x + 90;
  // 翠绿背景
  c.shadowColor='#80ffc0'; c.shadowBlur=36;
  const g = c.createRadialGradient(cx,y+80,0,cx,y+80,100);
  g.addColorStop(0,'rgba(40,160,80,0.3)'); g.addColorStop(1,'rgba(0,0,0,0)');
  c.fillStyle=g; c.fillRect(x,y,180,220);

  // 圣光柱（从下而上，背景）
  const pillar = c.createLinearGradient(cx,y+160,cx,y+30);
  pillar.addColorStop(0,'rgba(120,255,180,0.28)'); pillar.addColorStop(1,'rgba(120,255,180,0)');
  c.fillStyle=pillar; c.fillRect(cx-12,y+30,24,130);

  // 翅膀（洁白，展开摊手）
  for (let s = -1; s <= 1; s += 2) {
    c.save(); c.shadowColor='#c0ffd8'; c.shadowBlur=12; c.globalAlpha=0.88;
    c.fillStyle=s<0?'#c0f8d0':'#d0fce0';
    c.beginPath();
    c.moveTo(cx+s*8,y+70);
    c.bezierCurveTo(cx+s*35,y+50,cx+s*66,y+52,cx+s*68,y+80);
    c.bezierCurveTo(cx+s*58,y+102,cx+s*26,y+102,cx+s*8,y+70);
    c.fill();
    c.strokeStyle='rgba(140,255,190,0.4)'; c.lineWidth=1;
    for(let f=1;f<=3;f++){const ft=f/4;c.beginPath();c.moveTo(cx+s*8,y+70);c.lineTo(cx+s*(8+(60*ft)),y+70+15*ft-8);c.stroke();}
    c.globalAlpha=1; c.restore();
  }
  // 身体（纯白长袍）
  c.fillStyle='#f0fff8'; c.shadowColor='#80ffc0'; c.shadowBlur=10;
  c.beginPath(); c.moveTo(cx-16,y+70); c.lineTo(cx+16,y+70); c.lineTo(cx+22,y+148); c.lineTo(cx-22,y+148); c.closePath(); c.fill();
  // 双手摊开（手臂）
  c.strokeStyle='#e0f8f0'; c.lineWidth=7; c.lineCap='round'; c.shadowColor='#80ffc0'; c.shadowBlur=8;
  c.beginPath(); c.moveTo(cx-10,y+86); c.lineTo(cx-38,y+100); c.stroke();
  c.beginPath(); c.moveTo(cx+10,y+86); c.lineTo(cx+38,y+100); c.stroke();
  // 手心圣光
  c.fillStyle='rgba(120,255,180,0.6)'; c.shadowColor='#80ffc0'; c.shadowBlur=16;
  c.beginPath(); c.arc(cx-40,y+100,6,0,Math.PI*2); c.fill();
  c.beginPath(); c.arc(cx+40,y+100,6,0,Math.PI*2); c.fill();
  // 头部
  c.fillStyle='#e0f8ec'; c.shadowColor='#80ffc0'; c.shadowBlur=14;
  c.beginPath(); c.arc(cx,y+55,17,0,Math.PI*2); c.fill();
  // 头发（浅绿白）
  c.fillStyle='#60d898'; c.shadowBlur=0;
  c.beginPath(); c.moveTo(cx-13,y+42); c.bezierCurveTo(cx-10,y+28,cx+10,y+28,cx+13,y+42); c.bezierCurveTo(cx+18,y+38,cx+20,y+50,cx+14,y+55); c.lineTo(cx-14,y+55); c.bezierCurveTo(cx-20,y+50,cx-18,y+38,cx-13,y+42); c.closePath(); c.fill();
  // 眼睛（温柔，翠绿）
  c.fillStyle='#40c878'; c.shadowColor='#80ffc0'; c.shadowBlur=8;
  c.beginPath(); c.ellipse(cx-6,y+57,4,3,0.1,0,Math.PI*2); c.fill();
  c.beginPath(); c.ellipse(cx+6,y+57,4,3,0.1,0,Math.PI*2); c.fill();
  c.fillStyle='#ffffff'; c.shadowBlur=0;
  c.beginPath(); c.arc(cx-5,y+56,1.2,0,Math.PI*2); c.fill();
  c.beginPath(); c.arc(cx+7,y+56,1.2,0,Math.PI*2); c.fill();
  c.restore();
}

// 立绘调度（对话框渲染时调用）
function renderPortrait(line) {
  if (!line || !line.portrait) return;
  const pw = 180, ph = 220;
  const dialogH = H * 0.32;       // 对话框高度（同CSS height:32%）
  const portraitY = H - dialogH - ph + 10; // 贴对话框上沿，略微重叠
  const portraitX = (line.side === 'right') ? W - pw - 40 : 40;
  switch (line.portrait) {
    case 'lucifer':   drawPortraitLucifer (ctx, portraitX, portraitY); break;
    case 'player':    drawPortraitPlayer  (ctx, portraitX, portraitY); break;
    case 'raphael':   drawPortraitRaphael (ctx, portraitX, portraitY); break;
    case 'michael':   drawPortraitMichael (ctx, portraitX, portraitY); break;
    case 'azazel':    drawPortraitAzazel  (ctx, portraitX, portraitY); break;
    case 'ramiel':    drawPortraitRamiel  (ctx, portraitX, portraitY); break;
    case 'shamsiel':  drawPortraitShamsiel(ctx, portraitX, portraitY); break;
    case 'semyaza':   drawPortraitSemyaza (ctx, portraitX, portraitY); break;
    case 'kokabiel':  drawPortraitKokabiel(ctx, portraitX, portraitY); break;
    case 'sariel':    drawPortraitSariel  (ctx, portraitX, portraitY); break;
    case 'danel':     drawPortraitDanel   (ctx, portraitX, portraitY); break;
    case 'ezequeel':  drawPortraitEzequeel(ctx, portraitX, portraitY); break;
    case 'baraqiel':  drawPortraitBaraqiel(ctx, portraitX, portraitY); break;
    case 'zaqiel':    drawPortraitZaqiel  (ctx, portraitX, portraitY); break;
  }
}

// ═══ DIALOG SYSTEM ═════════════════════════════════════════
// ═══════════════════════════════════════════════════════════
let dlg = {
  id: null,
  lineIdx: 0,
  typeTimer: 0,    // 已经"打"出多少字符（小数累积）
  waitingChoice: false,
  waitingEnd: false,       // 最后一行打完后等玩家再点一次才关闭
  pendingAngelId: null,        // 当前天使对话对应的天使id（给完对话后发buff）
  pendingBlessingAngel: null,  // 当前祝福天使对象（对话后弹3选1）
};

const dlgSpeaker = document.getElementById('dialog-speaker');
const dlgText    = document.getElementById('dialog-text');
const dlgChoices = document.getElementById('dialog-choices');
const dlgHint    = document.getElementById('dialog-hint');
const dlgBox     = document.getElementById('dialog-box');

function startDialog(id) {
  const data = DIALOGS[id];
  if (!data) return;
  dlg.id            = id;
  dlg.lineIdx       = 0;
  dlg.typeTimer     = 0;
  dlg.waitingChoice = false;
  dlg.waitingEnd    = false;
  dlgChoices.innerHTML = '';
  setGameState(S.DIALOG);
  renderDialog();
}

function currentLine() {
  const data = DIALOGS[dlg.id];
  if (!data) return null;
  return data.lines[dlg.lineIdx] || null;
}

// 打字机速度：每帧累积字数（约2字/帧@60fps）
const TYPE_SPEED = 2;

function updateDialog(fd) {
  if (gameState !== S.DIALOG) return;
  const line = currentLine();
  if (!line) return;
  if (dlg.waitingChoice) return;           // 等选项点击，不自动推进

  const textLen = line.text.length;
  if (dlg.typeTimer < textLen) {
    dlg.typeTimer = Math.min(dlg.typeTimer + TYPE_SPEED * fd, textLen);
    renderDialogText(line);
  }
}

function renderDialog() {
  const line = currentLine();
  if (!line) return;
  dlg.typeTimer = 0;
  dlgChoices.innerHTML = '';
  dlg.waitingChoice = false;
  dlg.waitingEnd    = false;
  dlgHint.style.opacity = '1';

  dlgSpeaker.textContent  = line.speaker;
  dlgSpeaker.style.color  = line.speakerColor || '#ffe080';
  dlgText.textContent     = '';
}

function renderDialogText(line) {
  const shown = line.text.slice(0, Math.floor(dlg.typeTimer));
  dlgText.textContent = shown;
}

function advanceDialog() {
  const data = DIALOGS[dlg.id];
  if (!data) return;

  // 正在等待玩家确认结束
  if (dlg.waitingEnd) {
    dlg.waitingEnd = false;
    endDialog();
    return;
  }

  const line = currentLine();
  if (!line) return;

  // 若文字未打完，先补全
  if (dlg.typeTimer < line.text.length) {
    dlg.typeTimer = line.text.length;
    dlgText.textContent = line.text;
    return;
  }

  // 文字已全显：检查是否有选项
  if (line.choices && line.choices.length > 0 && !dlg.waitingChoice) {
    dlg.waitingChoice = true;
    dlgHint.style.opacity = '0';
    dlgChoices.innerHTML = '';
    for (const ch of line.choices) {
      const btn = document.createElement('button');
      btn.className = 'dialog-choice';
      btn.textContent = ch.label;
      btn.addEventListener('click', () => {
        dlg.waitingChoice = false;
        dlgChoices.innerHTML = '';
        dlgHint.style.opacity = '1';
        dlg.lineIdx  = ch.goto;
        dlg.typeTimer = 0;
        // 直接渲染下一行（即使 isEnd，也先让玩家读完再点击结束）
        const nextLine = currentLine();
        if (!nextLine) {
          dlg.waitingEnd = true;
        } else {
          renderDialog();
        }
      });
      dlgChoices.appendChild(btn);
    }
    return;
  }

  // 无选项：检查 isEnd 或前进
  if (line.isEnd) {
    // 先把文字显示完，等玩家再点一次才真正结束
    dlg.waitingEnd = true;
    dlgHint.style.opacity = '1';
    return;
  }

  dlg.lineIdx++;
  const next = currentLine();
  if (!next) {
    dlg.waitingEnd = true;
    dlgHint.style.opacity = '1';
    return;
  }
  dlg.typeTimer = 0;
  renderDialog();
}

function endDialog() {
  const data = DIALOGS[dlg.id];
  const endAction = data && data.onEnd;
  const angelId   = dlg.pendingAngelId || null;
  const blessingAngel = dlg.pendingBlessingAngel || null;
  dlg.id = null;
  dlg.pendingAngelId = null;
  dlg.pendingBlessingAngel = null;
  dlgBox.classList.add('hidden');
  setGameState(S.PLAYING);

  // 执行 onEnd 回调
  if (endAction === 'offerBuff') offerBuff(null);  // 全池3选1（路西法对话后）
  else if (endAction === 'offerBlessingBuffCombat') {
    // COMBAT房祝福天使对话后：给该天使自己的6个buff里3选1
    const aid = blessingAngel ? blessingAngel.id : null;
    offerBuff(aid);
  }
  else if (endAction === 'offerBlessingBuffAngelRoom') {
    // ANGEL房：全池3选1
    offerBuff(null);
  }
  else if (endAction === 'grantAngelBuff' && angelId) grantAngelBuffImmediate(angelId);
}

// ── 堕落天使对话（动态注入到DIALOGS）────────────────────
// 用过的天使按zone追踪，避免重复（每局重置）
let usedAngelIds = [];

function pickRandomAngel() {
  // 过滤掉已用的，如果全用完了就重置
  let available = FALLEN_ANGELS.filter(a => !usedAngelIds.includes(a.id));
  if (available.length === 0) { usedAngelIds = []; available = FALLEN_ANGELS; }
  return available[Math.floor(Math.random() * available.length)];
}

function startAngelDialog(angel) {
  // ANGEL房间：堕落天使对话结束后给全池3选1（不再是单个即时buff）
  const key = '__angel__';
  DIALOGS[key] = {
    onEnd: 'offerBlessingBuffAngelRoom',   // 全池3选1
    lines: angel.lines.map(l => ({
      speaker: angel.name,
      speakerColor: angel.color,
      portrait: null,   // 堕落天使暂无立绘（使用文字）
      text: l.text,
      isEnd: l.isEnd || false,
    })),
  };
  usedAngelIds.push(angel.id);
  startDialog(key);
}

// 天使祝福立即发放（对话结束后）
function grantAngelBuffImmediate(angelId) {
  const angel = FALLEN_ANGELS.find(a => a.id === angelId);
  if (!angel) return;
  // 找到对应buff
  const buff = ALL_BUFFS.find(b => b.id === angel.buffId);
  if (!buff) return;
  if (!run.activeBuffs.includes(buff.id)) {
    buff.apply(player);
    run.activeBuffs.push(buff.id);
    updateBuffIcons();
  }
  // 显示获得提示
  showFloatingText(`获得：${angel.buffName}`, angel.color);
}

// 浮动文字提示（屏幕中央短暂显示）
function showFloatingText(text, color) {
  floatingTexts.push({ text, color, timer: 180, y: H * 0.38 });
}
function updateFloatingTexts(fd) {
  for (let i = floatingTexts.length - 1; i >= 0; i--) {
    floatingTexts[i].timer -= fd;
    floatingTexts[i].y -= 0.3 * fd;
    if (floatingTexts[i].timer <= 0) floatingTexts.splice(i, 1);
  }
}
function renderFloatingTexts() {
  for (const ft of floatingTexts) {
    const alpha = Math.min(1, ft.timer / 40);
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.fillStyle   = ft.color;
    ctx.shadowColor = ft.color;
    ctx.shadowBlur  = 16;
    ctx.font        = 'bold 18px Courier New';
    ctx.textAlign   = 'center';
    ctx.fillText(ft.text, W / 2, ft.y);
    ctx.restore();
  }
}

// ═══════════════════════════════════════════════════════════
// ═══ ROOM & RUN SYSTEM ═════════════════════════════════════
// ═══════════════════════════════════════════════════════════
let room = { tiles: [], exits: [], type: 'COMBAT' };

// run 对象：当前局的进度
let run = { zone: 0, roomIdx: 0, roomSequence: [], activeBuffs: [], gold: 0, nextChoices: [],
  pendingEliteReward: false, pendingCombatReward: false, pendingCombatAngel: null,
  blessingAngelQueue: [], blessingAngelIdx: 0, buffSourceAngel: null };

// 房间类型序列生成
// 每区5间：ENTRY, COMBAT, COMBAT/ANGEL, ELITE, BOSS
// 只有20%概率把第2间改为ANGEL（天使祝福间），减少纯对话房间
function generateRoomSequence(zone) {
  const seq = ['ENTRY', 'COMBAT', 'COMBAT', 'ELITE', 'BOSS'];
  if (Math.random() < 0.20) seq[1] = 'ANGEL';
  return seq;
}

// 柱子布局模板（按房间类型）
const PILLAR_LAYOUTS = {
  ENTRY:  [[4,4],[4,20],[13,4],[13,20]],
  ANGEL:  [[4,4],[4,20],[13,4],[13,20]],   // 天使祝福间：同ENTRY布局
  COMBAT: [
    [[4,4],[4,20],[13,4],[13,20],[8,12]],
    [[4,8],[4,16],[8,4],[8,20],[13,12]],
    [[6,6],[6,18],[11,6],[11,18]],
    [[5,5],[5,19],[12,5],[12,19],[8,12]],
  ],
  ELITE:  [[3,3],[3,21],[14,3],[14,21],[8,7],[8,17]],
  BOSS:   [[3,3],[3,21],[14,3],[14,21]],
  EVENT:  [[4,4],[4,20],[13,4],[13,20]],
};

function generateRoom(type, zone) {
  const tiles = [];
  for (let r = 0; r < ROOM_ROWS; r++) {
    tiles[r] = [];
    for (let c = 0; c < ROOM_COLS; c++) {
      tiles[r][c] = (r === 0 || r === ROOM_ROWS-1 || c === 0 || c === ROOM_COLS-1) ? 1 : 0;
    }
  }

  // 选柱子布局
  let pillars;
  if (type === 'COMBAT') {
    const layouts = PILLAR_LAYOUTS.COMBAT;
    pillars = layouts[Math.floor(Math.random() * layouts.length)];
  } else {
    pillars = PILLAR_LAYOUTS[type] || PILLAR_LAYOUTS.ENTRY;
  }
  pillars.forEach(([r, c]) => {
    // 边界保护
    if (r > 0 && r+1 < ROOM_ROWS-1 && c > 0 && c+1 < ROOM_COLS-1) {
      tiles[r][c] = 1; tiles[r+1][c] = 1;
      tiles[r][c+1] = 1; tiles[r+1][c+1] = 1;
    }
  });

  // 出口：房间右侧中央（世界坐标，宽72高72）
  // 注意：ENTRY房间（起始间）已经打开，其余等敌人清空才解锁
  const exitCol = ROOM_COLS - 1;
  const exitRow = Math.floor(ROOM_ROWS / 2) - 1;
  // 在出口处打通墙（2格宽）
  tiles[exitRow][exitCol]   = 0;
  tiles[exitRow+1][exitCol] = 0;
  tiles[exitRow+2][exitCol] = 0;

  const exitX = exitCol * TILE;
  const exitY = exitRow * TILE;

  return {
    tiles,
    type,
    zone,
    exits: [{
      x: exitX, y: exitY,
      w: TILE, h: TILE * 3,
      locked: (type !== 'ENTRY'),
    }],
  };

// 初始化整个 run（新游戏 / 重试）
function initRun() {
  run.zone      = 0;
  run.roomIdx   = 0;
  run.activeBuffs = [];
  run.gold      = 0;
  run.nextChoices = [];
  run.pendingEliteReward = false;
  run.pendingCombatReward = false;   // COMBAT房打完等待天使弹出
  run.pendingCombatAngel = null;     // COMBAT房对应天使
  run.roomSequence = generateRoomSequence(0);
  usedAngelIds = [];
  initBlessingQueue();
  updateGoldHUD();
  loadRoom(0, 0);
}

// 加载指定区域+房间索引的房间
function loadRoom(zone, roomIdx) {
  const type = run.roomSequence[roomIdx];
  room = generateRoom(type, zone);

  // 玩家放在房间左侧中央
  player.x = TILE * 3;
  player.y = WORLD_H / 2;

  // 生成敌人
  spawnEnemiesForRoom(type, zone);

  // 每次加载新房间重置COMBAT战斗奖励标志
  run.pendingCombatReward = false;
  run.pendingCombatAngel  = null;
  run.pendingEliteReward  = false;

  // ENTRY / ANGEL / SHOP 房间直接解锁出口
  if (type === 'ENTRY' || type === 'ANGEL' || type === 'SHOP') {
    room.exits.forEach(e => e.locked = false);
  }

  // 清空攻击/粒子
  attacks     = [];
  projectiles = [];
  particles   = [];
  floatingTexts = [];

  // 更新顶部进度 HUD
  updateProgressHUD();

  // 叙事/商店触发
  if (type === 'SHOP') {
    setTimeout(() => openShop(), 300);
  } else if (zone === 1 && roomIdx === 0) {
    setTimeout(() => startDialog('raphael_zone2'), 300);
  } else if (zone === 2 && type === 'BOSS') {
    setTimeout(() => startDialog('michael_boss_intro'), 300);
  } else if (type === 'ANGEL') {
    // ANGEL房：堕落天使出现，对话后给全池3选1
    const angel = pickRandomAngel();
    setTimeout(() => startAngelDialog(angel), 300);
  }
}

// 按房间类型/区域生成敌人
function spawnEnemiesForRoom(type, zone) {
  enemies = [];
  if (type === 'ENTRY' || type === 'ANGEL' || type === 'SHOP') return;

  // 安全随机位置（远离玩家，不在墙里）
  function safePos() {
    let x, y, tries = 0;
    do {
      x = rnd(TILE * 5, WORLD_W - TILE * 5);
      y = rnd(TILE * 3, WORLD_H - TILE * 3);
      tries++;
    } while ((isWall(x, y) || dist({x, y}, player) < 200) && tries < 30);
    return { x, y };
  }

  if (type === 'COMBAT') {
    if (zone === 0) {
      // 净罪塔：2个守卫，1个长矛
      for (let i = 0; i < 2; i++) { const p = safePos(); enemies.push(makeEnemy('guardian', p.x, p.y)); }
      { const p = safePos(); enemies.push(makeEnemy('spear_angel', p.x, p.y)); }
    } else if (zone === 1) {
      // 圣光廊道：2个守卫，2个长矛
      for (let i = 0; i < 2; i++) { const p = safePos(); enemies.push(makeEnemy('guardian', p.x, p.y)); }
      for (let i = 0; i < 2; i++) { const p = safePos(); enemies.push(makeEnemy('spear_angel', p.x, p.y)); }
    } else {
      // 审判庭：3个守卫，2个长矛
      for (let i = 0; i < 3; i++) { const p = safePos(); enemies.push(makeEnemy('guardian', p.x, p.y)); }
      for (let i = 0; i < 2; i++) { const p = safePos(); enemies.push(makeEnemy('spear_angel', p.x, p.y)); }
    }
  } else if (type === 'ELITE') {
    // 精英间：archangel + 1个长矛
    const cx = WORLD_W * 0.6, cy = WORLD_H * 0.5;
    enemies.push(makeArchangel(cx, cy));
    { const p = safePos(); enemies.push(makeEnemy('spear_angel', p.x, p.y)); }
  } else if (type === 'BOSS') {
    // BOSS间：zone0/1 用强化archangel当Boss，zone2用michael_boss
    const cx = WORLD_W * 0.65, cy = WORLD_H * 0.5;
    if (zone < 2) {
      // 净罪塔/圣光廊道BOSS：强化大天使 + 2个守卫
      const boss = makeArchangel(cx, cy);
      boss.isBoss = true;
      boss.hp    = 280; boss.maxHp = 280;
      boss.r     = 22;
      boss.speed *= 1.2;
      enemies.push(boss);
      { const p = safePos(); enemies.push(makeEnemy('guardian', p.x, p.y)); }
      { const p = safePos(); enemies.push(makeEnemy('guardian', p.x, p.y)); }
    } else {
      // 审判庭BOSS：米迦勒
      enemies.push(makeMichaelBoss(cx, cy));
    }
  }
}

// 检查出口解锁（每帧调用）——ELITE/COMBAT/BOSS打完后先触发对话再解锁
function checkExitUnlock() {
  if (room.type === 'ENTRY' || room.type === 'ANGEL') return;
  if (enemies.length === 0 && !room.exits[0].locked) return; // 已解锁不重复处理
  if (enemies.length === 0) {
    // COMBAT房打完：弹出祝福天使对话 → 给该天使池3选1 → 解锁出口
    if (room.type === 'COMBAT' && !run.pendingCombatReward) {
      run.pendingCombatReward = true;
      room.exits.forEach(ex => { ex.locked = true; }); // 保持锁定，等Buff选完
      const angel = run.pendingCombatAngel || nextBlessingAngel();
      run.pendingCombatAngel = angel;
      setTimeout(() => {
        startBlessingAngelDialog(angel, 'combat');
      }, 400);
      return;
    }
    // 精英间打完：弹路西法对话+全池Buff选择
    if (room.type === 'ELITE' && !run.pendingEliteReward) {
      run.pendingEliteReward = true;
      setTimeout(() => {
        startDialog('lucifer_after_elite');
      }, 400);
      room.exits.forEach(ex => { ex.locked = true; }); // 保持锁定，等Buff选完
      return;
    }
    room.exits.forEach(ex => { ex.locked = false; });
  }
}

// 检查玩家是否踩到出口
function checkExitTrigger() {
  for (const ex of room.exits) {
    if (ex.locked) continue;
    if (player.x + player.r > ex.x && player.x - player.r < ex.x + ex.w &&
        player.y + player.r > ex.y && player.y - player.r < ex.y + ex.h) {
      // ENTRY 间第一次直接进下一间（游戏开始走廊不需要选路）
      // BOSS 间打完后直接走（advanceRoom 会处理区域结束逻辑）
      // 区域最后一间（BOSS）直接触发房间切换
      if (room.type === 'BOSS' || run.roomIdx + 1 >= ROOMS_PER_ZONE) {
        triggerRoomTransition();
      } else {
        triggerRouteChoice();
      }
      return;
    }
  }
}

function generateNextChoices(zone, currentIdx) {
  const pool = ROUTE_POOL[zone] || ROUTE_POOL[0];
  // 打乱并选两个不重复类型的选项
  const shuffled = [...pool].sort(() => Math.random() - 0.5);
  const choices = [];
  const usedTypes = new Set();
  for (const opt of shuffled) {
    if (!usedTypes.has(opt.type)) {
      choices.push(opt);
      usedTypes.add(opt.type);
    }
    if (choices.length >= 2) break;
  }
  // 如果只找到1个（池子太小），重复一个COMBAT
  if (choices.length < 2) {
    choices.push({ type: 'COMBAT', icon: '⚔', name: '普通战斗', desc: '标准敌人编队' });
  }
  return choices;
}

let pendingRouteChoice = null;  // 选中的路线选项（等 fade 结束后加载）

function triggerRouteChoice() {
  if (fadeState !== 'none') return;
  if (gameState === S.ROUTE) return;
  // 生成岔路选项，同时预先绑定下一个祝福天使
  run.nextChoices = generateNextChoices(run.zone, run.roomIdx);
  // 为选项里的COMBAT绑定预告天使
  for (const opt of run.nextChoices) {
    if (opt.type === 'COMBAT') {
      const angel = nextBlessingAngel();
      opt.blessingAngel = angel;  // 预告用
      opt.reward = `✦ ${angel.name}的祝福`;
      opt.rewardColor = angel.color;
    }
  }
  renderRouteScreen();
  setGameState(S.ROUTE);
}

function renderRouteScreen() {
  const container = document.getElementById('route-cards');
  container.innerHTML = '';
  for (const opt of run.nextChoices) {
    const card = document.createElement('div');

    card.innerHTML = `

      if (opt.type === 'COMBAT' && opt.blessingAngel) {
        run.pendingCombatAngel = opt.blessingAngel;
      }
      pendingRouteChoice = opt;
      setGameState(S.PLAYING);
      triggerRoomTransition();
    });

}


// 房间切换：渐黑→加载→渐亮
let fadeAlphaTarget = 0;
let fadeState = 'none'; // 'fadeout' | 'loading' | 'fadein' | 'none'
let fadeTimer = 0;
const FADE_DUR = 20; // 帧

function triggerRoomTransition() {
  if (fadeState !== 'none') return;
  fadeState = 'fadeout';
  fadeTimer = FADE_DUR;
}

function updateFade(fd) {
  if (fadeState === 'none') return;

  fadeTimer -= fd;
  if (fadeState === 'fadeout') {
    fadeAlpha = 1 - clamp(fadeTimer / FADE_DUR, 0, 1); // 0→1
    if (fadeTimer <= 0) {
      // 加载下一房间
      advanceRoom();
      fadeState = 'fadein';
      fadeTimer = FADE_DUR;
    }
  } else if (fadeState === 'fadein') {
    fadeAlpha = clamp(fadeTimer / FADE_DUR, 0, 1); // 1→0
    if (fadeTimer <= 0) {
      fadeAlpha = 0;
      fadeState = 'none';
    }
  }
}

function advanceRoom() {
  run.roomIdx++;

  if (run.roomIdx >= ROOMS_PER_ZONE) {
    // 区域结束
    run.zone++;
    if (run.zone >= 3) {
      setGameState(S.WIN);
      return;
    }
    run.roomIdx = 0;
    run.roomSequence = generateRoomSequence(run.zone);
    pendingRouteChoice = null;
    loadRoom(run.zone, 0);
    setTimeout(() => offerBuff(), 350);
  } else {
    // 用玩家选择的路线类型覆盖序列中对应房间类型
    if (pendingRouteChoice) {
      run.roomSequence[run.roomIdx] = pendingRouteChoice.type;
      pendingRouteChoice = null;
    }
    loadRoom(run.zone, run.roomIdx);
  }
}

// Buff选择渲染（按天使池或全池）
function renderBuffChoices() {
  const angelId = run.buffSourceAngel;
  let pool;
  let headerAngel = null;
  if (angelId) {
    const angel = BLESSING_ANGELS.find(a => a.id === angelId);
    headerAngel = angel;
    pool = ALL_BUFFS.filter(b => b.angel === angelId && !run.activeBuffs.includes(b.id));
    // 若该天使buff全选完，退化到全池
    if (pool.length === 0) pool = ALL_BUFFS.filter(b => !run.activeBuffs.includes(b.id));
  } else {
    pool = ALL_BUFFS.filter(b => !run.activeBuffs.includes(b.id));
  }
  const shuffled = [...pool].sort(() => Math.random() - 0.5);
  const choices = shuffled.slice(0, 3);

  // 更新标题（显示天使名）
  const titleEl = document.getElementById('buff-title');
  if (headerAngel) {
    titleEl.innerHTML = `<span style="color:${headerAngel.color}">${headerAngel.name}</span> 的祝福`;
  } else {
    titleEl.textContent = '选择恩赐';
  }

  const container = document.getElementById('buff-cards');
  container.innerHTML = '';
  for (const b of choices) {
    const card = document.createElement('div');
    card.className = 'buff-card';
    card.innerHTML = `
      <div class="buff-card-theme" style="background:${b.theme}"></div>
      <div class="buff-card-body">
        <div class="buff-card-tag" style="color:${b.theme}">${b.tag}</div>
        <div class="buff-card-name">${b.name}</div>
        <div class="buff-card-desc">${b.desc}</div>
      </div>`;
    card.addEventListener('click', () => {
      if (!run.activeBuffs.includes(b.id)) {
        run.activeBuffs.push(b.id);
        b.apply(player);
        updateBuffIcons();
        showFloatingText(`${b.tag} · ${b.name}`, b.theme);
      }
      run.buffSourceAngel = null;
      setGameState(S.PLAYING);
      // COMBAT间：Buff选完后解锁出口
      if (room.type === 'COMBAT') {
        room.exits.forEach(ex => { ex.locked = false; });
        run.pendingCombatReward = false;
        run.pendingCombatAngel  = null;
      }
      // 精英间：Buff选完后解锁出口
      if (room.type === 'ELITE') {
        room.exits.forEach(ex => { ex.locked = false; });
        run.pendingEliteReward = false;
      }
    });
    container.appendChild(card);
  }
}

// run.pendingCombatAngel: COMBAT房打完后等待显示的天使（含天使对象）

// 初始化祝福天使队列
function initBlessingQueue() {
  const ids = BLESSING_ANGELS.map(a => a.id);
  // Fisher-Yates打乱
  for (let i = ids.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [ids[i], ids[j]] = [ids[j], ids[i]];
  }
  run.blessingAngelQueue = ids;
  run.blessingAngelIdx   = 0;
}

// 取下一个祝福天使（循环轮转）
function nextBlessingAngel() {
  if (!run.blessingAngelQueue || run.blessingAngelQueue.length === 0) initBlessingQueue();
  const id = run.blessingAngelQueue[run.blessingAngelIdx % run.blessingAngelQueue.length];
  run.blessingAngelIdx = (run.blessingAngelIdx + 1) % run.blessingAngelQueue.length;
  return BLESSING_ANGELS.find(a => a.id === id);
}

let shopBoughtIds = new Set();  // 本商店已购商品

function openShop() {
  shopBoughtIds = new Set();
  setGameState(S.SHOP);
  renderShopItems();
  updateShopGold();
}

function updateShopGold() {
  document.getElementById('shop-gold').textContent = run.gold;
}

function renderShopItems() {
  // 随机3件不重复
  const pool = [...SHOP_ITEMS].sort(() => Math.random() - 0.5).slice(0, 3);
  const container = document.getElementById('shop-cards');
  container.innerHTML = '';
  for (const item of pool) {
    const card = document.createElement('div');
    card.className = 'shop-card';
    const themeTag = item.theme === '#ff6060' ? 'LIFE' :
                     item.theme === '#40c0ff' ? 'SPEED' :
                     item.theme === '#ffe080' ? 'HOLY'  : 'SHADOW';
    card.innerHTML = `
      <div class="shop-card-theme" style="background:${item.theme}"></div>
      <div class="shop-card-body">
        <div class="buff-card-tag">${themeTag}</div>
        <div class="shop-card-name">${item.name}</div>
        <div class="shop-card-desc">${item.desc}</div>
        <div class="shop-card-cost">◈ ${item.cost}</div>
      </div>
      <button class="shop-card-btn" data-id="${item.id}">购买</button>`;

    const btn = card.querySelector('.shop-card-btn');
    if (run.gold < item.cost) btn.disabled = true;

    btn.addEventListener('click', () => {
      if (run.gold < item.cost) return;
      if (shopBoughtIds.has(item.id)) return;
      run.gold -= item.cost;
      item.apply(player);
      shopBoughtIds.add(item.id);
      btn.textContent = '已购';
      btn.classList.add('bought');
      btn.disabled = true;
      updateShopGold();
      updateGoldHUD();
      // 重新灰化其他无法负担的按钮
      container.querySelectorAll('.shop-card-btn:not(.bought)').forEach(b => {
        const otherId = b.dataset.id;
        const other   = SHOP_ITEMS.find(i => i.id === otherId);
        if (other && run.gold < other.cost) b.disabled = true;
      });
    });

    container.appendChild(card);
  }
}
