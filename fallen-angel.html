<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>堕落天使</title>
<style>
/* ─── RESET ─────────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  width: 100%; height: 100%;
  background: #0a0608;
  overflow: hidden;
  font-family: 'Courier New', Courier, monospace;
  color: #d0c8c0;
  user-select: none;
}

/* ─── CANVAS ────────────────────────────────────────────── */
#c {
  display: block;
  position: absolute; top: 0; left: 0;
  width: 100%; height: 100%;
  cursor: crosshair;
}

/* ─── DOM HUD（pointer-events:none，浮于canvas之上）──── */
#ui {
  position: absolute; top: 0; left: 0;
  width: 100%; height: 100%;
  pointer-events: none;
}

/* HP条 */
#hud-hp {
  position: absolute; top: 16px; left: 16px;
  display: flex; flex-direction: column; gap: 4px;
  min-width: 180px;
}
.bar-label {
  font-size: 10px; letter-spacing: 2px; text-transform: uppercase;
  color: #605060;
}
.bar-track {
  width: 180px; height: 8px;
  background: #0d0810;
  border: 1px solid #2a1a28;
  border-radius: 2px;
  overflow: hidden;
}
#hp-fill {
  height: 100%; width: 100%;
  background: #c03060;
  border-radius: 2px;
  transition: width 0.1s ease;
}
#hp-text {
  font-size: 10px; color: #504050; letter-spacing: 1px;
}

/* CD指示（小canvas） */
#hud-cd {
  position: absolute; top: 12px; right: 16px;
}
#cd-canvas { display: block; }

/* Buff图标行 */
#hud-buffs {
  position: absolute; bottom: 16px; left: 16px;
  display: flex; gap: 6px;
}
.buff-icon {
  width: 32px; height: 32px;
  border-radius: 4px;
  border: 1px solid #403040;
  background: #1a1020;
  display: flex; align-items: center; justify-content: center;
  font-size: 10px; color: #a090a0;
}

/* 区域+进度（顶中） */
#hud-progress {
  position: absolute; top: 14px; left: 50%; transform: translateX(-50%);
  display: flex; flex-direction: column; align-items: center; gap: 5px;
}
#zone-name {
  font-size: 11px; letter-spacing: 3px; color: #806880;
  text-transform: uppercase;
}
#room-dots {
  display: flex; gap: 5px;
}
.room-dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: #302030;
  border: 1px solid #504050;
}
.room-dot.done  { background: #c080c0; border-color: #e0a0e0; }
.room-dot.cur   { background: #ff80ff; border-color: #ffc0ff;
                  box-shadow: 0 0 4px #ff80ff; }

/* 连击显示（屏幕中央偏上） */
#hud-combo {
  position: absolute; top: 35%; left: 50%; transform: translateX(-50%);
  pointer-events: none;
  text-align: center;
  opacity: 0;
  transition: opacity 0.15s;
}
#combo-count {
  font-size: 28px; font-weight: bold;
  color: #ffd080;
  text-shadow: 0 0 12px #ff8000;
  letter-spacing: 2px;
}

/* ─── OVERLAY 屏幕 ───────────────────────────────────────── */
.overlay {
  position: absolute; top: 0; left: 0;
  width: 100%; height: 100%;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  background: rgba(6, 2, 8, 0.88);
  pointer-events: all;
}
.overlay.hidden { display: none; }

/* 标题屏 */
#title-screen {
  background: transparent;
}
#title-quote {
  max-width: 480px;
  text-align: center;
  line-height: 2.4;
  color: #907890;
  font-size: 13px;
  letter-spacing: 1.5px;
  margin-bottom: 52px;
  white-space: pre-line;
  animation: quoteFade 4s ease-in-out infinite;
}
#title-quote .bar {
  color: #6040a0;
  margin-right: 6px;
}
#title-main {
  font-size: 52px;
  letter-spacing: 14px;
  color: #f0e8ff;
  text-shadow:
    0 0 20px #b060ff,
    0 0 50px #8030d0,
    0 0 100px #5010a0;
  margin-bottom: 10px;
  text-transform: uppercase;
  animation: titlePulse 3s ease-in-out infinite;
}
@keyframes titlePulse {
  0%,100% { text-shadow: 0 0 20px #b060ff, 0 0 50px #8030d0, 0 0 100px #5010a0; opacity: 1; }
  50%      { text-shadow: 0 0 40px #d080ff, 0 0 80px #a050e0, 0 0 160px #7020c0; opacity: 0.92; }
}
#title-sub {
  font-size: 13px;
  letter-spacing: 10px;
  color: #7050a0;
  margin-bottom: 64px;
  animation: subFade 3s ease-in-out infinite;
}
@keyframes subFade {
  0%,100% { opacity: 0.5; letter-spacing: 10px; }
  50%      { opacity: 0.8; letter-spacing: 11px; }
}
#title-quote {
  animation: quoteFade 4s ease-in-out infinite;
}
@keyframes quoteFade {
  0%,100% { opacity: 0.7; }
  50%      { opacity: 1; }
}
#btn-start {
  font-family: inherit;
  font-size: 13px;
  letter-spacing: 6px;
  color: #d0a8e8;
  background: rgba(80,20,120,0.15);
  border: 1px solid #7040a0;
  padding: 14px 48px;
  cursor: pointer;
  text-transform: uppercase;
  transition: border-color 0.25s, color 0.25s, box-shadow 0.25s, background 0.25s;
  position: relative;
  overflow: hidden;
}
#btn-start::before {
  content: '';
  position: absolute; inset: 0;
  background: linear-gradient(90deg, transparent, rgba(180,100,255,0.08), transparent);
  transform: translateX(-100%);
  transition: transform 0.5s;
}
#btn-start:hover::before { transform: translateX(100%); }
#btn-start:hover {
  border-color: #d080ff;
  color: #f8e8ff;
  box-shadow: 0 0 24px rgba(160,60,255,0.5), 0 0 60px rgba(120,30,200,0.2);
  background: rgba(100,30,160,0.25);
}

/* Buff选择屏 */
#buff-screen { gap: 32px; }
#buff-title {
  font-size: 14px; letter-spacing: 4px; color: #907090;
  text-transform: uppercase; margin-bottom: 8px;
}
#buff-cards {
  display: flex; gap: 20px;
}
.buff-card {
  width: 200px;
  background: #12090f;
  border: 1px solid #402840;
  border-radius: 6px;
  overflow: hidden;
  cursor: pointer;
  transition: border-color 0.15s, box-shadow 0.15s;
}
.buff-card:hover {
  border-color: #c080c0;
  box-shadow: 0 0 20px rgba(192,80,192,0.25);
}
.buff-card-theme {
  height: 4px;
}
.buff-card-body {
  padding: 16px;
  display: flex; flex-direction: column; gap: 8px;
}
.buff-card-tag {
  font-size: 9px; letter-spacing: 3px; text-transform: uppercase;
  color: #806080;
}
.buff-card-name {
  font-size: 16px; color: #e0d0e0; letter-spacing: 1px;
}
.buff-card-desc {
  font-size: 11px; color: #706070; line-height: 1.6;
}

/* 对话框 */
#dialog-box {
  position: absolute; bottom: 0; left: 0;
  width: 100%; height: 32%;
  background: rgba(6, 2, 10, 0.92);
  border-top: 1px solid #302030;
  padding: 20px 32px 16px;
  display: flex; flex-direction: column; gap: 10px;
  pointer-events: all;
}
#dialog-box.hidden { display: none; }
#dialog-speaker {
  font-size: 12px; letter-spacing: 3px;
  text-transform: uppercase;
}
#dialog-text {
  font-size: 14px; line-height: 1.8;
  color: #c0b8b8;
  flex: 1;
}
#dialog-choices {
  display: flex; flex-direction: column; gap: 6px;
}
.dialog-choice {
  font-family: inherit;
  font-size: 12px; letter-spacing: 1px;
  color: #a090a0;
  background: transparent;
  border: 1px solid #302030;
  padding: 7px 14px;
  cursor: pointer;
  text-align: left;
  transition: border-color 0.15s, color 0.15s;
}
.dialog-choice:hover { border-color: #c080c0; color: #f0d0f0; }
#dialog-hint {
  font-size: 10px; color: #403040;
  letter-spacing: 2px; text-transform: uppercase;
  align-self: flex-end;
}

/* 死亡屏 */
#dead-screen { gap: 24px; }
#dead-monologue {
  max-width: 440px; text-align: center;
  line-height: 2.2; color: #604858;
  font-size: 13px; letter-spacing: 1px;
  white-space: pre-line;
}
#btn-retry {
  font-family: inherit;
  font-size: 12px; letter-spacing: 4px;
  color: #a08090; background: transparent;
  border: 1px solid #503040;
  padding: 10px 30px; cursor: pointer;
  text-transform: uppercase;
  transition: border-color 0.2s, color 0.2s;
}
#btn-retry:hover { border-color: #c06080; color: #f0c0d0; }

/* 胜利屏 */
#win-screen { gap: 24px; }
#win-text {
  font-size: 15px; letter-spacing: 3px; color: #e0d8e8;
  text-shadow: 0 0 20px #8040c0;
}
#win-sub {
  font-size: 12px; color: #706070; letter-spacing: 2px;
  max-width: 400px; text-align: center; line-height: 1.8;
}
#btn-back {
  font-family: inherit;
  font-size: 12px; letter-spacing: 4px;
  color: #a090b0; background: transparent;
  border: 1px solid #403050;
  padding: 10px 30px; cursor: pointer;
  text-transform: uppercase;
  transition: border-color 0.2s, color 0.2s;
}
#btn-back:hover { border-color: #c080c0; color: #f0d0f0; }

/* 暂停屏 */
#pause-screen { background: rgba(6,2,8,0.7); gap: 20px; }
#pause-title { font-size: 16px; letter-spacing: 6px; color: #907090; }
#btn-resume {
  font-family: inherit; font-size: 12px; letter-spacing: 4px;
  color: #a090b0; background: transparent;
  border: 1px solid #403050; padding: 10px 30px; cursor: pointer;
  text-transform: uppercase; transition: border-color 0.2s, color 0.2s;
}
#btn-resume:hover { border-color: #c080c0; color: #f0d0f0; }

/* 金币 HUD */
#hud-gold {
  position: absolute; top: 68px; left: 16px;
  display: flex; align-items: center; gap: 6px;
}
#gold-icon { font-size: 13px; color: #d4a840; }
#gold-text  { font-size: 12px; color: #c8a030; letter-spacing: 2px; font-family: inherit; }

/* 岔路选择屏 */
#route-screen { gap: 28px; }
#route-title {
  font-size: 13px; letter-spacing: 5px; color: #907090;
  text-transform: uppercase;
}
#route-cards { display: flex; gap: 24px; }
.route-card {
  width: 220px;
  background: #12090f;
  border: 1px solid #402840;
  border-radius: 6px;
  overflow: hidden;
  cursor: pointer;
  transition: border-color 0.15s, box-shadow 0.15s, transform 0.12s;
}
.route-card:hover {
  border-color: #c080c0;
  box-shadow: 0 0 24px rgba(192,80,192,0.3);
  transform: translateY(-3px);
}
.route-card-icon {
  height: 56px;
  display: flex; align-items: center; justify-content: center;
  font-size: 26px;
  background: rgba(255,255,255,0.03);
  border-bottom: 1px solid #281828;
}
.route-card-body { padding: 14px 16px; display: flex; flex-direction: column; gap: 6px; }
.route-card-name { font-size: 15px; color: #e0d0e0; letter-spacing: 1px; }
.route-card-desc { font-size: 11px; color: #706070; line-height: 1.6; }

/* 武器选择屏 */
#weapon-screen { gap: 28px; }
#weapon-title {
  font-size: 13px; letter-spacing: 5px; color: #c0a8e0;
  text-transform: uppercase;
}
#weapon-cards { display: flex; gap: 16px; }
.weapon-card {
  width: 168px;
  background: #100810;
  border: 1px solid #3a2050;
  border-radius: 6px;
  overflow: hidden;
  cursor: pointer;
  transition: border-color 0.15s, box-shadow 0.15s, transform 0.12s;
}
.weapon-card:hover {
  border-color: #d080ff;
  box-shadow: 0 0 22px rgba(180,80,255,0.35);
  transform: translateY(-3px);
}
.weapon-card-banner {
  height: 5px;
}
.weapon-card-portrait {
  width: 100%; height: 110px;
  display: flex; align-items: center; justify-content: center;
  background: rgba(255,255,255,0.02);
  border-bottom: 1px solid #201030;
  overflow: hidden;
}
.weapon-card-portrait canvas {
  display: block;
}
.weapon-card-body { padding: 12px 14px; display: flex; flex-direction: column; gap: 5px; }
.weapon-card-angel { font-size: 9px; letter-spacing: 3px; text-transform: uppercase; color: #705080; }
.weapon-card-name  { font-size: 16px; color: #e8d8ff; letter-spacing: 1px; }
.weapon-card-desc  { font-size: 10px; color: #605068; line-height: 1.6; }

/* 商店屏 */
#shop-screen { gap: 24px; }
#shop-title {
  font-size: 14px; letter-spacing: 4px; color: #c8a030;
  text-transform: uppercase;
}
#shop-gold-display {
  font-size: 13px; color: #d4a840; letter-spacing: 2px;
}
#shop-cards { display: flex; gap: 18px; }
.shop-card {
  width: 190px;
  background: #120e06;
  border: 1px solid #3a2e10;
  border-radius: 6px;
  overflow: hidden;
  display: flex; flex-direction: column;
}
.shop-card-theme { height: 3px; background: #d4a840; }
.shop-card-body { padding: 14px; flex: 1; display: flex; flex-direction: column; gap: 7px; }
.shop-card-name { font-size: 15px; color: #e8d8a0; letter-spacing: 1px; }
.shop-card-desc { font-size: 11px; color: #806840; line-height: 1.6; flex: 1; }
.shop-card-cost { font-size: 12px; color: #c8a030; letter-spacing: 1px; }
.shop-card-btn {
  font-family: inherit; font-size: 11px; letter-spacing: 2px;
  color: #c8a030; background: transparent;
  border: 1px solid #3a2e10; border-top: none;
  padding: 9px; cursor: pointer; text-transform: uppercase;
  transition: background 0.15s, color 0.15s;
}
.shop-card-btn:hover:not(:disabled) { background: rgba(212,168,64,0.15); color: #f0d070; }
.shop-card-btn:disabled { color: #403020; cursor: default; }
.shop-card-btn.bought { color: #505030; cursor: default; }
#btn-shop-leave {
  font-family: inherit; font-size: 12px; letter-spacing: 4px;
  color: #806840; background: transparent;
  border: 1px solid #3a2e10;
  padding: 9px 28px; cursor: pointer;
  text-transform: uppercase;
  transition: border-color 0.2s, color 0.2s;
}
#btn-shop-leave:hover { border-color: #c8a030; color: #e8c860; }
</style>
</head>
<body>

<canvas id="c"></canvas>

<!-- DOM HUD（pointer-events:none，浮于canvas上） -->
<div id="ui">
  <div id="hud-hp">
    <div class="bar-label">生命</div>
    <div class="bar-track"><div id="hp-fill"></div></div>
    <span id="hp-text">100 / 100</span>
  </div>

  <div id="hud-gold">
    <span id="gold-icon">◈</span>
    <span id="gold-text">0</span>
  </div>

  <div id="hud-cd">
    <canvas id="cd-canvas" width="115" height="44"></canvas>
  </div>

  <div id="hud-buffs"></div>

  <div id="hud-progress">
    <span id="zone-name">净罪塔</span>
    <div id="room-dots"></div>
  </div>

  <div id="hud-combo">
    <span id="combo-count">x1</span>
  </div>
</div>

<!-- 标题屏 -->
<div id="title-screen" class="overlay">
  <div id="title-quote"><span class="bar">▎</span>你曾是第七天使，站在荣耀的阶梯最高处。
<span class="bar">▎</span>直到你问了一个问题：如果天命是错的，谁来纠正？
<span class="bar">▎</span>没有人回答。于是他们把你投进了净罪塔。</div>
  <div id="title-main">堕落天使</div>
  <div id="title-sub">Fallen Angel</div>
  <button id="btn-start">开始堕落</button>
</div>

<!-- 武器选择屏 -->
<div id="weapon-screen" class="overlay hidden">
  <div id="weapon-title">选择你的武器</div>
  <div id="weapon-cards"></div>
</div>

<!-- Buff选择屏 -->
<div id="buff-screen" class="overlay hidden">
  <div id="buff-title">选择恩赐</div>
  <div id="buff-cards"></div>
</div>

<!-- 岔路选择屏 -->
<div id="route-screen" class="overlay hidden">
  <div id="route-title">选择前路</div>
  <div id="route-cards"></div>
</div>

<!-- 商店屏 -->
<div id="shop-screen" class="overlay hidden">
  <div id="shop-title">商人之所</div>
  <div id="shop-gold-display">◈ <span id="shop-gold">0</span></div>
  <div id="shop-cards"></div>
  <button id="btn-shop-leave">离开</button>
</div>

<!-- 对话框（不是overlay，贴底部） -->
<div id="dialog-box" class="hidden">
  <div id="dialog-speaker"></div>
  <div id="dialog-text"></div>
  <div id="dialog-choices"></div>
  <div id="dialog-hint">点击 / 空格 继续</div>
</div>

<!-- 死亡屏 -->
<div id="dead-screen" class="overlay hidden">
  <div id="dead-monologue"></div>
  <button id="btn-retry">重新堕落</button>
</div>

<!-- 胜利屏 -->
<div id="win-screen" class="overlay hidden">
  <div id="win-text">你走出了审判庭</div>
  <div id="win-sub">不是因为天命允许——<br>而是因为你选择了。</div>
  <button id="btn-back">返回</button>
</div>

<!-- 暂停屏 -->
<div id="pause-screen" class="overlay hidden">
  <div id="pause-title">— 暂停 —</div>
  <button id="btn-resume">继续</button>
</div>

<script>
// ╔═══════════════════════════════════════════════════════════╗
// ║              FALLEN ANGEL — 完整设计文档                  ║
// ║              最后更新：2026-08-06                         ║
// ╚═══════════════════════════════════════════════════════════╝
//
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// § 0. 开发进度总览  ✅=已完成  🚧=部分完成  ⬜=未开始
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
//
// 【阶段一：武器系统】
//   ✅ 1.  武器选择界面（ENTRY房间弹出5张卡+点选→对话）
//   ✅ 2.  5个武器天使开场对话 + 立绘
//   ✅ 3.  矛：穿透普攻 / E投矛往返 / 右键跳刺
//   ✅ 4.  双匕：攻速×2 / 连击计数 / 第10连击雷爆发
//   ✅ 5.  大剑：蓄力普攻 / E跺地AOE / 右键蓄力劈
//   ✅ 6.  链刃：中距离普攻 / E拉近敌人 / 右键弹射自身
//
// 【阶段二：祝福系统骨架】
//   ✅ 7.  COMBAT打完→祝福天使对话→3选1→解锁出口
//   ✅ 8.  祝福天使轮转队列（一局内不重复天使）
//   ✅ 9.  祝福卡按天使池筛选（从该天使6个buff里抽3个）
//   ⬜ 10. 祝福叠加/升级逻辑（重复选到 → 升级补数值，暂未实装）
//   ✅ 11. 一局内台词不重复（lineIdx轮转）
//
// 【阶段三：祝福内容】
//   ✅ 12. 萨利尔6个祝福（全部效果已实装）
//   ✅ 13. 达内尔6个祝福（全部效果已实装，含dashFrostTrail/spinFrostRing）
//   ✅ 14. 以西结尔6个祝福（全部效果已实装，含thrustAOE）
//   ✅ 15. 巴拉奇尔6个祝福（全部效果已实装，含thrustCdMul/SpdMul/dashNextAtkActive）
//   ✅ 16. 扎奇尔6个祝福（全部效果已实装）
//
// 【阶段四：立绘】
//   ✅ 17. 主线NPC立绘：路西法 / 玩家 / 拉斐尔 / 米迦勒
//   ✅ 18. 武器天使立绘：阿扎泽尔 / 拉米尔 / 沙姆希尔 / 塞米亚扎 / 科卡比尔
//   ✅ 19. 祝福天使立绘：萨利尔 / 达内尔 / 以西结尔 / 巴拉奇尔 / 扎奇尔
//   ⬜ 20. 好天使立绘：乌列尔 / 拉古尔（ANGEL房间对话用，未制作）
//   ⬜ 21. 特殊天使立绘：萨拉克尼亚尔 / 加德列尔（结局用，未制作）

// § 1. 武器系统（5个武器天使）
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
//
// 触发时机：进入第一间房（ENTRY）后，弹出武器选择界面（5张卡）
// 选定后：跳转至对应天使对话（含立绘，2-3句），交代武器来历
// 之后：这5个武器天使不再出现，全程使用该武器

// ┌─────────────┬──────┬──────────────────────────────────────┐
// │ 天使        │ 武器 │ 风格定位                             │
// ├─────────────┼──────┼──────────────────────────────────────┤
// │ 路西法      │ 剑   │ 平衡型，默认，普攻三连击+旋转斩+突刺│
// │ 阿扎泽尔    │ 矛   │ 长程穿透，普攻穿透多敌，E投矛往返   │
// │ 拉米尔      │ 双匕 │ 超快低单体，攻速×2，第10连击雷爆发  │
// │ 沙姆希尔    │ 大剑 │ 超慢极高单体，蓄力劈，E跺地AOE      │
// │ 塞米亚扎    │ 链刃 │ 中距离控场，E拉近敌人，右键弹射自身 │
// └─────────────┴──────┴──────────────────────────────────────┘
//
// 每种武器有独立的：
//   - 普攻动画 + 伤害数值
//   - 右键技能（替换突刺）
//   - E技能（替换旋转斩）
//   - 冲刺手感微调（大剑冲刺距离短，双匕冲刺距离长）

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

// § 3. 祝福系统（5个祝福天使，每人6个buff，共30个）

// ELITE房：路西法出现+对话，给全池3选1（30个buff里随机）
// ANGEL房：好天使（乌列尔/拉古尔）出现，对话后给全池3选1

// ┌─────────────┬──────────┬───────────────────────────────────┐
// │ 天使        │ 主题     │ 祝福方向                          │

// │ 达内尔      │ 法则/冰  │ 减速敌人、冲刺CD缩短、冰封控场    │
// │ 以西结尔    │ 风暴/AOE │ 攻击范围扩大、旋转斩增强          │
// │ 巴拉奇尔    │ 闪电/速度│ 冲刺强化、攻击速度、连锁雷击      │
// │ 扎奇尔      │ 纯洁/净化│ 击杀回血、持续回复、净化          │
// └─────────────┴──────────┴───────────────────────────────────┘

//   id: sariel_atk    [普攻] 月牙斩    ：每次普攻命中回复 2 HP
//   id: sariel_dash   [冲刺] 月影步    ：冲刺后3秒内受伤减少40%
//   id: sariel_thrust [右键] 月盾突    ：突刺命中后立即回复 8 HP
//   id: sariel_spin   [E技]  月圆斩    ：旋转斩范围+30%，命中每个敌人回复1HP
//   id: sariel_p1     [被动] 月光庇护  ：最大HP +50
//   id: sariel_p2     [被动] 殒月      ：HP低于30%时所有伤害+25%
//
// § 3b. 达内尔祝福池（法则/冰/减速）颜色：#a0d0ff
//   id: danel_atk    [普攻] 冰封法则  ：普攻命中使敌人移速-40%持续2秒
//   id: danel_dash   [冲刺] 法则之壁  ：冲刺后留下冰霜轨迹，经过敌人减速-50%持续1.5秒
//   id: danel_thrust [右键] 冰矛穿透  ：突刺造成双倍伤害，命中必定减速2秒
//   id: danel_spin   [E技]  霜环      ：旋转斩落点留下持续3秒霜环，敌人进入减速-60%

// § 3c. 以西结尔祝福池（风暴/AOE/范围）颜色：#ffe060
//   id: ezequeel_atk    [普攻] 风刃      ：普攻攻击弧度+40%（扇形更宽）
//   id: ezequeel_dash   [冲刺] 风暴步    ：冲刺穿过敌人时对其造成18伤害

//   id: ezequeel_p2     [被动] 暴风之翼  ：移动速度+20%

//   id: baraqiel_thrust [右键] 雷速突刺  ：突刺CD-40%，突刺速度+50%

// § 7. 房间序列与祝福分配规则（定稿）
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
//
// 每区5间房：ENTRY → COMBAT → COMBAT → ELITE → BOSS
// 岔路选择（COMBAT后）可替换为：COMBAT / ANGEL / ELITE / SHOP
//
// 祝福触发规则（已确定）：
//   - COMBAT房：打完所有敌人→出口锁定→随机祝福天使出现对话
//               →给该天使自己池的3选1→选完出口解锁
//               岔路界面已提前预告是哪个天使（显示天使名+颜色）
//   - ELITE房：路西法出现+对话→给全部30个buff池3选1→选完出口解锁
//   - ANGEL房：无怪物，进房立刻触发乌列尔/拉古尔对话
//               →给全部30个buff池3选1→出口本来就开着
//
// 祝福天使轮转规则：
//   - 每次generateNextChoices()生成COMBAT选项时绑定一个祝福天使
//   - 用BLESSING_ANGELS轮转，避免一局内同一天使出现太多次
//   - run.usedBlessingAngels记录本局已用顺序，全部用完重置
//

// ── 等距投影：世界坐标 → 屏幕坐标 ────────────────────────
// 世界坐标系：wx向右，wy向下（正常游戏坐标）
// 等距投影后：X轴向右下，Y轴向左下
function isoX(wx, wy) { return (wx - wy) * ISO_COS; }
function isoY(wx, wy) { return (wx + wy) * ISO_SIN; }

// cam存储等距屏幕空间的偏移
function toScreen(wx, wy) {
  return {
    x: isoX(wx, wy) - cam.x,
    y: isoY(wx, wy) - cam.y,
  };
}

// 鼠标屏幕坐标 → 世界坐标（等距反算）
function fromScreen(sx, sy) {
  const ix = sx + cam.x, iy = sy + cam.y;
  return {
    x: (ix / ISO_COS + iy / ISO_SIN) / 2,
    y: (iy / ISO_SIN - ix / ISO_COS) / 2,
  };
}

function updateCamera() {
  // 玩家在屏幕中心
  const cx = isoX(player.x, player.y);
  const cy = isoY(player.x, player.y);
  cam.x = cx - W / 2;
  cam.y = cy - H / 2;
  // 不clamp——等距投影房间比较小，不限制更自然
}

// ═══════════════════════════════════════════════════════════
// ═══ UTILITY ═══════════════════════════════════════════════
// ═══════════════════════════════════════════════════════════
const dist  = (a, b) => Math.hypot(b.x - a.x, b.y - a.y);
const lerp  = (a, b, t) => a + (b - a) * t;
const clamp = (v, lo, hi) => v < lo ? lo : v > hi ? hi : v;
const rnd   = (a, b) => a + Math.random() * (b - a);
const rndI  = (a, b) => Math.floor(a + Math.random() * (b - a + 1));

// 扇形命中判定（标准化角度差到[-π,π]）
function inArc(atk, ex, ey, er) {
  const dx = ex - atk.cx, dy = ey - atk.cy;
  const d  = Math.hypot(dx, dy);
  if (d > atk.range + er) return false;
  if (atk.arc >= Math.PI * 2) return true;
  const a    = Math.atan2(dy, dx);
  const diff = (a - atk.angle + Math.PI * 3) % (Math.PI * 2) - Math.PI;
  return Math.abs(diff) <= atk.arc / 2;
}

const keys  = {};

window.addEventListener('keydown', e => {
  keys[e.code] = true;
  if (e.code === 'Escape') onEscape();
  if (e.code === 'Space')  { e.preventDefault(); onSpace(); }
  if (e.code === 'KeyE')   onKeyE();
});
window.addEventListener('keyup',   e => { keys[e.code] = false; });

canvas.addEventListener('mousemove', e => {
  mouse.x = e.clientX;
  mouse.y = e.clientY;
  mouse.worldX = mouse.x + cam.x;
  mouse.worldY = mouse.y + cam.y;
});
canvas.addEventListener('mousedown', e => {
  if (e.button === 0) {
    mouse.down = true;
    if (gameState === S.DIALOG) { advanceDialog(); return; }
    if (gameState !== S.PLAYING) return;
    if (player.weapon === 'greatsword') { player.gsCharging = true; return; }
    doAttack();
  }
  if (e.button === 2) {
    e.preventDefault();
    if (gameState === S.PLAYING && player.weapon === 'greatsword') {
      if (!player.gsRightCharging) { player.gsRightCharging = true; player.gsRightTimer = 0; }
      return;
    }
    onRightClick();
  }
});
canvas.addEventListener('mouseup', e => {
  if (e.button === 0) {
    mouse.down = false;
    if (gameState === S.PLAYING && player.weapon === 'greatsword' && player.gsCharging) {
      player.gsCharging = false;
      doGreatswordRelease();
    }
  }
  if (e.button === 2 && gameState === S.PLAYING && player.weapon === 'greatsword' && player.gsRightCharging) {
    player.gsRightCharging = false;
    doGreatswordRightRelease();
  }
});
canvas.addEventListener('contextmenu', e => e.preventDefault());

function onEscape() {
  if (gameState === S.PLAYING) setGameState(S.PAUSE);
  else if (gameState === S.PAUSE) setGameState(S.PLAYING);
}
function onSpace() {
  if (gameState === S.DIALOG) { advanceDialog(); return; }
  if (gameState !== S.PLAYING) return;
  doDash();
}
function onKeyE() {
  if (gameState !== S.PLAYING) return;
  doSpin();
}
function onMouseDown(){
  // 现在由 mousedown 监听器直接处理，保留此函数供其他地方调用兼容
  if (gameState === S.DIALOG) { advanceDialog(); return; }
  if (gameState !== S.PLAYING) return;
  doAttack();
}

function movePlayer(fd) {
  // 突刺中：快速位移，不可转向
  if (player.thrustTimer > 0) {
    player.thrustTimer -= fd;
    const nx = player.x + player.thrustVx * fd;
    const ny = player.y + player.thrustVy * fd;
    if (!isWall(nx, player.y)) player.x = nx;
    if (!isWall(player.x, ny)) player.y = ny;

    // 突刺期间持续检测穿透命中（每帧，用Set去重）
    for (const e of enemies) {
      if (player.thrustHit.has(e.id)) continue;
      if (dist(e, player) < e.r + player.r + 8) {
        player.thrustHit.add(e.id);
        // 各武器突刺伤害不同
        const thrustDmg = player.weapon === 'spear' ? 38 :
                          player.weapon === 'dagger' ? 25 :
                          player.weapon === 'chain'  ? 30 : 32;
        hitEnemy(e, thrustDmg, 14, Math.atan2(e.y - player.y, e.x - player.x), player.mods.holyDmg,
          { isThrust: true });
        // 旋风突（thrustAOE）：命中主目标后对半径100内其他敌人造成60%伤害
        if (player.mods.thrustAOE) {
          for (const oe of enemies) {
            if (oe === e || player.thrustHit.has(oe.id)) continue;
            if (dist(oe, player) < 100) {
              player.thrustHit.add(oe.id);
              hitEnemy(oe, Math.round(thrustDmg * 0.6), 8,
                Math.atan2(oe.y - player.y, oe.x - player.x), 0, { isThrust: true });
              spawnParticles(oe.x, oe.y, '#ffe060', 8, {
                spdMin: 2, spdMax: 7, rMin: 1.5, rMax: 3.5,
                decayMin: 0.04, decayMax: 0.09,
              });
            }
          }
          // 旋风粒子环
          spawnParticles(player.x, player.y, '#ffd040', 14, {
            spdMin: 3, spdMax: 10, rMin: 1.5, rMax: 4,
            decayMin: 0.03, decayMax: 0.07,
          });
        }
      }
    }
    // 突刺尾迹（dashFrostTrail由冲刺处理；此处仅普通尾迹）
    if (Math.random() < 0.6) {
      spawnParticles(player.x, player.y, '#ffe0a0', 2, {
        angle: Math.atan2(-player.thrustVy, -player.thrustVx), spread: 0.4,
        spdMin: 1, spdMax: 3, rMin: 1, rMax: 2.5,
        decayMin: 0.07, decayMax: 0.13,
      });
    }
    return;
  }

  // 冲刺中直接用冲刺速度
  if (player.dashTimer > 0) {
    player.dashTimer -= fd;
    const nx = player.x + player.dashVx * fd;
    const ny = player.y + player.dashVy * fd;
    if (!isWall(nx, player.y)) player.x = nx;
    if (!isWall(player.x, ny)) player.y = ny;
    // 法则之壁（dashFrostTrail）：冲刺轨迹留下冰霜，减速沿途敌人
    if (player.mods.dashFrostTrail && Math.random() < 0.5) {
      spawnParticles(player.x, player.y, '#a0e8ff', 3, {
        angle: Math.atan2(-player.dashVy, -player.dashVx), spread: 0.9,
        spdMin: 0.5, spdMax: 2, rMin: 2, rMax: 5,
        decayMin: 0.02, decayMax: 0.045,
      });
      for (const e of enemies) {
        if (dist(e, player) < e.r + 24) {
          e.slowMul   = Math.min(e.slowMul, 0.45);
          e.slowTimer = Math.max(e.slowTimer, 90);
        }
      }
    }
    return;
  }

  const spd = player.speed * fd;
  // 等距WASD：按屏幕方向走，W=屏幕上 D=屏幕右
  // 屏幕方向(sdx,sdy) → 世界坐标方向反算：
  //   wx = (sdx/ISO_COS + sdy/ISO_SIN) / 2
  //   wy = (sdy/ISO_SIN - sdx/ISO_COS) / 2
  let sdx = 0, sdy = 0;
  if (keys['KeyW'] || keys['ArrowUp'])    sdy -= 1;
  if (keys['KeyS'] || keys['ArrowDown'])  sdy += 1;
  if (keys['KeyA'] || keys['ArrowLeft'])  sdx -= 1;
  if (keys['KeyD'] || keys['ArrowRight']) sdx += 1;
  if (sdx !== 0 && sdy !== 0) { sdx *= 0.7071; sdy *= 0.7071; }
  player.moving = (sdx !== 0 || sdy !== 0);

  let dx = (sdx / ISO_COS + sdy / ISO_SIN) / 2 * spd;
  let dy = (sdy / ISO_SIN - sdx / ISO_COS) / 2 * spd;

  // 轴分离碰撞（贴墙滑动）
  if (dx !== 0) {
    const nx = player.x + dx + Math.sign(dx) * player.r;
    if (!isWall(nx, player.y - player.r + 2) && !isWall(nx, player.y + player.r - 2))
      player.x += dx;
  }
  if (dy !== 0) {
    const ny = player.y + dy + Math.sign(dy) * player.r;
    if (!isWall(player.x - player.r + 2, ny) && !isWall(player.x + player.r - 2, ny))
      player.y += dy;
  }

  // 更新朝向——用屏幕坐标算角度，与renderAttacks/inArc保持一致
  const psc = toScreen(player.x, player.y);
  player.angle = Math.atan2(mouse.y - psc.y, mouse.x - psc.x);
  // 翅膀动画——移动时扑动加快
  player.wingPhase += (player.moving ? 0.10 : 0.04) * fd;
}

function renderPlayer() {
  if (gameState !== S.PLAYING) return;
  const sc = toScreen(player.x, player.y);
  const sx = sc.x, sy = sc.y;
  const t  = player.wingPhase;
  const flashing = player.flashTimer > 0;

  // 跑步弹跳：移动时身体上下抖动
  const bobY  = player.moving ? Math.sin(t * 2.8) * 3.5 : 0;
  const bobX  = player.moving ? Math.sin(t * 1.4) * 1.2 : 0;
  const tiltA = player.moving ? Math.sin(t * 1.4) * 0.08 : 0; // 身体微倾

  ctx.save();
  ctx.translate(sx + bobX, sy + bobY);

  // ── 脚下阴影——弹跳时变小变暗（身体离"地"感）──────────
  ctx.save();
  // bobY向上(负)时阴影缩小，向下时阴影扩大
  const shadowScale = 1 - bobY * 0.018;
  ctx.globalAlpha = 0.35 - Math.abs(bobY) * 0.02;
  ctx.fillStyle   = '#000000';
  ctx.translate(0, -bobY);  // 阴影留在地面
  ctx.scale(shadowScale, 0.4 * shadowScale);
  ctx.beginPath();
  ctx.ellipse(0, 8, 18, 10, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  // ── 翅膀 ────────────────────────────────────────────────
  const flapL = Math.sin(t * 2.2) * 0.18;
  const flapR = Math.sin(t * 2.2 + 0.4) * 0.18;

  for (let side = -1; side <= 1; side += 2) {
    const isLeft = side < 0;
    const flap   = isLeft ? flapL : flapR;
    const span   = 46 + Math.abs(Math.sin(t * 2.2)) * 12;
    const droop  = 12 + Math.sin(t * 1.6) * 4;

    const root = { x: side * 8,            y: 0 };
    const cp1  = { x: side * span * 0.55,  y: -droop - span * 0.3 + flap * 20 };
    const cp2  = { x: side * span * 0.88,  y: -droop * 0.2 + flap * 28 };
    const tip  = { x: side * span,          y: droop * 0.4 + flap * 14 };
    const bot  = { x: side * span * 0.5,   y: droop + flap * 8 };

    const wingCol = isLeft ? '#0c0616' : '#f0ecff';
    const glowCol = isLeft ? '#7030d0' : '#b090ff';
    const edgeCol = isLeft ? '#9040e8' : '#ffffff';

    ctx.save();
    ctx.shadowColor = glowCol;
    ctx.shadowBlur  = 20;
    ctx.globalAlpha = flashing ? 0.4 : 0.85;
    ctx.fillStyle   = wingCol;
    ctx.beginPath();
    ctx.moveTo(root.x, root.y);
    ctx.bezierCurveTo(cp1.x, cp1.y, cp2.x, cp2.y, tip.x, tip.y);
    ctx.bezierCurveTo(bot.x + side * 5, bot.y + 4, bot.x, bot.y, root.x, root.y);
    ctx.fill();

    // 翅膀边缘
    ctx.globalAlpha = flashing ? 0.25 : 0.6;
    ctx.strokeStyle = edgeCol;
    ctx.lineWidth   = 1.5;
    ctx.shadowBlur  = 12;
    ctx.beginPath();
    ctx.moveTo(root.x, root.y);
    ctx.bezierCurveTo(cp1.x, cp1.y, cp2.x, cp2.y, tip.x, tip.y);
    ctx.stroke();

    // 羽毛纹
    ctx.globalAlpha = 0.22;
    ctx.lineWidth   = 1;
    ctx.shadowBlur  = 0;
    for (let f = 1; f <= 3; f++) {
      const ft = f / 4;
      const fx = root.x + (tip.x - root.x) * ft;
      const fy = root.y + (tip.y - root.y) * ft - droop * ft * 0.5;
      ctx.beginPath();
      ctx.moveTo(fx, fy);
      ctx.lineTo(fx + side * 7, fy + 10);
      ctx.stroke();
    }
    ctx.restore();
  }

  // ── 身体 ────────────────────────────────────────────────
  ctx.save();
  ctx.rotate(tiltA);  // 移动时身体微倾
  // 外轮廓
  ctx.shadowColor = flashing ? '#ffffff' : '#8040d0';
  ctx.shadowBlur  = flashing ? 32 : 18;
  ctx.fillStyle   = '#0e0818';
  ctx.beginPath();
  ctx.arc(0, 0, player.r + 2.5, 0, Math.PI * 2);
  ctx.fill();
  // 身体
  ctx.fillStyle = flashing ? '#ffffff' : '#ece8ff';
  ctx.beginPath();
  ctx.arc(0, 0, player.r, 0, Math.PI * 2);
  ctx.fill();
  // 内高光
  ctx.globalAlpha = 0.45;
  ctx.fillStyle   = '#ffffff';
  ctx.beginPath();
  ctx.arc(-2, -3, 4, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  // ── 武器（按类型派发） ────────────────────────────────────
  ctx.save();
  ctx.rotate(player.angle);
  switch (player.weapon) {
    case 'sword':      drawWeaponSword(flashing);      break;
    case 'spear':      drawWeaponSpear(flashing);      break;
    case 'dagger':     drawWeaponDaggers(flashing);    break;
    case 'greatsword': drawWeaponGreatsword(flashing); break;
    case 'chain':      drawWeaponChain(flashing);      break;
  }
  ctx.restore();

  ctx.restore();
}

function drawWeaponSword(flashing) {
  ctx.shadowColor = '#c0a0ff';

  bladeGrad.addColorStop(0.5, '#ffffff');
  bladeGrad.addColorStop(1,   'rgba(255,255,255,0.1)');
  ctx.fillStyle = bladeGrad;
  ctx.beginPath();
  ctx.moveTo(player.r + 1,  2.2);
  ctx.lineTo(player.r + 30, 1);
  ctx.lineTo(player.r + 38, 0);
  ctx.lineTo(player.r + 30, -1);
  ctx.lineTo(player.r + 1,  -2.2);
  ctx.closePath(); ctx.fill();
  ctx.shadowBlur = 6; ctx.fillStyle = '#7050b0';
  ctx.fillRect(player.r - 1, -5, 6, 10);
  ctx.fillStyle = 'rgba(255,255,255,0.3)';
  ctx.fillRect(player.r - 1, -5, 6, 2);
}

function drawWeaponSpear(flashing) {
  const pr = player.r;
  ctx.shadowColor = '#c0a040'; ctx.shadowBlur = 12;
  const shaftGrad = ctx.createLinearGradient(pr, 0, pr + 52, 0);
  shaftGrad.addColorStop(0, '#8a6830'); shaftGrad.addColorStop(0.6, '#c0a060'); shaftGrad.addColorStop(1, '#e8d090');
  ctx.fillStyle = shaftGrad;
  ctx.beginPath(); ctx.moveTo(pr,1.2); ctx.lineTo(pr+44,1.2); ctx.lineTo(pr+44,-1.2); ctx.lineTo(pr,-1.2); ctx.closePath(); ctx.fill();
  ctx.shadowBlur = 18; ctx.shadowColor = '#ffe080';
  const tipGrad = ctx.createLinearGradient(pr+44, 0, pr+62, 0);
  tipGrad.addColorStop(0, '#e0c060'); tipGrad.addColorStop(1, '#ffffc0');
  ctx.fillStyle = tipGrad;
  ctx.beginPath(); ctx.moveTo(pr+44,4); ctx.lineTo(pr+62,0); ctx.lineTo(pr+44,-4); ctx.closePath(); ctx.fill();
  ctx.shadowBlur=4; ctx.fillStyle='#907040'; ctx.fillRect(pr+6,-5,4,10);

}

function drawWeaponDaggers(flashing) {
  const pr = player.r;
  const thunderPct = player.dagCombo / 10;
  const glowAmt    = 8 + thunderPct * 20;
  for (let side = -1; side <= 1; side += 2) {
    ctx.save(); ctx.rotate(side * 0.28);
    ctx.shadowColor = `rgb(${Math.round(60 + thunderPct*150)},${Math.round(200+thunderPct*55)},255)`;
    ctx.shadowBlur  = glowAmt;
    const len = 22;
    const dg = ctx.createLinearGradient(pr,0,pr+len,0);
    dg.addColorStop(0,'#80d0ff'); dg.addColorStop(0.5,'#d0f0ff'); dg.addColorStop(1,'rgba(200,240,255,0.2)');
    ctx.fillStyle = dg;
    ctx.beginPath();
    ctx.moveTo(pr,side*1.8); ctx.lineTo(pr+len-5,side*1.8); ctx.lineTo(pr+len,0); ctx.lineTo(pr+len-5,-side*1.8); ctx.lineTo(pr,-side*1.8); ctx.closePath(); ctx.fill();
    if (thunderPct > 0.4) {
      ctx.globalAlpha = thunderPct - 0.4;
      ctx.strokeStyle = '#c0f0ff'; ctx.lineWidth = 0.8; ctx.shadowBlur = 6;
      ctx.beginPath(); ctx.moveTo(pr+4,0); ctx.lineTo(pr+10,side*1); ctx.lineTo(pr+16,-side*0.8); ctx.lineTo(pr+len-2,0); ctx.stroke();
      ctx.globalAlpha = 1;
    }
    ctx.restore();
  }
}

function drawWeaponGreatsword(flashing) {
  const pr = player.r;
  const chargePct = clamp(player.gsChargeTimer / 90, 0, 1);
  if (chargePct > 0.1) {
    ctx.save();
    ctx.globalAlpha = chargePct * 0.55;
    ctx.strokeStyle = `rgba(255,${Math.round(180-chargePct*120)},0,${chargePct})`;
    ctx.lineWidth = 3 + chargePct * 6;
    ctx.shadowColor = '#ff8020'; ctx.shadowBlur = 30 + chargePct * 40;
    ctx.beginPath(); ctx.moveTo(pr,0); ctx.lineTo(pr+52,0); ctx.stroke();
    ctx.globalAlpha = 1; ctx.restore();
  }
  const r = Math.round; const l = lerp;
  ctx.shadowColor = `rgb(${r(l(0x60,0xff,chargePct))},${r(l(0x80,0x40,chargePct))},0)`;
  ctx.shadowBlur  = 10 + chargePct * 28;
  const w = 7 + chargePct * 4;
  const bg = ctx.createLinearGradient(pr,0,pr+50,0);
  bg.addColorStop(0, `rgb(${r(l(0xc0,0xff,chargePct))},${r(l(0x80,0x50,chargePct))},0)`);
  bg.addColorStop(0.5,'#ffe080'); bg.addColorStop(1,'rgba(255,200,60,0.2)');
  ctx.fillStyle = bg;
  ctx.beginPath();
  ctx.moveTo(pr+1,w); ctx.lineTo(pr+42,w*0.5); ctx.lineTo(pr+52,0); ctx.lineTo(pr+42,-w*0.5); ctx.lineTo(pr+1,-w); ctx.closePath(); ctx.fill();
  ctx.shadowBlur=6; ctx.fillStyle='#804010'; ctx.fillRect(pr-2,-9,8,18);
  ctx.fillStyle='rgba(255,180,60,0.35)'; ctx.fillRect(pr-2,-9,8,3);
}

function drawWeaponChain(flashing) {
  const pr = player.r;
  ctx.shadowColor = '#c060ff'; ctx.shadowBlur = 14;
  const chainLen = 60; const segs = 6; const segLen = chainLen / segs;
  ctx.strokeStyle = '#c060d0'; ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.moveTo(pr, 0);
  for (let s = 0; s < segs; s++) {
    const x1 = pr + s * segLen + segLen * 0.3;
    const x2 = pr + (s+1) * segLen;
    const y  = (s%2===0) ? -3.5 : 3.5;
    ctx.lineTo(x1,y); ctx.lineTo(x2,0);
  }
  ctx.stroke();
  ctx.fillStyle = '#d080ff'; ctx.shadowBlur = 8;
  for (let s = 1; s < segs; s += 2) {
    ctx.beginPath(); ctx.arc(pr+s*segLen, 0, 2.5, 0, Math.PI*2); ctx.fill();
  }
  ctx.fillStyle = '#e8a0ff'; ctx.shadowBlur = 18;
  const ex = pr + chainLen;
  ctx.beginPath(); ctx.moveTo(ex+10,0); ctx.lineTo(ex+4,4); ctx.lineTo(ex-2,0); ctx.lineTo(ex+4,-4); ctx.closePath(); ctx.fill();
}

let particles = [];
let floatingTexts = [];   // 屏幕浮动提示文字

function spawnParticles(wx, wy, col, n, opts = {}) {
  for (let i = 0; i < n; i++) {
    const angle = opts.angle !== undefined
      ? opts.angle + rnd(-opts.spread||Math.PI, opts.spread||Math.PI)
      : Math.random() * Math.PI * 2;
    const spd = rnd(opts.spdMin||1.5, opts.spdMax||6);
    particles.push({
      x: wx, y: wy,
      vx: Math.cos(angle) * spd,
      vy: Math.sin(angle) * spd,
      life: 1, decay: rnd(opts.decayMin||0.03, opts.decayMax||0.07),
      r: rnd(opts.rMin||1.5, opts.rMax||4),
      col,
    });
  }
}

function updateParticles(fd) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x  += p.vx * fd; p.y += p.vy * fd;
    p.vx *= 0.88;      p.vy *= 0.88;
    p.life -= p.decay * fd;
    if (p.life <= 0) particles.splice(i, 1);
  }
}

function renderParticles() {
  for (const p of particles) {
    const sc = toScreen(p.x, p.y);
    ctx.save();
    ctx.globalAlpha = p.life;
    ctx.fillStyle   = p.col;
    ctx.shadowColor = p.col;
    ctx.shadowBlur  = 8;
    ctx.beginPath();
    ctx.arc(sc.x, sc.y, p.r, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
}

// ═══ COMBAT ════════════════════════════════════════════════
// ═══════════════════════════════════════════════════════════
let attacks     = [];
let projectiles = [];
let hitStopTimer = 0;   // 命中顿帧计时

const COMBO_DMG = [15, 18, 22];
// 矛
const SPEAR_DMG = [18, 21, 26];
const SPEAR_CD_MAX  = 300;  // 投矛E技
// 双匕
const DAGGER_DMG = [8, 9, 10];
const DAGGER_SPIN_CD = 180;
const DAGGER_THRUST_CD = 60;
// 大剑
const GREATSWORD_STOMP_CD = 350;
// 链刃
const CHAIN_DMG = [14, 16, 20];
const CHAIN_HOOK_CD  = 200;
const CHAIN_LAUNCH_CD = 100;

// ─── 主派发函数 ────────────────────────────────────────
function doAttack() {
  switch (player.weapon) {
    case 'sword':      doSwordAttack();      break;
    case 'spear':      doSpearAttack();      break;
    case 'dagger':     doDaggerAttack();     break;
    case 'greatsword': /* 由 mousedown/mouseup 控制 */  break;
    case 'chain':      doChainAttack();      break;
  }
}

// ─── 剑：普攻（原 doAttack 内容） ────────────────────
function doSwordAttack() {
  if (player.atkCd > 0) return;
  if (player.comboTimer <= 0) player.comboStep = 0;
  const step = player.comboStep;
  let dmg = COMBO_DMG[step];
  if (step === 2) dmg = Math.round(dmg * player.mods.comboFinisherMul);
  // 闪电冲：冲刺后下次攻击+30%
  if (player.mods.dashNextAtkActive) {
    dmg = Math.round(dmg * 1.3);
    player.mods.dashNextAtkActive = false;
    spawnParticles(player.x, player.y, '#ffe040', 8, { spdMin: 2, spdMax: 7, rMin: 1, rMax: 3, decayMin: 0.05, decayMax: 0.10 });
  }
  const angle = player.angle;
  screenShake = Math.max(screenShake, step === 2 ? 3 : 1.5);
  attacks.push({
    id: Math.random(), cx: player.x, cy: player.y,
    angle, arc: SWORD_ARC,
    range: SWORD_RANGE + step * 6,
    dmg, knockback: step === 2 ? 10 : 0,
    life: 10, maxLife: 10, hit: new Set(),
    holyDmg: player.mods.holyDmg, isSpin: false, step,
  });
  player.atkCd    = 22 * player.mods.atkSpeedMul;
  player.comboStep  = (step + 1) % 3;
  player.comboTimer = COMBO_WINDOW;
}

// ─── 矛：普攻（穿透长刺） ─────────────────────────────
function doSpearAttack() {
  if (player.atkCd > 0) return;
  if (player.comboTimer <= 0) player.comboStep = 0;
  const step = player.comboStep;
  let dmg  = SPEAR_DMG[step];
  // 闪电冲：冲刺后下次攻击+30%
  if (player.mods.dashNextAtkActive) {
    dmg = Math.round(dmg * 1.3);
    player.mods.dashNextAtkActive = false;
    spawnParticles(player.x, player.y, '#ffe040', 8, { spdMin: 2, spdMax: 7, rMin: 1, rMax: 3, decayMin: 0.05, decayMax: 0.10 });
  }
  const angle = player.angle;
  screenShake = Math.max(screenShake, 2);
  attacks.push({
    id: Math.random(), cx: player.x, cy: player.y,
    angle, arc: 0.55,          // 窄扇（约31°）
    range: 105 + step * 8,    // 长距离
    dmg, knockback: step === 2 ? 12 : 0,
    life: 8, maxLife: 8,
    hit: null,                 // null = 穿透，不记录命中（但每帧只加一次伤害，用 'pierceHit' set）
    pierceHit: new Set(),
    holyDmg: player.mods.holyDmg, isSpin: false, step, isPierce: true,
  });
  player.atkCd    = 30 * player.mods.atkSpeedMul;
  player.comboStep  = (step + 1) % 3;
  player.comboTimer = COMBO_WINDOW;
}

// ─── 双匕：普攻（超快，第10连击雷爆） ────────────────
function doDaggerAttack() {
  if (player.atkCd > 0) return;
  if (player.comboTimer <= 0) player.comboStep = 0;
  const step = player.comboStep;
  let dmg  = DAGGER_DMG[step];
  // 闪电冲：冲刺后下次攻击+30%
  if (player.mods.dashNextAtkActive) {
    dmg = Math.round(dmg * 1.3);
    player.mods.dashNextAtkActive = false;
    spawnParticles(player.x, player.y, '#ffe040', 8, { spdMin: 2, spdMax: 7, rMin: 1, rMax: 3, decayMin: 0.05, decayMax: 0.10 });
  }
  const angle = player.angle;
  // 交替双匕：每次攻击偏移角度±0.25弧度
  const sideOff = (player.comboStep % 2 === 0) ? -0.22 : 0.22;
  attacks.push({
    id: Math.random(), cx: player.x, cy: player.y,
    angle: angle + sideOff, arc: 1.1,
    range: 52, dmg, knockback: 0,
    life: 6, maxLife: 6, hit: new Set(),
    holyDmg: player.mods.holyDmg, isSpin: false, step,
    isDagger: true,
  });
  player.atkCd    = 11 * player.mods.atkSpeedMul;
  player.comboStep  = (step + 1) % 3;
  player.comboTimer = COMBO_WINDOW;
}

// ─── 链刃：普攻（中距宽扇） ──────────────────────────
function doChainAttack() {
  if (player.atkCd > 0) return;
  if (player.comboTimer <= 0) player.comboStep = 0;
  const step = player.comboStep;
  let dmg  = CHAIN_DMG[step];
  // 闪电冲：冲刺后下次攻击+30%
  if (player.mods.dashNextAtkActive) {
    dmg = Math.round(dmg * 1.3);
    player.mods.dashNextAtkActive = false;
    spawnParticles(player.x, player.y, '#ffe040', 8, { spdMin: 2, spdMax: 7, rMin: 1, rMax: 3, decayMin: 0.05, decayMax: 0.10 });
  }
  const angle = player.angle;
  screenShake = Math.max(screenShake, step === 2 ? 4 : 2);
  attacks.push({
    id: Math.random(), cx: player.x, cy: player.y,
    angle, arc: 1.85,           // 约106°宽扇
    range: 90 + step * 5,
    dmg, knockback: step === 2 ? 14 : 0,
    life: 9, maxLife: 9, hit: new Set(),
    holyDmg: player.mods.holyDmg, isSpin: false, step,
    isChain: true,
  });
  player.atkCd    = 26 * player.mods.atkSpeedMul;
  player.comboStep  = (step + 1) % 3;
  player.comboTimer = COMBO_WINDOW;
}

// ─── 大剑：松键释放重击 ──────────────────────────────
function doGreatswordRelease() {
  if (player.atkCd > 0 && player.gsChargeTimer < 5) return;
  const charge = player.gsChargeTimer;
  player.gsChargeTimer = 0;
  const chargePct = clamp(charge / 90, 0, 1);
  let dmg  = Math.round(30 + chargePct * 82);   // 30~112
  // 闪电冲：冲刺后下次攻击+30%
  if (player.mods.dashNextAtkActive) {
    dmg = Math.round(dmg * 1.3);
    player.mods.dashNextAtkActive = false;
    spawnParticles(player.x, player.y, '#ffe040', 8, { spdMin: 2, spdMax: 7, rMin: 1, rMax: 3, decayMin: 0.05, decayMax: 0.10 });
  }
  const arc  = lerp(1.1, 2.3, chargePct);         // 窄→宽
  const range = lerp(65, 90, chargePct);
  const angle = player.angle;
  screenShake = Math.max(screenShake, chargePct > 0.7 ? 10 : 4);
  // 橙红粒子爆发（满蓄力）
  if (chargePct > 0.6) {
    spawnParticles(player.x, player.y, '#ff8020', 20, {
      angle, spread: arc / 2, spdMin: 3, spdMax: 12, rMin: 2, rMax: 6,
      decayMin: 0.03, decayMax: 0.07,
    });
    spawnParticles(player.x, player.y, '#ffcc60', 10, {
      angle, spread: arc / 3, spdMin: 6, spdMax: 16, rMin: 1, rMax: 3,
      decayMin: 0.05, decayMax: 0.10,
    });
  }
  attacks.push({
    id: Math.random(), cx: player.x, cy: player.y,
    angle, arc, range,
    dmg, knockback: Math.round(18 * chargePct + 5),
    life: 14, maxLife: 14, hit: new Set(),
    holyDmg: player.mods.holyDmg, isSpin: false, step: chargePct > 0.7 ? 2 : 0,
    isGreatsword: true, chargePct,
  });
  player.atkCd = 50;
}

// ─── 大剑：右键蓄力劈释放 ────────────────────────────
function doGreatswordRightRelease() {
  if (player.thrustCd > 0) return;
  const charge = player.gsRightTimer;
  player.gsRightTimer = 0;
  const chargePct = clamp(charge / 60, 0, 1);
  const dmg  = Math.round(40 + chargePct * 15);   // 40~55
  screenShake = Math.max(screenShake, 8);
  spawnParticles(player.x, player.y, '#ff6010', 16, {
    angle: player.angle, spread: 1.2,
    spdMin: 3, spdMax: 10, rMin: 2, rMax: 5,
    decayMin: 0.03, decayMax: 0.07,
  });
  attacks.push({
    id: Math.random(), cx: player.x, cy: player.y,
    angle: player.angle, arc: Math.PI,   // 180° 大横扫
    range: 80,
    dmg, knockback: 30,
    life: 16, maxLife: 16, hit: new Set(),
    holyDmg: player.mods.holyDmg, isSpin: false, step: 2,
    isGreatsword: true, chargePct,
  });
  player.thrustCd = Math.round(THRUST_CD_MAX * player.mods.thrustCdMul);
}

// ─── 旋转斩/E技 主派发 ────────────────────────────────
function doSpin() {
  if (gameState !== S.PLAYING) return;
  switch (player.weapon) {
    case 'sword':      doSwordSpin();      break;
    case 'spear':      doSpearSpin();      break;
    case 'dagger':     doDaggerSpin();     break;
    case 'greatsword': doGreatswordStomp(); break;
    case 'chain':      doChainHook();      break;
  }
}

// ─── 剑：旋转斩（原 doSpin 内容） ────────────────────
function doSwordSpin() {
  if (player.spinCd > 0) return;
  player.spinCd = SPIN_CD_MAX;
  const spinRange = Math.round(SPIN_RANGE * player.mods.spinRangeBonus);
  const atk = {
    id: Math.random(), cx: player.x, cy: player.y,
    angle: 0, arc: Math.PI * 2, range: spinRange,
    dmg: 55 + player.mods.spinDmgBonus, knockback: 20,
    life: 18, maxLife: 18, hit: new Set(),
    holyDmg: player.mods.holyDmg, isSpin: true, step: -1,
  };
  attacks.push(atk);
  spawnParticles(player.x, player.y, '#ffe080', 40, { spdMin: 2, spdMax: 10, rMin: 2.5, rMax: 6, decayMin: 0.02, decayMax: 0.05 });
  spawnParticles(player.x, player.y, '#ffffff', 20, { spdMin: 6, spdMax: 18, rMin: 1, rMax: 3, decayMin: 0.06, decayMax: 0.12 });
  spawnParticles(player.x, player.y, '#ffa040', 16, { spdMin: 1, spdMax: 5, rMin: 3, rMax: 7, decayMin: 0.025, decayMax: 0.05 });
  // 霜环（spinFrostRing）：旋转斩后生成冰环，对范围内敌人施加减速
  if (player.mods.spinFrostRing) {
    spawnParticles(player.x, player.y, '#80d8ff', 28, { spdMin: 3, spdMax: spinRange * 0.065, rMin: 2, rMax: 5, decayMin: 0.025, decayMax: 0.05 });
    spawnParticles(player.x, player.y, '#c0f4ff', 14, { spdMin: spinRange * 0.06, spdMax: spinRange * 0.1, rMin: 1, rMax: 3, decayMin: 0.04, decayMax: 0.07 });
    for (const e of enemies) {
      if (dist(e, player) < spinRange + 30) {
        e.slowMul   = Math.min(e.slowMul, 0.4);
        e.slowTimer = Math.max(e.slowTimer, 150);   // 2.5秒
        spawnParticles(e.x, e.y, '#80d8ff', 5, { spdMin: 1, spdMax: 4, rMin: 1.5, rMax: 3, decayMin: 0.05, decayMax: 0.10 });
      }
    }
  }
  screenShake = Math.max(screenShake, 10);
}

// ─── 矛：E技——投矛往返 ───────────────────────────────
function doSpearSpin() {
  if (player.spinCd > 0) return;
  player.spinCd = SPEAR_CD_MAX;
  // 用鼠标世界坐标（fromScreen反算）计算真正的世界空间方向

function hitEnemy(e, dmg, knockback, angle, holyDmg, opts) {
  // archangel护盾减伤
  let realDmg = dmg + (holyDmg || 0);

  // 殒月：低血量额外伤害
  if (player.mods.lowHpDmgBonus && player.hp / player.maxHp < 0.3) realDmg = Math.round(realDmg * 1.25);
  // 绝对零度：减速中敌人额外伤害
  if (player.mods.slowedEnemyDmgBonus && e.slowTimer > 0) realDmg = Math.round(realDmg * 1.2);
  // 突刺伤害倍数（冰矛穿透）
  if (opts && opts.isThrust && player.mods.thrustDmgMul > 1) realDmg = Math.round(realDmg * player.mods.thrustDmgMul);

  if (e.type === 'archangel') realDmg = applyArchangelShield(e, realDmg);

  // fallen_curse / danel_atk buff：命中减速
  if (player.mods.slowDur > 0 && player.mods.slowOnHit !== 1) {
    e.slowMul   = player.mods.slowOnHit;
    e.slowTimer = player.mods.slowDur;
  }
  // 突刺必定减速（冰矛穿透）
  if (opts && opts.isThrust && player.mods.thrustFreeze) {
    e.slowMul   = 0.5;
    e.slowTimer = Math.max(e.slowTimer, 120);
  }

  // 雷击普攻：附加闪电伤害+连锁
  if (player.mods.thunderOnHit > 0 && !opts?.noThunder) {
    realDmg += player.mods.thunderOnHit;
    // 连锁到最近的另一个敌人
    let nearest = null, nearDist = 9999;
    for (const other of enemies) {
      if (other === e) continue;
      const d2 = dist(other, e);
      if (d2 < nearDist) { nearDist = d2; nearest = other; }
    }
    if (nearest && nearDist < 200) {
      nearest.hp -= 8;
      nearest.flashTimer = 6;
      // 电弧粒子
      spawnParticles(nearest.x, nearest.y, '#c0f0ff', 5, { spdMin:2, spdMax:6, rMin:1, rMax:2, decayMin:0.07, decayMax:0.13 });
      if (nearest.hp <= 0) killEnemy(nearest);
    }
  }

  e.hp -= realDmg;
  e.flashTimer = 10;

  // 月牙斩：普攻命中回血
  if (player.mods.lifeOnHit > 0 && !opts?.isSpin) {
    player.hp = Math.min(player.maxHp, player.hp + player.mods.lifeOnHit);
  }
  // 月盾突：突刺命中回血
  if (player.mods.thrustLifeSteal > 0 && opts && opts.isThrust) {
    player.hp = Math.min(player.maxHp, player.hp + player.mods.thrustLifeSteal);
  }
  // 净化突刺：突刺伤害转生命
  if (player.mods.thrustLifePct > 0 && opts && opts.isThrust) {
    player.hp = Math.min(player.maxHp, player.hp + Math.round(realDmg * player.mods.thrustLifePct));
  }

  // 命中顿帧（第3击更长）
  hitStopTimer = Math.max(hitStopTimer, knockback > 0 ? 5 : 2);

  // 击退
  const kbBase = Math.max(knockback, 5);
  const kbMul  = (player.mods.spinKnockbackBonus && opts && opts.isSpin) ? 2 : 1;
  const wdx = e.x - player.x, wdy = e.y - player.y;
  const wd  = Math.hypot(wdx, wdy) || 1;
  e.vx = (e.vx || 0) + (wdx / wd) * kbBase * kbMul;
  e.vy = (e.vy || 0) + (wdy / wd) * kbBase * kbMul;

  // 旋转斩灼烧（纯洁旋）
  if (opts && opts.isSpin && player.mods.spinBurn) {
    e.burnTimer  = (e.burnTimer || 0) + 60;   // 1秒灼烧
    e.burnDmgCd  = e.burnDmgCd || 0;
  }

  // 月圆斩：旋转斩命中每敌回血
  if (opts && opts.isSpin && player.mods.spinLifePerHit > 0) {
    player.hp = Math.min(player.maxHp, player.hp + player.mods.spinLifePerHit);
  }

  // 净化之光：20%概率触发治愈光环
  if (player.mods.pureAuraChance && Math.random() < 0.2) {
    player.hp = Math.min(player.maxHp, player.hp + 5);
    spawnParticles(player.x, player.y, '#80ffc0', 12, { spdMin:2, spdMax:6, rMin:1.5, rMax:3.5, decayMin:0.03, decayMax:0.07 });
    for (const oe of enemies) {
      if (dist(oe, player) < 80) { oe.hp -= 5; oe.flashTimer = 6; if (oe.hp <= 0) killEnemy(oe); }
    }
  }

  // 命中粒子
  spawnParticles(e.x, e.y, '#ffe0a0', 10, {
    angle, spread: 0.9, spdMin: 2, spdMax: 8,
    rMin: 2, rMax: 5, decayMin: 0.04, decayMax: 0.09,
  });
  spawnParticles(e.x, e.y, '#ffffff', 5, {
    angle, spread: 0.5, spdMin: 4, spdMax: 12,
    rMin: 1, rMax: 2.5, decayMin: 0.06, decayMax: 0.12,
  });

  screenShake = Math.max(screenShake, knockback > 0 ? 5 : 2.5);

  if (e.hp <= 0) killEnemy(e);
}

function killEnemy(e) {
  // 死亡爆发粒子
  spawnParticles(e.x, e.y, '#ffe0a0', 18, {
    spdMin: 2, spdMax: 9, rMin: 2, rMax: 6,
    decayMin: 0.025, decayMax: 0.055,
  });
  spawnParticles(e.x, e.y, '#ffffff', 8, {
    spdMin: 4, spdMax: 14, rMin: 1, rMax: 3,
    decayMin: 0.04, decayMax: 0.08,
  });
  screenShake = Math.max(screenShake, 6);
  if (player.mods.lifeOnKill) {
    player.hp = Math.min(player.maxHp, player.hp + player.mods.lifeOnKill);
  }
  if (player.mods.dashKillReset) player.dashCd = 0;
  // 金币掉落
  if (e.goldDrop > 0) {
    run.gold += e.goldDrop;
    updateGoldHUD();
  }
  // 从 enemies 数组移除
  const idx = enemies.indexOf(e);
  if (idx !== -1) enemies.splice(idx, 1);
}

// ── 冲刺 ─────────────────────────────────────────────────
function doDash() {
  if (player.dashCd > 0) return;

  // 冲刺方向：优先WASD（按屏幕方向），无输入则朝鼠标方向
  let sdx = 0, sdy = 0;
  if (keys['KeyW'] || keys['ArrowUp'])    sdy -= 1;
  if (keys['KeyS'] || keys['ArrowDown'])  sdy += 1;
  if (keys['KeyA'] || keys['ArrowLeft'])  sdx -= 1;
  if (keys['KeyD'] || keys['ArrowRight']) sdx += 1;
  let dx, dy;
  if (sdx === 0 && sdy === 0) {
    // 无WASD：朝鼠标世界坐标方向
    const mdx = mouse.worldX - player.x;
    const mdy = mouse.worldY - player.y;
    const mlen = Math.hypot(mdx, mdy) || 1;
    dx = mdx / mlen;
    dy = mdy / mlen;
  } else {
    const len = Math.hypot(sdx, sdy);
    sdx /= len; sdy /= len;
    // 屏幕方向→世界坐标方向
    dx = (sdx / ISO_COS + sdy / ISO_SIN) / 2;
    dy = (sdy / ISO_SIN - sdx / ISO_COS) / 2;
    const wlen = Math.hypot(dx, dy) || 1;
    dx /= wlen; dy /= wlen;
  }

  const spd = DASH_SPEED * player.mods.dashRange;
  player.dashVx     = dx * spd;
  player.dashVy     = dy * spd;
  player.dashTimer  = DASH_DUR;
  player.invincible = INVINCIBLE_DUR;
  player.dashCd     = Math.round(DASH_CD_MAX * player.mods.dashCdMul);
  // divine_ward buff：冲刺后防御窗口
  if (player.mods.dashDefenseWindow > 0) player.dashDefWindow = player.mods.dashDefenseWindow;
  // 圣洁冲：冲刺后5秒（300帧）转化受伤为HP
  if (player.mods.dashLifeConvert) player.mods.dashLifeConvertTimer = 300;
  // 闪电冲：冲刺后下次攻击+30%
  if (player.mods.dashNextAtkBonus) player.mods.dashNextAtkActive = true;

  // 冲刺尾迹粒子（方向反向喷出）
  spawnParticles(player.x, player.y, '#a060ff', 12, {
    angle: Math.atan2(-dy, -dx), spread: 0.7,
    spdMin: 2, spdMax: 6, rMin: 1.5, rMax: 3.5,
    decayMin: 0.04, decayMax: 0.09,
  });
  spawnParticles(player.x, player.y, '#ffffff', 5, {
    angle: Math.atan2(-dy, -dx), spread: 0.4,
    spdMin: 4, spdMax: 9, rMin: 1, rMax: 2,
    decayMin: 0.06, decayMax: 0.12,
  });
  screenShake = Math.max(screenShake, 2);
}

// ── 旋转斩(E) ─────────────────────────────────────────
// （doSpin 已在武器dispatch区定义，此处删除旧版）

function updateAttacks(fd) {
  if (player.comboTimer > 0) player.comboTimer -= fd;
  if (player.atkCd > 0)      player.atkCd      -= fd;
  if (player.spinCd > 0)     player.spinCd      -= fd;

  // 大剑蓄力计时
  if (player.weapon === 'greatsword') {
    if (player.gsCharging) {
      player.gsChargeTimer = Math.min(player.gsChargeTimer + fd, 90);
    }
    if (player.gsRightCharging) {
      player.gsRightTimer = Math.min(player.gsRightTimer + fd, 60);
      // 蓄满自动释放
      if (player.gsRightTimer >= 60) {
        player.gsRightCharging = false;
        doGreatswordRightRelease();
      }
    }
  }

  // 双匕旋风刺——分步发射
  if (player.weapon === 'dagger' && player.dagSpinStep > 0) {
    player.dagSpinTimer -= fd;
    if (player.dagSpinTimer <= 0) {
      player.dagSpinStep--;
      player.dagSpinTimer = 5;
      // 发出一次小扇形
      const sOff = (player.dagSpinStep % 2 === 0) ? -0.25 : 0.25;
      attacks.push({
        id: Math.random(), cx: player.x, cy: player.y,
        angle: player.angle + sOff, arc: 1.1, range: 60,
        dmg: 12, knockback: 4,
        life: 5, maxLife: 5, hit: new Set(),
        holyDmg: player.mods.holyDmg, isSpin: false, step: 0, isDagger: true,
      });
      spawnParticles(player.x, player.y, '#80e0ff', 5, {
        angle: player.angle + sOff, spread: 0.6,
        spdMin: 3, spdMax: 8, rMin: 1, rMax: 2.5, decayMin: 0.06, decayMax: 0.12,
      });
    }
  }

  for (let i = attacks.length - 1; i >= 0; i--) {
    const a = attacks[i];
    a.life -= fd;
    if (a.life <= 0) { attacks.splice(i, 1); continue; }

    if (a.isEnemy) {
      // 敌人发出的攻击弧：打玩家
      if (player.invincible <= 0) {
        const asc = toScreen(a.cx, a.cy);
        const psc = toScreen(player.x, player.y);
        if (inArc(
          { cx: asc.x, cy: asc.y, angle: a.angle, arc: a.arc, range: a.range },
          psc.x, psc.y, player.r
        )) {
          damagePlayer(a.dmg, Math.atan2(player.y - a.cy, player.x - a.cx));
        }
      }
    } else {
      // 玩家发出的攻击弧：打敌人
      for (const e of enemies) {
        // 穿透攻击用 pierceHit 去重（每次攻击只命中一次，但不阻止同一次攻击打多个敌人）
        const hitSet = a.isPierce ? a.pierceHit : a.hit;
        if (hitSet.has(e.id)) continue;
        const asc = toScreen(a.cx, a.cy);
        const esc = toScreen(e.x, e.y);
        if (!inArc(
          { cx: asc.x, cy: asc.y, angle: a.angle, arc: a.arc, range: a.range },
          esc.x, esc.y, e.r
        )) continue;
        hitSet.add(e.id);
        hitEnemy(e, a.dmg, a.knockback, a.angle, a.holyDmg,
          { isSpin: a.isSpin, isThrust: false, noThunder: a.isSpin });

        // 双匕命中计数，触发雷爆
        if (a.isDagger && player.weapon === 'dagger') {
          player.dagCombo++;
          if (player.dagCombo >= 10) {
            player.dagCombo = 0;
            spawnDaggerThunder(e.x, e.y);
          }
        }
      }

      // spinBurst/风眼 buff：旋转斩命中≥2敌人时触发圣光冲击波
      if (a.isSpin && player.mods.spinBurst && a.hit.size >= 2 && !a.burstFired) {
        a.burstFired = true;
        spawnHolyBurst(a.cx, a.cy);
      }
      // 闪电环：旋转斩命中后在敌人间生成电弧
      if (a.isSpin && player.mods.spinLightningArc && a.hit.size >= 2 && !a.arcFired) {
        a.arcFired = true;
        const hitEnemies = enemies.filter(e => a.hit.has(e.id));
        for (let i = 0; i < hitEnemies.length - 1; i++) {
          hitEnemy(hitEnemies[i+1], 15, 0, 0, 0, { noThunder: true });
          spawnParticles(hitEnemies[i].x, hitEnemies[i].y, '#c0f0ff', 6, { spdMin:2, spdMax:6, rMin:1, rMax:2.5, decayMin:0.05, decayMax:0.11 });
        }
      }
    }
  }

  // 冲刺穿透 buff：冲刺中每帧伤害经过的敌人
  if (player.dashTimer > 0 && player.mods.dashThrough) {
    for (const e of enemies) {
      if (dist(e, player) < e.r + player.r) {
        hitEnemy(e, player.mods.dashThroughDmg || 20, 0, Math.atan2(e.y - player.y, e.x - player.x), 0, { noThunder: true });
      }
    }
  }

  // 链刃弹射穿越伤害（复用thrustHit逻辑，在movePlayer里处理，这里只做粒子）

  // dashCd倒计时
  if (player.dashCd > 0)   player.dashCd   -= fd;
  if (player.thrustCd > 0) player.thrustCd -= fd;

  // 冲刺后防御窗口倒计时
  if (player.dashDefWindow > 0) player.dashDefWindow -= fd;
  // 圣洁冲倒计时
  if (player.mods.dashLifeConvertTimer > 0) player.mods.dashLifeConvertTimer -= fd;
}

// 圣光冲击波（spinBurst buff专用）
