<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>Mercenaries - RE4 Style</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#000;overflow:hidden;font-family:'Courier New',monospace;}
#three-canvas{position:fixed;top:0;left:0;z-index:0;display:block;}

/* ── 选角界面 ── */
#char-select{
  position:fixed;top:0;left:0;width:100%;height:100%;
  background:#080808;display:flex;flex-direction:column;
  align-items:center;justify-content:center;z-index:20;color:#fff;
}
#char-select h1{font-size:44px;letter-spacing:10px;color:#cc0000;text-shadow:0 0 24px #f00;margin-bottom:6px;}
.subtitle{font-size:12px;color:#555;letter-spacing:6px;margin-bottom:44px;}
.char-grid{display:grid;grid-template-columns:repeat(4,190px);gap:14px;}
.char-card{border:2px solid #2a2a2a;padding:20px 14px;cursor:pointer;text-align:center;
  background:rgba(255,255,255,0.02);transition:all .18s;}
.char-card:hover{border-color:#c00;background:rgba(180,0,0,0.1);transform:translateY(-3px);}
.char-card.selected{border-color:#FFD700;background:rgba(255,215,0,0.07);}
.char-avatar{display:block;width:80px;height:80px;margin:0 auto 10px;}
.char-name{font-size:16px;font-weight:bold;letter-spacing:3px;margin-bottom:4px;}
.char-type{font-size:10px;color:#777;margin-bottom:9px;letter-spacing:1px;}
.char-skills{font-size:10px;color:#aaa;line-height:1.9;text-align:left;}
.char-skills b{color:#FFD700;}
#start-btn{
  margin-top:28px;padding:12px 52px;background:#c00;border:none;color:#fff;
  font-size:14px;font-family:'Courier New',monospace;letter-spacing:5px;
  cursor:pointer;display:none;transition:background .15s;
}
#start-btn:hover{background:#f00;}

/* ── HUD ── */
#hud{position:fixed;top:0;left:0;width:100%;height:100%;
  pointer-events:none;color:#fff;z-index:10;display:none;}
#exec-cut{
  position:fixed;top:0;left:0;width:100%;height:100%;
  background:#000;opacity:0;pointer-events:none;z-index:25;
}

#crosshair{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:18px;height:18px;color:rgba(255,255,255,.75);transition:width .06s,height .06s,color .08s;}
#crosshair::before,#crosshair::after{content:'';position:absolute;background:currentColor;}
#crosshair::before{width:2px;height:100%;left:50%;transform:translateX(-50%);}
#crosshair::after{width:100%;height:2px;top:50%;transform:translateY(-50%);}

#timer{position:absolute;top:16px;left:50%;transform:translateX(-50%);
  font-size:38px;font-weight:bold;text-shadow:0 2px 8px #000;min-width:90px;text-align:center;}
#timer.danger{color:#f44;animation:blink .4s step-end infinite;}
@keyframes blink{50%{opacity:.2;}}

#time-add{position:absolute;top:62px;left:50%;transform:translateX(-50%);
  font-size:19px;color:#0ff;opacity:0;text-shadow:0 0 10px #0ff;pointer-events:none;}
#score-box{position:absolute;top:16px;right:26px;text-align:right;}
#score-label{font-size:10px;color:#777;letter-spacing:3px;}
#score-val{font-size:30px;font-weight:bold;color:#FFD700;}
#combo-box{position:absolute;top:72px;right:26px;text-align:right;}
#combo-val{font-size:25px;font-weight:bold;color:#FF6B35;}
#combo-label{font-size:10px;color:#777;letter-spacing:2px;}

#char-info{position:absolute;bottom:26px;left:26px;}
#char-info-name{font-size:18px;font-weight:bold;letter-spacing:3px;}
#char-info-weapon{font-size:11px;color:#888;margin-top:3px;letter-spacing:2px;}
#char-info-skill{font-size:11px;color:#6ecbff;margin-top:4px;letter-spacing:1px;}
#ammo{margin-top:5px;font-size:13px;color:#ccc;}

#hp-wrap{position:absolute;bottom:26px;right:26px;text-align:right;}
#hp-label{font-size:10px;color:#777;letter-spacing:3px;margin-bottom:3px;}
#hp-bg{width:170px;height:8px;background:#1a1a1a;border:1px solid #444;margin-left:auto;}
#hp-fill{height:100%;background:#0f0;transition:width .25s,background .25s;}

#finisher-prompt{
  position:absolute;top:60%;left:50%;transform:translateX(-50%);
  font-size:20px;font-weight:bold;color:#FFD700;
  text-shadow:0 0 14px #FF8C00;letter-spacing:4px;display:none;
  animation:pulse .45s ease-in-out infinite alternate;
}
#context-prompt{
  position:absolute;top:66%;left:50%;transform:translateX(-50%);
  font-size:14px;font-weight:bold;color:#8ce7ff;
  text-shadow:0 0 10px #0a2b3f;letter-spacing:2px;display:none;
}
@keyframes pulse{
  from{opacity:.6;transform:translateX(-50%) scale(.97);}
  to{opacity:1;transform:translateX(-50%) scale(1.03);}
}
#zone-hit{position:absolute;top:42%;left:50%;transform:translateX(-50%);
  font-size:14px;font-weight:bold;letter-spacing:5px;pointer-events:none;opacity:0;}
#hint{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);
  font-size:10px;color:#333;letter-spacing:2px;}

/* ── 游戏结束 ── */
#game-over{
  position:fixed;top:0;left:0;width:100%;height:100%;
  background:rgba(0,0,0,.92);display:none;
  align-items:center;justify-content:center;flex-direction:column;z-index:30;color:#fff;
}
#game-over h2{font-size:48px;color:#c00;letter-spacing:8px;margin-bottom:16px;}
#final-score{font-size:26px;color:#FFD700;margin-bottom:8px;}
#final-kills{font-size:14px;color:#777;margin-bottom:32px;}
#rank-label{font-size:13px;color:#aaa;letter-spacing:2px;margin-bottom:6px;}
#rank-val{font-size:28px;color:#FFD700;letter-spacing:4px;margin-bottom:28px;}
#retry-btn{padding:11px 42px;background:#c00;border:none;color:#fff;
  font-size:13px;font-family:'Courier New',monospace;letter-spacing:3px;cursor:pointer;}
#retry-btn:hover{background:#f00;}
</style>
</head>

function addMapCollider(x,z,sx,sz,pad,layer){
  var p=pad||0;
  MAP_COLLIDERS.push({
    minX:x-sx*.5-p,maxX:x+sx*.5+p,
    minZ:z-sz*.5-p,maxZ:z+sz*.5+p,
    layer:layer||'ground'
  });
}

function resolveMapCollision(pos,radius,layer){
  for(var i=0;i<MAP_COLLIDERS.length;i++){
    var c=MAP_COLLIDERS[i];
    if(c.layer!=='all'&&c.layer!==(layer||'ground'))continue;
    var nx=Math.max(c.minX,Math.min(pos.x,c.maxX));
    var nz=Math.max(c.minZ,Math.min(pos.z,c.maxZ));
    var dx=pos.x-nx,dz=pos.z-nz;
    var d2=dx*dx+dz*dz,rr=radius*radius;
    if(d2>=rr)continue;

    if(d2<1e-8){
      var left=Math.abs(pos.x-c.minX),right=Math.abs(c.maxX-pos.x);
      var top=Math.abs(pos.z-c.minZ),bottom=Math.abs(c.maxZ-pos.z);
      var m=Math.min(left,right,top,bottom);
      if(m===left)pos.x=c.minX-radius;
      else if(m===right)pos.x=c.maxX+radius;
      else if(m===top)pos.z=c.minZ-radius;
      else pos.z=c.maxZ+radius;
    }else{
      var d=Math.sqrt(d2),push=(radius-d)+1e-4;
      pos.x+=(dx/d)*push;
      pos.z+=(dz/d)*push;
    }
  }
}

function moveWithMapCollision(pos,delta,radius,layer){
  var p=pos.clone();
  p.x+=delta.x;resolveMapCollision(p,radius,layer);
  p.z+=delta.z;resolveMapCollision(p,radius,layer);
  return p;
}

function movePlayerWithSqueeze(pos,delta,layer){
  var stepLen=delta.length();
  if(stepLen<1e-6)return pos.clone();
  var normal=moveWithMapCollision(pos,delta,PLAYER_COLLIDER_R,layer);
  var movedNormal=normal.distanceTo(pos);
  if(movedNormal>=stepLen*.34)return normal;

  // 细缝兜底：移动明显受阻时，临时收窄半径尝试通过
  var tight=moveWithMapCollision(pos,delta,PLAYER_COLLIDER_R_TIGHT,layer);
  var movedTight=tight.distanceTo(pos);
  if(movedTight>movedNormal+1e-4)return tight;

  // 轴向补偿，避免斜向挤缝时卡角
  var xFirst=moveWithMapCollision(pos,new THREE.Vector3(delta.x,0,0),PLAYER_COLLIDER_R_TIGHT,layer);
  xFirst=moveWithMapCollision(xFirst,new THREE.Vector3(0,0,delta.z),PLAYER_COLLIDER_R_TIGHT,layer);
  var zFirst=moveWithMapCollision(pos,new THREE.Vector3(0,0,delta.z),PLAYER_COLLIDER_R_TIGHT,layer);
  zFirst=moveWithMapCollision(zFirst,new THREE.Vector3(delta.x,0,0),PLAYER_COLLIDER_R_TIGHT,layer);
  var movedXF=xFirst.distanceTo(pos),movedZF=zFirst.distanceTo(pos);
  if(movedXF>=movedZF&&movedXF>movedNormal)return xFirst;
  if(movedZF>movedNormal)return zFirst;
  return normal;
}

  if(!selectedChar)return;
  currentChar=selectedChar;
  // 深拷贝武器
  CHARS[currentChar].weapons=CHARS[currentChar].weapons.map(function(w){return Object.assign({},w);});
  initWeaponAmmoState(CHARS[currentChar].weapons);

  document.getElementById('hud').style.display='block';

  var cd=CHARS[currentChar];
  playerHP=cd.hp;playerMaxHP=cd.hp;
  weaponIndex=0;score=0;kills=0;combo=0;timeLeft=180;spawnTimer=0;
  skillCD=0;skillTimer=0;skillActive=null;skillFxTimer=0;reloadState=null;
  mouseDown=false;aimDown=false;aimBlend=0;bowDraw.active=false;bowDraw.hold=0;bowDraw.t=0;
  crosshairPulse=0;
  playerLayer='ground';
  playerAction=null;
  gameState='playing';

  initThree();
  pVel=new THREE.Vector3();
  player=buildPlayer(cd);
  setPlayerWeaponModel();

  for(var i=0;i<4;i++)spawnEnemy();

  renderer.domElement.addEventListener('click',function(){renderer.domElement.requestPointerLock();});
  renderer.domElement.addEventListener('contextmenu',function(e){e.preventDefault();});
  document.addEventListener('mousemove',onMouseMove);
  document.addEventListener('mousedown',onMouseDown);
  document.addEventListener('mouseup',onMouseUp);
  document.addEventListener('keydown',onKeyDown);
  document.addEventListener('keyup',function(e){keys[e.code]=false;});

  document.getElementById('char-info-name').textContent=cd.name;
  refreshWeaponHUD();refreshSkillHUD();refreshHPHUD();refreshScoreHUD();refreshTimerHUD();
  animate();
}

function initWeaponAmmoState(ws){
  if(!ws||!ws.length)return;
  ws.forEach(function(w){
    if(!w||w.ammo===-1){
      if(w){w.mag=-1;w.reserve=-1;}
      return;
    }
    var carryMax=AMMO_MAX[w.name]||Math.max(w.ammo||0,1);
    var clipSize=AMMO_CLIP[w.name]||carryMax;
    var total=Math.min(Math.max((w.ammo||0)+(w.reserve||0),0),carryMax);
    w.mag=clipSize;
    w.ammo=Math.min(clipSize,total);
    w.reserve=Math.max(0,total-w.ammo);
  });
}

function onMouseMove(e){
  if(document.pointerLockElement!==renderer.domElement)return;
  if(isFinishing)return;
  var sens=.002;
  if(aimDown){
    sens*=.35;
    if(currentChar&&CHARS[currentChar]){
      var wp=CHARS[currentChar].weapons[weaponIndex];
      if(wp&&wp.kind==='sniper')sens*=.55;
    }
  }
  camYaw-=e.movementX*sens;
  camPitch+=e.movementY*sens;
  camPitch=Math.max(-.3,Math.min(.65,camPitch));
}
function onMouseDown(e){
  if(e.button===2){
    if(gameState==='playing')aimDown=true;
    e.preventDefault();
    return;
  }
  if(e.button!==0)return;
  mouseDown=true;
  if(gameState!=='playing')return;
  var wp=CHARS[currentChar].weapons[weaponIndex];
  if(wp&&wp.kind==='bow'){
    bowDraw.active=true;
    bowDraw.hold=0;
    return;
  }
  shoot();
}

function onMouseUp(e){
  if(e.button===2){
    aimDown=false;
    e.preventDefault();
    return;
  }
  if(e.button!==0)return;
  mouseDown=false;
  if(gameState!=='playing')return;
  var wp=CHARS[currentChar].weapons[weaponIndex];
  if(wp&&wp.kind==='bow'&&bowDraw.active){
    releaseBowShot();
  }
  bowDraw.active=false;
  bowDraw.hold=0;
}
function onKeyDown(e){
  keys[e.code]=true;
  if(gameState!=='playing')return;
  if(e.code==='KeyC'){tryContextAction();return;}
  if(e.code==='KeyE')useSkill();
  if(e.code==='KeyF')tryFinisher();
  if(e.code==='KeyG')tryExecute();
  if(e.code==='KeyQ')switchWeapon();
  if(e.code==='KeyR')reloadWeapon();
}

function getLayerY(layer){
  if(layer==='roof')return ROOF_Y;
  if(layer==='tower')return TOWER_Y;
  if(layer==='platform')return PLATFORM_Y;
  return 0;
}

function startPlayerAction(toPos,toLayer,dur,arc){
  if(!player)return;
  playerAction={
    t:0,dur:dur||.36,
    from:player.position.clone(),
    to:toPos.clone(),
    layer:toLayer||playerLayer,
    arc:arc||0
  };
}

function sampleWalkRampHeight(pos,currentLayer){
  var best=null,bestD=1e9;
  MAP_WALK_RAMPS.forEach(function(r){
    if(r.from!==currentLayer&&r.to!==currentLayer)return;
    var vx=r.tx-r.x,vz=r.tz-r.z;
    var len2=vx*vx+vz*vz;
    if(len2<1e-6)return;
    var t=((pos.x-r.x)*vx+(pos.z-r.z)*vz)/len2;
    t=clamp01(t);
    var px=r.x+vx*t,pz=r.z+vz*t;
    var d=Math.hypot(pos.x-px,pos.z-pz);
    var w=r.width||1.1;
    if(d>w||d>=bestD)return;
    bestD=d;
    best={
      y:lerp(getLayerY(r.from),getLayerY(r.to),t),
      layer:t>.92?r.to:(t<.08?r.from:currentLayer)
    };
  });
  return best;
}

function getNearbyContextAction(){
  if(!player||isFinishing||playerAction)return null;
  var p=player.position;
  var best=null,bestD=1e9;
  MAP_WINDOWS.forEach(function(w){
    if(w.from!==playerLayer)return;
    var d=Math.hypot(p.x-w.x,p.z-w.z);
    if(d<1.7&&d<bestD){bestD=d;best={kind:'window',data:w};}
  });
  return best;
}

function tryContextAction(){
  var best=getNearbyContextAction();
  if(!best)return;
  var cfg=best.data;
  var to=new THREE.Vector3(cfg.tx,cfg.ty||0,cfg.tz);
  startPlayerAction(to,cfg.to,.34,.58);
}

function tickContextPrompt(){
  var el=document.getElementById('context-prompt');
  if(!el)return;
  var near=getNearbyContextAction();
  if(!near){el.style.display='none';return;}
  el.textContent='[ C ] 翻窗';
  el.style.display='block';
}

function lm(c){return new THREE.MeshLambertMaterial({color:c});}

  function addBlock(x,y,z,sx,sy,sz,c,solid,layer){
    var m=new THREE.Mesh(new THREE.BoxGeometry(sx,sy,sz),lm(c||0x7a6a50));
    m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;scene.add(m);
    if(solid!==false&&sy>.2)addMapCollider(x,z,sx,sz,.1,layer||'ground');

    addBlock(x,h*.5,z,w,h,d,tint||0x7a6a50);

/* ================================================================

  角色朝向 = player.rotation.y = camYaw + PI
   右臂绕 X 轴旋转：负值 = 手臂向前（朝 +Z）伸出
   枪口对准摄像机方向（含俯仰）

function applyGunPose(){
  if(!player||isFinishing)return;
  var ch=player.children;
  var lA=ch[2],rA=ch[3],gun=ch[4];

    }

  // 枪：跟随俯仰
  if(gun){
    if(wp&&wp.kind==='bow'){
      gun.position.set(.34,.94,.42+.02*draw);
      gun.rotation.set(camPitch*.35-.1*draw,0,.08-.05*draw);

    }else if(wp&&wp.kind==='rpg'){
      gun.position.set(.40,.90,.20);
      gun.rotation.set(camPitch*.18,0,.04);
    }else if(wp&&wp.kind==='gauntlet'){
      gun.position.set(.41,.92,.26);
      gun.rotation.set(camPitch*.18,0,.22);
    }else if(wp&&wp.kind==='moldsmg'){
      gun.position.set(.39,.90,.36);
      gun.rotation.set(camPitch*.44,0,.05);
    }else if(wp&&wp.kind==='whip'){
      gun.position.set(.42,.90,.24);

    }else if(wp&&wp.kind==='rifle'){

      gun.rotation.set(camPitch*.42,0,.04);
    }else{
      gun.position.set(.38,.88,.42);

function spawnEnemy(){
  if(enemies.length>=MAX_E)return;
  var pool=['villager','villager','shielder','chainsaw'];
  var tk=pool[Math.floor(Math.random()*pool.length)];
  var t=ETYPES[tk];
  var mesh=buildEnemyMesh(tk);
  var sp=pickSafeSpawnPoint();
  mesh.position.copy(sp);
  scene.add(mesh);
  enemies.push({mesh:mesh,tk:tk,data:Object.assign({},t),
    hp:t.hp,maxHp:t.hp,staggerAcc:0,staggerZone:null,
    state:'chase',staggerTimer:0,atkTimer:0,
    aiMode:'push',aiSide:Math.random()<.5?-1:1,canStrike:true,
    layer:'ground',roleTimer:.4+Math.random()*.8,slowTimer:0,slowMul:1,
    stuckTimer:0,lastPos:mesh.position.clone()});
}

function pickSafeSpawnPoint(){
  var fallback=(MAP_SPAWNS.length?MAP_SPAWNS[0]:new THREE.Vector3(0,0,0)).clone();
  var best=fallback,bestDist=-1;
  var playerPos=player?player.position.clone():new THREE.Vector3();
  var camDir=new THREE.Vector3(0,0,-1);
  if(camera)camera.getWorldDirection(camDir);

  var minDist=15.5; // 不允许贴脸刷怪
  var frontDot=0.45; // 尽量不在玩家镜头正前方
  for(var i=0;i<40;i++){
    var base=MAP_SPAWNS.length?MAP_SPAWNS[Math.floor(Math.random()*MAP_SPAWNS.length)]:new THREE.Vector3(0,0,0);
    var cand=base.clone();
    cand.x+=(Math.random()-.5)*1.8;
    cand.z+=(Math.random()-.5)*1.8;
    cand.y=0;

    var to=cand.clone().sub(playerPos);to.y=0;
    var d=to.length();
    if(d>bestDist){bestDist=d;best=cand.clone();}

    // 开局 player 尚未可用时直接接受
    if(!player)return cand;
    if(d<minDist)continue;

    var dirTo=to.normalize();
    var inFront=camDir.dot(dirTo)>frontDot;
    if(inFront)continue;
    return cand;
  }
  return best; // 实在找不到，至少刷在最远点
}
function removeEnemy(en){
  scene.remove(en.mesh);
  var i=enemies.indexOf(en);if(i!==-1)enemies.splice(i,1);
}

/* ================================================================
   射击
================================================================ */
function shoot(chargeMul){
  var cd=CHARS[currentChar],wp=cd.weapons[weaponIndex];
  if(shootCD>0||wp.ammo===0||reloadState)return;
  var shotWp=wp;
  var charge=chargeMul||1;
  if(wp.kind==='bow'){
    var extraPierce=charge>=2.1?2:(charge>=1.7?1:0);
    shotWp=Object.assign({},wp,{
      range:wp.range*(0.55+.62*charge),
      pierce:(wp.pierce||0)+extraPierce,
      bowCharge:charge
    });
  }
  var stats=getWeaponStats(wp);
  if(wp.kind==='bow'){
    stats.damage*=charge;
    stats.rate*=1.08; // 弓松手后略有复位间隔
  }
  if(wp.ammo>0&&!stats.infiniteAmmo)wp.ammo--;
  shootCD=stats.rate;

  var aim=getAimResult(shotWp.range);
  var dir=aim.dir;
  var muz=new THREE.Vector3();player.getWorldPosition(muz);muz.y+=1.0;
  var baseDir=aim.point.clone().sub(muz);
  if(baseDir.lengthSq()<1e-6)baseDir.copy(dir);
  baseDir.normalize();
  if(shotWp.kind==='shotgun'){
    var pellets=shotWp.pellets||7;
    for(var p=0;p<pellets;p++){
      var pdir=spreadDir(baseDir,stats.spread||.1);
      fireHitscan(muz,pdir,shotWp,stats);
    }
    fxFlash(muz);doShake(.16);
    crosshairPulse=.18;
  }else if(shotWp.kind==='grenade'){
    fireGrenade(muz,baseDir,shotWp,stats);
    fxFlash(muz);
    crosshairPulse=.22;
  }else if(shotWp.kind==='rpg'){
    fireRocket(muz,baseDir,shotWp,stats);
    fxFlash(muz);
    doShake(.26);
    crosshairPulse=.28;
  }else if(shotWp.kind==='whip'){
    lashMoldWhip(shotWp,stats);
    doShake(.10);
    crosshairPulse=.13;
  }else if(shotWp.kind==='gauntlet'){
    punchGauntlet(shotWp,stats);
    doShake(.11);
    crosshairPulse=.14;
  }else if(shotWp.kind==='knife'){
    slashKnife(shotWp,stats);
    doShake(.08);
    crosshairPulse=.12;
  }else{
    fireHitscan(muz,baseDir,shotWp,stats);
    if(shotWp.kind==='moldsmg')fxMoldFlash(muz);
    else fxFlash(muz);
    if(shotWp.kind==='bow'){
      doShake(.14*charge);
      fxArrowTrail(muz,baseDir,Math.min(shotWp.range,28),charge);
      crosshairPulse=.12+.15*(charge-1);
    }else{
      crosshairPulse=.15;
    }
  }
  refreshWeaponHUD();
  refreshSkillHUD();
}

function releaseBowShot(){
  var h=bowDraw.hold;
  var charge;
  if(h<.16)charge=.78;          // 轻触
  else if(h<.48)charge=1.25;    // 半拉
  else if(h<.85)charge=1.85;    // 深拉
  else charge=2.4;              // 满拉（爆头可秒链锯）
  shoot(charge);
  if(charge>=2.4)showZone('FULL DRAW','#8CE7FF');
}

function getWeaponStats(wp){
  var rateMul=1,damageMul=1,spreadMul=1,infiniteAmmo=false;
  if(skillActive){
    if(skillActive.id==='leon'){
      damageMul=1.22;
      if(wp.kind==='shotgun')spreadMul=.78;
    }else if(skillActive.id==='krauser'){
      if(wp.kind==='knife'){damageMul=1.5;rateMul=.82;}
      else damageMul=1.1;
    }else if(skillActive.id==='wesker'){
      damageMul=1.2;rateMul=.9;
    }else if(skillActive.id==='hunk'){
      rateMul=.8;
      if(wp.kind==='grenade')damageMul=1.1;
    }else if(skillActive.id==='jill'){
      damageMul=1.25;
      rateMul=.9;
    }else if(skillActive.id==='chris'){
      damageMul=1.32;
    }else if(skillActive.id==='rose'){
      rateMul=.5;
    }
  }
  return {
    damage:wp.damage*damageMul,
    rate:Math.max(.05,wp.rate*rateMul),
    spread:(wp.spread||0)*spreadMul,
    pierce:wp.pierce||0,
    infiniteAmmo:infiniteAmmo
  };
}

function spreadDir(base,spread){
  var d=base.clone().normalize();
  if(spread<=0)return d;
  d.x+=(Math.random()-.5)*spread;
  d.y+=(Math.random()-.5)*spread;
  d.z+=(Math.random()-.5)*spread;
  return d.normalize();
}

function rayHitList(origin,dir,range){
  var ray=new THREE.Raycaster(origin.clone(),dir.clone().normalize(),0,range);
  return ray.intersectObjects(enemies.map(function(e){return e.mesh;}),true);
}

function getAimResult(range){
  var camPos=camera.position.clone();
  var camDir=new THREE.Vector3();camera.getWorldDirection(camDir);
  var hits=rayHitList(camPos,camDir,range);
  var point=camPos.clone().addScaledVector(camDir,range);
  if(hits.length>0)point.copy(hits[0].point);
  return {dir:camDir.normalize(),point:point};
}

function findEnemyRoot(obj){
  var root=obj;while(root.parent&&root.parent!==scene)root=root.parent;
  for(var i=0;i<enemies.length;i++){if(enemies[i].mesh===root)return enemies[i];}
  return null;
}

function fireHitscan(origin,dir,wp,stats){
  var hits=rayHitList(origin,dir,wp.range);
  var used={},hitCount=0,maxHits=(stats.pierce||0)+1,lastPoint=origin.clone().addScaledVector(dir,Math.min(wp.range,25));
  for(var i=0;i<hits.length;i++){
    var h=hits[i],en=findEnemyRoot(h.object);
    if(!en||en.state==='dying')continue;
    var id=en.mesh.uuid;
    if(used[id])continue;
    used[id]=true;hitCount++;
    var z=h.object.userData.z||'body';
    var dmg=stats.damage;
    if(wp.critHead&&z==='head')dmg*=wp.critHead;
    if(skillActive&&skillActive.id==='leon'&&wp.kind==='pistol'&&z==='head')dmg*=1.2;
    if((wp.kind==='pistol'||wp.kind==='smg'||wp.kind==='moldsmg')&&z==='head')dmg*=.58; // 体术启动器，弱化直接爆头斩杀
    if((wp.kind==='pistol'||wp.kind==='smg'||wp.kind==='moldsmg')&&z==='body')dmg*=.9;
    if(wp.kind==='bow'&&wp.bowCharge&&wp.bowCharge>=2.3&&z==='head'&&en.tk==='chainsaw')dmg=9999;
    var staggerMul=(wp.staggerBonus||1);
    if(currentChar==='rose'&&wp.kind==='moldsmg'&&z==='leg'){
      staggerMul*=1.28;
    }
    hitEnemy(en,dmg,h.point,z,staggerMul);
    if(wp.kind==='bow'&&wp.bowCharge&&wp.bowCharge<1.25&&en.state==='chase'&&en.hp>0){
      // 轻蓄力箭作为体术/处决启动器
      doStagger(en,z==='leg'?'leg':'head');
      en.staggerAcc=0;
    }
    lastPoint=h.point.clone();
    if(hitCount>=maxHits)break;
  }
  if(wp.kind==='moldsmg')fxMoldTrail(origin,dir,lastPoint.distanceTo(origin));
  else fxTrail(origin,dir,lastPoint.distanceTo(origin));
}

function fireGrenade(origin,dir,wp,stats){
  var spawn=origin.clone().addScaledVector(dir,.55);
  spawn.y+=.2;
  var mesh=new THREE.Mesh(
    new THREE.SphereGeometry(.11,10,10),
    new THREE.MeshLambertMaterial({color:0x556b2f})
  );
  mesh.position.copy(spawn);
  mesh.castShadow=true;
  scene.add(mesh);

  var vel=dir.clone().multiplyScalar(14);
  vel.y+=4.8;
  projectiles.push({
    kind:'grenade',
    mesh:mesh,
    vel:vel,
    life:1.15,
    layer:playerLayer||'ground',
    damage:stats.damage,
    radius:(wp.blast||3.0)*(skillActive&&skillActive.id==='hunk'?1.2:1)
  });
}

function fireRocket(origin,dir,wp,stats){
  var spawn=origin.clone().addScaledVector(dir,.62);
  spawn.y+=.08;
  var mesh=new THREE.Group();
  var shell=new THREE.Mesh(new THREE.CylinderGeometry(.04,.04,.42,10),new THREE.MeshLambertMaterial({color:0x5e686f}));
  shell.rotation.x=Math.PI/2;
  mesh.add(shell);
  var tip=new THREE.Mesh(new THREE.ConeGeometry(.06,.14,10),new THREE.MeshLambertMaterial({color:0x7d868f}));
  tip.position.z=.26;
  tip.rotation.x=Math.PI/2;
  mesh.add(tip);
  mesh.position.copy(spawn);
  mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0,0,1),dir.clone().normalize());
  mesh.traverse(function(m){if(m.isMesh)m.castShadow=true;});
  scene.add(mesh);
  projectiles.push({
    kind:'rpg',
    mesh:mesh,
    vel:dir.clone().multiplyScalar(24),
    life:1.3,
    layer:playerLayer||'ground',
    damage:stats.damage,
    radius:(wp.blast||4.6)*(skillActive&&skillActive.id==='jill'?1.15:1)
  });
}

function explodeGrenade(point,damage,radius){
  enemies.slice().forEach(function(en){
    if(en.state==='dying')return;
    var center=getEnemyHitCenter(en);
    var d=center.distanceTo(point);
    if(d>radius)return;
    var fall=1-d/Math.max(radius,.001);
    hitEnemy(en,damage*Math.max(.35,fall),center.clone(),'body',1.2);
    var push=en.mesh.position.clone().sub(point);push.y=0;
    if(push.lengthSq()<1e-4)push.set(Math.random()-.5,0,Math.random()-.5);
    push.normalize();en.mesh.position.addScaledVector(push,1.4*fall);
  });
  fxExplosion(point,radius);
  doShake(.30);
}

function slashKnife(wp,stats){
  var p=player.position.clone();
  var sinY=Math.sin(camYaw),cosY=Math.cos(camYaw);
  var fw=new THREE.Vector3(-sinY,0,-cosY);
  var arc=wp.arc||.95,range=wp.range;
  enemies.slice().forEach(function(en){
    if(en.state==='dying')return;
    var to=en.mesh.position.clone().sub(p);to.y=0;
    var d=to.length();
    if(d>range||d<.1)return;
    to.normalize();
    if(fw.dot(to)<arc)return;
    var dmg=stats.damage*(skillActive&&skillActive.id==='krauser'?1.22:1);
    hitEnemy(en,dmg,en.mesh.position.clone().setY(1.0),'body',1.4);
  });
}
function punchGauntlet(wp,stats){
  var p=player.position.clone();
  var sinY=Math.sin(camYaw),cosY=Math.cos(camYaw);
  var fw=new THREE.Vector3(-sinY,0,-cosY);
  var arc=wp.arc||.88,range=wp.range||2.5;
  var target=null,best=1e9;
  enemies.forEach(function(en){
    if(en.state==='dying')return;
    var to=en.mesh.position.clone().sub(p);to.y=0;
    var d=to.length();
    if(d>range||d<.1)return;
    to.normalize();
    if(fw.dot(to)<arc)return;
    if(d<best){best=d;target=en;}
  });
  if(!target)return;
  var hitPos=target.mesh.position.clone().setY(1.0);
  hitEnemy(target,stats.damage,hitPos,'body',2.6);
  // 拳套命中默认打出僵直，形成连段与体术窗口
  if(target&&target.state!=='dying'&&target.hp>0){
    doStagger(target,'head');
    target.staggerAcc=0;
  }
}
function lashMoldWhip(wp,stats){
  var p=player.position.clone();
  var sinY=Math.sin(camYaw),cosY=Math.cos(camYaw);
  var fw=new THREE.Vector3(-sinY,0,-cosY);
  fxMoldWhipArc(p.clone().setY(1.0),fw,wp.range||4.6);
  var arc=wp.arc||.74,range=wp.range||4.6;
  enemies.slice().forEach(function(en){
    if(en.state==='dying')return;
    var to=en.mesh.position.clone().sub(p);to.y=0;
    var d=to.length();
    if(d>range||d<.1)return;
    to.normalize();
    if(fw.dot(to)<arc)return;
    hitEnemy(en,stats.damage,en.mesh.position.clone().setY(1.0),'body',1.35);
    if(en.state!=='dying'&&en.hp>0){
      en.slowTimer=Math.max(en.slowTimer||0,wp.slow||2.0);
      en.slowMul=Math.min(en.slowMul||1,wp.slowMul||.64);
      // 鞭子以减速控场为主，不再默认强制高僵直
      if(d<2.2){
        doStagger(en,'leg');
        en.staggerAcc=0;
      }
    }
  });
}
function fxMoldWhipArc(origin,fw,range){
  var base=fw.clone().normalize();
  var right=new THREE.Vector3(base.z,0,-base.x);
  var seg=8,rad=Math.max(2.8,range||4.2);
  var prev=null;
  for(var i=0;i<=seg;i++){
    var t=i/seg;
    var ang=lerp(-.95,.95,t);
    var dir=base.clone().multiplyScalar(Math.cos(ang)).add(right.clone().multiplyScalar(Math.sin(ang))).normalize();
    var p=origin.clone().addScaledVector(dir,rad*(.46+.54*t));
    p.y+=Math.sin(t*Math.PI)*.45;
    if(prev){
      var mid=prev.clone().lerp(p,.5),d=prev.distanceTo(p);
      var m=new THREE.Mesh(
        new THREE.CylinderGeometry(.035,.055,d,7),
        new THREE.MeshBasicMaterial({color:0x2a1b34,transparent:true,opacity:.95})
      );
      m.position.copy(mid);
      m.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),p.clone().sub(prev).normalize());
      scene.add(m);
      effects.push({mesh:m,life:.14,max:.14});
    }
    prev=p;
  }
}

/* ================================================================
   命中 & 僵直
================================================================ */
function hitEnemy(en,dmg,pt,zone,staggerMul){
  var mult={head:2.5,leg:.8,body:1.0}[zone]||1.0;
  var sm=staggerMul||1;
  var fd=Math.floor(dmg*mult);
  en.hp-=fd;en.staggerAcc+=fd*sm;
  fxHit(pt,zone==='head'?0xff6600:0xff2200,zone==='head'?9:5);
  if(zone==='head')showZone('HEADSHOT!','#FF6600');
  else if(zone==='leg')showZone('LEG SHOT','#88CCFF');
  if(en.hp<=0){
    // 关键修复：普通射击爆头击杀也走 headshot 死亡姿态，避免模型下沉观感
    killEnemy(en,{style:zone==='head'?'headshot':'normal'});
    return;
  }
  if(en.staggerAcc>=en.data.staggerTh&&en.state==='chase'){
    en.staggerAcc=0;doStagger(en,zone);
  }
}

function doStagger(en,zone){
  en.state=(zone==='leg')?'downed':'stagger';en.staggerZone=zone;
  var s=(en.data&&en.data.scale)||1;
  var body=en.mesh.children[0],head=en.mesh.children[1],lA=en.mesh.children[2],rA=en.mesh.children[3],lL=en.mesh.children[4],rL=en.mesh.children[5];
  en.mesh.rotation.x=0;
  if(zone==='head'){
    en.groundOffset=.06*s;
    en.staggerTimer=2.8;
    en.mesh.position.y=en.groundOffset;
    if(body)body.rotation.x=.2;
    if(head)head.rotation.x=-.15;
    if(lA){lA.rotation.z=1.1;lA.rotation.x=-1.0;}
    if(rA){rA.rotation.z=-1.1;rA.rotation.x=-1.0;}
  }else{
    // 失衡跪姿：抬高底座，避免大体型敌人陷地
    en.groundOffset=.22*s;
    en.staggerTimer=3.6;
    en.mesh.position.y=en.groundOffset;
    if(body)body.rotation.x=.18;
    if(head)head.rotation.x=-.2;
    if(lL)lL.rotation.x=.95;
    if(rL)rL.rotation.x=.8;
    if(lA){lA.rotation.x=-.65;lA.rotation.z=.18;}
    if(rA){rA.rotation.x=-.55;rA.rotation.z=-.12;}
  }
}

function resetEnemyPose(en){
  en.groundOffset=0;
  en.mesh.rotation.x=0;en.mesh.position.y=0;
  var body=en.mesh.children[0],head=en.mesh.children[1],lA=en.mesh.children[2],rA=en.mesh.children[3],lL=en.mesh.children[4],rL=en.mesh.children[5];
  if(body)body.rotation.set(0,0,0);
  if(head)head.rotation.set(0,0,0);
  if(lA){lA.rotation.z=0;lA.rotation.x=0;}
  if(rA){rA.rotation.z=0;rA.rotation.x=0;}
  if(lL)lL.rotation.x=0;if(rL)rL.rotation.x=0;
}

function rewardChrisSkillOnKill(en){
  if(!skillActive||skillActive.id!=='chris'||currentChar!=='chris')return;
  var heal=en&&en.tk==='chainsaw'?18:en&&en.tk==='shielder'?12:8;
  playerHP=Math.min(playerMaxHP,playerHP+heal);
  var ws=CHARS[currentChar]&&CHARS[currentChar].weapons?CHARS[currentChar].weapons:[];
  ws.forEach(function(w){
    if(!w||w.ammo===-1)return;
    var maxA=AMMO_MAX[w.name]||Math.max((w.ammo||0)+(w.reserve||0),1);
    var clip=w.mag||AMMO_CLIP[w.name]||Math.max(w.ammo||1,1);
    var gain=en&&en.tk==='chainsaw'?Math.max(3,Math.ceil(clip*.24)):Math.max(2,Math.ceil(clip*.14));
    var total=Math.min(maxA,(w.ammo||0)+(w.reserve||0)+gain);
    w.ammo=Math.min(clip,total);
    w.reserve=Math.max(0,total-w.ammo);
  });
  refreshHPHUD();
  refreshWeaponHUD();
}

function killEnemy(en,opt){
  opt=opt||{};
  en.state='dying';en.hp=0;
  en.deathStyle=(opt.style==='headshot')?'headshot':'normal';
  en.deathSway=0;
  en.groundOffset=0;
  en.staggerTimer=0;en.staggerAcc=0;en.staggerZone=null;
  if(finishTarget===en){finishTarget=null;canFinish=false;document.getElementById('finisher-prompt').style.display='none';}
  if(executeTarget===en){executeTarget=null;canExecute=false;document.getElementById('finisher-prompt').style.display='none';}
  rewardChrisSkillOnKill(en);
  var mult=1+combo*.1;
  score+=Math.floor(en.data.score*mult);kills++;combo++;comboTimer=5.0;
  var bon=en.tk==='chainsaw'?20:en.tk==='shielder'?10:5;
  timeLeft=Math.min(timeLeft+bon,180);showTimeAdd('+'+bon+'s');
  refreshScoreHUD();doShake(.25);
  var s=(en.data&&en.data.scale)||1;
  // 先回正骨骼，再套死亡姿态；避免根节点翻转导致埋地
  resetEnemyPose(en);
  en.mesh.rotation.x=0;
  if(opt.style==='headshot'){
    en.mesh.position.y=.38*s;
    var b=en.mesh.children&&en.mesh.children[0];
    var h=en.mesh.children&&en.mesh.children[1];
    var lA=en.mesh.children&&en.mesh.children[2];
    var rA=en.mesh.children&&en.mesh.children[3];
    if(b){b.rotation.x=0;b.rotation.y=0;b.rotation.z=0;}
    if(h){h.rotation.x=-.20;h.rotation.y=0;}
    // 抱头不动
    if(lA){lA.rotation.x=-1.40;lA.rotation.z=.65;}
    if(rA){rA.rotation.x=-1.40;rA.rotation.z=-.65;}
  }else{
    en.mesh.position.y=.30*s;
    var b2=en.mesh.children&&en.mesh.children[0];
    var h2=en.mesh.children&&en.mesh.children[1];
    if(b2)b2.rotation.x=.26;
    if(h2)h2.rotation.x=-.38;
  }
  setTimeout(function(){removeEnemy(en);},opt.keepMs||1000);
}

/* ================================================================
   体术
================================================================ */
function isValidFinisherTarget(en){
  if(!en||!en.mesh)return false;
  if(enemies.indexOf(en)===-1)return false;
  if(en.state!=='stagger')return false;
  if(en.hp<=0||en.state==='dying')return false;
  if(!en.staggerZone||en.staggerTimer<=0)return false;
  return true;
}

function isValidExecuteTarget(en){
  if(!en||!en.mesh)return false;
  if(enemies.indexOf(en)===-1)return false;
  var canExecState=false;
  if(en.state==='downed'){
    canExecState=true;
  }else if(en.state==='stagger'){
    var weakHp=en.hp<=en.maxHp*.7;
    var exposed=(en.staggerZone==='head'||en.staggerZone==='leg');
    canExecState=exposed||weakHp;
  }
  if(!canExecState)return false;
  if(en.hp<=0||en.state==='dying')return false;
  if(en.staggerTimer<=0)return false;
  return true;
}

function isBehindEnemy(en){
  if(!player||!en||!en.mesh)return false;
  var toPlayer=player.position.clone().sub(en.mesh.position);toPlayer.y=0;
  if(toPlayer.lengthSq()<1e-5)return false;
  toPlayer.normalize();
  var fwd=new THREE.Vector3(Math.sin(en.mesh.rotation.y),0,Math.cos(en.mesh.rotation.y));
  return fwd.dot(toPlayer)<-.05;
}

function tryExecute(){
  if(!canExecute||!executeTarget||isFinishing)return false;
  if(!isValidExecuteTarget(executeTarget)){
    canExecute=false;executeTarget=null;document.getElementById('finisher-prompt').style.display='none';
    return false;
  }
  var en=executeTarget,cfg=getExecuteCfg(currentChar);
  isFinishing=true;

  var fwd=new THREE.Vector3(Math.sin(en.mesh.rotation.y),0,Math.cos(en.mesh.rotation.y));
  player.position.copy(en.mesh.position).sub(fwd.multiplyScalar(1.05));
  camYaw=Math.atan2(-fwd.x,-fwd.z);
  player.rotation.y=camYaw+Math.PI;

  var dur=cfg.wu+cfg.st+cfg.re;
  finAnim={
    t:0,dur:dur,cfg:cfg,charId:currentChar,enemy:en,dmgDone:false,
    startPos:player.position.clone(),isExecution:true,hitAt:cfg.hitAt,fx1:false,fx2:false,fx3:false,enemyStartPos:en.mesh.position.clone(),moldTick:0
  };
  camAnim={dur:dur,hitAt:cfg.hitAt,snapFOV:false,profile:cfg.cam,isExecution:true};
  canExecute=false;executeTarget=null;canFinish=false;finishTarget=null;
  document.getElementById('finisher-prompt').style.display='none';
  return true;
}

function tryFinisher(){
  if(!canFinish||!finishTarget||isFinishing)return;
  if(!isValidFinisherTarget(finishTarget)){
    canFinish=false;finishTarget=null;document.getElementById('finisher-prompt').style.display='none';
    return;
  }
  var en=finishTarget,cfg=FIN_CFG[currentChar];
  isFinishing=true;

  if(currentChar==='krauser'){
    var to=new THREE.Vector3().subVectors(en.mesh.position,player.position).normalize();
    player.position.copy(en.mesh.position).sub(to.multiplyScalar(1.4));
  }
  if(currentChar==='wesker'){
    var ed=new THREE.Vector3(Math.sin(en.mesh.rotation.y),0,Math.cos(en.mesh.rotation.y));
    player.position.copy(en.mesh.position).sub(ed.multiplyScalar(1.5));
    player.rotation.y=en.mesh.rotation.y;
  }

  var dur=cfg.wu+cfg.st+cfg.re;
  finAnim={
    t:0,dur:dur,cfg:cfg,charId:currentChar,enemy:en,dmgDone:false,
    startPos:player.position.clone()
  };
  camAnim={dur:dur,hitAt:cfg.wu,snapFOV:false,profile:cfg.cam};

  canFinish=false;finishTarget=null;
  document.getElementById('finisher-prompt').style.display='none';
}

function tickFinAnim(dt){
  if(!finAnim)return;
  var fa=finAnim,cfg=fa.cfg;
  fa.t+=dt;
  var phase,lt;
  if(fa.t<cfg.wu){phase='wu';lt=fa.t/cfg.wu;}
  else if(fa.t<cfg.wu+cfg.st){phase='st';lt=(fa.t-cfg.wu)/cfg.st;}
  else{phase='re';lt=Math.min((fa.t-cfg.wu-cfg.st)/cfg.re,1);}

  if(fa.isExecution){
    updateExecuteMotion(fa,phase,lt);
    applyExecutePose(fa.charId,phase,lt);
    applyExecuteEnemyPose(fa,phase,lt);
    var p=clamp01(fa.t/Math.max(fa.dur,.001));
    if(fa.charId==='leon'){
      if(!fa.fx1&&p>.26&&fa.enemy&&fa.enemy.mesh){
        fa.fx1=true;
        fxHit(fa.enemy.mesh.position.clone().setY(1.0),0xff8844,8);
      }
    }else if(fa.charId==='krauser'){
      if(!fa.fx1&&p>.22&&fa.enemy&&fa.enemy.mesh){
        fa.fx1=true;
        var a1=fa.enemy.mesh.position.clone().setY(.86);
        var o1=player.position.clone().setY(1.18);
        fxTrail(o1,new THREE.Vector3().subVectors(a1,o1).normalize(),o1.distanceTo(a1));
        fxHit(fa.enemy.mesh.position.clone().setY(.86),0x88d7ff,10);
      }
      if(!fa.fx2&&p>.42&&fa.enemy&&fa.enemy.mesh){
        fa.fx2=true;
        var a2=fa.enemy.mesh.position.clone().setY(.92);
        var o2=player.position.clone().setY(1.12);
        fxTrail(o2,new THREE.Vector3().subVectors(a2,o2).normalize(),o2.distanceTo(a2));
        fxHit(fa.enemy.mesh.position.clone().setY(.92),0x88d7ff,10);
      }
    }else if(fa.charId==='wesker'){
      if(phase==='st'&&fa.enemy&&fa.enemy.mesh){
        if(p<.62){
          var jabPulse=Math.sin(p*Math.PI*22.0);
          if(jabPulse>.82){
            fxHit(fa.enemy.mesh.position.clone().setY(.96),0xff5533,6);
          }
        }else if(!fa.fx1&&p>.78){
          fa.fx1=true;
          var from=player.position.clone().setY(1.05);
          var to=fa.enemy.mesh.position.clone().setY(.96);
          fxTrail(from,new THREE.Vector3().subVectors(to,from).normalize(),from.distanceTo(to));
        }
      }
    }else if(fa.charId==='ada'){
      if(phase==='st'&&fa.enemy&&fa.enemy.mesh){
        var chest=fa.enemy.mesh.position.clone().setY(1.00);
        var head=fa.enemy.mesh.position.clone().setY(1.24);
        var py=player.position.clone();
        var yaw=player.rotation.y||0;
        var pfwd=new THREE.Vector3(Math.sin(yaw),0,Math.cos(yaw));
        var pright=new THREE.Vector3(pfwd.z,0,-pfwd.x);
        if(!fa.fx1&&p>.18){
          fa.fx1=true;
          // 第一脚：射线起点放在前侧踢击脚，避免从角色中心穿出
          var foot=py.clone().addScaledVector(pright,.24).addScaledVector(pfwd,.40);
          foot.y=py.y+.72;
          var kdir=new THREE.Vector3().subVectors(chest,foot).normalize();
          fxTrail(foot,kdir,foot.distanceTo(chest));
          fxExplosion(chest.clone(),2.0);
          fxHit(chest.clone(),0xffaa66,10);
        }
        if(p>.34&&p<.78&&fa.t>(fa.hookTick||0)){
          fa.hookTick=fa.t+.06;
          // 钩索起点放在右手附近，避免“裆部射线”
          var hookFrom=py.clone().addScaledVector(pright,.30).addScaledVector(pfwd,.20);
          hookFrom.y=py.y+1.28;
          var hookTo=head.clone().add(new THREE.Vector3(0,.22,0));
          fxHookCable(hookFrom,hookTo);
        }
        if(!fa.fx2&&p>.86){
          fa.fx2=true;
          // 第二脚：射线起点放在回摆腿路径
          var foot2=py.clone().addScaledVector(pright,-.20).addScaledVector(pfwd,.34);
          foot2.y=py.y+.80;
          var kdir2=new THREE.Vector3().subVectors(head,foot2).normalize();
          fxTrail(foot2,kdir2,foot2.distanceTo(head));
          fxExplosion(head.clone(),2.8);
          fxHit(head.clone(),0xff8844,14);
        }
      }
    }else if(fa.charId==='jill'){
      if(phase==='wu'&&fa.enemy&&fa.enemy.mesh&&!fa.fx1&&p>.20){
        fa.fx1=true;
        fxHit(fa.enemy.mesh.position.clone().setY(1.0),0xffaa55,12);
      }else if(phase==='st'&&fa.enemy&&fa.enemy.mesh){
        var ec=fa.enemy.mesh.position.clone().setY(1.02);
        if(!fa.fx2&&p>.62){
          fa.fx2=true;
          fxHit(ec.clone(),0xffcc99,10);
        }
        if(!fa.fx3&&p>.86){
          fa.fx3=true;
          var ep=player.position.clone().setY(1.02);
          var dir3=new THREE.Vector3().subVectors(ec,ep).normalize();
          fxTrail(ep,dir3,ep.distanceTo(ec));
        }
      }
    }else if(fa.charId==='chris'){
      if(phase==='st'&&fa.enemy&&fa.enemy.mesh){
        var cp=fa.enemy.mesh.position.clone().setY(1.02);
        if(!fa.fx1&&p>.24){
          fa.fx1=true;
          fxHit(cp.clone().setY(1.18),0xffaa66,11); // 头槌
        }
        if(!fa.fx2&&p>.54){
          fa.fx2=true;
          fxHit(cp.clone().setY(1.0),0xff9955,9);   // 踉跄
        }
        if(!fa.fx3&&p>.84){
          fa.fx3=true;
          var fist=player.position.clone().setY(1.05);
          var pdir=new THREE.Vector3().subVectors(cp,fist).normalize();
          fxPunchWave(fist.clone().addScaledVector(pdir,.55),pdir);
          fxExplosion(cp.clone(),3.1);                // 拳风扩散
        }
      }
    }else if(fa.charId==='rose'){
      if(phase==='st'&&fa.enemy&&fa.enemy.mesh){
        var rp=fa.enemy.mesh.position.clone().setY(.92);
        if(fa.t>(fa.moldTick||0)){
          fa.moldTick=fa.t+.07;
          var left=player.position.clone().add(new THREE.Vector3(-.28,.98,.0));
          var right=player.position.clone().add(new THREE.Vector3(.28,.98,.0));
          var bindL=rp.clone().add(new THREE.Vector3(-.18,.2,0));
          var bindR=rp.clone().add(new THREE.Vector3(.18,.2,0));
          fxMoldTentacle(left,bindL);
          fxMoldTentacle(right,bindR);
          fxMoldVortex(rp.clone().setY(.08),1.08);
        }
        if(!fa.fx1&&p>.22){
          fa.fx1=true;
          fxHit(rp.clone().setY(1.1),0x7f5dff,11); // 链条缠绕
        }
        if(!fa.fx2&&p>.52){
          fa.fx2=true;
          fxMoldVortex(rp.clone().setY(.08),1.26);
          fxHit(rp.clone().setY(.30),0x4a356b,14);
        }
        if(!fa.fx3&&p>.82){
          fa.fx3=true;
          fxMoldVortex(rp.clone().setY(.06),1.52);  // 下沉爆发
        }
      }
    }
    if(!fa.dmgDone&&fa.t>=(fa.hitAt||cfg.wu)&&fa.enemy&&fa.enemy.mesh&&enemies.indexOf(fa.enemy)!==-1&&fa.enemy.state!=='dying'&&fa.enemy.hp>0){
      fa.dmgDone=true;
      doShake(.78);
      if(camAnim)camAnim.snapFOV=true;
      fxFinisher(fa.enemy.mesh.position.clone().setY(1));
      if(fa.charId==='wesker'){
        // 血雾终结：叠加多段血爆
        var bp=fa.enemy.mesh.position.clone();
        fxHit(bp.clone().setY(1.02),0xff2200,16);
        fxHit(bp.clone().setY(.86),0xff3300,14);
        fxHit(bp.clone().setY(1.20),0xff1100,10);
        // Wesker 穿身后目标应立即“蒸发”，避免看到残留躯体
        fa.enemy.mesh.visible=false;
      }else if(fa.charId==='ada'){
        // 二段踢终结：踢飞+冲击爆
        var hp=fa.enemy.mesh.position.clone().setY(1.12);
        var kickDir=new THREE.Vector3().subVectors(fa.enemy.mesh.position,player.position);kickDir.y=0;
        if(kickDir.lengthSq()<1e-6)kickDir.set(0,0,1);
        kickDir.normalize();
        fxEnemyLaunchModel(fa.enemy,kickDir);
        fa.enemy.mesh.position.addScaledVector(kickDir,1.20);
        fa.enemy.mesh.position.y=Math.max(fa.enemy.mesh.position.y,.72);
        fxPunchWave(hp.clone().addScaledVector(kickDir,.44),kickDir);
        fxExplosion(hp.clone(),3.6);
        fxHit(hp.clone().setY(1.24),0xff2200,16);
        fa.enemy.mesh.visible=false;
      }else if(fa.charId==='jill'){
        var rp=fa.enemy.mesh.position.clone().setY(1.05);
        var shotFrom=player.position.clone().setY(1.08);
        fxTrail(shotFrom,new THREE.Vector3().subVectors(rp,shotFrom).normalize(),shotFrom.distanceTo(rp));
        fxExplosion(rp.clone(),5.8);
        fxHit(rp.clone().setY(1.2),0x99e6ff,20);
        fa.enemy.mesh.visible=false;
      }else if(fa.charId==='chris'){
        var cp2=fa.enemy.mesh.position.clone().setY(1.0);
        var fist2=player.position.clone().setY(1.06);
        var blowDir=new THREE.Vector3().subVectors(cp2,fist2);blowDir.y=0;
        if(blowDir.lengthSq()<1e-6)blowDir.set(0,0,1);
        blowDir.normalize();
        fxEnemyLaunchModel(fa.enemy,blowDir);
        fa.enemy.mesh.position.addScaledVector(blowDir,1.35);
        fa.enemy.mesh.position.y=Math.max(fa.enemy.mesh.position.y,.74);
        fxPunchWave(fist2.clone().addScaledVector(blowDir,.62),blowDir);
        fxExplosion(cp2.clone(),4.6);
        fxHit(cp2.clone().setY(1.16),0xff8844,16);
        fa.enemy.mesh.visible=false;
      }else if(fa.charId==='rose'){
        // Rose 终结进入 sinkState：0.6~0.9s 下沉，没入后再结算击杀
        if(!fa.enemy.sinkState){
          var s=(fa.enemy.data&&fa.enemy.data.scale)||1;
          fa.enemy.sinkState={
            t:0,
            dur:.78,
            startY:fa.enemy.mesh.position.y,
            targetY:-1.05*s,
            x:fa.enemy.mesh.position.x,
            z:fa.enemy.mesh.position.z,
            heal:cfg.heal||24,
            done:false
          };
          fxMoldVortex(fa.enemy.mesh.position.clone().setY(.05),1.64);
        }
      }
      if(fa.charId!=='rose'){
      killEnemy(fa.enemy,{style:(fa.charId==='chris'||fa.charId==='rose')?'normal':'headshot',keepMs:fa.charId==='jill'?180:(fa.charId==='wesker'?80:(fa.charId==='chris'||fa.charId==='rose'?120:1450))});
        playerHP=Math.min(playerMaxHP,playerHP+(cfg.heal||24));
        refreshHPHUD();
        showZone('EXECUTION +'+(cfg.heal||24)+' HP','#8CF2A0');
        fa.enemy=null;
      }
      if(fa.charId==='hunk'){
        // 折颈后立即黑屏，再平滑切回 HUNK 越肩视角
        triggerHunkExecutionCut();
        fa.t=fa.dur;
      }
    }
  }else{
    updateFinisherMotion(fa,phase,lt);
    applyFinPose(fa.charId,phase,lt);
    if(phase==='st'&&!fa.dmgDone&&fa.enemy&&isValidFinisherTarget(fa.enemy)){
      fa.dmgDone=true;
      doShake(.55);
      if(camAnim)camAnim.snapFOV=true;
      fxFinisher(fa.enemy.mesh.position.clone().setY(1));
      applyFinisherImpact(fa);
      rewardAmmoFromFinisher();
      showZone('MELEE +AMMO','#ffd97a');
      fa.enemy=null;
    }
  }

  if(fa.t>=fa.dur){
    resetPlayerPose();
    finAnim=null;isFinishing=false;camAnim=null;
    if(camera){camera.fov=70;camera.up.set(0,1,0);camera.updateProjectionMatrix();}
  }
}

function lerp(a,b,t){return a+(b-a)*t;}
function eOut(t){return 1-Math.pow(1-t,2);}
function eIn(t){return t*t;}
function clamp01(t){return Math.max(0,Math.min(1,t));}
function getCinematicTimeScale(){
  if(!isFinishing||!finAnim||!finAnim.isExecution)return 1;
  if(finAnim.charId==='ada'){
    var ad=Math.max(finAnim.dur,.001);
    var ap=clamp01(finAnim.t/ad);
    var ah=clamp01((finAnim.hitAt||ad*.66)/ad);
    if(ap<ah*.26)return .66; // 起手踢
    if(ap<ah*.76){
      var hold=(ap-ah*.26)/Math.max(ah*.50,.001); // 摆荡追击
      return lerp(.56,.22,eOut(clamp01(hold)));
    }
    if(ap<ah)return .10; // 二段踢瞬间
    var ar=(ap-ah)/Math.max(1-ah,.001);
    return lerp(.24,.80,eOut(clamp01(ar)));
  }
  if(finAnim.charId==='jill'){
    var jd=Math.max(finAnim.dur,.001);
    var jp=clamp01(finAnim.t/jd);
    var jh=clamp01((finAnim.hitAt||jd*.7)/jd);
    if(jp<jh*.48)return .70;
    if(jp<jh*.90){
      var holdJ=(jp-jh*.48)/Math.max(jh*.42,.001);
      return lerp(.58,.26,eOut(clamp01(holdJ)));
    }
    if(jp<jh)return .18;
    var jr=(jp-jh)/Math.max(1-jh,.001);
    return lerp(.24,.84,eOut(clamp01(jr)));
  }
  if(finAnim.charId==='chris'){
    var cd=Math.max(finAnim.dur,.001);
    var cp=clamp01(finAnim.t/cd);
    var ch=clamp01((finAnim.hitAt||cd*.72)/cd);
    if(cp<ch*.40)return .72;
    if(cp<ch*.86){
      var holdC=(cp-ch*.40)/Math.max(ch*.46,.001);
      return lerp(.62,.30,eOut(clamp01(holdC)));
    }
    if(cp<ch)return .18;
    var cr=(cp-ch)/Math.max(1-ch,.001);
    return lerp(.26,.82,eOut(clamp01(cr)));
  }
  if(finAnim.charId==='rose'){
    var rd=Math.max(finAnim.dur,.001);
    var rp=clamp01(finAnim.t/rd);
    var rh=clamp01((finAnim.hitAt||rd*.72)/rd);
    if(rp<rh*.46)return .66;
    if(rp<rh*.90){
      var holdR=(rp-rh*.46)/Math.max(rh*.44,.001);
      return lerp(.56,.22,eOut(clamp01(holdR)));
    }
    if(rp<rh)return .14;
    var rr=(rp-rh)/Math.max(1-rh,.001);
    return lerp(.22,.80,eOut(clamp01(rr)));
  }
  if(finAnim.charId==='wesker'){
    var wd=Math.max(finAnim.dur,.001);
    var wp=clamp01(finAnim.t/wd);
    var wh=clamp01((finAnim.hitAt||wd*.66)/wd);
    // 特写前 0.05s 微停顿：穿身后、正脸特写前的电影节拍
    if(wp>wh*.935&&wp<wh*.955)return .07;
    if(wp<wh*.58)return .74;
    if(wp<wh*.88){
      var holdW=(wp-wh*.58)/Math.max(wh*.30,.001);
      return lerp(.64,.34,eOut(clamp01(holdW)));
    }
    if(wp<wh)return .18;
    var wr=(wp-wh)/Math.max(1-wh,.001);
    return lerp(.26,.82,eOut(clamp01(wr)));
  }
  if(finAnim.charId!=='hunk')return 1;
  var dur=Math.max(finAnim.dur,.001);
  var prog=clamp01(finAnim.t/dur);
  var hitProg=clamp01((finAnim.hitAt||dur*.66)/dur);
  if(prog<hitProg*.58){
    // 逼近阶段：中度慢镜
    return .62;
  }
  if(prog<hitProg*.90){
    // 行刑前停顿：更慢
    var hold=(prog-hitProg*.58)/Math.max(hitProg*.32,.001);
    return lerp(.58,.34,eOut(clamp01(hold)));
  }
  if(prog<hitProg){
    // 拧脖瞬间：极慢
    return .24;
  }
  // 收尾回正
  var rec=(prog-hitProg)/Math.max(1-hitProg,.001);
  return lerp(.30,.78,eOut(clamp01(rec)));
}
function getExecuteCfg(charId){
  var base=EXEC_CFG.default||EXEC_CFG;
  var spec=(EXEC_CFG&&EXEC_CFG[charId])?EXEC_CFG[charId]:null;
  var cfg=Object.assign({},base,spec||{});
  cfg.cam=Object.assign({},base.cam||{},(spec&&spec.cam)||{});
  if(cfg.hitAt==null)cfg.hitAt=cfg.wu||.3;
  return cfg;
}
function getAmmoRarityFactor(w){
  if(!w)return 1;
  if(w.kind==='rpg')return .28;
  if(w.kind==='rifle')return .74;
  if(w.kind==='moldsmg')return .8;
  if(w.kind==='grenade')return .34;
  if(w.kind==='sniper')return .42;
  if(w.kind==='shotgun')return .52;
  if(w.kind==='bow')return .62;
  if(w.kind==='smg')return .82;
  if(w.kind==='pistol')return 1.0;
  return .85;
}
function rewardAmmoFromFinisher(){
  if(!currentChar)return;
  var ws=CHARS[currentChar].weapons;
  ws.forEach(function(w){
    if(w.ammo===-1)return;
    var maxA=AMMO_MAX[w.name]||Math.max((w.ammo||0)+(w.reserve||0),1);
    var nowTotal=(w.ammo||0)+(w.reserve||0);
    var missing=Math.max(0,maxA-nowTotal);
    if(missing<=0)return;
    // 动态补给：稀有度越高、单发伤害越高，基础补给越低；弹药越少，返还越多
    var rarity=getAmmoRarityFactor(w);
    var dmg=w.damage||12;
    var dmgFactor=clamp01(20/Math.max(dmg,1))*.75+.35;
    var scarcity=1+Math.pow(missing/Math.max(maxA,1),1.2)*2.0;
    var base=maxA*.055;
    var gain=Math.max(1,Math.ceil(base*rarity*dmgFactor*scarcity));
    // 体术补给仅补备用弹，不自动填充当前弹匣
    w.reserve=Math.min(maxA-(w.ammo||0),Math.max(0,w.reserve||0)+gain);
  });
  refreshWeaponHUD();
}
function lerpAngle(a,b,t){
  var d=((b-a+Math.PI)%(Math.PI*2))-Math.PI;
  return a+d*t;
}

function applyFinisherImpact(fa){
  if(!fa||!fa.cfg)return;
  var c=CHARS[fa.charId],aoe=fa.cfg.aoe||{radius:2.6,falloff:.5,knock:2.2};
  var center=(fa.enemy&&fa.enemy.mesh)?fa.enemy.mesh.position.clone():player.position.clone();
  if(fa.charId==='rose'&&player){
    var pf=getPlayerPlanarForward();
    center=player.position.clone().addScaledVector(pf,1.25);
  }
  enemies.slice().forEach(function(en){
    if(en.state==='dying')return;
    var d=en.mesh.position.distanceTo(center);
    if(en!==fa.enemy&&d>aoe.radius)return;

    var dmg;
    if(en===fa.enemy)dmg=c.finisherDmg;
    else{
      var edge=clamp01(1-d/Math.max(aoe.radius,.01));
      dmg=Math.max(c.finisherDmg*aoe.falloff*edge,c.finisherDmg*.2);
    }

    // F 体术高伤害但不应从满血直接秒杀；已残血目标仍可被击杀
    var capRatio=en===fa.enemy?.72:.56;
    var cap=Math.max(34,en.maxHp*capRatio);
    dmg=Math.min(dmg,cap);
    en.hp-=dmg;
    if(en.hp<=0){killEnemy(en);return;}

    en.state='stagger';
    en.staggerTimer=Math.max(en.staggerTimer||0,(fa.charId==='rose'?1.85:1.45));
    var push=en.mesh.position.clone().sub(center);push.y=0;
    if(push.lengthSq()<1e-4)push.set(Math.random()-.5,0,Math.random()-.5);
    push.normalize();
    var pushDist=aoe.knock;
    if(fa.charId==='rose'){
      var edgeR=clamp01(1-d/Math.max(aoe.radius,.01));
      pushDist=Math.max(3.2,aoe.knock*Math.max(.58,edgeR));
      if(en!==fa.enemy)pushDist*=1.15;
    }
    var layer=en.layer||'ground';
    var pushDelta=push.clone().multiplyScalar(pushDist);
    var next=moveWithMapCollision(en.mesh.position,pushDelta,ENEMY_COLLIDER_R,layer);
    var moved=next.distanceTo(en.mesh.position);
    if(fa.charId==='rose'&&moved<pushDist*.32){
      // 墙角兜底：主方向被挡时，加一点横向滑推，保证“震退”可见
      var side=new THREE.Vector3(push.z,0,-push.x).multiplyScalar((Math.random()<.5?-1:1)*pushDist*.55);
      next=moveWithMapCollision(en.mesh.position,pushDelta.add(side),ENEMY_COLLIDER_R,layer);
    }
    en.mesh.position.copy(next);
    fxHit(en.mesh.position.clone().setY(.9),0xffcc66,7);
  });
}

function updateFinisherMotion(fa,phase,t){
  if(!player||!fa||!fa.enemy||!isValidFinisherTarget(fa.enemy))return;
  var ep=fa.enemy.mesh.position;
  var to=new THREE.Vector3().subVectors(ep,player.position);to.y=0;
  var dist=to.length();
  if(dist>.001){
    var needYaw=Math.atan2(-to.x,-to.z);
    camYaw=lerpAngle(camYaw,needYaw,phase==='wu'?.24:.14);
    player.rotation.y=camYaw+Math.PI;
  }
  if(dist<.001)return;
  to.normalize();

  if(fa.charId==='leon'||fa.charId==='jill'){
    if(phase==='wu'&&dist>1.1)player.position.addScaledVector(to,Math.min(dist-1.1,.22));
    if(phase==='st')player.position.addScaledVector(to,.05+(.06*eOut(t)));
  }else if(fa.charId==='chris'){
    if(phase==='wu'&&dist>1.02)player.position.addScaledVector(to,Math.min(dist-1.02,.34));
    if(phase==='st')player.position.addScaledVector(to,.09+(.07*eOut(t)));
  }else if(fa.charId==='krauser'){
    if(phase==='wu'&&dist>.95)player.position.addScaledVector(to,Math.min(dist-.95,.55));
    if(phase==='st')player.position.addScaledVector(to,.11);
  }else if(fa.charId==='wesker'){
    if(phase==='wu'&&dist>1.0)player.position.addScaledVector(to,Math.min(dist-1.0,.35));
    if(phase==='st')player.position.addScaledVector(to,.07);
  }else if(fa.charId==='ada'){
    // 处决起手：快速贴近锁位，爆发段不做额外前顶
    if(phase==='wu'&&dist>1.08)player.position.addScaledVector(to,Math.min(dist-1.08,.72));
    if(phase==='st'&&t<.72)player.position.addScaledVector(to,.05+(.03*eOut(t)));
  }else if(fa.charId==='rose'){
    if(phase==='wu'&&dist>1.62)player.position.addScaledVector(to,Math.min(dist-1.62,.16));
    if(phase==='st')player.position.addScaledVector(to,.01);
  }else{
    if(phase==='wu'&&dist>.85)player.position.addScaledVector(to,Math.min(dist-.85,.28));
    if(phase==='st')player.position.addScaledVector(to,.04);
  }
}

function updateExecuteMotion(fa,phase,t){
  if(!player||!fa||!fa.enemy||!isValidExecuteTarget(fa.enemy))return;
  var ep=fa.enemy.mesh.position.clone();
  var fwd=new THREE.Vector3(Math.sin(fa.enemy.mesh.rotation.y),0,Math.cos(fa.enemy.mesh.rotation.y));
  var right=new THREE.Vector3(fwd.z,0,-fwd.x);
  var desired=ep.clone().sub(fwd.clone().multiplyScalar(1.02));
  if(fa.charId==='leon'){
    if(phase==='wu'){
      desired=ep.clone().sub(fwd.clone().multiplyScalar(1.28)).addScaledVector(right,.22);
    }else if(phase==='st'){
      if(t<.58){
        var r=t/.58;
        desired=ep.clone()
          .sub(fwd.clone().multiplyScalar(1.10-.14*r))
          .addScaledVector(right,.22+1.02*eOut(r));
      }else{
        var a=(t-.58)/.42;
        desired=ep.clone()
          .sub(fwd.clone().multiplyScalar(1.00+.24*a))
          .addScaledVector(right,lerp(1.24,.18,eOut(a)));
      }
    }else{
      desired=ep.clone().sub(fwd.clone().multiplyScalar(1.18)).addScaledVector(right,.10);
    }
  }else if(fa.charId==='krauser'){
    if(phase==='wu'){
      desired=ep.clone().sub(fwd.clone().multiplyScalar(1.40)).addScaledVector(right,.45);
    }else if(phase==='st'){
      if(t<.30){
        desired=ep.clone().sub(fwd.clone().multiplyScalar(1.28)).addScaledVector(right,.85);
      }else if(t<.58){
        var sw=(t-.30)/.28;
        desired=ep.clone().sub(fwd.clone().multiplyScalar(1.24)).addScaledVector(right,lerp(.85,-.78,sw));
      }else{
        var close=(t-.58)/.42;
        desired=ep.clone().sub(fwd.clone().multiplyScalar(lerp(1.24,.78,eOut(close)))).addScaledVector(right,lerp(-.78,.08,eOut(close)));
      }
    }else{
      desired=ep.clone().sub(fwd.clone().multiplyScalar(1.05)).addScaledVector(right,.06);
    }
  }else if(fa.charId==='wesker'){
    var ringR=1.18;
    if(phase==='wu'){
      desired=ep.clone().sub(fwd.clone().multiplyScalar(1.42)).addScaledVector(right,.62);
    }else if(phase==='st'){
      if(t<.62){
        // 围绕目标高速旋转连拳
        var spin=t/.62;
        var angle=(spin*Math.PI*4.8)+(Math.PI*.35);
        var radius=ringR+(Math.sin(spin*Math.PI*6)*.08);
        desired=ep.clone().add(new THREE.Vector3(Math.cos(angle)*radius,0,Math.sin(angle)*radius));
      }else if(t<.84){
        // 折返到起手点
        var backT=eOut((t-.62)/.22);
        desired=ep.clone().sub(fwd.clone().multiplyScalar(1.10)).lerp(fa.startPos,backT);
      }else{
        // 终结突进：从目标中线穿身而过（不是停在身前）
        var dashT=(t-.84)/.16;
        var eased=dashT<.58?Math.pow(dashT/.58,3)*.25:(.25+eOut((dashT-.58)/.42)*.75);
        desired=fa.startPos.clone().lerp(ep.clone().add(fwd.clone().multiplyScalar(1.18)),eased);
      }
    }else{
      desired=ep.clone().sub(fwd.clone().multiplyScalar(1.06)).addScaledVector(right,.05);

      if(t<.44){

        if(body){body.rotation.x=lerp(.12,.28,bind);body.rotation.y=lerp(.04,-.04,bind);}
        if(head){head.rotation.x=lerp(-.02,.12,bind);}
        if(lA){lA.rotation.x=lerp(-.72,-1.58,bind);lA.rotation.z=lerp(.24,.88,bind);}
        if(rA){rA.rotation.x=lerp(-.72,-1.58,bind);rA.rotation.z=lerp(-.24,-.88,bind);}
      }else if(t<.78){
        var drag=eOut((t-.44)/.34);
        if(body){body.rotation.x=lerp(.28,.52,drag);}
        if(head){head.rotation.x=lerp(.12,.36,drag);}
        if(lA){lA.rotation.x=lerp(-1.58,-1.82,drag);lA.rotation.z=lerp(.88,.96,drag);}
        if(rA){rA.rotation.x=lerp(-1.58,-1.82,drag);rA.rotation.z=lerp(-.88,-.96,drag);}
        en.mesh.position.y=Math.max(.12*s,en.mesh.position.y-0.10*drag);
      }else{
        var sink=eOut((t-.78)/.22);
        if(body){body.rotation.x=lerp(.52,.80,sink);}
        if(head){head.rotation.x=lerp(.36,.92,sink);}
        en.mesh.position.y=Math.max(.02*s,en.mesh.position.y-0.42*sink);
      }
    }else{
      if(body)body.rotation.x=lerp(body.rotation.x||0,0,.22);
      if(head)head.rotation.x=lerp(head.rotation.x||0,0,.22);
    }
    return;
  }
  if(fa.charId==='ada'){
    // 目标先被踢飞，再被回摆追上后二次踢飞
    en.mesh.rotation.x=0;
    var base=fa.enemyStartPos||en.mesh.position;
    var efwd=new THREE.Vector3(Math.sin(en.mesh.rotation.y),0,Math.cos(en.mesh.rotation.y));
    if(phase==='wu'){
      if(body){body.rotation.x=.08;body.rotation.y=.04;}
      if(head){head.rotation.x=-.02;head.rotation.y=.10*wobble;}
      if(lA){lA.rotation.x=-.54;lA.rotation.z=.18;}
      if(rA){rA.rotation.x=-.66;rA.rotation.z=-.22;}
      if(lL)lL.rotation.x=.14;
      if(rL)rL.rotation.x=.20;
    }else if(phase==='st'){
      if(t<.30){
        var kick1=t/.30;
        if(body){body.rotation.x=lerp(.08,-.30,kick1);body.rotation.y=lerp(.04,.12,kick1);}
        if(head){head.rotation.x=lerp(-.02,-.34,kick1);}
        if(lA){lA.rotation.x=lerp(-.54,-.92,kick1);lA.rotation.z=lerp(.18,.30,kick1);}
        if(rA){rA.rotation.x=lerp(-.66,-1.04,kick1);rA.rotation.z=lerp(-.22,-.36,kick1);}
        en.mesh.position.x=base.x+efwd.x*lerp(0,1.58,eOut(kick1));
        en.mesh.position.z=base.z+efwd.z*lerp(0,1.58,eOut(kick1));
        en.mesh.position.y=Math.max(en.mesh.position.y,base.y+lerp(0,.66,eOut(kick1)));
      }else if(t<.78){
        var air=(t-.30)/.48;
        if(body){body.rotation.x=lerp(-.30,.22,air);body.rotation.y=lerp(.12,-.26,air);}
        if(head){head.rotation.x=lerp(-.34,.20,air);head.rotation.y=.24*Math.sin(performance.now()*0.035)*(1-air*.2);}
        if(lA){lA.rotation.x=lerp(-.92,-1.18,air);lA.rotation.z=lerp(.30,.58,air);}
        if(rA){rA.rotation.x=lerp(-1.04,-1.22,air);rA.rotation.z=lerp(-.36,-.62,air);}
        if(lL)lL.rotation.x=lerp(.14,.52,air);
        if(rL)rL.rotation.x=lerp(.20,.46,air);
        en.mesh.position.x=base.x+efwd.x*lerp(1.58,1.14,air);
        en.mesh.position.z=base.z+efwd.z*lerp(1.58,1.14,air);
        en.mesh.position.y=Math.max(en.mesh.position.y,base.y+lerp(.66,.48,air)+Math.sin(air*Math.PI)*.12);
      }else{
        var kick2=eOut((t-.78)/.22);
        if(body){body.rotation.x=lerp(.22,-.42,kick2);body.rotation.y=lerp(-.26,.10,kick2);}
        if(head){head.rotation.x=lerp(.20,-1.02,kick2);head.rotation.y=lerp(0,.24,kick2);}
        if(lA){lA.rotation.x=lerp(-1.18,-.76,kick2);lA.rotation.z=lerp(.58,.22,kick2);}
        if(rA){rA.rotation.x=lerp(-1.22,-.74,kick2);rA.rotation.z=lerp(-.62,-.20,kick2);}
        en.mesh.position.x=base.x+efwd.x*lerp(1.14,3.12,kick2);
        en.mesh.position.z=base.z+efwd.z*lerp(1.14,3.12,kick2);
        en.mesh.position.y=Math.max(en.mesh.position.y,base.y+lerp(.48,.16,kick2));
      }
    }else{
      if(body)body.rotation.x=lerp(body.rotation.x||0,0,.22);
      if(head)head.rotation.x=lerp(head.rotation.x||0,0,.22);
    }
    return;
  }
}

function clampEnemyToGround(en){
  if(!en||!en.mesh)return;
  var s=(en.data&&en.data.scale)||1;
  var minY=(en.groundOffset||0);
  if(en.state==='stagger'){
    // 头部僵直也保留足够离地，避免偶发陷地
    minY=Math.max(minY,.16*s);
  }else if(en.state==='downed'){
    // 跪姿/倒地阶段离地更高，避免大体型穿地
    minY=Math.max(minY,.22*s);
  }
  if(en.state==='dying'){
    // 死亡阶段抬高最低离地，防止任何姿态视觉上“埋地”
    minY=Math.max(minY,.36*s);
  }
  if(en.mesh.position.y<minY) en.mesh.position.y=minY;
}

function applyDyingPose(en){
  if(!en||!en.mesh||en.state!=='dying')return;
  var s=(en.data&&en.data.scale)||1;
  var style=en.deathStyle||'normal';
  var b=en.mesh.children&&en.mesh.children[0];
  var h=en.mesh.children&&en.mesh.children[1];
  var lA=en.mesh.children&&en.mesh.children[2];
  var rA=en.mesh.children&&en.mesh.children[3];

  // 核心硬限制：根节点不允许翻转，防止“倒立进土”
  en.mesh.rotation.x=0;
  en.mesh.rotation.z=0;
  if(style==='headshot'){
    en.mesh.position.y=Math.max(en.mesh.position.y,.38*s);
    if(b){b.rotation.x=0;b.rotation.y=0;b.rotation.z=0;}
    if(h){h.rotation.x=-.20;h.rotation.y=0;}
    if(lA){lA.rotation.x=-1.40;lA.rotation.z=.65;}
    if(rA){rA.rotation.x=-1.40;rA.rotation.z=-.65;}
  }else{
    en.mesh.position.y=Math.max(en.mesh.position.y,.34*s);
    if(b){b.rotation.x=.20;b.rotation.y=0;b.rotation.z=0;}
    if(h){h.rotation.x=-.30;h.rotation.y=0;}
    if(lA){lA.rotation.x=-.25;lA.rotation.z=.12;}
    if(rA){rA.rotation.x=-.25;rA.rotation.z=-.12;}
  }
}

function applyFinPose(cid,phase,t){
  if(!player)return;
  var ch=player.children;
  var body=ch[0],lA=ch[2],rA=ch[3],gun=ch[4],lL=ch[5],rL=ch[6];
  var e=eOut(t),ei=eIn(t);

  if(cid==='leon'||cid==='jill'){
    // 上旋踢：右腿猛踢
    if(phase==='wu'){
      if(rL)rL.rotation.x=lerp(0,-1.3,e);
      if(body){body.rotation.x=lerp(0,.25,e);body.rotation.y=lerp(0,-.4,e);}
      if(rA){rA.rotation.x=lerp(-1.3,-.5,e);rA.position.set(.38,.96,.05);}

      if(rA){rA.rotation.x=lerp(-.5,-.3,e);}
    }else{
      if(rL)rL.rotation.x=lerp(2.0,0,e);
      if(body){body.rotation.x=lerp(-.2,0,e);body.rotation.y=lerp(.5,0,e);body.rotation.z=lerp(.1,0,e);}

  }else if(cid==='chris'){
    // 重踹：蓄力后正面爆踹
    if(phase==='wu'){
      if(rL)rL.rotation.x=lerp(0,-1.55,e);
      if(body){body.rotation.x=lerp(0,.28,e);body.rotation.y=lerp(0,-.35,e);}
      if(rA){rA.rotation.x=lerp(-1.3,-.72,e);rA.rotation.z=lerp(0,-.18,e);rA.position.set(.39,.98,.08);}
      if(lA){lA.rotation.x=lerp(-.3,-.62,e);lA.rotation.z=lerp(0,.16,e);}
      if(gun)gun.position.set(.38,.90,.12);
    }else if(phase==='st'){
      if(rL)rL.rotation.x=lerp(-1.55,2.35,ei);
      if(body){body.rotation.x=lerp(.28,-.28,e);body.rotation.y=lerp(-.35,.58,ei);body.rotation.z=lerp(0,.14,ei);}
      if(rA){rA.rotation.x=lerp(-.72,-.25,e);rA.rotation.z=lerp(-.18,.18,ei);}
      if(lA){lA.rotation.x=lerp(-.62,-.18,e);lA.rotation.z=lerp(.16,-.08,ei);}
    }else{
      if(rL)rL.rotation.x=lerp(2.35,0,e);
      if(body){body.rotation.x=lerp(-.28,0,e);body.rotation.y=lerp(.58,0,e);body.rotation.z=lerp(.14,0,e);}
      if(rA){rA.rotation.x=lerp(-.25,-1.3,e);rA.rotation.z=lerp(.18,.05,e);}
      if(lA){lA.rotation.x=lerp(-.18,-.3,e);lA.rotation.z=lerp(-.08,0,e);}
      if(gun)gun.position.set(.38,.88,.42);
    }

  }else if(cid==='rose'){
    // 念力震退：双臂外展并前推
    if(phase==='wu'){
      if(body){body.rotation.x=lerp(0,.08,e);body.rotation.y=lerp(0,.14,e);}
      if(lA){lA.rotation.x=lerp(-.3,-1.18,e);lA.rotation.z=lerp(0,.84,e);}
      if(rA){rA.rotation.x=lerp(-1.3,-1.18,e);rA.rotation.z=lerp(.05,-.84,e);}
      if(gun){gun.position.set(.26,.84,-.20);gun.rotation.set(.16,-.62,.12);}
    }else if(phase==='st'){
      if(body){body.rotation.x=lerp(.08,-.10,e);body.rotation.y=lerp(.14,-.08,ei);}
      if(lA){lA.rotation.x=lerp(-1.18,-1.62,ei);lA.rotation.z=lerp(.84,1.18,ei);}
      if(rA){rA.rotation.x=lerp(-1.18,-1.62,ei);rA.rotation.z=lerp(-.84,-1.18,ei);}
      if(gun){gun.position.set(.24,.82,-.24);gun.rotation.set(.20,-.70,.14);}
    }else{
      if(body){body.rotation.x=lerp(-.10,0,e);body.rotation.y=lerp(-.08,0,e);}
      if(lA){lA.rotation.x=lerp(-1.62,-.3,e);lA.rotation.z=lerp(1.18,0,e);}
      if(rA){rA.rotation.x=lerp(-1.62,-1.3,e);rA.rotation.z=lerp(-1.18,.05,e);}
      if(gun){gun.position.set(.38,.88,.42);gun.rotation.set(camPitch*.5,0,0);}
    }

  }else if(cid==='krauser'){
    // 刀臂突进：右臂举刀横劈
    if(phase==='wu'){
      if(rA){rA.rotation.x=lerp(-1.3,-2.2,e);rA.rotation.z=lerp(0,-.6,e);rA.position.set(.38,.96,.1);}
      if(body){body.rotation.y=lerp(0,.65,e);body.rotation.x=lerp(0,.16,e);}
      if(gun)gun.position.set(.38,.88,.1);
    }else if(phase==='st'){
      if(rA){rA.rotation.x=lerp(-2.2,.8,ei);rA.rotation.z=lerp(-.6,1.0,ei);}
      if(body){body.rotation.y=lerp(.65,-.5,ei);body.rotation.x=lerp(.16,-.2,ei);}
      if(lA)lA.rotation.z=lerp(0,-.5,ei);

      if(rA){rA.rotation.x=lerp(.8,-1.3,e);rA.rotation.z=lerp(1.0,0,e);}

  }else if(cid==='wesker'){

    if(phase==='wu'){
      if(lA){lA.rotation.x=lerp(-.3,-1.5,e);lA.rotation.z=lerp(0,.35,e);}

      if(body){body.rotation.y=lerp(0,.26,e);body.rotation.x=lerp(0,.18,e);body.rotation.z=lerp(0,.06,e);}

      if(rL)rL.rotation.x=lerp(0,-1.04,e);
      if(gun)gun.position.set(.34,.90,.14);
    }else if(phase==='st'){
      if(t<.30){
        var kick1=eOut(t/.30);
        // 第一脚踢飞

        if(rA){rA.rotation.x=lerp(-.52,-.30,kick1);rA.rotation.z=lerp(-.16,-.22,kick1);}

        if(lL)lL.rotation.x=lerp(-.44,1.06,swing);
        if(gun)gun.position.set(.28,.82,lerp(.20,.34,swing));
      }else{
        var kick2=eOut((t-.78)/.22);

        if(rA){rA.rotation.x=lerp(-1.42,.18,kick2);rA.rotation.z=lerp(1.02,.52,kick2);}

      if(lL)lL.rotation.x=lerp(2.88,0,e);
      if(body){body.rotation.x=lerp(.24,0,e);body.rotation.y=lerp(.06,0,e);body.rotation.z=lerp(-.22,0,e);}
      if(gun)gun.position.set(.38,.88,.42);
    }

  }else{
    // hunk 颈折：快速双手扼喉
    if(phase==='wu'){
      if(lA){lA.rotation.x=lerp(-.3,-1.3,e);lA.rotation.z=lerp(0,.45,e);}
      if(rA){rA.rotation.x=lerp(-1.3,-1.3,e);rA.rotation.z=lerp(0,-.45,e);rA.position.set(.38,.96,.1);}
      if(body)body.rotation.y=lerp(0,.2,e);
      if(gun)gun.position.set(.38,.88,.1);
    }else if(phase==='st'){
      if(lA)lA.rotation.z=lerp(.45,1.3,ei);
      if(rA)rA.rotation.z=lerp(-.45,-1.3,ei);
      if(body){body.rotation.x=lerp(0,-.18,ei);body.rotation.y=lerp(.2,-.15,ei);}
    }else{
      if(lA){lA.rotation.x=lerp(-1.3,-.3,e);lA.rotation.z=lerp(1.3,0,e);}
      if(rA){rA.rotation.z=lerp(-1.3,0,e);}
      if(body){body.rotation.x=lerp(-.18,0,e);body.rotation.y=lerp(-.15,0,e);}
    }
  }
}

function resetPlayerPose(){
  if(!player)return;
  var ch=player.children;
  var body=ch[0],lA=ch[2],rA=ch[3],gun=ch[4],lL=ch[5],rL=ch[6];
  if(body){body.rotation.x=0;body.rotation.y=0;body.rotation.z=0;}
  if(lA){lA.rotation.set(0,0,0);lA.position.set(-.4,.85,0);}
  if(rA){rA.rotation.set(-1.3,0,.05);rA.position.set(.38,.96,.1);}
  if(gun){gun.position.set(.38,.88,.42);gun.rotation.set(0,0,0);}
  if(gun&&gun.userData&&gun.userData.jillExecCannon){
    while(gun.children.length)gun.remove(gun.children[0]);
    if(currentChar&&CHARS[currentChar]){
      gun.add(createWeaponModel(CHARS[currentChar].weapons[weaponIndex]));
    }
    gun.userData.jillExecCannon=false;
  }
  if(lL)lL.rotation.set(0,0,0);
  if(rL)rL.rotation.set(0,0,0);
  var eyes=player.userData&&player.userData.hunkEyes;
  if(eyes&&eyes.length){
    eyes.forEach(function(eye){
      if(eye&&eye.material)eye.material.opacity=.18;
    });
  }
}

function lookAtWithRoll(cam,from,to,roll){
  var fwd=new THREE.Vector3().subVectors(to,from);
  if(fwd.lengthSq()<1e-6){
    cam.lookAt(to);
    return;
  }
  fwd.normalize();
  var worldUp=new THREE.Vector3(0,1,0);
  var right=new THREE.Vector3().crossVectors(worldUp,fwd);
  if(right.lengthSq()<1e-6)right.set(1,0,0);
  right.normalize();
  var upBase=new THREE.Vector3().crossVectors(fwd,right).normalize();
  var up=upBase.multiplyScalar(Math.cos(roll)).add(right.multiplyScalar(Math.sin(roll))).normalize();
  cam.up.copy(up);
  cam.lookAt(to);
}

function triggerHunkExecutionCut(){
  if(!camera)return;
  var dir=new THREE.Vector3();
  camera.getWorldDirection(dir);
  execCutFromPos=camera.position.clone();
  execCutFromLook=camera.position.clone().addScaledVector(dir,6.2);
  execCutFromFov=camera.fov;
  execCutBlackTimer=HUNK_EXEC_BLACK_DUR;
  execCutBlendTimer=0;
  execCutAlpha=1;
}

function tickExecutionCut(dt){
  if(execCutBlackTimer>0){
    execCutBlackTimer=Math.max(0,execCutBlackTimer-dt);
    execCutAlpha=1;
    if(execCutBlackTimer<=0){
      execCutBlendTimer=HUNK_EXEC_BLEND_DUR;
    }
  }else if(execCutBlendTimer>0){
    execCutBlendTimer=Math.max(0,execCutBlendTimer-dt);
    var bt=1-execCutBlendTimer/Math.max(HUNK_EXEC_BLEND_DUR,.001);
    execCutAlpha=1-clamp01(eOut(bt));
    if(execCutBlendTimer<=0){
      execCutFromPos=null;
      execCutFromLook=null;
      execCutFromFov=70;
    }
  }else{
    execCutAlpha=0;
  }
  var cut=document.getElementById('exec-cut');
  if(cut)cut.style.opacity=String(execCutAlpha);
}

function damagePlayer(dmg){
  if(isFinishing)return;
  if(skillActive&&skillActive.id==='rose')return;
  playerHP=Math.max(0,playerHP-dmg);
  refreshHPHUD();doShake(.15);
  if(playerHP<=0)endGame();
}

function switchWeapon(){
  if(reloadState)return;
  var ws=CHARS[currentChar].weapons;if(ws.length<2)return;
  weaponIndex=(weaponIndex+1)%ws.length;
  bowDraw.active=false;bowDraw.hold=0;bowDraw.t=0;
  setPlayerWeaponModel();
  refreshWeaponHUD();
}
function reloadWeapon(){
  if(reloadState)return;
  var wp=CHARS[currentChar].weapons[weaponIndex];
  if(wp.ammo===-1)return;
  var mag=wp.mag||AMMO_CLIP[wp.name]||wp.ammo;
  var reserve=Math.max(0,wp.reserve||0);
  if(wp.ammo>=mag)return;
  if(reserve<=0)return;
  reloadState={idx:weaponIndex,time:wp.reloadTime||1.4};
  showZone('RELOADING...','#c7d5ff');
  refreshWeaponHUD();
}

function tickReload(dt){
  if(!reloadState||!currentChar)return;
  reloadState.time-=dt;
  if(reloadState.time>0)return;
  var ws=CHARS[currentChar].weapons;
  var wp=ws[reloadState.idx];
  if(wp&&wp.ammo!==-1){
    var mag=wp.mag||AMMO_CLIP[wp.name]||wp.ammo;
    var reserve=Math.max(0,wp.reserve||0);
    var need=Math.max(0,mag-wp.ammo);
    var load=Math.min(need,reserve);
    wp.ammo+=load;
    wp.reserve=Math.max(0,reserve-load);
  }
  reloadState=null;
  refreshWeaponHUD();
}

function useSkill(){
  if(isFinishing||skillCD>0)return;
  var cd=CHARS[currentChar],sk=cd.skill;
  skillCD=sk.cd;
  skillActive={id:currentChar,name:sk.name,dur:sk.dur};
  skillTimer=sk.dur;
  if(currentChar==='wesker'){
    doWeskerDashSkill();
    skillActive=null;
    skillTimer=0;
    skillFxTimer=0;
  }else if(currentChar==='ada'){
    doAdaShiftSkill();
    skillActive=null;
    skillTimer=0;
    skillFxTimer=0;
  }else if(currentChar==='krauser'){
    doKrauserMutationBurst();
  }else if(currentChar==='jill'){
    showZone('BATTLE SURGE','#7ec8ff');
  }else if(currentChar==='chris'){
    showZone('ASSAULT ADRENALINE','#ffd77e');
  }else if(currentChar==='rose'){
    showZone('MOLD PHASE','#a88bff');
  }
  doShake(.35);
  refreshSkillHUD();
}

function doWeskerDashSkill(){
  var sinY=Math.sin(camYaw),cosY=Math.cos(camYaw);
  var fw=new THREE.Vector3(-sinY,0,-cosY);
  var start=player.position.clone(),end=start.clone().addScaledVector(fw,7.0);
  player.position.copy(end);
  enemies.slice().forEach(function(en){
    if(en.state==='dying')return;
    var to=en.mesh.position.clone().sub(start);to.y=0;
    var proj=to.dot(fw);
    if(proj<0||proj>7.8)return;
    var closest=start.clone().addScaledVector(fw,proj);
    if(en.mesh.position.distanceTo(closest)>1.4)return;
    hitEnemy(en,220,en.mesh.position.clone().setY(1.0),'head',1.35);
    en.state='stagger';en.staggerTimer=Math.max(en.staggerTimer,1.2);
  });
  fxFinisher(end.clone().setY(1.0));
}

function doKrauserMutationBurst(){
  enemies.slice().forEach(function(en){
    if(en.state==='dying')return;
    var d=en.mesh.position.distanceTo(player.position);
    if(d>3.0)return;
    hitEnemy(en,110*(1-d/3.0),en.mesh.position.clone().setY(1.0),'body',1.45);
  });
  fxFinisher(player.position.clone().setY(1.1));
}

function getAdaGrappleWallPoint(maxDist){
  if(!camera||!player)return null;
  var camPos=camera.position.clone();
  var dir=new THREE.Vector3();
  camera.getWorldDirection(dir);
  dir.y=0;
  if(dir.lengthSq()<1e-6)return null;
  dir.normalize();
  var dist=Math.max(6,maxDist||22);
  for(var d=1.8;d<=dist;d+=.4){
    var sx=camPos.x+dir.x*d,sz=camPos.z+dir.z*d;
    var hit=false;
    for(var i=0;i<MAP_COLLIDERS.length;i++){
      var c=MAP_COLLIDERS[i];
      if(sx>=c.minX&&sx<=c.maxX&&sz>=c.minZ&&sz<=c.maxZ){hit=true;break;}
    }
    if(!hit)continue;
    var target=new THREE.Vector3(sx-dir.x*.95,player.position.y,sz-dir.z*.95);
    var safe=movePlayerWithSqueeze(player.position,new THREE.Vector3().subVectors(target,player.position),playerLayer);
    if(safe.distanceTo(player.position)>1.15)return safe;
    break;
  }
  return null;
}

function doAdaShiftSkill(){
  var start=player.position.clone();
  var best=getAdaGrappleWallPoint(24);
  if(!best){
    // 没有墙体命中时，保底做短位移
    var sinY=Math.sin(camYaw),cosY=Math.cos(camYaw);
    var dir=new THREE.Vector3(-sinY,0,-cosY);
    best=movePlayerWithSqueeze(start,dir.multiplyScalar(3.8),playerLayer);
  }
  player.position.copy(best);
  player.position.x=Math.max(-32,Math.min(32,player.position.x));
  player.position.z=Math.max(-32,Math.min(32,player.position.z));
  player.position.y=getLayerY(playerLayer);
  playerHP=Math.min(playerMaxHP,playerHP+18);
  refreshHPHUD();
  // 回复部分弹药：仅补备用弹，不自动填充当前弹匣
  CHARS[currentChar].weapons.forEach(function(w){
    if(!w||w.ammo===-1)return;
    var maxA=AMMO_MAX[w.name]||Math.max((w.ammo||0)+(w.reserve||0),1);
    var add=Math.max(1,Math.ceil(maxA*.1));
    w.reserve=Math.min(maxA-(w.ammo||0),Math.max(0,w.reserve||0)+add);
  });
  refreshWeaponHUD();
  fxFinisher(best.clone().setY(1.0));
  showZone('WIRE SHIFT +RECOVER','#ff95c4');
  // 位移落点压制：给近身敌人硬直，创造重新拉枪线的窗口
  enemies.slice().forEach(function(en){
    if(en.state==='dying')return;
    var d=en.mesh.position.distanceTo(best);
    if(d>2.7)return;
    hitEnemy(en,26*(1-d/2.7),en.mesh.position.clone().setY(1.0),'body',1.1);
    if(en.hp>0){
      en.state='stagger';
      en.staggerTimer=Math.max(en.staggerTimer||0,1.1);
    }
  });
}

function tickSkill(dt){
  if(skillCD>0)skillCD=Math.max(0,skillCD-dt);
  if(skillActive&&skillActive.dur>0){
    skillTimer=Math.max(0,skillTimer-dt);
    if(skillTimer<=0){skillActive=null;skillFxTimer=0;}
  }
  tickSkillAuraFx(dt);
}

function tickBowDraw(dt){
  if(gameState!=='playing'||!currentChar){bowDraw.t=0;bowDraw.active=false;return;}
  var wp=CHARS[currentChar].weapons[weaponIndex];
  var isBow=wp&&wp.kind==='bow';
  if(!isBow){bowDraw.t=0;bowDraw.active=false;bowDraw.hold=0;return;}
  if(bowDraw.active&&mouseDown){
    bowDraw.hold=Math.min(1.05,bowDraw.hold+dt);
    bowDraw.t=Math.min(1,bowDraw.hold/.85);
  }else{
    bowDraw.t=Math.max(0,bowDraw.t-dt*8);
  }
}

function tickCrosshair(dt){
  var ch=document.getElementById('crosshair');
  if(!ch)return;
  if(crosshairPulse>0)crosshairPulse=Math.max(0,crosshairPulse-dt*3.4);
  var draw=0,isBow=false;
  if(currentChar&&CHARS[currentChar]){
    var wp=CHARS[currentChar].weapons[weaponIndex];
    isBow=!!(wp&&wp.kind==='bow');
    if(isBow)draw=bowDraw.t;
  }
  var size=18-draw*6+crosshairPulse*9-aimBlend*2.4;

  ch.style.height=size+'px';

    ch.style.color='rgba(120,220,255,'+a+')';
  }else{
    ch.style.color='rgba(255,255,255,.75)';
  }

function getEnemyHitRadius(en){
  var s=(en&&en.data&&en.data.scale)||1;
  return (en&&en.tk==='chainsaw'?0.95:0.78)*s;
}

function getEnemyHitCenter(en){
  var s=(en&&en.data&&en.data.scale)||1;
  var h=en&&en.tk==='chainsaw'?1.08:0.92;
  return en.mesh.position.clone().setY(h*s);
}

function sweepHitEnemy(from,to,en,inflate){
  if(!en||en.state==='dying'||!en.mesh)return null;
  var seg=to.clone().sub(from);
  var lenSq=seg.lengthSq();
  var center=getEnemyHitCenter(en);
  var t=0;
  if(lenSq>1e-6){
    var toCenter=center.clone().sub(from);
    t=THREE.MathUtils.clamp(toCenter.dot(seg)/lenSq,0,1);
  }
  var point=from.clone().addScaledVector(seg,t);
  var r=getEnemyHitRadius(en)+(inflate||0);
  if(point.distanceToSquared(center)<=r*r){
    return point;
  }
  return null;
}

function isProjectileBlockedAt(pos,projRadius,layer){
  if(pos.y<=.12)return true;
  var useLayer=layer||'ground';
  for(var i=0;i<MAP_COLLIDERS.length;i++){
    var c=MAP_COLLIDERS[i];
    if(c.layer!=='all'&&c.layer!==useLayer)continue;
    if(pos.x>=c.minX-projRadius&&pos.x<=c.maxX+projRadius&&
       pos.z>=c.minZ-projRadius&&pos.z<=c.maxZ+projRadius){
      return true;
    }
  }
  return false;
}

function sweepHitMap(from,to,projRadius,layer){
  var steps=Math.max(2,Math.ceil(from.distanceTo(to)/0.33));
  for(var i=1;i<=steps;i++){
    var t=i/steps;
    var p=from.clone().lerp(to,t);
    if(isProjectileBlockedAt(p,projRadius,layer))return p;
  }
  return null;
}

function tickProjectiles(dt){
  for(var i=projectiles.length-1;i>=0;i--){
    var p=projectiles[i];
    var prevPos=p.mesh.position.clone();
    p.life-=dt;
    if(p.kind!=='rpg'){
      p.vel.y-=15*dt;
    }
    p.mesh.position.addScaledVector(p.vel,dt);
    if(p.kind!=='rpg'&&p.mesh.position.y<.12){
      p.mesh.position.y=.12;
      p.vel.multiplyScalar(.45);
      p.vel.y=Math.abs(p.vel.y)*.38;
    }
    var hitEnemyNow=false,hitPoint=null;
    for(var j=0;j<enemies.length;j++){
      var en=enemies[j];
      if(en.state==='dying')continue;
      var pHit=sweepHitEnemy(prevPos,p.mesh.position,en,p.kind==='rpg'?.12:0);
      if(pHit){
        hitEnemyNow=true;
        hitPoint=pHit;
        break;
      }
    }
    var mapHit=sweepHitMap(prevPos,p.mesh.position,p.kind==='rpg'?.16:.11,p.layer||'ground');
    if(p.life<=0||hitEnemyNow||mapHit||(p.kind!=='rpg'&&p.vel.lengthSq()<1.2)){
      var boomPos=hitPoint||mapHit||p.mesh.position.clone();
      explodeGrenade(boomPos,p.damage,p.radius);
      scene.remove(p.mesh);
      projectiles.splice(i,1);
    }
  }
}

function tickEffects(dt){
  for(var i=effects.length-1;i>=0;i--){
    var fx=effects[i];fx.life-=dt;
    if(fx.life<=0){scene.remove(fx.mesh);effects.splice(i,1);continue;}
    if(fx.mesh.material)fx.mesh.material.opacity=fx.life/fx.max;
    if(fx.vel){fx.mesh.position.addScaledVector(fx.vel,dt);if(fx.grav)fx.vel.y-=12*dt;}
    if(fx.grow&&fx.mesh&&fx.mesh.scale){
      var g=1+fx.grow*dt;
      fx.mesh.scale.multiplyScalar(g);
    }
    if(fx.sink&&fx.mesh&&fx.mesh.position){
      fx.mesh.position.y-=fx.sink*dt;
    }
    if(fx.spin&&fx.mesh&&fx.mesh.rotation){
      fx.mesh.rotation.x+=fx.spin.x*dt;
      fx.mesh.rotation.y+=fx.spin.y*dt;
      fx.mesh.rotation.z+=fx.spin.z*dt;
    }
  }
  if(shake>0){
    camera.position.x+=(Math.random()-.5)*shake;
    camera.position.y+=(Math.random()-.5)*shake;
    shake*=.65;if(shake<.001)shake=0;
  }
}
