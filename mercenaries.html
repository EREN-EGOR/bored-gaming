function animate(){
  requestAnimationFrame(animate);
  if(!clock)return;
  var dt=Math.min(clock.getDelta(),.05);
  tickExecutionCut(dt);
  if(gameState!=='playing'){if(renderer)renderer.render(scene,camera);return;}
  var simScale=getCinematicTimeScale();
  var simDt=dt*simScale;
  tickSkill(simDt);
  tickReload(simDt);
  tickCrosshair(simDt);
  tickContextPrompt();
  tickBowDraw(simDt);
  tickPlayer(simDt);
  tickFinAnim(simDt);
  tickAutoFire();
  tickProjectiles(simDt);
  applyGunPose();
  tickEnemies(simDt);
  tickEffects(simDt);
  checkFinishPrompt();
  tickTimers(simDt);
  tickCamera();
  renderer.render(scene,camera);
}

function tickAutoFire(){
  if(!mouseDown||isFinishing||gameState!=='playing')return;
  var wp=CHARS[currentChar].weapons[weaponIndex];
  if(wp&&wp.auto)shoot();
}

/* ================================================================
   玩家移动
================================================================ */
function tickPlayer(dt){
  if(isFinishing)return;
  if(playerAction){
    playerAction.t+=dt;
    var tt=clamp01(playerAction.t/Math.max(playerAction.dur,.001));
    var et=eOut(tt);
    var p=playerAction.from.clone().lerp(playerAction.to,et);
    if(playerAction.arc>0){
      p.y+=Math.sin(tt*Math.PI)*playerAction.arc;
    }
    player.position.copy(p);
    if(tt>=1){
      playerLayer=playerAction.layer||'ground';
      player.position.copy(playerAction.to);
      playerAction=null;
    }
    player.rotation.y=camYaw+Math.PI;
    return;
  }
  var cd=CHARS[currentChar],speed=cd.speed;
  if(skillActive){
    if(skillActive.id==='krauser')speed*=1.15;
    if(skillActive.id==='wesker')speed*=1.12;
    if(skillActive.id==='leon')speed*=1.05;
    if(skillActive.id==='jill')speed*=1.16;
  }
  var sinY=Math.sin(camYaw),cosY=Math.cos(camYaw);
  var fw=new THREE.Vector3(-sinY,0,-cosY),ri=new THREE.Vector3(cosY,0,-sinY);
  var wish=new THREE.Vector3();
  if(keys['KeyW']||keys['ArrowUp'])wish.addScaledVector(fw,1);
  if(keys['KeyS']||keys['ArrowDown'])wish.addScaledVector(fw,-1);
  if(keys['KeyA']||keys['ArrowLeft'])wish.addScaledVector(ri,-1);
  if(keys['KeyD']||keys['ArrowRight'])wish.addScaledVector(ri,1);
  var moving=wish.lengthSq()>0;
  if(moving)wish.normalize();
  var ac=moving?1-Math.pow(.01,dt*10):1-Math.pow(.04,dt*10);
  pVel.lerp(wish.multiplyScalar(speed),ac);
  var nextP=movePlayerWithSqueeze(player.position,pVel.clone().multiplyScalar(dt),playerLayer);
  player.position.copy(nextP);
  player.position.x=Math.max(-32,Math.min(32,player.position.x));
  player.position.z=Math.max(-32,Math.min(32,player.position.z));
  if(moving&&!playerAction){
    var stepDir=pVel.clone();stepDir.y=0;
    if(stepDir.lengthSq()<1e-6)stepDir=wish.clone();
    if(stepDir.lengthSq()>1e-6){
      stepDir.normalize();
    }
  }
  var rampSample=sampleWalkRampHeight(player.position,playerLayer);
  if(rampSample){
    playerLayer=rampSample.layer||playerLayer;
    player.position.y=rampSample.y;
  }else{
    player.position.y=getLayerY(playerLayer);
  }
  // 模型默认朝 +Z，而镜头前向是 -Z；加 PI 让角色与准星同向
  player.rotation.y=camYaw+Math.PI;

  // 腿部摆动
  if(pVel.lengthSq()>.05){
    var t=clock.elapsedTime*9,sw=Math.min(pVel.length()/speed,1)*.4;
    var lL=player.children[5],rL=player.children[6];
    if(lL)lL.rotation.x=Math.sin(t)*sw;
    if(rL)rL.rotation.x=-Math.sin(t)*sw;
  }
  if(shootCD>0)shootCD-=dt;
}

/* ================================================================
   敌人 AI
================================================================ */
function pickEnemyWalkRamp(en,targetLayer){
  var fromLayer=en.layer||'ground';
  var best=null,bestScore=1e9;
  MAP_WALK_RAMPS.forEach(function(r){
    if(r.from!==fromLayer)return;
    if(targetLayer&&r.to!==targetLayer)return;
    var toNode=Math.hypot(en.mesh.position.x-r.x,en.mesh.position.z-r.z);
    var toExit=Math.hypot(player.position.x-r.tx,player.position.z-r.tz);
    var score=toNode*1.1+toExit*.9;
    if(score<bestScore){
      bestScore=score;
      best=r;
    }
  });
  return best;
}

function applyEnemyWalkRamp(en){
  var s=sampleWalkRampHeight(en.mesh.position,en.layer||'ground');
  if(!s)return null;
  en.layer=s.layer||en.layer||'ground';
  en.mesh.position.y=s.y+(en.groundOffset||0);
  return s;
}

function getPlayerPlanarForward(){
  var f=new THREE.Vector3(0,0,-1);
  if(camera)camera.getWorldDirection(f);
  f.y=0;
  if(f.lengthSq()<1e-6)f.set(-Math.sin(camYaw),0,-Math.cos(camYaw));
  return f.normalize();
}

function getFinisherSafeRadius(){
  if(!isFinishing)return 0;
  if(!finAnim)return 3.6;
  var base=finAnim.isExecution?3.95:3.55;
  var byChar={
    wesker:4.2,
    jill:4.0,
    chris:4.15,
    rose:4.1,
    ada:3.95,
    krauser:3.9,
    leon:3.8,
    hunk:3.85
  };
  if(byChar[finAnim.charId]!=null)base=Math.max(base,byChar[finAnim.charId]);
  return base;
}

function rotateDirY(dir,ang){
  var c=Math.cos(ang),s=Math.sin(ang);
  return new THREE.Vector3(dir.x*c-dir.z*s,0,dir.x*s+dir.z*c);
}

function pickSteerDir(startPos,desiredDir,stepLen,targetPos,layer,radius){
  var base=desiredDir.clone();
  base.y=0;
  if(base.lengthSq()<1e-6)base.set(0,0,1);
  base.normalize();
  var bestDir=base.clone(),bestScore=-1e9,bestMove=0;
  var angs=[0,.38,-.38,.72,-.72,1.08,-1.08,1.45,-1.45,Math.PI];
  for(var i=0;i<angs.length;i++){
    var cand=rotateDirY(base,angs[i]).normalize();
    var step=cand.clone().multiplyScalar(stepLen);
    var next=moveWithMapCollision(startPos,step,radius,layer);
    var moved=next.distanceTo(startPos);
    if(moved<stepLen*.22)continue;
    var toward=0;
    if(targetPos){
      var before=startPos.distanceTo(targetPos);
      var after=next.distanceTo(targetPos);
      toward=(before-after);
    }
    var lateral=Math.abs(angs[i])>0.2?0.02:0;
    var score=moved*1.85+toward*2.2+lateral;
    if(score>bestScore){
      bestScore=score;
      bestDir=cand;
      bestMove=moved;
    }
  }
  return {dir:bestDir,score:bestScore,moved:bestMove};
}

function refreshEnemyCombatRoles(){
  if(!player)return;
  var pp=player.position;
  var active=enemies.filter(function(en){
    return en.state==='chase'&&en.hp>0&&en.state!=='dying';
  });
  if(!active.length)return;
  active.sort(function(a,b){
    return a.mesh.position.distanceTo(pp)-b.mesh.position.distanceTo(pp);
  });
  var rushSlots=Math.max(1,Math.min(2,Math.floor(active.length*.3)));
  var flankSlots=Math.max(1,Math.min(4,Math.floor(active.length*.4)));
  var strikeSlots=Math.max(1,Math.min(2,Math.floor(active.length*.22)));
  var pForward=getPlayerPlanarForward();
  aiStrikeRefresh=0;
  active.forEach(function(en,idx){
    en.roleTimer=Math.max(.6,.85+Math.random()*.95);
    en.canStrike=false;
    if(en.stuckTimer>1.1){
      en.aiMode='reposition';
      en.aiSide*=-1;
    }else if(idx<rushSlots){
      en.aiMode='rush';
    }else if(idx<rushSlots+flankSlots){
      en.aiMode='flank_back';
      if(Math.random()<.35)en.aiSide*=-1;
    }else{
      en.aiMode='bait';
      var toEn=en.mesh.position.clone().sub(pp);toEn.y=0;
      if(toEn.lengthSq()>1e-6){
        var rightSign=Math.sign(toEn.x*pForward.z-toEn.z*pForward.x);
        if(rightSign!==0)en.aiSide=rightSign;
      }
      if(Math.random()<.24)en.aiSide*=-1;
    }
  });
  // 攻击位轮换：冲锋位优先出手，绕后位次之，牵制位几乎不主动拍击
  active.slice(0,Math.max(strikeSlots,1)).forEach(function(en){
    if(en.aiMode!=='bait')en.canStrike=true;
  });
}

function tickEnemies(dt){
  var pp=player.position;
  enemyAiRefresh-=dt;
  if(enemyAiRefresh<=0){
    refreshEnemyCombatRoles();
    enemyAiRefresh=.95+Math.random()*.35;
  }
  aiStrikeRefresh-=dt;
  if(aiStrikeRefresh<=0){
    var chasers=enemies.filter(function(en){
      return en.state==='chase'&&en.hp>0&&en.state!=='dying';
    });
    chasers.sort(function(a,b){
      var ad=a.mesh.position.distanceTo(pp)+(a.aiMode==='bait'?1.8:0)+(a.aiMode==='flank_back'?.55:0);
      var bd=b.mesh.position.distanceTo(pp)+(b.aiMode==='bait'?1.8:0)+(b.aiMode==='flank_back'?.55:0);
      return ad-bd;
    });
    chasers.forEach(function(en){en.canStrike=false;});
    var allow=Math.max(1,Math.min(2,Math.floor(chasers.length*.2)));
    for(var ai=0;ai<chasers.length&&allow>0;ai++){
      if(chasers[ai].aiMode==='bait')continue;
      chasers[ai].canStrike=true;
      allow--;
    }
    aiStrikeRefresh=.42+Math.random()*.18;
  }
  enemies.forEach(function(en){
    if(en.sinkState){
      en.sinkState.t+=dt;
      var sp=clamp01(en.sinkState.t/Math.max(en.sinkState.dur,.001));
      en.mesh.position.x=en.sinkState.x;
      en.mesh.position.z=en.sinkState.z;
      en.mesh.position.y=lerp(en.sinkState.startY,en.sinkState.targetY,eOut(sp));
      if(en.mesh.children&&en.mesh.children.length){
        var b=en.mesh.children[0],h=en.mesh.children[1];
        if(b)b.rotation.x=lerp(.18,.92,sp);
        if(h)h.rotation.x=lerp(-.02,1.18,sp);
      }
      if(sp>=1&&!en.sinkState.done){
        en.sinkState.done=true;
        fxMoldVortex(new THREE.Vector3(en.sinkState.x,.03,en.sinkState.z),1.9);
        en.mesh.visible=false;
        killEnemy(en,{style:'normal',keepMs:80});
        playerHP=Math.min(playerMaxHP,playerHP+(en.sinkState.heal||24));
        refreshHPHUD();
        showZone('EXECUTION +'+(en.sinkState.heal||24)+' HP','#8CF2A0');
        en.sinkState=null;
      }
      return;
    }
    if(en.state==='dying'){
      applyDyingPose(en);
      clampEnemyToGround(en);
      return;
    }
    if(isFinishing&&finAnim&&finAnim.isExecution&&finAnim.enemy===en){
      // 当前处决目标完全交给处决动画控制
      return;
    }
    if(en.slowTimer>0){
      en.slowTimer=Math.max(0,en.slowTimer-dt);
      if(en.slowTimer<=0)en.slowMul=1;
    }
    var enLayer=en.layer||'ground';
    var rampNow=sampleWalkRampHeight(en.mesh.position,enLayer);
    if(rampNow){
      en.layer=rampNow.layer||en.layer||'ground';
      enLayer=en.layer||'ground';
    }
    var baseY=(rampNow?rampNow.y:getLayerY(enLayer))+(en.groundOffset||0);
    clampEnemyToGround(en);
    en.mesh.position.y=baseY; // 分层地形高度 + 姿态离地偏移
    // HP条朝摄像机
    var hpG=en.mesh.children[en.mesh.children.length-1];
    if(hpG&&hpG.isGroup){
      var fi=hpG.getObjectByName('hpFill');
      if(fi){
        var r=Math.max(0,en.hp/en.maxHp);
        fi.scale.x=r;fi.position.x=(r-1)*.5;
        fi.material.color.setHex(r>.5?0x00cc00:r>.25?0xffaa00:0xff2200);
      }
      hpG.lookAt(camera.position);
    }
    if(en.state==='stagger'||en.state==='downed'){
      // 僵直阶段根节点强制回正，防止偶发倒立/侧翻
      en.mesh.rotation.x=0;
      en.mesh.rotation.z=0;
      en.mesh.position.y=baseY;
      clampEnemyToGround(en);
      en.staggerTimer-=dt;
      if(en.staggerTimer<=0){en.state='chase';en.staggerAcc=0;en.staggerZone=null;resetEnemyPose(en);}
      return;
    }
    var toP=new THREE.Vector3().subVectors(pp,en.mesh.position),dist=toP.length();
    toP.y=0;dist=toP.length();
    var dirTo=toP.lengthSq()>1e-6?toP.clone().normalize():new THREE.Vector3();
    var pForward=getPlayerPlanarForward();
    var pRight=new THREE.Vector3(pForward.z,0,-pForward.x);
    var finisherSafeR=getFinisherSafeRadius();
    if(!en.lastPos)en.lastPos=en.mesh.position.clone();
    var moved=en.lastPos.distanceTo(en.mesh.position);
    if(moved<.015&&dist>2.2)en.stuckTimer+=dt;
    else en.stuckTimer=Math.max(0,en.stuckTimer-dt*1.8);
    en.lastPos.copy(en.mesh.position);
    en.roleTimer=(en.roleTimer||0)-dt;
    if(en.roleTimer<=0){
      if(Math.random()<.38)en.aiSide*=-1;
      if(en.aiMode==='reposition')en.aiMode='observe';
      en.roleTimer=.7+Math.random()*1.2;
    }
    var sep=new THREE.Vector3();
    for(var si=0;si<enemies.length;si++){
      var other=enemies[si];
      if(other===en||other.state==='dying')continue;
      var away=new THREE.Vector3().subVectors(en.mesh.position,other.mesh.position);away.y=0;
      var sd=away.length();
      if(sd>0&&sd<1.35){
        sep.addScaledVector(away.normalize(),(1.35-sd)*1.3);
      }
    }
    var moveDir=dirTo.clone(),guideRamp=null;
    var speedMul=1.0;
    if(en.slowTimer>0)speedMul*=Math.max(.18,en.slowMul||1);
    if(enLayer!==playerLayer){
      guideRamp=pickEnemyWalkRamp(en,playerLayer);
      if(guideRamp){
        var toNode=new THREE.Vector3(guideRamp.x,en.mesh.position.y,guideRamp.z).sub(en.mesh.position);
        toNode.y=0;
        if(toNode.lengthSq()>1e-6)moveDir=toNode.normalize();
        speedMul=1.05;
      }
    }
    if(!guideRamp&&en.aiMode==='flank_back'){
      var flankR=Math.max(en.data.atkRange+2.1,3.4);
      var rearOffset=Math.max(en.data.atkRange+1.5,2.6);
      var flankTarget=pp.clone()
        .addScaledVector(pForward,-rearOffset)
        .addScaledVector(pRight,(en.aiSide||1)*flankR*.7);
      moveDir=new THREE.Vector3().subVectors(flankTarget,en.mesh.position);
      if(moveDir.lengthSq()>1e-6)moveDir.normalize();
      speedMul=1.04;
      if(dist<en.data.atkRange+1.3){
        moveDir.addScaledVector(dirTo,-.7);
      }
    }else if(!guideRamp&&en.aiMode==='bait'){
      var holdDist=en.data.atkRange+4.6;
      var baitAnchor=pp.clone()
        .addScaledVector(pForward,Math.max(holdDist-1.4,2.7))
        .addScaledVector(pRight,(en.aiSide||1)*1.4);
      if(dist<holdDist*.9){
        // 牵制位以横移和前方拉扯为主，尽量吸引玩家视线
        moveDir=new THREE.Vector3().subVectors(baitAnchor,en.mesh.position);
        moveDir.addScaledVector(pRight,en.aiSide||1);
        speedMul=.66;
      }else{
        moveDir=new THREE.Vector3().subVectors(baitAnchor,en.mesh.position);
        speedMul=.78;
      }
    }else if(!guideRamp&&en.aiMode==='reposition'){
      moveDir=new THREE.Vector3(dirTo.z,0,-dirTo.x).multiplyScalar(en.aiSide||1);
      moveDir.addScaledVector(dirTo,-.7);
      speedMul=.86;
    }else if(!guideRamp){
      // rush：冲锋位会更积极直切，并带轻微蛇形，避免木讷直线
      var weave=Math.sin((performance.now()*0.001)*3.7+(en.mesh.id%7))*0.22;
      moveDir.addScaledVector(new THREE.Vector3(dirTo.z,0,-dirTo.x),(en.aiSide||1)*weave);
      speedMul=(en.aiMode==='rush')?1.18:1.06;
    }
    if(isFinishing){
      en.canStrike=false;
      if(dist<finisherSafeR){
        moveDir=dirTo.clone().multiplyScalar(-1);
        speedMul=1.25;
      }else{
        // 到达安全圈后原地待命，避免沿墙拱动造成“空气墙”观感
        moveDir.set(0,0,0);
        speedMul=0;
      }
    }
    if(!en.canStrike&&dist<en.data.atkRange*1.35){
      // 非攻击位会重整：绕后位轻退，牵制位明显后撤
      var retreat=en.aiMode==='flank_back'?.52:1.15;
      moveDir.addScaledVector(dirTo,-retreat);
      speedMul*=en.aiMode==='flank_back'?.95:.88;
    }
    if(sep.lengthSq()>1e-6){
      moveDir.addScaledVector(sep.normalize(),.9);
    }
    if(moveDir.lengthSq()>1e-6)moveDir.normalize();
    var holdAtSafeRing=isFinishing&&enLayer===playerLayer&&dist>=finisherSafeR&&dist<=finisherSafeR+.9;
    if((dist>en.data.atkRange*.9||en.aiMode!=='bait')&&!holdAtSafeRing){
      var stepLen=en.data.speed*speedMul*dt;
      var steer=pickSteerDir(en.mesh.position,moveDir,stepLen,pp,enLayer,ENEMY_COLLIDER_R);
      var step=steer.dir.multiplyScalar(stepLen);
      var enNext=moveWithMapCollision(en.mesh.position,step,ENEMY_COLLIDER_R,enLayer);
      var advance=enNext.distanceTo(en.mesh.position);
      if(advance<stepLen*.2){
        en.aiSide*=-1;
        if(en.aiMode==='rush'||en.aiMode==='bait')en.aiMode='flank_back';
        else en.aiMode='reposition';
        en.roleTimer=Math.min(en.roleTimer||1,.25);
      }
      en.mesh.position.copy(enNext);
      var ramped=applyEnemyWalkRamp(en);
      en.mesh.position.y=ramped?(en.mesh.position.y):(baseY);
      clampEnemyToGround(en);
      en.mesh.lookAt(pp.x,en.mesh.position.y,pp.z);
    }
    if(!isFinishing&&enLayer===playerLayer&&dist<en.data.atkRange&&en.canStrike){
      en.atkTimer-=dt;
      if(en.atkTimer<=0){en.atkTimer=en.data.atkRate;damagePlayer(en.data.damage);}
    }else{
      // 非攻击位保持压迫但延迟出手，避免蜂拥同步拍击
      en.atkTimer=Math.max(en.atkTimer,.28+Math.random()*.2);
    }
  });
}

/* ================================================================
   体术提示
================================================================ */
function checkFinishPrompt(){
  if(isFinishing||!player)return;
  var exeCfg=getExecuteCfg(currentChar);
  var exeRange=exeCfg.range||2.4,exeBest=null,exeD=exeRange;
  enemies.forEach(function(en){
    if(!isValidExecuteTarget(en))return;
    var d=player.position.distanceTo(en.mesh.position);
    if(d>exeD)return;
    exeD=d;exeBest=en;
  });
  canExecute=!!exeBest;executeTarget=exeBest;

  var range=CHARS[currentChar].finisherRange,best=null,bd=range;
  enemies.forEach(function(en){
    if(!isValidFinisherTarget(en))return;
    var d=player.position.distanceTo(en.mesh.position);
    if(d<bd){bd=d;best=en;}
  });
  canFinish=!!best;finishTarget=best;

  var p2=document.getElementById('finisher-prompt');
  if(canFinish&&canExecute){
    p2.textContent='[ F ] 体术  [ G ] 处决';
    p2.style.display='block';
  }else if(canFinish){
    p2.textContent='[ F ] 体术';
    p2.style.display='block';
  }else if(canExecute){
    p2.textContent='[ G ] 处决';
    p2.style.display='block';
  }else{
    p2.style.display='none';
  }
}

/* ================================================================
   摄像机（越肩 TPS + 体术推镜）
================================================================ */
function tickCamera(){
  if(!player)return;
  camera.up.set(0,1,0);
  var px=player.position.x,py=player.position.y,pz=player.position.z;
  var sinY=Math.sin(camYaw),cosY=Math.cos(camYaw);
  var cosP=Math.cos(camPitch),sinP=Math.sin(camPitch);

  var dist=CAM_DIST;
  if(camAnim&&isFinishing&&finAnim){
    var profile=camAnim.profile||{};
    var prog=clamp01(finAnim.t/Math.max(camAnim.dur,.001));
    var hitProg=clamp01(camAnim.hitAt/Math.max(camAnim.dur,.001));
    var attackT=hitProg>0?clamp01(prog/hitProg):1;
    var recoverT=(prog-hitProg)/Math.max(1-hitProg,.001);
    recoverT=clamp01(recoverT);
    var orbit=(profile.orbit||.3)*Math.sin(prog*Math.PI);
    var cy=camYaw+orbit;
    var cSin=Math.sin(cy),cCos=Math.cos(cy);
    var side=(profile.side||1.0)*(prog<hitProg?1:.9);
    var back=(profile.back||1.2);
    var rise=(profile.rise||.2);
    var weskerFrontClose=false;
    var weskerTopView=false;
    var weskerTopSpin=0;
    if(finAnim.isExecution){
      if(finAnim.charId==='hunk'&&finAnim.enemy&&finAnim.enemy.mesh){
        // 敌人第一视角：看见红眼 HUNK 逼近，最终镜头侧歪（断颈）
        var en=finAnim.enemy;
        var s=(en.data&&en.data.scale)||1;
        var ep=en.mesh.position.clone();
        var efwd=new THREE.Vector3(Math.sin(en.mesh.rotation.y),0,Math.cos(en.mesh.rotation.y));
        var eright=new THREE.Vector3(efwd.z,0,-efwd.x);
        var approachT=hitProg>0?clamp01(prog/Math.max(hitProg*.74,.001)):1;
        var lockT=hitProg>0?clamp01((prog-hitProg*.58)/Math.max(hitProg*.30,.001)):0;
        var neckT=hitProg>0?clamp01((prog-hitProg*.90)/Math.max(hitProg*.10,.001)):0;
        var breath=(1-neckT)*(1-.45*lockT);
        var eyePos=ep.clone()
          .addScaledVector(efwd,.08)
          .addScaledVector(eright,.028*Math.sin(prog*Math.PI*3.2)*breath);
        eyePos.y=(en.mesh.position.y+HUNK_EXEC_POV_EYE_H*s)+(Math.sin(prog*Math.PI*5.4)*.012*breath);
        // 前段慢慢贴近受害者眼位，后段固定在被控制姿态
        var eyeLerp=lerp(.16,.46,eOut(approachT));
        camera.position.lerp(eyePos,eyeLerp);

        var look=player.position.clone();
        look.y=player.position.y+1.36;
        // 中段“盯脸”压迫：先缩小摆动，再在断颈时瞬间偏折
        look.addScaledVector(eright,.06*Math.sin(prog*Math.PI*2.2)*(1-lockT));
        look.y+=.04*Math.sin(prog*Math.PI*2.8)*(1-lockT);
        // 末段被拧断脖子时，视角向右下偏斜
        look.addScaledVector(eright,.34*neckT);
        look.y-=.48*neckT;
        var neckRoll=lerp(0,-1.42,eOut(neckT));
        lookAtWithRoll(camera,camera.position,look,neckRoll);

        var baseFov=lerp(70,HUNK_EXEC_POV_FOV_IN,eOut(approachT));
        // 压迫停顿时略收窄，断颈瞬间急剧拉宽
        var holdFov=lerp(baseFov,HUNK_EXEC_POV_FOV_IN-6,eOut(lockT));
        var targetFov=lerp(holdFov,HUNK_EXEC_POV_FOV_BREAK,eOut(neckT));
        camera.fov=lerp(camera.fov,targetFov,.36);
        camera.updateProjectionMatrix();
        return;
      }
      if(finAnim.charId==='leon'){
        var rollProg=hitProg>0?clamp01(prog/(hitProg*.72)):0;
        var settleProg=hitProg<1?clamp01((prog-hitProg*.72)/Math.max(1-hitProg*.72,.001)):1;
        orbit += .18*Math.sin(rollProg*Math.PI*2.0)*(1-clamp01(settleProg));
        side += (prog<hitProg?.26:-.08);
        back += (prog<hitProg*.55?.32:-.10);
        rise += (prog<hitProg?.18:.06);
      }else if(finAnim.charId==='krauser'){
        var volleyT=hitProg>0?clamp01(prog/hitProg):1;
        orbit += .10*Math.sin(volleyT*Math.PI*3.6);
        side += (prog<hitProg?.28:.10);
        back += (prog<hitProg*.78?.32:-.06);
        rise += (prog<hitProg?.18:.28);
      }else if(finAnim.charId==='wesker'){
        var rushT=hitProg>0?clamp01(prog/hitProg):1;
        if(rushT<.62){
          // 快速转圈阶段：偏上帝视角，保证完整看到环绕全过程
          weskerTopView=true;
          weskerTopSpin=rushT;
          orbit += .18*Math.sin(rushT*Math.PI*4.4);
          side = lerp(side,.02,eOut(rushT/.62));
          back = lerp(back,2.76,eOut(rushT/.62));
          rise += lerp(.52,1.48,eOut(rushT/.62));
        }else if(rushT<.86){
          var prep=(rushT-.62)/.24;
          orbit += lerp(.10,-.26,eOut(prep));
          side = lerp(side,side*.52,eOut(prep));
          back = lerp(back,1.18,eOut(prep));
          rise += lerp(.14,.52,eOut(prep));
        }else{
          var dash=(rushT-.86)/.14;
          orbit += lerp(-.26,.04,dash);
          side = lerp(side*.52,.22,eOut(dash));
          back = lerp(1.18,.86,eOut(dash));
          rise += lerp(.52,.20,eOut(dash));
          // 终结冲刺段后半：切到 Wesker 正脸特写（背后目标在景深里）
          if(rushT>.95)weskerFrontClose=true;
        }
      }else if(finAnim.charId==='ada'){
        var swingT=hitProg>0?clamp01(prog/hitProg):1;
        if(swingT<.30){
          // 起手踢：中近景高速切入
          orbit += .16*Math.sin(swingT*Math.PI*2.8);
          side += .44;
          back += .64;
          rise += .24;
        }else if(swingT<.78){
          // 摆荡段：镜头做大圆弧，突出“钩索摆荡”
          var prepFlip=(swingT-.30)/.48;
          orbit += lerp(.42,-1.08,eOut(prepFlip));
          side += lerp(.44,.06,eOut(prepFlip));
          back = lerp(back,2.42,eOut(prepFlip));
          rise += lerp(.24,1.18,eOut(prepFlip));
        }else{
          // 二段踢：切到右前侧冲击特写
          var hitFlip=(swingT-.78)/.22;
          orbit += lerp(-1.08,.16,eOut(hitFlip));
          side += lerp(.06,.36,eOut(hitFlip));
          back = lerp(2.42,1.12,eOut(hitFlip));
          rise += lerp(1.18,.28,eOut(hitFlip));
        }
      }else if(finAnim.charId==='jill'){
        var jt=hitProg>0?clamp01(prog/hitProg):1;
        if(jt<.34){
          orbit += .26*Math.sin(jt*Math.PI*3.2);
          side += .38;
          back += .74;
          rise += .24;
        }else if(jt<.76){
          var prepRail=(jt-.34)/.42;
          orbit += lerp(.36,-.64,eOut(prepRail));
          side += lerp(.38,.08,eOut(prepRail));
          back = lerp(back,1.88,eOut(prepRail));
          rise += lerp(.24,.86,eOut(prepRail));
        }else{
          // 电磁炮发射窗口：抬到 Jill 右上后方，避免背部遮挡目标
          var blast=(jt-.76)/.24;
          orbit = lerp(.38,.44,eOut(blast));
          side = lerp(1.52,1.34,eOut(blast));
          back = lerp(2.18,1.96,eOut(blast));
          rise = lerp(1.34,1.12,eOut(blast));
        }
      }else if(finAnim.charId==='chris'){
        var ct=hitProg>0?clamp01(prog/hitProg):1;
        if(ct<.34){
          // 头槌段：靠近但保持两人同框
          orbit += .12*Math.sin(ct*Math.PI*2.4);
          side += .42;
          back += .78;
          rise += .32;
        }else if(ct<.66){
          // 蓄力段：镜头后撤并抬高，完整拍到踉跄与蓄力
          var prepPunch=(ct-.34)/.32;
          orbit += lerp(.22,-.38,eOut(prepPunch));
          side += lerp(.42,.18,eOut(prepPunch));
          back = lerp(back,2.52,eOut(prepPunch));
          rise += lerp(.32,1.18,eOut(prepPunch));
        }else{
          // 重拳段：机位与 Jill 发射段一致（右上后方）
          var punchCam=(ct-.66)/.34;
          orbit = lerp(.38,.44,eOut(punchCam));
          side = lerp(1.52,1.34,eOut(punchCam));
          back = lerp(2.40,2.18,eOut(punchCam));
          rise = lerp(1.48,1.24,eOut(punchCam));
        }
      }else if(finAnim.charId==='rose'){
        var rt=hitProg>0?clamp01(prog/hitProg):1;
        if(rt<.44){
          orbit += .18*Math.sin(rt*Math.PI*2.2);
          side += .52;
          back += 1.08;
          rise += .44;
        }else if(rt<.78){
          var prepV=(rt-.44)/.34;
          orbit += lerp(.34,-.22,eOut(prepV));
          side += lerp(.52,.26,eOut(prepV));
          back = lerp(back,2.62,eOut(prepV));
          rise += lerp(.44,1.34,eOut(prepV));
        }else{
          var sinkV=(rt-.78)/.22;
          orbit += lerp(-.22,.10,eOut(sinkV));
          side += lerp(.26,.32,eOut(sinkV));
          back = lerp(2.62,2.26,eOut(sinkV));
          rise += lerp(1.34,1.08,eOut(sinkV));
        }
      }
      cy=camYaw+orbit;
      cSin=Math.sin(cy);cCos=Math.cos(cy);
      // 所有处决统一后撤一点，避免贴脸看不全动作
      back*=EXEC_CAM_BACK_SCALE;
      side*=EXEC_CAM_SIDE_SCALE;
      if(weskerTopView&&finAnim.enemy&&finAnim.enemy.mesh){
        var ep=finAnim.enemy.mesh.position.clone();
        // 敌人置中的上帝视角，完整展示 Wesker 绕圈
        var ang=(weskerTopSpin*Math.PI*6.4)+(Math.PI*.25);
        var rad=2.85;
        var topPos=new THREE.Vector3(
          ep.x+Math.cos(ang)*rad,
          ep.y+3.85,
          ep.z+Math.sin(ang)*rad
        );
        camera.position.lerp(topPos,.38);
        camera.lookAt(ep.x,ep.y+.95,ep.z);
        camera.fov=lerp(camera.fov,51,.36);
        camera.updateProjectionMatrix();
        return;
      }
      if(weskerFrontClose&&player){
        var wf=new THREE.Vector3(-Math.sin(camYaw),0,-Math.cos(camYaw));
        var wr=new THREE.Vector3(wf.z,0,-wf.x);
        var face=player.position.clone().setY(player.position.y+1.30);
        // 正脸特写稍微后撤，给背后血雾留画面空间
        var closePos=face.clone().addScaledVector(wf,1.16).addScaledVector(wr,.14);
        camera.position.lerp(closePos,.42);
        // 稍微穿过脸部看向身后，让“背后血雾”在画面里
        var lookPos=face.clone().addScaledVector(wf,-.78);
        if(finAnim.enemy&&finAnim.enemy.mesh){
          lookPos.lerp(finAnim.enemy.mesh.position.clone().setY(finAnim.enemy.mesh.position.y+1.0),.4);
        }
        camera.lookAt(lookPos);
        camera.fov=lerp(camera.fov,41,.46);
        camera.updateProjectionMatrix();
        return;
      }
    }
    var pivotY=py+CAM_H*.85+rise*Math.sin(attackT*Math.PI);
    var mx=px,mz=pz;
    if(finAnim.enemy&&finAnim.enemy.mesh){
      mx=(px+finAnim.enemy.mesh.position.x)*.5;
      mz=(pz+finAnim.enemy.mesh.position.z)*.5;
      pivotY=lerp(pivotY,finAnim.enemy.mesh.position.y+1.0,.55);
    }
    var tx=mx+cSin*back+cCos*side;
    var ty=pivotY+Math.sin(prog*Math.PI)*.1;
    var tz=mz+cCos*back-cSin*side;
    camera.position.lerp(new THREE.Vector3(tx,ty,tz),.28);

    var lookDist=profile.look||7.5;
    var lx=mx-cSin*lookDist,ly=pivotY-sinP*3.2,lz=mz-cCos*lookDist;
    if(finAnim.enemy&&finAnim.enemy.mesh){
      var lookMix=.6,lookMixY=.7;
      if(finAnim.isExecution&&finAnim.charId==='jill'){
        var jprog=hitProg>0?clamp01(prog/hitProg):1;
        if(jprog>=.76){
          // 发射瞬间更强“右上过肩盯目标”，保证敌人不被挡住
          lookMix=.90;
          lookMixY=.92;
        }
      }else if(finAnim.isExecution&&finAnim.charId==='chris'){
        var cprog=hitProg>0?clamp01(prog/hitProg):1;
        if(cprog>=.66){
          // 轰拳段同样使用右上过肩盯目标
          lookMix=.90;
          lookMixY=.92;
        }
      }else if(finAnim.isExecution&&finAnim.charId==='rose'){
        var rprog=hitProg>0?clamp01(prog/hitProg):1;
        if(rprog>=.44){
          lookMix=.92;
          lookMixY=.93;
        }
      }
      lx=lerp(lx,finAnim.enemy.mesh.position.x,lookMix);
      ly=lerp(ly,finAnim.enemy.mesh.position.y+1.0,lookMixY);
      lz=lerp(lz,finAnim.enemy.mesh.position.z,lookMix);
    }
    camera.lookAt(lx,ly,lz);

    var fIn=profile.fovIn||58,fHit=profile.fovHit||48,targetFov=70;
    if(finAnim.isExecution&&finAnim.charId==='wesker'&&prog<hitProg){
      var wt=hitProg>0?clamp01(prog/hitProg):1;
      if(wt<.70){
        targetFov=lerp(70,fIn,eOut(wt/.70));
      }else{
        // 终结冲刺前慢动作推镜
        targetFov=lerp(fIn,40,eOut((wt-.70)/.30));
      }
    }else if(finAnim.isExecution&&finAnim.charId==='ada'&&prog<hitProg){
      var at=hitProg>0?clamp01(prog/hitProg):1;
      if(at<.74){
        targetFov=lerp(70,fIn,eOut(at/.74));
      }else{
        // 二段踢前推镜
        targetFov=lerp(fIn,34,eOut((at-.74)/.26));
      }
    }else if(finAnim.isExecution&&finAnim.charId==='jill'&&prog<hitProg){
      var jt2=hitProg>0?clamp01(prog/hitProg):1;
      if(jt2<.72){
        targetFov=lerp(70,fIn,eOut(jt2/.72));
      }else{
        // 电磁炮发射前重度推镜，保留环境信息
        targetFov=lerp(fIn,34,eOut((jt2-.72)/.28));
      }
    }else if(finAnim.isExecution&&finAnim.charId==='chris'&&prog<hitProg){
      var ct2=hitProg>0?clamp01(prog/hitProg):1;
      if(ct2<.70){
        targetFov=lerp(70,fIn,eOut(ct2/.70));
      }else{
        // 重拳爆发前推镜，保留人物和受击目标
        targetFov=lerp(fIn,36,eOut((ct2-.70)/.30));
      }
    }else if(finAnim.isExecution&&finAnim.charId==='rose'&&prog<hitProg){
      var rt2=hitProg>0?clamp01(prog/hitProg):1;
      if(rt2<.78){
        targetFov=lerp(70,fIn,eOut(rt2/.78));
      }else{
        targetFov=lerp(fIn,40,eOut((rt2-.78)/.22));
      }
    }else if(prog<hitProg)targetFov=lerp(70,fIn,eOut(attackT));
    else if(camAnim.snapFOV)targetFov=lerp(fHit,70,eOut(recoverT));
    else targetFov=fHit;
    camera.fov=lerp(camera.fov,targetFov,.35);camera.updateProjectionMatrix();
    return;
  }

  aimBlend=lerp(aimBlend,(aimDown&&!isFinishing)?1:0,.2);
  var aimDist=lerp(CAM_DIST,1.12,aimBlend);
  var aimShoulder=lerp(CAM_SH,CAM_SH+.24,aimBlend);
  var aimLook=lerp(CAM_LOOK,22,aimBlend);
  var aimHeight=CAM_H+aimBlend*.06;

  // RE4 风格：相机锚点在右肩，镜头始终看向角色前方目标点
  var ax=px+cosY*aimShoulder,ay=py+aimHeight,az=pz-sinY*aimShoulder;
  var tx=ax+sinY*cosP*aimDist,ty=ay+sinP*aimDist,tz=az+cosY*cosP*aimDist;
  if(execCutBlendTimer>0&&execCutFromPos&&execCutFromLook){
    var bt=1-execCutBlendTimer/Math.max(HUNK_EXEC_BLEND_DUR,.001);
    bt=clamp01(eOut(bt));
    var nx=ax-sinY*cosP*aimLook,ny=ay-sinP*aimLook,nz=az-cosY*cosP*aimLook;
    var bPos=new THREE.Vector3(
      lerp(execCutFromPos.x,tx,bt),
      lerp(execCutFromPos.y,ty,bt),
      lerp(execCutFromPos.z,tz,bt)
    );
    var bLook=new THREE.Vector3(
      lerp(execCutFromLook.x,nx,bt),
      lerp(execCutFromLook.y,ny,bt),
      lerp(execCutFromLook.z,nz,bt)
    );
    camera.position.copy(bPos);
    camera.lookAt(bLook);
    camera.fov=lerp(execCutFromFov||70,70,bt);
    camera.updateProjectionMatrix();
    return;
  }
  camera.position.lerp(new THREE.Vector3(tx,ty,tz),isFinishing?.25:CAM_SMOOTH);
  camera.lookAt(ax-sinY*cosP*aimLook,ay-sinP*aimLook,az-cosY*cosP*aimLook);
  camera.fov=lerp(camera.fov,lerp(70,57,aimBlend),.2);
  camera.updateProjectionMatrix();
}

/* ================================================================
   计时 & HUD
================================================================ */
function tickTimers(dt){
  if(combo>0){comboTimer-=dt;if(comboTimer<=0){combo=0;refreshScoreHUD();}}
  if(timeAddTimer>0){timeAddTimer-=dt;if(timeAddTimer<=0)document.getElementById('time-add').style.opacity='0';}
  if(zoneTimer>0){zoneTimer-=dt;if(zoneTimer<=0)document.getElementById('zone-hit').style.opacity='0';}
  refreshSkillHUD();
  timeLeft-=dt;refreshTimerHUD();
  if(timeLeft<=0){timeLeft=0;refreshTimerHUD();endGame();return;}
  spawnTimer+=dt;if(spawnTimer>=SPAWN_INT){spawnTimer=0;spawnEnemy();}
}

function refreshScoreHUD(){
  document.getElementById('score-val').textContent=score.toLocaleString();
  var cb=document.getElementById('combo-box');cb.style.opacity=combo>1?'1':'0';
  document.getElementById('combo-val').textContent='x'+combo;
}
function refreshTimerHUD(){
  var m=Math.floor(timeLeft/60),s=Math.floor(timeLeft%60);
  var el=document.getElementById('timer');
  el.textContent=m+':'+String(s).padStart(2,'0');
  el.className=timeLeft<30?'danger':'';
}
function refreshHPHUD(){
  var r=playerHP/playerMaxHP;
  var bar=document.getElementById('hp-fill');
  bar.style.width=(r*100)+'%';
  bar.style.background=r>.5?'#0f0':r>.25?'#fa0':'#f33';
}
function refreshWeaponHUD(){
  var wp=CHARS[currentChar].weapons[weaponIndex];
  document.getElementById('char-info-weapon').textContent=wp.name;
  var reserve=(typeof wp.reserve==='number')?wp.reserve:Math.max(0,(AMMO_MAX[wp.name]||0)-Math.max(0,wp.ammo||0));
  if(reloadState&&reloadState.idx===weaponIndex){
    document.getElementById('ammo').textContent='RELOAD '+Math.max(0,reloadState.time).toFixed(1)+'s';
  }else{
    document.getElementById('ammo').textContent=wp.ammo===-1?'∞':wp.ammo+' / '+reserve;
  }
}
function refreshSkillHUD(){
  if(!currentChar)return;
  var sk=CHARS[currentChar].skill,el=document.getElementById('char-info-skill');
  if(skillActive){
    var remain=skillActive.dur>0?(' '+skillTimer.toFixed(1)+'s'):'';
    el.textContent='SKILL: '+sk.name+' [ACTIVE'+remain+']';
    return;
  }
  if(skillCD>0){
    el.textContent='SKILL: '+sk.name+' [CD '+skillCD.toFixed(1)+'s]';
    return;
  }
  el.textContent='SKILL: '+sk.name+' [E READY]';
}
function showTimeAdd(txt){
  var el=document.getElementById('time-add');el.textContent=txt;el.style.opacity='1';timeAddTimer=1.5;
}
function showZone(txt,col){
  var el=document.getElementById('zone-hit');el.textContent=txt;el.style.color=col;el.style.opacity='1';zoneTimer=.7;
}

/* ================================================================
   游戏结束 + 评分 (Step 4)
================================================================ */
function endGame(){
  if(gameState==='over')return;
  gameState='over';
  bowDraw.active=false;bowDraw.hold=0;bowDraw.t=0;
  projectiles.forEach(function(p){scene.remove(p.mesh);});
  projectiles.length=0;
  document.getElementById('hud').style.display='none';
  document.getElementById('finisher-prompt').style.display='none';

  // 计算等级
  var rank='D';
  for(var i=0;i<RANKS.length;i++){if(score>=RANKS[i].min){rank=RANKS[i].label;break;}}

  var el=document.getElementById('game-over');el.style.display='flex';
  document.getElementById('final-score').textContent='SCORE  '+score.toLocaleString();
  document.getElementById('final-kills').textContent='KILLS  '+kills;
  document.getElementById('rank-val').textContent=rank;

  if(document.exitPointerLock)document.exitPointerLock();
}
</script>
