<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>FPS</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;overflow:hidden;font-family:'Courier New',monospace}
#c{display:block;width:100vw;height:100vh;cursor:none}
#ui{position:fixed;inset:0;pointer-events:none;color:#fff}

#xhair{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:24px;height:24px}
.xh{position:absolute;background:#fff;opacity:.9;transition:all .06s}
#xh-t{width:2px;height:8px;top:0;left:11px}
#xh-b{width:2px;height:8px;bottom:0;left:11px}
#xh-l{width:8px;height:2px;left:0;top:11px}
#xh-r{width:8px;height:2px;right:0;top:11px}
#xh-dot{width:3px;height:3px;top:10.5px;left:10.5px;border-radius:50%;background:red;opacity:.8;position:absolute}
.spread #xh-t{top:-5px}.spread #xh-b{bottom:-5px}.spread #xh-l{left:-5px}.spread #xh-r{right:-5px}
#xhair.headshot .xh{background:#ffd700;opacity:1;box-shadow:0 0 5px #ffd700}
#xhair.headshot #xh-dot{background:#ffd700;opacity:1;box-shadow:0 0 8px #ffd700;width:5px;height:5px;top:9.5px;left:9.5px}
#xhair.kill .xh{background:#e94560;opacity:1;box-shadow:0 0 6px #e94560}
#xhair.kill #xh-dot{background:#fff;opacity:1;transform:scale(2.2);box-shadow:0 0 10px #fff}

#hp-wrap{position:absolute;bottom:40px;left:40px}
#hp-bg{width:180px;height:10px;background:rgba(255,255,255,.15);border-radius:2px}
#hp-fill{height:10px;background:#e94560;border-radius:2px;transition:width .15s}
#hp-num{font-size:13px;color:#aaa;margin-top:3px}

#ammo-wrap{position:absolute;bottom:40px;right:40px;text-align:right}
#ammo-main{font-size:40px;font-weight:bold;line-height:1}
#ammo-sep{color:#555;font-size:28px;margin:0 4px}
#ammo-res{font-size:28px;color:#888}
#ammo-label{font-size:11px;color:#555;margin-top:2px;letter-spacing:2px}
#reload-bar{width:0;height:3px;background:#f0a500;margin-top:4px;border-radius:2px}

#score-wrap{position:absolute;top:20px;left:50%;transform:translateX(-50%);text-align:center}
#score-num{font-size:24px;font-weight:bold;color:#f0a500;letter-spacing:3px}
#kill-streak{font-size:12px;color:#e94560;height:16px;letter-spacing:2px}

#pain{position:absolute;inset:0;pointer-events:none;background:rgba(233,69,96,0);transition:background .08s}
#lowblood{position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 0px #e94560;transition:box-shadow .3s}

#overlay{position:absolute;inset:0;background:rgba(0,0,0,.88);display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:all}
#overlay h1{font-size:52px;letter-spacing:10px;color:#e94560;text-shadow:0 0 30px #e94560;margin-bottom:8px}
#overlay .sub{color:#555;font-size:14px;letter-spacing:3px;margin-bottom:32px}
.key-hint{color:#888;font-size:13px;margin:4px 0}
.key-hint b{color:#ddd;background:#222;padding:2px 6px;border-radius:3px;margin:0 2px}
#startBtn{margin-top:28px;padding:14px 60px;background:#e94560;color:#fff;border:none;border-radius:4px;font-size:16px;letter-spacing:4px;cursor:pointer;font-family:inherit}
#startBtn:hover{background:#c73652}

#dead{display:none;position:absolute;inset:0;background:rgba(0,0,0,.9);flex-direction:column;align-items:center;justify-content:center;pointer-events:all}
#dead h1{font-size:60px;color:#e94560;letter-spacing:8px;text-shadow:0 0 40px #e94560;animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
#dead-stats{color:#888;font-size:16px;margin:20px 0;line-height:2.2}
#dead-stats span{color:#fff}
#restartBtn{padding:12px 50px;background:#e94560;color:#fff;border:none;border-radius:4px;font-size:16px;letter-spacing:4px;cursor:pointer;font-family:inherit}

.dmgnum{position:absolute;font-size:18px;font-weight:bold;color:#ff4444;pointer-events:none;text-shadow:1px 1px 2px #000;animation:floatup .8s ease-out forwards}
.dmgnum.headshot{color:#ffd700;font-size:22px;text-shadow:0 0 8px #ffd700,1px 1px 2px #000}
.kill-banner{position:absolute;top:38%;left:50%;transform:translateX(-50%);font-size:20px;font-weight:bold;color:#e94560;letter-spacing:3px;text-shadow:0 0 14px #e94560;pointer-events:none;animation:killpop .9s ease-out forwards;font-family:'Courier New',monospace}
.kill-banner.headshot-kill{color:#ffd700;text-shadow:0 0 14px #ffd700,0 0 28px #e94560}
.headshot-tag{position:absolute;top:calc(50% + 18px);left:50%;transform:translateX(-50%);font-size:11px;font-weight:bold;color:#ffd700;letter-spacing:3px;text-shadow:0 0 6px #ffd700;pointer-events:none;animation:killpop .7s ease-out forwards}
@keyframes killpop{0%{opacity:0;transform:translateX(-50%) scale(.7)}18%{opacity:1;transform:translateX(-50%) scale(1.05)}72%{opacity:1;transform:translateX(-50%) scale(1)}100%{opacity:0;transform:translateX(-50%) translateY(-18px)}}
/* 暂停界面 */
#pause{display:none;position:absolute;inset:0;background:rgba(0,0,0,.75);flex-direction:column;align-items:center;justify-content:center;pointer-events:all}
#pause h1{font-size:42px;letter-spacing:8px;color:#f0a500;margin-bottom:28px}
#pause-stats{color:#aaa;font-size:16px;line-height:2.4;text-align:center;margin-bottom:28px}
#pause-stats span{color:#fff;font-weight:bold}
#pause-stats .label{color:#555;font-size:12px;letter-spacing:2px;display:block}
.pause-btns{display:flex;gap:16px}
.pause-btns button{padding:12px 36px;border:none;border-radius:4px;font-size:15px;letter-spacing:3px;cursor:pointer;font-family:'Courier New',monospace}
#resumeBtn{background:#f0a500;color:#000}
#resumeBtn:hover{background:#d4920a}
#pause-restartBtn{background:#333;color:#fff}
#pause-restartBtn:hover{background:#444}

/* ── 波次HUD ── */
#wave-hud{position:absolute;top:20px;left:40px;pointer-events:none}
#wave-label{font-size:13px;color:#aaa;letter-spacing:3px;margin-bottom:4px}
#wave-num{font-size:28px;font-weight:bold;color:#f0a500;letter-spacing:4px;line-height:1}
#wave-progress-bg{width:160px;height:5px;background:rgba(255,255,255,.12);border-radius:2px;margin-top:6px}
#wave-progress-fill{height:5px;background:#f0a500;border-radius:2px;transition:width .3s}
#wave-kills{font-size:11px;color:#666;margin-top:3px;letter-spacing:1px}
#wave-timer{font-size:13px;color:#888;margin-top:4px;letter-spacing:2px}
#wave-timer.urgent{color:#e94560;animation:pulse .5s infinite}
#wave-announce{position:absolute;top:38%;left:50%;transform:translateX(-50%);
  font-size:52px;font-weight:bold;letter-spacing:10px;color:#f0a500;
  text-shadow:0 0 30px #f0a500;pointer-events:none;opacity:0;
  transition:opacity .15s;font-family:'Courier New',monospace}

/* ── 技能冷却UI ── */
#skill-ui{position:absolute;bottom:36px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:4px;pointer-events:none}
#skill-key{font-size:11px;color:#555;letter-spacing:3px}
#skill-ring{position:relative;width:52px;height:52px}
#skill-ring svg{position:absolute;top:0;left:0;transform:rotate(-90deg)}
#skill-ring-bg{stroke:#222;fill:none;stroke-width:4}
#skill-ring-fill{stroke:#f0a500;fill:none;stroke-width:4;stroke-linecap:round;transition:stroke-dashoffset .05s linear}
#skill-icon{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:20px}
#skill-cd-text{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:bold;color:#fff;font-family:'Courier New',monospace}
#skill-name{font-size:10px;color:#666;letter-spacing:2px;text-align:center}
#skill-active-banner{position:absolute;top:30%;left:50%;transform:translateX(-50%);font-size:18px;font-weight:bold;letter-spacing:4px;pointer-events:none;opacity:0;transition:opacity .2s;font-family:'Courier New',monospace;text-shadow:0 0 12px currentColor}

/* 幽灵冲刺残影 */
@keyframes dashtrail{0%{opacity:.6}100%{opacity:0;transform:scale(1.3)}}

@keyframes floatup{0%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-50px)}}

/* ── 角色选择界面 ── */
#char-select{position:absolute;inset:0;background:rgba(0,0,0,.95);display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:all;z-index:100}
#char-select h1{font-size:38px;letter-spacing:10px;color:#e94560;text-shadow:0 0 24px #e94560;margin-bottom:6px}
#char-select .sub{color:#555;font-size:13px;letter-spacing:4px;margin-bottom:36px}
#cards{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:32px;justify-content:center;max-width:1100px}
.char-card{width:148px;background:#111;border:2px solid #333;border-radius:6px;padding:14px 10px;cursor:pointer;transition:border-color .15s,transform .15s,background .15s;user-select:none}
.char-card:hover{border-color:#666;background:#1a1a1a;transform:translateY(-3px)}
.char-card.selected{border-color:#e94560;background:#1a0509;transform:translateY(-6px);box-shadow:0 0 20px rgba(233,69,96,.35)}
.char-card .cname{font-size:15px;font-weight:bold;letter-spacing:3px;margin-bottom:2px}
.char-card .ctitle{font-size:10px;color:#555;letter-spacing:2px;margin-bottom:10px}
.char-card .cweapon{font-size:10px;color:#888;margin-bottom:12px;line-height:1.5}
.char-card .stat-row{display:flex;align-items:center;gap:6px;margin-bottom:5px}
.char-card .stat-label{font-size:9px;color:#555;width:28px;letter-spacing:1px}
.char-card .stat-bar{flex:1;height:4px;background:#222;border-radius:2px}
.char-card .stat-fill{height:4px;border-radius:2px}
.char-card .skill-row{margin-top:10px;padding-top:8px;border-top:1px solid #222}
.char-card .skill-text{font-size:9px;color:#666;line-height:1.5}
.char-card .skill-text b{color:#aaa}
#confirm-btn{padding:13px 64px;background:#e94560;color:#fff;border:none;border-radius:4px;font-size:16px;letter-spacing:5px;cursor:pointer;font-family:'Courier New',monospace;transition:background .15s}
#confirm-btn:hover{background:#c73652}
#confirm-btn:disabled{background:#333;color:#555;cursor:default}
#char-quote{height:24px;color:#888;font-size:13px;letter-spacing:2px;margin-bottom:16px;font-style:italic;transition:opacity .3s}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <div id="xhair" style="display:none">
    <div class="xh" id="xh-t"></div>
    <div class="xh" id="xh-b"></div>
    <div class="xh" id="xh-l"></div>
    <div class="xh" id="xh-r"></div>
    <div class="xh" id="xh-dot"></div>
  </div>
  <div id="pain"></div>
  <div id="lowblood"></div>
  <!-- 波次HUD（游戏开始后才显示）-->
  <div id="wave-hud" style="display:none">
    <div id="wave-label">WAVE</div>
    <div id="wave-num">—</div>
    <div id="wave-progress-bg"><div id="wave-progress-fill" style="width:0%"></div></div>
    <div id="wave-kills">0 / 0</div>
    <div id="wave-timer"></div>
  </div>
  <div id="wave-announce"></div>
  <div id="hp-wrap" style="display:none">
    <div style="font-size:20px;margin-bottom:4px">❤️</div>
    <div id="hp-bg"><div id="hp-fill" style="width:100%"></div></div>
    <div id="hp-num">100 / 100</div>
    <div id="passive-stack" style="margin-top:6px;font-size:12px;color:#e94560;letter-spacing:2px;height:16px"></div>
    <div id="medkit-hud" style="margin-top:6px;font-size:13px;color:#444;letter-spacing:2px">[SHIFT] 💉 —</div>
  </div>
  <div id="ammo-wrap" style="display:none">
    <div><span id="ammo-main">30</span><span id="ammo-sep">/</span><span id="ammo-res">120</span></div>
    <div id="ammo-label">AMMO</div>
    <div id="reload-bar"></div>
  </div>
  <div id="score-wrap" style="display:none">
    <div id="score-num">0</div>
    <div id="kill-streak"></div>
  </div>
  <!-- 技能冷却UI（游戏开始后才显示）-->
  <div id="skill-ui" style="display:none">
    <div id="skill-key">[E] SKILL</div>
    <div id="skill-ring">
      <svg width="52" height="52" viewBox="0 0 52 52">
        <circle id="skill-ring-bg" cx="26" cy="26" r="22"/>
        <circle id="skill-ring-fill" cx="26" cy="26" r="22" stroke-dasharray="138.2" stroke-dashoffset="0"/>
      </svg>
      <div id="skill-icon">⚡</div>
      <div id="skill-cd-text"></div>
    </div>
    <div id="skill-name"></div>
  </div>
  <div id="skill-active-banner"></div>
  <!-- 猎手开镜覆盖层 -->
  <div id="scope-overlay" style="display:none;position:absolute;inset:0;pointer-events:none">
    <!-- 四周黑色遮罩（圆形镂空） -->
    <div style="position:absolute;inset:0;background:rgba(0,0,0,0.93);
      mask:radial-gradient(circle 140px at 50% 50%,transparent 99%,black 100%);
      -webkit-mask:radial-gradient(circle 140px at 50% 50%,transparent 99%,black 100%)"></div>
    <!-- 圆环边框 -->
    <div style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
      width:280px;height:280px;border-radius:50%;border:1.5px solid rgba(180,180,180,0.5)"></div>
    <!-- 水平十字线（左半段） -->
    <div style="position:absolute;top:50%;left:calc(50% - 140px);width:112px;height:1px;background:rgba(255,255,255,0.85);transform:translateY(-50%)"></div>
    <!-- 水平十字线（右半段） -->
    <div style="position:absolute;top:50%;left:calc(50% + 28px);width:112px;height:1px;background:rgba(255,255,255,0.85);transform:translateY(-50%)"></div>
    <!-- 垂直十字线（上半段） -->
    <div style="position:absolute;left:50%;top:calc(50% - 140px);height:112px;width:1px;background:rgba(255,255,255,0.85);transform:translateX(-50%)"></div>
    <!-- 垂直十字线（下半段） -->
    <div style="position:absolute;left:50%;top:calc(50% + 28px);height:112px;width:1px;background:rgba(255,255,255,0.85);transform:translateX(-50%)"></div>

    <div style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:5px;height:5px;border-radius:50%;background:rgba(255,40,40,0.9)"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
'use strict';

let audioCtx;
function getAudio(){
  if(!audioCtx) audioCtx=new(window.AudioContext||window.webkitAudioContext)();
  if(audioCtx.state==='suspended') audioCtx.resume();
  return audioCtx;
}
function playGunshot(){
  const ctx=getAudio(), sr=ctx.sampleRate;
  const buf=ctx.createBuffer(1,sr*0.22,sr);
  const d=buf.getChannelData(0);
  for(let i=0;i<d.length;i++){
    const t=i/sr;
    d[i]=Math.max(-1,Math.min(1,
      (Math.random()*2-1)*Math.exp(-t*35)*1.0+
      (Math.random()*2-1)*Math.exp(-t*18)*0.5+
      Math.sin(2*Math.PI*180*t)*Math.exp(-t*22)*0.3));
  }
  const src=ctx.createBufferSource(); src.buffer=buf;
  const f=ctx.createBiquadFilter(); f.type='lowpass'; f.frequency.value=4000;
  const g=ctx.createGain(); g.gain.value=1.0;
  src.connect(f); f.connect(g); g.connect(ctx.destination); src.start();
}
function playFlame(){
  const ctx=getAudio(), sr=ctx.sampleRate;
  const buf=ctx.createBuffer(1,Math.floor(sr*0.08),sr);
  const d=buf.getChannelData(0);
  for(let i=0;i<d.length;i++){
    const t=i/sr;
    d[i]=((Math.random()*2-1)*0.7+Math.sin(2*Math.PI*120*t)*0.2)*Math.exp(-t*12);
  }
  const src=ctx.createBufferSource(); src.buffer=buf;
  const f=ctx.createBiquadFilter(); f.type='bandpass'; f.frequency.value=520;
  const g=ctx.createGain(); g.gain.value=0.35;
  src.connect(f); f.connect(g); g.connect(ctx.destination); src.start();
}
function playVoltShot(){
  const ctx=getAudio();
  const osc=ctx.createOscillator();
  const osc2=ctx.createOscillator();
  const g=ctx.createGain();
  osc.type='square'; osc.frequency.setValueAtTime(560,ctx.currentTime);
  osc.frequency.exponentialRampToValueAtTime(180,ctx.currentTime+0.08);
  osc2.type='triangle'; osc2.frequency.setValueAtTime(820,ctx.currentTime);
  osc2.frequency.exponentialRampToValueAtTime(260,ctx.currentTime+0.09);
  g.gain.setValueAtTime(0.20,ctx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+0.10);
  osc.connect(g); osc2.connect(g); g.connect(ctx.destination);
  osc.start(); osc2.start();
  osc.stop(ctx.currentTime+0.10); osc2.stop(ctx.currentTime+0.10);
}
function playStep(){
  const ctx=getAudio(), sr=ctx.sampleRate;
  const buf=ctx.createBuffer(1,sr*0.07,sr);
  const d=buf.getChannelData(0);
  for(let i=0;i<d.length;i++){
    const t=i/sr;
    d[i]=(Math.random()*2-1)*Math.exp(-t*80)*0.25;
  }
  const src=ctx.createBufferSource(); src.buffer=buf;
  const g=ctx.createGain(); g.gain.value=0.3;
  src.connect(g); g.connect(ctx.destination); src.start();
}
function playHit(){
  const ctx=getAudio();
  const osc=ctx.createOscillator(), g=ctx.createGain();
  osc.type='sawtooth';
  osc.frequency.setValueAtTime(220,ctx.currentTime);
  osc.frequency.exponentialRampToValueAtTime(55,ctx.currentTime+0.15);
  g.gain.setValueAtTime(0.35,ctx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+0.15);
  osc.connect(g); g.connect(ctx.destination);
  osc.start(); osc.stop(ctx.currentTime+0.15);
}
function playReload(){
  const ctx=getAudio();
  [0,0.35].forEach(delay=>{
    const buf=ctx.createBuffer(1,ctx.sampleRate*0.1,ctx.sampleRate);
    const d=buf.getChannelData(0);
    for(let i=0;i<d.length;i++){
      const t=i/ctx.sampleRate;
      d[i]=(Math.random()*2-1)*Math.exp(-t*60)*0.5;
    }
    const src=ctx.createBufferSource(); src.buffer=buf;
    const g=ctx.createGain(); g.gain.value=0.4;
    src.connect(g); g.connect(ctx.destination);
    src.start(ctx.currentTime+delay);
  });
}
function playMelee(){
  const ctx=getAudio(), sr=ctx.sampleRate;
  const buf=ctx.createBuffer(1,sr*0.1,sr);
  const d=buf.getChannelData(0);
  for(let i=0;i<d.length;i++){
    const t=i/sr;
    d[i]=(Math.random()*2-1)*Math.exp(-t*50)*0.6;
  }
  const src=ctx.createBufferSource(); src.buffer=buf;
  const g=ctx.createGain(); g.gain.value=0.5;
  src.connect(g); g.connect(ctx.destination); src.start();
}
function playDeath(){
  const ctx=getAudio();
  const osc=ctx.createOscillator(), g=ctx.createGain();
  osc.type='sine';
  osc.frequency.setValueAtTime(440,ctx.currentTime);
  osc.frequency.exponentialRampToValueAtTime(110,ctx.currentTime+1.5);
  g.gain.setValueAtTime(0.3,ctx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+1.5);
  osc.connect(g); g.connect(ctx.destination);
  osc.start(); osc.stop(ctx.currentTime+1.5);
}
function playPickup(){
  const ctx=getAudio();
  const osc=ctx.createOscillator(), g=ctx.createGain();
  osc.type='sine'; osc.frequency.value=880;
  g.gain.setValueAtTime(0.2,ctx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+0.15);
  osc.connect(g); g.connect(ctx.destination);
  osc.start(); osc.stop(ctx.currentTime+0.15);
}

// ═══════════════════════════════════════════════
// 渲染器 & 场景
// ═══════════════════════════════════════════════
const canvas=document.getElementById('c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=false;

const scene=new THREE.Scene();
scene.fog=new THREE.FogExp2(0x1a1a2a,0.018);
scene.background=new THREE.Color(0x1a1a2a);

const camera=new THREE.PerspectiveCamera(80,1,0.05,150);
camera.position.set(2,1.7,2);

function resize(){
  renderer.setSize(innerWidth,innerHeight);
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();

function makeTex(fn,s=256){
  const cv=document.createElement('canvas'); cv.width=cv.height=s;
  fn(cv.getContext('2d'),s);
  const t=new THREE.CanvasTexture(cv);
  t.wrapS=t.wrapT=THREE.RepeatWrapping;
  return t;
}
const wallTex=makeTex((ctx,s)=>{
  ctx.fillStyle='#6a5a4a'; ctx.fillRect(0,0,s,s);
  for(let i=0;i<3000;i++){
    const v=Math.floor(Math.random()*40+80);
    ctx.fillStyle=`rgb(${v},${Math.floor(v*.9)},${Math.floor(v*.75)})`;
    ctx.fillRect(Math.random()*s,Math.random()*s,2,2);
  }
  ctx.strokeStyle='#3a2a1a'; ctx.lineWidth=2;
  const bw=64,bh=32;
  for(let row=0;row*bh<s+bh;row++){
    const off=row%2===0?0:bw/2;
    for(let col=-1;col*bw<s+bw;col++) ctx.strokeRect(col*bw+off+2,row*bh+2,bw-4,bh-4);
  }
}); wallTex.repeat.set(2,1);

const floorTex=makeTex((ctx,s)=>{
  ctx.fillStyle='#555'; ctx.fillRect(0,0,s,s);
  for(let i=0;i<2000;i++){
    const v=Math.floor(Math.random()*30+60);
    ctx.fillStyle=`rgb(${v},${v},${v})`;
    ctx.fillRect(Math.random()*s,Math.random()*s,3,3);
  }
  ctx.strokeStyle='#333'; ctx.lineWidth=1;
  for(let i=0;i<=s/64;i++){
    ctx.beginPath();ctx.moveTo(i*64,0);ctx.lineTo(i*64,s);ctx.stroke();
    ctx.beginPath();ctx.moveTo(0,i*64);ctx.lineTo(s,i*64);ctx.stroke();
  }
}); floorTex.repeat.set(6,6);

const ceilTex=makeTex((ctx,s)=>{
  ctx.fillStyle='#444'; ctx.fillRect(0,0,s,s);
  for(let i=0;i<1000;i++){
    const v=Math.floor(Math.random()*20+50);
    ctx.fillStyle=`rgb(${v},${v},${v})`;
    ctx.fillRect(Math.random()*s,Math.random()*s,2,2);
  }
}); ceilTex.repeat.set(4,4);

const PR=0.4;

// 性能优化：复用 Raycaster / Vector3，避免每帧分配
const tmp={
  ray:new THREE.Raycaster(),
  v3a:new THREE.Vector3(),
  v3b:new THREE.Vector3(),
  v3c:new THREE.Vector3(),
};

function isWall(x,z){
  const cx=Math.floor((x+OX)/CELL), cz=Math.floor((z+OZ)/CELL);
  if(cz<0||cz>=MR||cx<0||cx>=MC) return true;
  return MAP[cz][cx]===1;
}
function canMove(x,z){
  return !isWall(x-PR,z-PR)&&!isWall(x+PR,z-PR)&&!isWall(x-PR,z+PR)&&!isWall(x+PR,z+PR);
}
function moveEntity(ep,dx,dz,spd,dt){
  const distSq=dx*dx+dz*dz;
  if(distSq<0.0001) return;
  const dist=Math.sqrt(distSq);
  const nx=ep.x+dx/dist*spd*dt, nz=ep.z+dz/dist*spd*dt;
  if(canMove(nx,nz)){ep.x=nx;ep.z=nz;}
  else if(canMove(nx,ep.z)){ep.x=nx;}
  else if(canMove(ep.x,nz)){ep.z=nz;}
}

let currentGunMesh=null;
function switchGunModel(id){
  if(currentGunMesh){ gunGroup.remove(currentGunMesh); }
  currentGunMesh=GUN_BUILDERS[id]?GUN_BUILDERS[id]():GUN_BUILDERS.reaper();
  currentGunMesh.rotation.set(0,0,0);
  // 掘墓者视角武器翻转180°，让前端锤头/斧头可见
  if(id==='grave'){
    currentGunMesh.rotation.y=Math.PI;
    // 再绕持柄轴逆时针60°，让锤头/斧头朝下
    currentGunMesh.rotation.z=Math.PI/3;
  }
  gunGroup.add(currentGunMesh);
}

function updateParticles(dt){
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i]; p._age+=dt;
    if(p._age>=p._life){scene.remove(p);p.material.dispose();particles.splice(i,1);continue;}
    const grav=(p._grav===undefined)?12:p._grav;
    p._vy-=grav*dt;
    p.position.x+=p._vx*dt; p.position.y+=p._vy*dt; p.position.z+=p._vz*dt;
    p.material.opacity=Math.max(0,1-p._age/p._life);
  }
}

const drops=[];
const DROP_MAX_COUNT=40;     // 地面掉落最大数量，防止无限堆积
const DROP_LIFETIME=18;      // 掉落物存在时长（秒）

function rollDrop(kind){
  const r=Math.random();
  if(kind==='heavy') return 'ammo';
  if(kind==='berserker'){
    if(r<0.30) return 'ammo';
    if(r<0.60) return 'hp';
    if(r<0.75) return 'hpbig';
    return null;
  }
  if(kind==='sniper'){
    if(r<0.40) return 'ammo';
    if(r<0.65) return 'hp';
    if(r<0.75) return 'hpbig';
    return null;
  }
  // normal
  if(r<0.50) return 'ammo';
  if(r<0.70) return 'hp';
  if(r<0.75) return 'hpbig';
  return null;
}

function spawnDrop(pos,type){
  if(!type) return;
  const color=type==='ammo'?0xf0a500:type==='hp'?0x00cc44:0x00ffaa;
  const g=new THREE.Group();
  const box=new THREE.Mesh(
    new THREE.BoxGeometry(0.4,0.4,0.4),
    new THREE.MeshLambertMaterial({color,emissive:color,emissiveIntensity:0.4}));
  g.add(box);
  const pl=new THREE.PointLight(color,1.5,3); g.add(pl);
  g.position.set(pos.x,0.3,pos.z);
  scene.add(g);
  drops.push({group:g,box,type,bobPhase:Math.random()*Math.PI*2,life:DROP_LIFETIME});
  // 超出上限时，移除最旧掉落
  while(drops.length>DROP_MAX_COUNT){
    const oldest=drops.shift();
    if(oldest) scene.remove(oldest.group);
  }
}

function rollAmmoPickupAmount(){
  switch(P.charId){
    case 'reaper':   return 24+Math.floor(Math.random()*13); // 24-36
    case 'fortress': return 38+Math.floor(Math.random()*19); // 38-56
    case 'phantom':  return 6+Math.floor(Math.random()*5);   // 6-10
    case 'hawk':     return 3+Math.floor(Math.random()*4);   // 3-6
    case 'cowboy':   return 4+Math.floor(Math.random()*5);   // 4-8
    case 'volt':     return 3+Math.floor(Math.random()*4);   // 3-6
    case 'pyro':     return 28+Math.floor(Math.random()*17); // 28-44
    case 'grave':    return 0; // 掘墓者不用弹药
    case 'blade':    return 0; // 刺客不用弹药
    default:         return 15+Math.floor(Math.random()*16); // 15-30
  }
}

function pickupDrop(d,idx){
  scene.remove(d.group); drops.splice(idx,1);
  playPickup();
  if(d.type==='ammo'){
    const add=rollAmmoPickupAmount();
    P.reserve=Math.min(P.reserve+add,999);
    if(P.charId==='blade'||P.charId==='grave'){
      showPickupMsg('当前角色无需弹药','#f0a500');
    } else if(P.charId==='pyro'){
      showPickupMsg('+'+add+' 燃料','#ff6600');
    } else {
      showPickupMsg('+'+add+' 弹药','#f0a500');
    }
  } else if(d.type==='hp'){
    const before=P.hp;
    P.hp=Math.min(P.hp+25,P.maxHp);
    const actual=Math.round(P.hp-before);
    showPickupMsg(actual>0?'+'+actual+' HP':'血量已满','#00cc44');
    updateHpUI();
  } else {
    const before=P.hp;
    P.hp=Math.min(P.hp+50,P.maxHp);
    const actual=Math.round(P.hp-before);
    showPickupMsg(actual>0?'+'+actual+' HP ★':'血量已满','#00ffaa');
    updateHpUI();
  }
  updateAmmoUI();
}

function updateDrops(dt){
  for(let i=drops.length-1;i>=0;i--){
    const d=drops[i];
    d.life-=dt;
    if(d.life<=0){
      scene.remove(d.group);
      drops.splice(i,1);
      continue;
    }
    d.bobPhase+=dt*2.5;
    d.group.position.y=0.3+Math.sin(d.bobPhase)*0.12;
    d.box.rotation.y+=dt*2;
    d.box.material.emissiveIntensity=Math.sin(d.bobPhase*4)>0?0.6:0.2;
    const dx=camera.position.x-d.group.position.x;
    const dz=camera.position.z-d.group.position.z;
    if(dx*dx+dz*dz<1.44) pickupDrop(d,i);
  }
}

function makeFaceTex(eyeC,mouthC,bgC){
  const cv=document.createElement('canvas'); cv.width=cv.height=64;
  const ctx=cv.getContext('2d');
  ctx.fillStyle=bgC; ctx.fillRect(0,0,64,64);
  ctx.fillStyle=eyeC;
  ctx.beginPath();ctx.ellipse(20,22,7,6,0,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.ellipse(44,22,7,6,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#000';
  ctx.beginPath();ctx.arc(20,22,3,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(44,22,3,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle=mouthC; ctx.lineWidth=3;
  ctx.beginPath();ctx.moveTo(14,44);ctx.lineTo(20,40);ctx.lineTo(26,44);
  ctx.lineTo(32,38);ctx.lineTo(38,44);ctx.lineTo(44,40);ctx.lineTo(50,44);ctx.stroke();
  return new THREE.CanvasTexture(cv);
}

function m3(color){return new THREE.MeshLambertMaterial({color});}

function makeLimbs(g,bodyColor,legColor,armColor,bw,bh){
  bw=bw||0.7; bh=bh||1.1;
  const body=new THREE.Mesh(new THREE.BoxGeometry(bw,bh,0.4),m3(bodyColor));
  body.position.y=bh/2; g.add(body);
  const legL=new THREE.Mesh(new THREE.BoxGeometry(0.25,0.7,0.3),m3(legColor));
  legL.position.set(-0.2,-0.35,0); g.add(legL);
  const legR=legL.clone(); legR.position.x=0.2; g.add(legR);
  const armHalf=0.1, shoulderY=-0.15, armInset=0.05;
  const armL=new THREE.Mesh(new THREE.BoxGeometry(0.2,0.7,0.3),m3(armColor));
  armL.position.set(-bw/2-armHalf+armInset,shoulderY,0);
  body.add(armL);
  const armR=armL.clone();
  armR.position.set(bw/2+armHalf-armInset,shoulderY,0);
  body.add(armR);
  return {body,legL,legR,armL,armR};
}

  const cv=document.createElement('canvas'); cv.width=64;cv.height=8;
  const ctx=cv.getContext('2d');
  const tex=new THREE.CanvasTexture(cv);
  const spr=new THREE.Sprite(new THREE.SpriteMaterial({map:tex,depthTest:false}));
  spr.scale.set(1.4,0.16,1); spr.position.y=yOff; g.add(spr);
  return function(hp,max){
    ctx.fillStyle='#300'; ctx.fillRect(0,0,64,8);
    const pct=Math.max(0,hp/max);
    ctx.fillStyle=pct>0.5?'#0f0':pct>0.25?'#ff0':'#f00';
    ctx.fillRect(0,0,64*pct,8);
    tex.needsUpdate=true;
  };
}

const SPAWN_PTS=[
  [8,8],[16,8],[-8,8],[-16,8],
  [8,-8],[16,-8],[-8,-8],[-16,-8],
  [0,16],[0,-16],[12,0],[-12,0],
];

// 按坐标和波次组成安全刷怪
function trySpawnKind(x,z,kind){
  const cx=Math.floor((x+OX)/CELL), cz=Math.floor((z+OZ)/CELL);
  if(cz<0||cz>=MR||cx<0||cx>=MC||MAP[cz][cx]!==0) return null;
  let e;
  if(kind==='normal')     e=buildNormal(x,z);
  else if(kind==='berserker') e=buildBerserker(x,z);
  else if(kind==='heavy') e=buildHeavy(x,z);
  else if(kind==='sniper') e=buildSniper(x,z);
  else e=buildNormal(x,z);
  enemies.push(e);
  return e;
}

// 根据波次决定一个随机敌人类型
function rollKindForWave(waveNum){
  const r=Math.random();
  if(waveNum<=3){
    return 'normal'; // 热身全普通兵
  } else if(waveNum<=6){
    return r<0.55?'normal':r<0.85?'berserker':'heavy';
  } else if(waveNum<=10){
    return r<0.35?'normal':r<0.60?'berserker':r<0.82?'heavy':'sniper';
  } else {
    return r<0.20?'normal':r<0.45?'berserker':r<0.72?'heavy':'sniper';
  }
}

const WAVE={
  num:0,          // 当前波次（0=未开始）
  state:'idle',   // idle | active | between
  timer:0,        // 当前波次倒计时（秒）
  totalToSpawn:0, // 本波计划刷怪总数
  spawned:0,      // 已刷出数量
  killed:0,       // 本波已击杀数量
  maxOnField:12,  // 场上敌人上限
  spawnInterval:0,// 刷怪间隔计时
};

// 波次配置
function getWaveCfg(n){
  if(n<=3)  return {count:4+n,            timer:45, groupSize:1};
  if(n<=6)  return {count:7+n,            timer:40, groupSize:1};
  if(n<=10) return {count:11+n,           timer:30, groupSize:2};
             return {count:Math.min(20+n,30), timer:20, groupSize:3};
}

function startWave(n){
  WAVE.num=n;
  WAVE.state='active';
  const cfg=getWaveCfg(n);
  WAVE.totalToSpawn=cfg.count;
  WAVE.spawned=0;
  WAVE.killed=0;
  WAVE.timer=cfg.timer;
  WAVE.maxOnField=n<=3?10:n<=6?14:n<=10?18:24;
  WAVE.spawnInterval=0;
  WAVE._cfg=cfg;

  // 波次公告
  const ann=document.getElementById('wave-announce');
  ann.textContent='WAVE '+n;
  ann.style.opacity=1;
  setTimeout(()=>ann.style.opacity=0, 1800);

  updateWaveHUD();
}

// 波次期间刷怪（分批刷，按间隔）
function tickWaveSpawn(dt){
  if(WAVE.state!=='active') return;
  if(WAVE.spawned>=WAVE.totalToSpawn) return;
  if(enemies.length>=WAVE.maxOnField) return;

  WAVE.spawnInterval-=dt;
  if(WAVE.spawnInterval>0) return;

  // 计算本批刷几个
  const cfg=WAVE._cfg;
  const groupSize=cfg.groupSize||1;
  const toSpawn=Math.min(groupSize, WAVE.totalToSpawn-WAVE.spawned,
                         WAVE.maxOnField-enemies.length);

  // 随机选刷怪点（避免重叠，洗牌取前N个）
  const pts=[...SPAWN_PTS].sort(()=>Math.random()-0.5).slice(0,toSpawn);
  pts.forEach(([x,z])=>{
    const kind=rollKindForWave(WAVE.num);
    if(trySpawnKind(x,z,kind)) WAVE.spawned++;
  });

  // 刷怪间隔：随波次缩短
  WAVE.spawnInterval=WAVE.num<=3?3.5:WAVE.num<=6?2.5:WAVE.num<=10?1.8:1.0;
  updateWaveHUD();
}

// 每帧波次驱动
function tickWave(dt){
  if(WAVE.state==='idle') return;

  tickWaveSpawn(dt);

  if(WAVE.state==='active'){
    WAVE.timer-=dt;
    updateWaveTimerUI();

    // 判断结束条件：全灭 OR 倒计时到0
    const aliveCount=enemies.filter(e=>!e.dying).length;
    const allKilled=WAVE.spawned>=WAVE.totalToSpawn&&aliveCount===0;
    const timerUp=WAVE.timer<=0;

    if(allKilled||timerUp){
      // 清场奖励
      if(allKilled&&WAVE.timer>0){
        const bonus=Math.round(WAVE.timer)*10*WAVE.num;
        P.score+=bonus;
        updateScoreUI();
        showPassiveMsg('清场奖励 +'+bonus,'#f0a500');
      }
      // 每波结束补充一瓶治疗药剂（上限1）
      if(P.medkit<1){
        P.medkit=1;
        updateMedkitUI();
        showPassiveMsg('获得治疗药剂 💉','#00ffaa');
      }
      // 第8波后不给喘息
      if(WAVE.num>=8){
        setTimeout(()=>startWave(WAVE.num+1), 800);
      } else {
        WAVE.state='between';
        WAVE.timer=5; // 5秒间隔
        updateWaveHUD();
      }
    }
  }

  if(WAVE.state==='between'){
    WAVE.timer-=dt;
    updateWaveTimerUI();
    if(WAVE.timer<=0) startWave(WAVE.num+1);
  }
}

// 波次HUD更新
function updateWaveHUD(){
  document.getElementById('wave-num').textContent=
    WAVE.num>0?WAVE.num:'—';
  const kills=WAVE.killed, total=WAVE.totalToSpawn||1;
  document.getElementById('wave-kills').textContent=kills+' / '+total+' 击杀';
  const pct=Math.min(1,kills/total)*100;
  document.getElementById('wave-progress-fill').style.width=pct+'%';
}
function updateWaveTimerUI(){
  const el=document.getElementById('wave-timer');
  if(WAVE.state==='active'){
    const t=Math.ceil(WAVE.timer);
    el.textContent='下一波 '+t+'s';
    el.className=t<=5?'urgent':'';
  } else if(WAVE.state==='between'){
    const t=Math.ceil(WAVE.timer);
    el.textContent='准备… '+t+'s';
    el.className=t<=3?'urgent':'';
  } else {
    el.textContent=''; el.className='';
  }
}

// killEnemy 通知波次系统（替代旧的补位逻辑）
function onEnemyKilledForWave(){
  if(WAVE.state==='active') WAVE.killed++;
  updateWaveHUD();
}

// 玩家受伤统一入口（处理钢皮减伤等被动）
// source: 'ranged'=远程攻击, 'melee'=近战攻击, undefined=未分类
function damagePlayer(rawDmg,source){
  let dmg=rawDmg;
  // 被动：重火力钢皮减伤20%
  if(P.charId==='fortress') dmg=Math.round(dmg*0.8);
  // ── 刺客格挡 ──
  if(P.charId==='blade'&&P.bladeBlocking){
    // 反弹远程时也会承受10%伤害（与普通格挡一致）
    dmg=Math.max(1,Math.round(rawDmg*0.1)); // 格挡减伤90%，至少受1点
    if(source==='ranged'){
      // 远程攻击：反弹600%原始伤害至准星前方第一个敌人
      const reflectDmg=Math.round(rawDmg*6);
      tmp.ray.setFromCamera({x:0,y:0},camera);
      const eMeshes=enemies.flatMap(e=>e.meshes);
      const rHits=tmp.ray.intersectObjects(eMeshes,false);
      if(rHits.length>0){
        for(const e of enemies){
          if(e.meshes.includes(rHits[0].object)){
            applyHitToEnemy(e,rHits[0],reflectDmg);
            showPassiveMsg('⚔ 反弹 '+reflectDmg,'#cc44ff');
            break;
          }
        }
      } else {
        showPassiveMsg('🛡 格挡（无目标）','#cc44ff');
      }
    } else {
      // 近战格挡：仅减伤，无反弹
      showPassiveMsg('🛡 格挡','#cc44ff');
    }
  }
  P.hp=Math.max(0,P.hp-dmg);
  updateHpUI();
  document.getElementById('pain').style.background='rgba(233,69,96,0.45)';
  setTimeout(()=>document.getElementById('pain').style.background='rgba(233,69,96,0)',120);
  playHit();
  if(P.hp<=0) die();
}

}

function tickEnemyBurn(e,dt){
  if(!e||e.dying||!e.burnTimer||!e.burnStacks) return;
  e.burnTimer=Math.max(0,e.burnTimer-dt);
  e.burnFxTimer=(e.burnFxTimer||0)+dt;
  while(e.burnFxTimer>=0.10){
    e.burnFxTimer-=0.10;
    const fxPos=e.group.position.clone();
    fxPos.y+=0.7+Math.random()*0.9;
    spawnFlameBurst(fxPos,3);
  }
  e.burnTick=(e.burnTick||0)+dt;
  while(e.burnTick>=1.0 && !e.dying){
    e.burnTick-=1.0;
    const burnDmg=5*e.burnStacks;
    const hitPoint=e.group.position.clone(); hitPoint.y+=1.0;
    const fakeHit={object:e.armL||e.head,point:hitPoint};
    applyHitToEnemy(e,fakeHit,burnDmg,{allowHeadshot:false,effect:'flame'});
  }
  if(e.burnTimer<=0){
    e.burnStacks=0;
    e.burnTick=0;
    e.burnFxTimer=0;
  }
}

function applyHitToEnemy(e,hit,baseDmg,opts){
  const options=opts||{};
  // 刺客与火焰系伤害都不触发爆头
  const allowHeadshot=(options.allowHeadshot!==false)&&(options.effect!=='flame')&&(P.charId!=='blade');
  const headshot=allowHeadshot&&(hit.object===e.head);
  const dmg=Math.round(baseDmg*(headshot?HEADSHOT_MULT:1));
  e.hp-=dmg;
  e.refreshHp(Math.max(0,e.hp),e.maxHp);
  if(options.effect==='flame') spawnFlameBurst(hit.point,2);
  else if(options.effect==='volt') spawnShockBurst(hit.point,3);
  else if(options.effect==='grave') spawnGraveBurst(hit.point,3);
  else spawnBlood(hit.point);
  showDmgNum(hit.point,dmg,headshot);
  e.stunTimer=0.28;
  if(headshot){
    flashXhair('headshot',180);
    showHeadshotTag();
  } else {
    document.getElementById('xh-dot').style.transform='scale(2)';
    setTimeout(()=>document.getElementById('xh-dot').style.transform='',100);
  }
  playHit();

  // 被动：重火力吸血（主动激活时命中回血）
  if(P.charId==='fortress'&&P.fortressLifesteal){
    const heal=Math.max(1,Math.round(dmg*0.2));
    P.hp=Math.min(P.maxHp,P.hp+heal);
    updateHpUI();
  }

  if(e.hp<=0) killEnemy(e,headshot);
  return headshot;
}

// ═══════════════════════════════════════════════
// 检查玩家是否被墙阻挡
// ═══════════════════════════════════════════════
function isPlayerObstructed(enemyPos){
  const v3a=tmp.v3a, v3b=tmp.v3b;
  v3a.set(camera.position.x-enemyPos.x,0,camera.position.z-enemyPos.z);
  const distSq=v3a.x*v3a.x+v3a.z*v3a.z;
  if(distSq<0.0001) return false;
  const dist=Math.sqrt(distSq);
  v3a.normalize();
  v3b.set(enemyPos.x,1.5,enemyPos.z);
  tmp.ray.set(v3b,v3a);
  const hits=tmp.ray.intersectObjects(wallObjs,false);
  return hits.length>0 && hits[0].distance<dist-0.1;
}

// 玩家视角到敌人中心线是否被墙遮挡（用于牛仔锁定等）
function isEnemyVisibleFromPlayer(enemy){
  const v3a=tmp.v3a, v3b=tmp.v3b;
  const targetY=enemy.head?enemy.head.getWorldPosition(v3b).y:1.5;
  v3a.set(
    enemy.group.position.x-camera.position.x,
    targetY-camera.position.y,
    enemy.group.position.z-camera.position.z
  );
  const dist=v3a.length();
  if(dist<0.0001) return true;
  v3a.normalize();
  tmp.ray.set(camera.position,v3a);
  const wHits=tmp.ray.intersectObjects(wallObjs,false);
  return !(wHits.length>0&&wHits[0].distance<dist-0.1);
}

const PATROL_ARRIVE_SQ=0.09;

function doPatrol(ep,e,dt,radius,timerBase){
  e.state='patrol';
  e.patrolTimer-=dt;
  if(!e.patrolTarget||e.patrolTimer<=0){
    e.patrolTimer=timerBase+Math.random()*3;
    const a=Math.random()*Math.PI*2;
    e.patrolTarget={x:ep.x+Math.cos(a)*radius,z:ep.z+Math.sin(a)*radius};
  }
  const pdx=e.patrolTarget.x-ep.x, pdz=e.patrolTarget.z-ep.z;
  const mul=e.slowTimer>0?0.3:1.0;
  if(pdx*pdx+pdz*pdz>PATROL_ARRIVE_SQ) moveEntity(ep,pdx,pdz,e.speed*mul,dt);
  else e.patrolTarget=null;
}

let muzzleTimer=0;

// 单次射线伤害（含墙遮挡检测）
function doRayDmg(ox,oy,baseDmg){
  tmp.ray.setFromCamera({x:ox,y:oy},camera);
  const eMeshes=enemies.flatMap(e=>e.meshes);
  const eHits=tmp.ray.intersectObjects(eMeshes,false);
  if(eHits.length>0){
    const wHits=tmp.ray.intersectObjects(wallObjs,false);
    if(wHits.length>0&&wHits[0].distance<eHits[0].distance){
      spawnHole(wHits[0].point,wHits[0].face.normal);
    } else {
      const hit=eHits[0];
      for(const e of enemies){
        if(e.meshes.includes(hit.object)){ applyHitToEnemy(e,hit,baseDmg); break; }
      }
    }
  } else {
    const wHits=tmp.ray.intersectObjects(wallObjs,false);
    if(wHits.length>0) spawnHole(wHits[0].point,wHits[0].face.normal);
  }
}

function applyVoltSlow(e,duration){
  if(!e||e.dying) return;
  e.slowTimer=Math.max(e.slowTimer||0,duration||1.5);
}

function doVoltBeam(baseDmg){
  tmp.ray.setFromCamera({x:0,y:0},camera);
  const eMeshes=enemies.flatMap(e=>e.meshes);
  const hits=tmp.ray.intersectObjects(eMeshes,false);
  const hitEnemies=[];
  const seen=new Set();
  hits.forEach(hit=>{
    const e=enemies.find(en=>en.meshes.includes(hit.object));
    if(!e||e.dying||seen.has(e)) return;
    seen.add(e);
    hitEnemies.push({enemy:e,hit});
  });
  let anyHit=false;
  let overloadBlastPending=P.voltOverloadReady;
  hitEnemies.forEach(({enemy,hit},idx)=>{
    anyHit=true;
    applyHitToEnemy(enemy,hit,baseDmg,{allowHeadshot:false,effect:'volt'});
    applyVoltSlow(enemy,1.5);
    spawnShockBurst(hit.point,4);
    P.voltHitCount++;
    if(P.voltHitCount>=3&&!P.voltOverloadReady){
      P.voltHitCount-=3;
      P.voltOverloadReady=true;
      showPassiveMsg('过载已就绪','#00ccff');
    }
    if(overloadBlastPending&&idx===0){
      overloadBlastPending=false;
      P.voltOverloadReady=false;
      const center=hit.point.clone();
      const r=2.5, r2=r*r;
      enemies.forEach(e=>{
        if(e.dying||e===enemy) return;
        const dx=e.group.position.x-center.x;
        const dz=e.group.position.z-center.z;
        if(dx*dx+dz*dz<=r2){
          const p=e.group.position.clone(); p.y+=1.0;
          applyHitToEnemy(e,{object:e.armL||e.head,point:p},60,{allowHeadshot:false,effect:'volt'});
          applyVoltSlow(e,1.5);
        }
      });
      spawnShockBurst(center,14);
      showPassiveMsg('过载爆炸 60','#00ccff');
    }
  });
  if(!anyHit){
    const p=camera.position.clone();
    p.x+=-Math.sin(P.yaw)*7.5; p.y+=1.0; p.z+=-Math.cos(P.yaw)*7.5;
    spawnShockBurst(p,5);
  }
}

function shoot(){
  if(P.charId==='blade'||P.charId==='grave') return; // 纯近战角色不使用枪
  if(P.reloading||P.meleeing||P.ammo<=0) return;
  const now=performance.now();
  if(now-P.lastShot<(P.fireRate||110)) return;
  P.lastShot=now; P.ammo--; updateAmmoUI();
  if(P.charId==='pyro') playFlame();
  else if(P.charId==='volt') playVoltShot();
  else playGunshot();

  // 后坐力（狙击更大，机枪偏移随机；焚化者后坐力很小）
  const recoilScale=P.charId==='hawk'?2.2:P.charId==='fortress'?0.7:P.charId==='pyro'?0.35:P.charId==='volt'?0.9:1.0;
  P.recoilPitch-=(0.03+Math.random()*0.015)*recoilScale;
  P.recoilYaw+=(Math.random()-0.5)*0.018*recoilScale;
  gunGroup.position.z=P.charId==='pyro'?-0.20:-0.25;
  muzzleFlash.intensity=P.charId==='pyro'?4.5:6;
  muzzleTimer=P.charId==='pyro'?0.04:0.07;
  muzzleSprite.material.opacity=1.0;

  xhair.classList.add('spread');
  setTimeout(()=>xhair.classList.remove('spread'),100);

  let baseDmg=P.dmgMin+Math.floor(Math.random()*(P.dmgMax-P.dmgMin+1));
  // 牛仔右键速射：每发伤害减半
  if(P.charId==='cowboy'&&P.cowboyFanfire){
    baseDmg=Math.max(1,Math.round(baseDmg*0.5));
  }

  // 焚化者：前方120°扇形AOE喷火（8单位）+ 点燃
  if(P.charId==='pyro'){
    const fwdX=-Math.sin(P.yaw), fwdZ=-Math.cos(P.yaw);
    const range=8, rangeSq=range*range;
    let hitCount=0;
    enemies.forEach(e=>{
      if(e.dying) return;
      const dx=e.group.position.x-camera.position.x;
      const dz=e.group.position.z-camera.position.z;
      const distSq=dx*dx+dz*dz;
      if(distSq>rangeSq||distSq<0.0001) return;
      const dist=Math.sqrt(distSq);
      const dot=fwdX*(dx/dist)+fwdZ*(dz/dist);
      if(dot<0.5) return; // 120°扇形
      if(!isEnemyVisibleFromPlayer(e)) return;
      const falloff=Math.max(0.35,1-dist/range);
      const flameDmg=Math.max(1,Math.round(baseDmg*falloff));
      const p=e.group.position.clone(); p.y+=1.0;
      const fakeHit={object:e.armL||e.head,point:p};
      applyHitToEnemy(e,fakeHit,flameDmg,{allowHeadshot:false,effect:'flame'});
      igniteEnemy(e,1,2);
      hitCount++;
    });
    const muzzlePos=new THREE.Vector3();
    muzzleFlash.getWorldPosition(muzzlePos);
    spawnFlameBurst(muzzlePos,6);
    if(hitCount===0){
      const airPos=camera.position.clone();
      airPos.x+=fwdX*2.4; airPos.y+=0.9; airPos.z+=fwdZ*2.4;
      spawnFlameBurst(airPos,4);
    }
    if(P.ammo===0&&P.reserve>0) startReload();
    return;
  }
  if(P.charId==='volt'){
    doVoltBeam(baseDmg);
    if(P.ammo===0&&P.reserve>0) startReload();
    return;
  }

  if(P.shotCount>1){
    // 霰弹：多弹丸扩散，近距离才有效
    // 幽灵移速快，略微减小散布以保留中距离威胁
    const SHOT_SPREAD=P.charId==='phantom'?0.08:0.12;
    const MAX_RANGE=12; // 超过此距离伤害清零
    for(let i=0;i<P.shotCount;i++){
      const ox=(Math.random()-0.5)*SHOT_SPREAD;
      const oy=(Math.random()-0.5)*SHOT_SPREAD;
      // 近距离检测：用射线打到敌人的距离判断
      tmp.ray.setFromCamera({x:ox,y:oy},camera);
      const eMeshes=enemies.flatMap(e=>e.meshes);
      const eHits=tmp.ray.intersectObjects(eMeshes,false);
      if(eHits.length>0){
        const wHits=tmp.ray.intersectObjects(wallObjs,false);
        if(wHits.length>0&&wHits[0].distance<eHits[0].distance){
          spawnHole(wHits[0].point,wHits[0].face.normal);
        } else {
          const hit=eHits[0];
          if(hit.distance>MAX_RANGE) continue; // 超距离不伤
          // 近距离线性衰减
          const falloff=Math.max(0,1-hit.distance/MAX_RANGE);
          const pelletDmg=Math.round(baseDmg*falloff);
          if(pelletDmg<=0) continue;
          for(const e of enemies){
            if(e.meshes.includes(hit.object)){ applyHitToEnemy(e,hit,pelletDmg); break; }
          }
        }
      } else {
        const wHits=tmp.ray.intersectObjects(wallObjs,false);
        if(wHits.length>0) spawnHole(wHits[0].point,wHits[0].face.normal);
      }
    }
  } else {
    // 单发（精度偏移用于机枪）
    const sp=P.spread||0;
    const ox=(Math.random()-0.5)*sp;
    const oy=(Math.random()-0.5)*sp;
    doRayDmg(ox,oy,baseDmg);
  }

  if(P.ammo===0&&P.reserve>0) startReload();
}

function killEnemy(e,headshot){
  if(e.dying) return;
  e.dying=true; e.state='dying'; e.dyingTimer=0.6;
  e.meshes=[];
  spawnDrop(e.group.position,rollDrop(e.kind));
  P.kills++; P.streak++;
  P.score+=(e.score||100)*(P.streak>=3?2:1);
  updateScoreUI();
  document.getElementById('kill-streak').textContent=P.streak>=3?P.streak+' KILL STREAK!':'';
  showKillBanner(e.kind,!!headshot);
  flashXhair('kill',420);

  // 通知波次系统
  onEnemyKilledForWave();

  // ── 被动触发 ──
  // 突击手：战意——击杀后叠层，刷新衰减计时
  if(P.charId==='reaper'){
    P.reaperStacks=Math.min(3,P.reaperStacks+1);
    P.reaperStackTimer=1.0; // 1秒内不衰减
    updatePassiveStackUI();
    showPassiveMsg('战意 ×'+P.reaperStacks,'#e94560');
  }
  // 猎手：爆头击杀立刻补满弹夹
  if(P.charId==='hawk'&&headshot){
    P.ammo=P.maxAmmo;
    updateAmmoUI();
    showPassiveMsg('弹夹补满','#ffd700');
  }
  // 幽灵：击杀任意敌人立刻重置E冷却
  if(P.charId==='phantom'){
    P.skillCd=0;
    updateSkillUI();
    showPassiveMsg('击杀！E冷却重置','#00ffaa');
  }
  // 牛仔：爆头击杀回10HP
  if(P.charId==='cowboy'&&headshot){
    const before=P.hp;
    P.hp=Math.min(P.maxHp,P.hp+10);
    if(P.hp>before){ updateHpUI(); showPassiveMsg('+10 HP','#f0a500'); }
  }
  // 刺客：击杀触发血怒被动
  if(P.charId==='blade'){
    P.bladeFury=true;
    P.bladeFuryTimer=2.0;
    showPassiveMsg('血怒！下次攻击伤害翻倍','#cc44ff');
  }
}

// ── 刺客：双刀攻击 ──────────────────────────────────
// 与普通近战不同：用 fireRate 节流而非 meleeTimer 锁定，速度更快
function doBladeAttack(){
  const now=performance.now();
  if(now-P.lastShot<(P.fireRate||350)) return;
  P.lastShot=now;
  playMelee();
  P.meleeing=true; P.meleeTimer=0.35; // 短后摇，比普通近战快

  tmp.ray.setFromCamera({x:0,y:0},camera);
  const hits=tmp.ray.intersectObjects(enemies.flatMap(e=>e.meshes),false);
  if(hits.length>0&&hits[0].distance<2.5){
    const wHits=tmp.ray.intersectObjects(wallObjs,false);
    if(!(wHits.length>0&&wHits[0].distance<hits[0].distance)){
      for(const e of enemies){
        if(e.meshes.includes(hits[0].object)){
          let dmg=P.dmgMin+Math.floor(Math.random()*(P.dmgMax-P.dmgMin+1));
          if(P.bladeFury){
            dmg*=2;
            P.bladeFury=false; P.bladeFuryTimer=0;
            showPassiveMsg('💥 血怒爆发！','#cc44ff');
          }
          applyHitToEnemy(e,hits[0],dmg);
          break;
        }
      }
    }
  }
}

// ── 掘墓者：链锤重击（慢速，高单次，带溅射）──────────────
function doGraveAttack(){
  const now=performance.now();
  if(now-P.lastShot<(P.fireRate||800)) return;
  P.lastShot=now;
  playMelee();
  P.meleeing=true; P.meleeTimer=0.62;

  const dirX=-Math.sin(P.yaw), dirZ=-Math.cos(P.yaw);
  const center=tmp.v3a.set(
    camera.position.x+dirX*3.0,
    1.0,
    camera.position.z+dirZ*3.0
  );
  const splashR=2.5, splashR2=splashR*splashR;
  const targets=[];
  enemies.forEach(e=>{
    if(e.dying) return;
    const dx=e.group.position.x-center.x;
    const dz=e.group.position.z-center.z;
    if(dx*dx+dz*dz<=splashR2) targets.push(e);
  });
  if(targets.length===0){
    spawnGraveBurst(center.clone(),10);
    return;
  }

  const baseDmg=45+Math.floor(Math.random()*16); // 45-60
  targets.sort((a,b)=>{
    const adx=a.group.position.x-center.x, adz=a.group.position.z-center.z;
    const bdx=b.group.position.x-center.x, bdz=b.group.position.z-center.z;
    return (adx*adx+adz*adz)-(bdx*bdx+bdz*bdz);
  });
  const main=targets[0];
  const p0=main.group.position.clone(); p0.y+=1.0;
  applyHitToEnemy(main,{object:main.armL||main.head,point:p0},baseDmg,{allowHeadshot:false,effect:'grave'});

  let splashHits=0;
  for(let i=1;i<targets.length;i++){
    const e=targets[i];
    const p=e.group.position.clone(); p.y+=1.0;
    applyHitToEnemy(e,{object:e.armL||e.head,point:p},Math.round(baseDmg*0.5),{allowHeadshot:false,effect:'grave'});
    splashHits++;
  }

  P.graveImpact=Math.min(5,(P.graveImpact||0)+1);
  updateAmmoUI();
  spawnGraveBurst(center.clone(),12);
  if(splashHits>0) showPassiveMsg('震地溅射 '+splashHits,'#aaaaaa');
}


function startReload(){
  if(P.reserve<=0||P.ammo===P.maxAmmo||P.reloading) return;
  P.reloading=true; P.reloadProgress=0; playReload();
}
function finishReload(){
  const take=Math.min(P.maxAmmo-P.ammo,P.reserve);
  P.ammo+=take; P.reserve-=take;
  P.reloading=false; updateAmmoUI();
  document.getElementById('reload-bar').style.width='0';
}
function doMelee(){
  if(P.meleeing) return;
  P.meleeing=true; P.meleeTimer=0.5; playMelee();
  // 无前摇：立即判定伤害
  tmp.ray.setFromCamera({x:0,y:0},camera);
  const hits=tmp.ray.intersectObjects(enemies.flatMap(e=>e.meshes),false);
  if(hits.length>0&&hits[0].distance<2.5){
    // 检查射线是否先击中墙（敌人被遮挡）
    const wHits=tmp.ray.intersectObjects(wallObjs,false);
    // 如果有墙且墙更近，则敌人被遮挡
    if(!(wHits.length>0 && wHits[0].distance < hits[0].distance)){
      for(const e of enemies){
        if(e.meshes.includes(hits[0].object)){
          if(P.charId==='pyro'){
            const meleeDmg=34+Math.floor(Math.random()*7);
            applyHitToEnemy(e,hits[0],meleeDmg,{allowHeadshot:false,effect:'flame'});
            igniteEnemy(e,2,2.2);
          } else if(P.charId==='volt'){
            const meleeDmg=30+Math.floor(Math.random()*7);
            applyHitToEnemy(e,hits[0],meleeDmg,{allowHeadshot:false,effect:'volt'});
            applyVoltSlow(e,1.5);
            spawnShockBurst(hits[0].point,6);
          } else {
            applyHitToEnemy(e,hits[0],28+Math.floor(Math.random()*5)); // 28-32伤害
          }
          break;
        }
      }
    }
  }
}

// 冷却UI更新
const SKILL_CIRCUM=2*Math.PI*22; // svg circle r=22
function updateSkillUI(){
  const fill=document.getElementById('skill-ring-fill');
  const cdText=document.getElementById('skill-cd-text');
  const nameEl=document.getElementById('skill-name');
  if(!fill) return;
  if(P.skillCd>0){
    const pct=P.skillCd/P.skillMaxCd;
    fill.style.strokeDashoffset=SKILL_CIRCUM*pct;
    fill.style.stroke='#555';
    cdText.textContent=Math.ceil(P.skillCd)+'s';
  } else {
    fill.style.strokeDashoffset=0;
    fill.style.stroke=P.skillActive?'#fff':(CHARS[P.charId]?CHARS[P.charId].color:'#f0a500');
    cdText.textContent='';
  }
  if(P.charId&&CHARS[P.charId]) nameEl.textContent=CHARS[P.charId].name;
}

function showSkillBanner(text,color,duration){
  const el=document.getElementById('skill-active-banner');
  el.textContent=text; el.style.color=color; el.style.opacity=1;
  clearTimeout(el._t);
  el._t=setTimeout(()=>el.style.opacity=0, duration||1500);
}

// 技能触发入口
function useSkill(){
  if(!P.charId||gameDead||gamePaused) return;
  const id=P.charId;
  // 刺客技能走独立逻辑（不用 P.skillCd 门控）
  if(id==='blade'){ skillBlade(); return; }
  if(P.skillCd>0) return;
  if(id==='reaper')  skillReaper();
  else if(id==='fortress') skillFortress();
  else if(id==='phantom')  skillPhantom();
  else if(id==='hawk')     skillHawk();
  else if(id==='cowboy')   skillCowboy();
  else if(id==='pyro')     skillPyro();
  else if(id==='volt')     skillVolt();
  else if(id==='grave')    skillGrave();
}

// ── 刺客：残影斩（最多存3次，独立CD 10s/次）────────────
function skillBlade(){
  if(P.bladeCharges<=0) return; // 无存量时无法使用
  P.bladeCharges--;
  P.bladeChargeTimers.push(10.0); // 推入一个10s充能计时
  updateBladeSkillUI();
  showSkillBanner('残影斩','#cc44ff',800);

  // 向前冲刺，路径上每个敌人最多连中3刀（每刀固定100伤害）
  if(P.phantomDashing) return; // 复用冲刺锁
  P.phantomDashing=true;
  const DASH_DIST=10, DASH_DMG=100, SLASH_COUNT=3, STEPS=20;
  const dirX=-Math.sin(P.yaw), dirZ=-Math.cos(P.yaw);
  const startX=camera.position.x, startZ=camera.position.z;
  let step=0;
  const hitMap=new Map(); // enemy → slash count

  const dashInterval=setInterval(()=>{
    step++;
    const t=step/STEPS;
    const tx=startX+dirX*DASH_DIST*t;
    const tz=startZ+dirZ*DASH_DIST*t;
    if(canMove(tx,tz)){
      camera.position.x=tx;
      camera.position.z=tz;
    }
    enemies.forEach(e=>{
      if(e.dying) return;
      const slashes=hitMap.get(e)||0;
      if(slashes>=SLASH_COUNT) return;
      const ex=e.group.position.x-camera.position.x;
      const ez=e.group.position.z-camera.position.z;
      if(ex*ex+ez*ez<4.0){
        hitMap.set(e,(slashes+1));
        const fakeHit={object:e.head,point:e.group.position.clone()};
        applyHitToEnemy(e,fakeHit,DASH_DMG);
        if(!e.dying) e.state='chase';
      }
    });
    if(step>=STEPS){ clearInterval(dashInterval); P.phantomDashing=false; }
  },16);
}

// ── 幽灵：冲刺斩 ─────────────────────────────────
// 向视线方向冲刺，路径上敌人受55伤害，击杀刷新CD（被动也会刷新，见killEnemy）
function skillPhantom(){
  if(P.phantomDashing) return;
  P.skillCd=8; P.skillMaxCd=8;
  P.phantomDashing=true;
  showSkillBanner('冲刺斩','#00ffaa',600);
  updateSkillUI();

  const DASH_DIST=10, DASH_DMG=55, STEPS=20;
  const dirX=-Math.sin(P.yaw), dirZ=-Math.cos(P.yaw);
  const startX=camera.position.x, startZ=camera.position.z;
  let step=0;
  const hitEnemies=new Set();

  const dashInterval=setInterval(()=>{
    step++;
    const t=step/STEPS;
    const tx=startX+dirX*DASH_DIST*t;
    const tz=startZ+dirZ*DASH_DIST*t;
    if(canMove(tx,tz)){
      camera.position.x=tx;
      camera.position.z=tz;
    }
    // 路径伤害检测
    enemies.forEach(e=>{
      if(e.dying||hitEnemies.has(e)) return;
      const ex=e.group.position.x-camera.position.x;
      const ez=e.group.position.z-camera.position.z;
      if(ex*ex+ez*ez<3.5){
        hitEnemies.add(e);
        const fakeHit={object:e.head,point:e.group.position.clone()};
        const killed=e.hp<=DASH_DMG;
        applyHitToEnemy(e,fakeHit,DASH_DMG);
        // 命中后强制进入追击状态（不论存活还是击杀），硬直结束后会追玩家
        if(!e.dying) e.state='chase';
        // 击杀刷新CD（注意：killEnemy里的被动也会刷新，这里保留双保险）
        if(killed){
          P.skillCd=0;
          updateSkillUI();
        }
      }
    });
    if(step>=STEPS){ clearInterval(dashInterval); P.phantomDashing=false; }
  },16);
}

// 3发打完自动收弓进入CD

function startHawkCharge(){
  if(!P.hawkBowActive||P.hawkBowAmmo<=0||P.hawkCharging) return;
  P.hawkCharging=true;
  P.hawkCharge=0;
}

function releaseHawkArrow(){
  if(!P.hawkBowActive||!P.hawkCharging) return;
  P.hawkCharging=false;

  const charge=Math.min(1,P.hawkCharge/1.5);
  const AOE_DMG=Math.round(80+140*charge);
  const AOE_R=2.5+2.5*charge;

  // 发射箭矢：方向直接从相机世界朝向取，保证与准星完全一致
  const arrowGroup=new THREE.Group();
  const arrowBody=new THREE.Mesh(new THREE.BoxGeometry(0.04,0.04,0.6),
    new THREE.MeshBasicMaterial({color:0xffdd00}));
  const arrowTip=new THREE.Mesh(new THREE.ConeGeometry(0.05,0.15,4),
    new THREE.MeshBasicMaterial({color:0xff8800}));
  arrowTip.rotation.x=Math.PI/2; arrowTip.position.z=-0.37;
  arrowGroup.add(arrowBody); arrowGroup.add(arrowTip);

  // 取相机世界空间的前向量（-Z方向），这才是准星真正指向的方向
  const camDir=new THREE.Vector3();
  camera.getWorldDirection(camDir); // 已经归一化，考虑了所有旋转含后坐力

  const dirX=camDir.x, dirY=camDir.y, dirZ=camDir.z;

  // 起点：相机位置沿准星方向前移1单位
  arrowGroup.position.set(
    camera.position.x+dirX*1.0,
    camera.position.y+dirY*1.0,
    camera.position.z+dirZ*1.0
  );
  scene.add(arrowGroup);

  const ARROW_SPD=38;
  let travelTime=0;
  const MAX_TRAVEL=3.5;

  const arrowTick=setInterval(()=>{
    const s=0.016;
    travelTime+=s;
    arrowGroup.position.x+=dirX*ARROW_SPD*s;
    arrowGroup.position.y+=dirY*ARROW_SPD*s;
    arrowGroup.position.z+=dirZ*ARROW_SPD*s;
    arrowGroup.lookAt(
      arrowGroup.position.x+dirX,
      arrowGroup.position.y+dirY,
      arrowGroup.position.z+dirZ);

    // 碰到敌人直接爆炸（扩大命中半径到3.5）
    let hitEnemy=false;
    for(const e of enemies){
      if(e.dying) continue;
      const ex=e.group.position.x-arrowGroup.position.x;
      const ey=e.group.position.y-arrowGroup.position.y;
      const ez=e.group.position.z-arrowGroup.position.z;
      if(ex*ex+ey*ey+ez*ez<3.5){hitEnemy=true;break;}
    }

    // 碰墙/地面/敌人/超时
    const hitWall=isWall(arrowGroup.position.x,arrowGroup.position.z);
    const hitGround=arrowGroup.position.y<=0.1;
    if(hitEnemy||hitWall||hitGround||travelTime>MAX_TRAVEL){
      clearInterval(arrowTick);
      scene.remove(arrowGroup);
      hawkExplode(arrowGroup.position.clone(),AOE_DMG,AOE_R);
    }
  },16);

  // 消耗箭矢
  P.hawkBowAmmo--;
  showSkillBanner('爆炸弓  ×'+P.hawkBowAmmo,'#ffd700',800);

  // 3发打完：收弓，进CD
  if(P.hawkBowAmmo<=0){
    setTimeout(()=>{
      P.hawkBowActive=false;
      P.skillActive=false;
      P.skillCd=12; P.skillMaxCd=12;
      switchGunModel('hawk'); // 换回狙击枪
      showSkillBanner('弓收起','#ffd700',800);
      updateSkillUI();
    },400);
  }
}
function hawkExplode(pos,dmg,radius){
  // 爆炸闪光
  const flash=new THREE.PointLight(0xff8800,8,radius*3);
  flash.position.copy(pos); scene.add(flash);
  setTimeout(()=>scene.remove(flash),200);

  showSkillBanner('爆炸！','#ffd700',600);

  // AOE伤害
  const r2=radius*radius;
  enemies.forEach(e=>{
    if(e.dying) return;
    const dx=e.group.position.x-pos.x;
    const dz=e.group.position.z-pos.z;
    if(dx*dx+dz*dz<r2){
      const fakeHit={object:e.head,point:e.group.position.clone()};
      applyHitToEnemy(e,fakeHit,dmg);
    }
  });
}

// ── 牛仔：神射手 ─────────────────────────────────
// 2s锁定视野内所有敌人，2s后击杀
function skillCowboy(){
  P.skillCd=25; P.skillMaxCd=25;
  P.skillActive=true; P.skillTimer=4.0; // 2s锁定 + 2s等待
  P.cowboyAimPhase=1; // 1=锁定期，2=击杀期
  P.cowboyAimTimer=2.0;
  P.cowboyAimTargets=[];

  // 收集视野内敌人：距离60单位内 + 在玩家视线120°角内
  const fwdX=-Math.sin(P.yaw);
  const fwdZ=-Math.cos(P.yaw);
  enemies.forEach(e=>{
    if(e.dying) return;
    const dx=e.group.position.x-camera.position.x;
    const dz=e.group.position.z-camera.position.z;
    const distSq=dx*dx+dz*dz;
    if(distSq>3600) return; // 60单位距离上限
    // 计算敌人方向与玩家朝向的夹角
    const dist=Math.sqrt(distSq);
    const dot=fwdX*(dx/dist)+fwdZ*(dz/dist);
    if(dot>0.5&&isEnemyVisibleFromPlayer(e)) { // 仅锁定无遮挡目标
      P.cowboyAimTargets.push(e);
    }
  });
  showSkillBanner('神射手：锁定 '+P.cowboyAimTargets.length+' 目标','#f0a500',2000);
  updateSkillUI();
}

// ── 焚化者：助燃热浪 ────────────────────────────────
// 向前释放热浪，触碰墙体停止；命中60伤害并点燃
function skillPyro(){
  P.skillCd=14; P.skillMaxCd=14;
  const origin=new THREE.Vector3(camera.position.x,1.15,camera.position.z);
  const dir=new THREE.Vector3(-Math.sin(P.yaw),0,-Math.cos(P.yaw)).normalize();
  const maxRange=12;
  tmp.ray.set(origin,dir);
  const wHits=tmp.ray.intersectObjects(wallObjs,false);
  const travel=(wHits.length>0)?Math.max(0,Math.min(maxRange,wHits[0].distance-0.2)):maxRange;
  const waveRadius=2.7;
  const waveR2=waveRadius*waveRadius;
  let hitCount=0;

  enemies.forEach(e=>{
    if(e.dying) return;
    const v=tmp.v3a.set(
      e.group.position.x-origin.x,
      0,
      e.group.position.z-origin.z
    );
    const proj=v.x*dir.x+v.z*dir.z;
    if(proj<0||proj>travel) return;
    const sideSq=v.lengthSq()-proj*proj;
    if(sideSq>waveR2) return;
    const p=e.group.position.clone(); p.y+=1.0;
    const fakeHit={object:e.armL||e.head,point:p};
    applyHitToEnemy(e,fakeHit,60,{allowHeadshot:false,effect:'flame'});
    igniteEnemy(e,2,2.5);
    hitCount++;
  });

  for(let d=0.6;d<travel;d+=0.75){
    const p=origin.clone().addScaledVector(dir,d);
    spawnFlameBurst(p,5);
  }
  showSkillBanner('助燃热浪 '+(hitCount>0?('命中 '+hitCount):'未命中'),'#ff6600',1200);
  updateSkillUI();
}

  P.skillCd=20; P.skillMaxCd=20;
  P.skillActive=true;
  P.graveCharging=true;
  showSkillBanner('末日重击 · 蓄力','#888888',800);
  updateSkillUI();
  setTimeout(()=>{
    if(P.charId!=='grave'||gameDead) return;

    P.skillActive=false;
    graveSlam();
    updateSkillUI();
  },800);

function graveSlam(){
  const range=9, rangeSq=range*range;
  const px=camera.position.x, pz=camera.position.z;
  let pulled=0;
  enemies.forEach((e,idx)=>{
    if(e.dying) return;
    const dx=e.group.position.x-px;
    const dz=e.group.position.z-pz;
    const d2=dx*dx+dz*dz;
    if(d2>rangeSq) return;
    const dist=Math.max(0.001,Math.sqrt(d2));
    const dirX=dx/dist, dirZ=dz/dist;
    const targetDist=1.8+0.2*(idx%5);
    const tx=px+dirX*targetDist;
    const tz=pz+dirZ*targetDist;
    if(canMove(tx,tz)){
      e.group.position.x=tx;
      e.group.position.z=tz;
      pulled++;
    }
    const p=e.group.position.clone(); p.y+=1.0;
    applyHitToEnemy(e,{object:e.armL||e.head,point:p},52,{allowHeadshot:false,effect:'grave'});
    e.stunTimer=Math.max(e.stunTimer||0,0.6);
  });

  const heal=pulled*30;
  if(heal>0){
    const before=P.hp;
    P.hp=Math.min(P.maxHp,P.hp+heal);
    if(P.hp>before) updateHpUI();
  }
  spawnGraveBurst(new THREE.Vector3(px,1.0,pz),18);
  showSkillBanner('末日重击：拉拽 '+pulled+' 目标','#888888',1300);
}

// 输入
// ═══════════════════════════════════════════════
const keys={};
document.addEventListener('keydown',e=>{
  keys[e.code]=true;
  if(e.code==='KeyR') startReload();
  // F/V 近战：刺客/掘墓者调用专属攻击，其他角色用通用近战
  if(e.code==='KeyF'||e.code==='KeyV'){
    if(P.charId==='blade') doBladeAttack();
    else if(P.charId==='grave') doGraveAttack();
    else doMelee();
  }
  if(e.code==='Escape'||e.code==='KeyP') togglePause();
  if(e.code==='KeyE'&&gameStarted&&!gameDead&&!gamePaused) useSkill();
  // Shift：使用治疗药剂（回复50HP，上限1瓶，每波清完补充）
  if((e.code==='ShiftLeft'||e.code==='ShiftRight')&&gameStarted&&!gameDead&&!gamePaused) useMedkit();
  if(e.code==='Space'&&gameStarted&&!gameDead&&!gamePaused){
    e.preventDefault();
    if(P.jumpCount<P.maxJumps){
      P.velY=7.5;     // 起跳初速度
      P.onGround=false;
      P.jumpCount++;
    }
  }
});
// 猎手：E键松开不再发箭（改为左键控制）
document.addEventListener('keyup',e=>{
  keys[e.code]=false;
});

let locked=false;
canvas.addEventListener('click',()=>{ if(gameStarted&&!gameDead) canvas.requestPointerLock(); });
document.addEventListener('pointerlockchange',()=>{locked=document.pointerLockElement===canvas;});
document.addEventListener('mousemove',e=>{
  if(!locked) return;
  P.yaw-=e.movementX*0.0022;
  P.pitch=Math.max(-1.3,Math.min(1.3,P.pitch-e.movementY*0.0022));
});
document.addEventListener('mousedown',e=>{
  if(e.button===0&&locked){
    // 猎手拿弓时：左键按下开始蓄力
    if(P.charId==='hawk'&&P.hawkBowActive){
      startHawkCharge();
    } else if(P.charId==='blade'){
      // 刺客：左键直接触发双刀攻击
      doBladeAttack();
    } else if(P.charId==='grave'){
      // 掘墓者：左键触发链锤攻击
      doGraveAttack();
    } else {
      P.shooting=true;
      if(!P.fullAuto) shoot();
    }
  }
  // 右键处理
  if(e.button===2&&locked){
    if(P.charId==='blade'){
      // 刺客右键：格挡
      P.bladeBlocking=true;
    } else if(P.charId==='cowboy'){
      // 牛仔右键：快速清空弹夹
      if(!P.reloading&&P.ammo>0){
        P.cowboyFanfire=true;
        P.cowboyFanTimer=0;
      }
    } else if(P.charId==='hawk'&&!P.hawkBowActive){
      // 猎手右键：开镜（拿弓时不能开镜）
      P.hawkScoping=true;
    }
  }
  // Mouse 4/5 侧键：近战（button 3=侧后, 4=侧前/Mouse5）
  if((e.button===3||e.button===4)&&locked&&gameStarted&&!gameDead&&!gamePaused){
    if(P.charId==='blade') doBladeAttack();
    else if(P.charId==='grave') doGraveAttack();
    else doMelee();
  }
});
document.addEventListener('mouseup',e=>{
  if(e.button===0){
    P.shooting=false;
    // 猎手拿弓时：左键松开发射
    if(P.charId==='hawk'&&P.hawkBowActive&&P.hawkCharging) releaseHawkArrow();
  }
  if(e.button===2){
    P.bladeBlocking=false; // 刺客松开右键：解除格挡
    P.cowboyFanfire=false;
    // 猎手松开右键：关镜
    if(P.charId==='hawk') P.hawkScoping=false;
  }
});

// 游戏状态
// ═══════════════════════════════════════════════
let gameStarted=false, gameDead=false, gamePaused=false, lastTime=0;

function togglePause(){
  if(!gameStarted||gameDead) return;
  gamePaused=!gamePaused;
  const el=document.getElementById('pause');
  if(gamePaused){
    document.exitPointerLock();
    el.style.display='flex';
    document.getElementById('pause-stats').innerHTML=
      '<span class="label">得分</span><span>'+P.score+'</span>'+
      '<span class="label">击杀</span><span>'+P.kills+'</span>'+
      '<span class="label">最高连杀</span><span>'+P.streak+'</span>'+
      '<span class="label">HP</span><span>'+Math.ceil(P.hp)+' / '+P.maxHp+'</span>'+
      '<span class="label">弹药</span><span>'+P.ammo+' / '+P.reserve+'</span>';
  } else {
    el.style.display='none';
    lastTime=performance.now();
    canvas.requestPointerLock();
  }
}

document.getElementById('resumeBtn').onclick=()=>togglePause();
document.getElementById('pause-restartBtn').onclick=()=>location.reload();

document.getElementById('restartBtn').onclick=()=>location.reload();

function die(){
  gameDead=true;
  document.exitPointerLock();
  playDeath();
  const d=document.getElementById('dead');
  d.style.display='flex';
  document.getElementById('dead-stats').innerHTML=
    '得分: <span>'+P.score+'</span><br>击杀: <span>'+P.kills+'</span><br>最高连杀: <span>'+P.streak+'</span><br>到达波次: <span>第'+WAVE.num+'波</span>';
}

// ═══════════════════════════════════════════════
// 主循环
// ═══════════════════════════════════════════════
function loop(now){
  requestAnimationFrame(loop);
  if(!gameStarted||gameDead||gamePaused) return;
  const dt=Math.min((now-lastTime)/1000,0.05);
  lastTime=now;

  // 射击（全自动按住触发，半自动只走mousedown单发）
  if(P.shooting&&P.fullAuto) shoot();

  // 牛仔快排：右键一次迅速射出所有子弹（绕过fireRate限制）
  if(P.cowboyFanfire&&P.charId==='cowboy'){
    P.cowboyFanTimer-=dt;
    if(P.cowboyFanTimer<=0&&P.ammo>0&&!P.reloading){
      P.cowboyFanTimer=0.08;
      // 直接执行射击逻辑，跳过fireRate冷却检查
      P.lastShot=0; // 强制重置，让shoot()通过时间检查
      shoot();
    }
    if(P.ammo===0) P.cowboyFanfire=false;
  }

  // ── 刺客：血怒计时 + 充能计时 ──
  if(P.charId==='blade'){
    // 血怒倒计时
    if(P.bladeFuryTimer>0){
      P.bladeFuryTimer-=dt;
      if(P.bladeFuryTimer<=0){ P.bladeFury=false; P.bladeFuryTimer=0; }
    }
    // 残影斩充能：每个计时器各自倒计时，归零则加一层存量
    if(P.bladeChargeTimers&&P.bladeChargeTimers.length>0){
      for(let i=P.bladeChargeTimers.length-1;i>=0;i--){
        P.bladeChargeTimers[i]-=dt;
        if(P.bladeChargeTimers[i]<=0){
          P.bladeChargeTimers.splice(i,1);
          P.bladeCharges=Math.min(3,P.bladeCharges+1);
        }
      }
      updateBladeSkillUI();
    }
  }

  // 被动：突击手战意衰减
  if(P.charId==='reaper'&&P.reaperStacks>0){
    P.reaperStackTimer-=dt;
    if(P.reaperStackTimer<=0){
      P.reaperStacks--;
      P.reaperStackTimer=P.reaperStacks>0?1.0:0;
      updatePassiveStackUI();
    }
    // 战意射速加成：每层 fireRate 减少30%（不低于50ms）
    const baseRate=CHARS[P.charId].wp.fireRate;
    P.fireRate=Math.max(50,Math.round(baseRate*(1-0.3*P.reaperStacks)));
  } else if(P.charId==='reaper'){
    P.fireRate=CHARS[P.charId].wp.fireRate;
  }

  // ── 主动技能：冷却倒计时 ──
  if(P.skillCd>0){
    P.skillCd=Math.max(0,P.skillCd-dt);
    updateSkillUI();
  }

  // ── 突击手肾上腺素：持续计时 ──
  if(P.charId==='reaper'&&P.skillActive){
    P.skillTimer-=dt;
    if(P.skillTimer<=0){
      P.skillActive=false;
      P._reaperSpeedBoost=false;
    }
    // 无限弹药（ammo不减，shoot里ammo--后立刻补回来）
    if(P.ammo<P.maxAmmo&&P.skillActive) P.ammo=P.maxAmmo;
  }

  // ── 重火力吸血：持续计时 ──
  if(P.charId==='fortress'&&P.skillActive){
    P.skillTimer-=dt;
    if(P.skillTimer<=0){
      P.skillActive=false;
      P.fortressLifesteal=false;
      showSkillBanner('吸血结束','#4488ff',800);
    }
  }

  // ── 猎手蓄弓：蓄力计时 + 准星拉伸反馈 ──
  if(P.charId==='hawk'&&P.hawkCharging){
    P.hawkCharge=Math.min(1.5,P.hawkCharge+dt);
    // 蓄力越满准星越小收拢（视觉反馈）
    const chargeRatio=P.hawkCharge/1.5;
    const xhairEl=document.getElementById('xhair');
    if(xhairEl) xhairEl.style.transform=
      `translate(-50%,-50%) scale(${1-chargeRatio*0.6})`;
  } else if(P.charId==='hawk'&&!P.hawkCharging){
    const xhairEl=document.getElementById('xhair');
    if(xhairEl) xhairEl.style.transform='translate(-50%,-50%) scale(1)';
  }

  // ── 牛仔神射手：两段逻辑 ──
  if(P.charId==='cowboy'&&P.skillActive){
    P.cowboyAimTimer-=dt;
    if(P.cowboyAimPhase===1&&P.cowboyAimTimer<=0){
      // 锁定结束，进入击杀倒计时
      P.cowboyAimPhase=2;
      P.cowboyAimTimer=2.0;
      showSkillBanner('击杀中...','#f0a500',2000);
    } else if(P.cowboyAimPhase===2&&P.cowboyAimTimer<=0){
      // 击杀所有锁定目标
      P.skillActive=false;
      let killed=0;
      P.cowboyAimTargets.forEach(e=>{
        if(!e.dying){
          const fakeHit={object:e.head,point:e.group.position.clone()};
          applyHitToEnemy(e,fakeHit,99999);
          killed++;
        }
      });
      P.cowboyAimTargets=[];
      showSkillBanner('击杀 '+killed+' 敌人！','#f0a500',1500);
    }
  }

  // 换弹
  if(P.reloading){
    P.reloadProgress+=dt/P.reloadTime;
    if(P.reloadProgress>=1){
      finishReload();
    } else {
      document.getElementById('reload-bar').style.width=(P.reloadProgress*100)+'%';
      const ph=P.reloadProgress;
      gunGroup.position.y=-0.22-(ph<0.4?Math.sin(ph/0.4*Math.PI)*0.18:Math.sin((1-ph)/0.6*Math.PI)*0.1);
      gunGroup.rotation.z=ph<0.4?Math.sin(ph/0.4*Math.PI)*0.3:Math.sin((1-ph)/0.6*Math.PI)*0.15;
    }
  }

  // 近战：独立武器模型动画（后摇0.5s，无前摇，不锁射击）
  if(P.meleeing){
    P.meleeTimer-=dt;
    const t=Math.max(0,Math.min(1,1-P.meleeTimer/0.5)); // 0→1 进度
    const s=Math.sin(t*Math.PI); // 弧线：起止为0，中段最大
    const s2=Math.sin(t*Math.PI*0.5); // 单向弧：0→1→慢降

    // 出招时：隐藏主武器，显示近战武器
    gunGroup.visible=false;
    meleeGroup.visible=true;

    if(P.charId==='reaper'){
      // 枪托横扫：从右腰抡到左前方
      meleeGroup.position.set(0.35-s*0.55, -0.28+s*0.05, -0.3-s*0.1);
      meleeGroup.rotation.set(-0.3+s*0.4, -0.8+s*1.6, -0.4-s*0.5);
    } else if(P.charId==='fortress'){
      // 左拳直捅：从身体左侧向正前方猛冲
      meleeGroup.position.set(-0.1-s2*0.05, -0.25+s*0.04, -0.25-s*0.55);
      meleeGroup.rotation.set(-s*0.3, s*0.2, 0.1-s*0.15);
    } else if(P.charId==='phantom'){
      // 短刀斜刺：握刀右腰出发，向左前方穿刺——刀尖(-z)始终朝向敌人
      // 起始：右腰，刀平持略下倾；冲刺到正前偏左，刀尖直指前方
      meleeGroup.position.set(0.28-s*0.22, -0.26+s*0.06, -0.18-s*0.62);
      meleeGroup.rotation.set(-0.2-s*0.25, 0.5-s*0.55, 0.3-s*0.35);
    } else if(P.charId==='hawk'){
      // 箭矢刺击：从右侧腰部向正前方直刺，箭尖(-z)朝敌人
      meleeGroup.position.set(0.3-s*0.18, -0.22+s*0.04, -0.15-s*0.70);
      meleeGroup.rotation.set(-0.15-s*0.1, 0.3-s*0.32, 0.1-s*0.12);
    } else if(P.charId==='cowboy'){
      // 套绳从右下甩到左上：起点右下角，终点左上角，rotation跟着画弧
      // x: 右→左(0.35→-0.25)  y: 下→上(-0.4→0.25)  z: 近→稍远(-0.25→-0.4)
      meleeGroup.position.set(0.35-s*0.60, -0.40+s*0.65, -0.25-s*0.15);
      meleeGroup.rotation.set(-0.4+s*0.5, 0.6-s*1.0, 1.2-s*2.2);
    } else if(P.charId==='blade'){
      // 双刀交叉横扫：右刀从右下→左前，左刀从左→右，交叉出击
      meleeGroup.position.set(0.18-s*0.30, -0.22+s*0.06, -0.25-s*0.30);
      meleeGroup.rotation.set(-0.2+s*0.35, -0.5+s*1.1, 0.6-s*1.2);
    } else if(P.charId==='pyro'){
      // 燃烧左拳：贴身冲拳
      meleeGroup.position.set(-0.04+s2*0.05, -0.20+s*0.03, -0.22-s*0.68);
      meleeGroup.rotation.set(-0.08+s*0.22, -0.22+s*0.28, 0.35-s*0.25);
    } else if(P.charId==='volt'){
      // 电棍斜劈
      meleeGroup.position.set(0.16-s*0.30, -0.24+s*0.04, -0.22-s*0.55);
      meleeGroup.rotation.set(-0.30+s*0.30, 0.45-s*0.65, 0.55-s*0.75);
    } else if(P.charId==='grave'){
      // 两段式战斧：前摇上举 -> 纵向下劈（减少前推，避免“拖把推刺感”）
      if(t<0.35){
        const u=t/0.35; // 0 -> 1
        // 上举到头顶右后侧，蓄力感
        meleeGroup.position.set(
          0.18+u*0.03,
          -0.42+u*0.50,
          -0.52+u*0.08
        );
        meleeGroup.rotation.set(
          -1.90-u*0.35,
          0.06+u*0.18,
          0.42+u*0.36
        );
      } else {
        const v=(t-0.35)/0.65; // 0 -> 1
        // 纵向砍下：主要沿Y轴下落，Z仅小幅前移
        meleeGroup.position.set(
          0.21-v*0.10,
          0.08-v*0.90,
          -0.44-v*0.55
        );
        meleeGroup.rotation.set(
          -2.25+v*1.85,
          0.24-v*0.18,
          0.78-v*0.72
        );
      }
    } else {
      meleeGroup.position.set(0.2, -0.2-s*0.3, -0.3-s*0.4);
      meleeGroup.rotation.set(-s*1.0, 0, 0);
    }

    if(P.meleeTimer<=0){
      P.meleeing=false;
      meleeGroup.visible=false;
      gunGroup.visible=true;
      // 重置近战武器位置
      meleeGroup.position.set(0,0,0);
      meleeGroup.rotation.set(0,0,0);
    }
  } else if(P.charId==='blade'&&P.bladeBlocking){
    // 刺客右键格挡：双刀交叉挡在前方
    gunGroup.visible=false;
    meleeGroup.visible=true;
    const sway=Math.sin(now*0.012)*0.02;
    meleeGroup.position.set(0.02+sway, -0.06, -0.58);
    meleeGroup.rotation.set(-0.30, 0.02, -0.12);
  } else {
    // 非近战/非格挡状态确保主武器可见、近战武器隐藏
    if(!gunGroup.visible) gunGroup.visible=true;
    meleeGroup.visible=false;
  }

  // 后坐力恢复
  P.recoilPitch*=0.82; P.recoilYaw*=0.82;

  // 枪口闪消退
  if(muzzleTimer>0){
    muzzleTimer-=dt;
    if(muzzleTimer<=0){muzzleFlash.intensity=0;muzzleSprite.material.opacity=0;}
  }

  // 移动（移除Shift奔跑，统一基础速度）
  let baseSpd=5.5;
  // 突击手肾上腺素：移速+20%
  if(P.charId==='reaper'&&P._reaperSpeedBoost) baseSpd*=1.2;
  // 重火力：移速慢
  if(P.charId==='fortress') baseSpd*=0.72;
  // 幽灵：移速快（被动改为击杀重置E冷却，补偿移速）
  if(P.charId==='phantom') baseSpd*=1.35;
  // 猎手：略慢
  if(P.charId==='hawk') baseSpd*=0.88;
  // 焚化者：偏慢
  if(P.charId==='pyro') baseSpd*=0.84;
  // 掘墓者：最慢
  if(P.charId==='grave') baseSpd*=0.58;
  // 刺客：最快
  if(P.charId==='blade') baseSpd*=1.45;
  const spd=baseSpd;
  const sin=Math.sin(P.yaw), cos=Math.cos(P.yaw);
  let mx=0,mz=0;
  if(keys['KeyW']||keys['ArrowUp'])    {mx-=sin;mz-=cos;}
  if(keys['KeyS']||keys['ArrowDown'])  {mx+=sin;mz+=cos;}
  if(keys['KeyA']||keys['ArrowLeft'])  {mx-=cos;mz+=sin;}
  if(keys['KeyD']||keys['ArrowRight']) {mx+=cos;mz-=sin;}
  const ml=Math.sqrt(mx*mx+mz*mz);
  P.isMoving=ml>0;
  if(P.isMoving){mx=mx/ml*spd*dt;mz=mz/ml*spd*dt;}
  if(canMove(camera.position.x+mx,camera.position.z)) camera.position.x+=mx;
  if(canMove(camera.position.x,camera.position.z+mz)) camera.position.z+=mz;

  // 跳跃 & 重力
  const GRAVITY=22;
  const GROUND_Y=1.7;
  if(!P.onGround){
    P.velY-=GRAVITY*dt;
    camera.position.y+=P.velY*dt;
    if(camera.position.y<=GROUND_Y){
      camera.position.y=GROUND_Y;
      P.velY=0;
      P.onGround=true;
      P.jumpCount=0;  // 落地重置跳跃次数
    }
  }

  // 脚步声
  if(P.isMoving&&P.onGround){
    P.stepTimer+=dt*(spd>7?1.5:1);
    if(P.stepTimer>0.45){P.stepTimer=0;playStep();}
  } else {P.stepTimer=0;}

  // 头部摇摆（仅在地面时）
  if(P.isMoving&&P.onGround) P.bobPhase+=dt*8;
  const bobY=P.isMoving&&P.onGround?Math.sin(P.bobPhase)*0.04:0;
  const bobX=P.isMoving&&P.onGround?Math.sin(P.bobPhase*0.5)*0.02:0;
  if(P.onGround) camera.position.y=1.7+bobY;  // 空中由重力控制Y
  camera.rotation.order='YXZ';
  camera.rotation.y=P.yaw;
  camera.rotation.x=P.pitch+P.recoilPitch;
  camera.rotation.z=bobX;

  // 猎手开镜：平滑缩小/恢复FOV，切换开镜UI
  {
    const scopeActive=P.charId==='hawk'&&P.hawkScoping&&!P.hawkBowActive&&gameStarted&&!gameDead&&!gamePaused;
    const targetFov=scopeActive?35:80;
    camera.fov+=(targetFov-camera.fov)*0.18;
    camera.updateProjectionMatrix();
    const scopeEl=document.getElementById('scope-overlay');
    const xhairEl=document.getElementById('xhair');
    if(scopeActive){
      scopeEl.style.display='block';
      if(xhairEl) xhairEl.style.display='none';
    } else {
      scopeEl.style.display='none';
      if(xhairEl&&gameStarted&&!gameDead) xhairEl.style.display='';
    }
  }

  // 枪摆动
  if(!P.reloading&&!P.meleeing){
    const idleY=P.charId==='grave'?-0.10:-0.22;
    const idleX=P.charId==='grave'?0.24:0.22;
    const idleZ=P.charId==='grave'?-0.50:-0.4;
    const idleRx=P.charId==='grave'?-2.79:0; // 约160°上举
    const idleRy=P.charId==='grave'?0.12:0.05;
    const idleRz=P.charId==='grave'?-0.22:0;
    gunGroup.position.y+=(idleY+bobY*1.5-gunGroup.position.y)*0.15;
    gunGroup.position.x+=(idleX+bobX-gunGroup.position.x)*0.1;
    gunGroup.position.z+=(idleZ-gunGroup.position.z)*0.25;
    gunGroup.rotation.x+=(idleRx-gunGroup.rotation.x)*0.15;
    gunGroup.rotation.y+=(idleRy-gunGroup.rotation.y)*0.12;
    gunGroup.rotation.z+=(idleRz-gunGroup.rotation.z)*0.15;
  }

  // 粒子
  updateParticles(dt);

  // 掉落物
  updateDrops(dt);

  // 敌人AI
  for(let i=enemies.length-1;i>=0;i--){
    const e=enemies[i];
    const ep=e.group.position;
    const dx=camera.position.x-ep.x;
    const dz=camera.position.z-ep.z;
    const distSq=dx*dx+dz*dz;
    const attackRangeSq=e.attackRange*e.attackRange;

    // 倒地
    if(e.dying){
      e.dyingTimer-=dt;
      e.group.rotation.z+=dt*4;
      e.group.position.y-=dt*1.5;
      if(e.dyingTimer<=0){scene.remove(e.group);enemies.splice(i,1);}
      continue;
    }

    // 灼烧DOT
    tickEnemyBurn(e,dt);
    if(e.dying) continue;
    if(e.slowTimer>0) e.slowTimer=Math.max(0,e.slowTimer-dt);
    const speedMul=e.slowTimer>0?0.3:1.0;

    // 硬直
    if(e.stunTimer>0){
      e.stunTimer-=dt;
      const flash=Math.sin(e.stunTimer*40)>0;
      e.meshes.forEach(m=>{
        if(m.material&&!Array.isArray(m.material)&&m.material.emissive)
          m.material.emissive.set(flash?0xffffff:0x000000);
      });
      continue;
    } else {
      e.meshes.forEach(m=>{
        if(m.material&&!Array.isArray(m.material)&&m.material.emissive)
          m.material.emissive.set(0x000000);
      });
    }

    // 朝向
    e.group.rotation.y=Math.atan2(e.state==='flee'?-dx:dx, e.state==='flee'?-dz:dz);

    // 腿臂动画
    const asp=e.state==='flee'?5:e.state==='patrol'?2:4;
    e.legAnim+=dt*asp;
    e.legL.rotation.x= Math.sin(e.legAnim)*0.5;
    e.legR.rotation.x=-Math.sin(e.legAnim)*0.5;
    e.armL.rotation.x=-Math.sin(e.legAnim)*0.35;
    e.armR.rotation.x= Math.sin(e.legAnim)*0.35;

    // 逃跑
    if(e.state==='flee'){
      moveEntity(ep,-dx,-dz,e.speed*1.2*speedMul,dt);
      if(distSq>400) e.state='patrol';
      continue;
    }

    // 残血逃跑
    if(e.fleeHp>0&&e.hp/e.maxHp<e.fleeHp&&distSq<256){e.state='flee';continue;}

    // 重装兵：中距离停下射击
    if(e.kind==='heavy'){
      if(distSq>attackRangeSq){
        e.state='chase'; moveEntity(ep,dx,dz,e.speed*speedMul,dt);
      } else {
        // 检查是否有墙阻挡敌人和玩家之间的直线
        const wallObstructed=isPlayerObstructed(ep);
        if(wallObstructed){
          e.state='chase'; moveEntity(ep,dx,dz,e.speed*speedMul,dt);
        } else {
          e.state='attack'; e.attackTimer+=dt;
          if(e.attackTimer>=e.attackRate){
            e.attackTimer=0;
            const dmg=e.attackDmg+Math.floor(Math.random()*3);
            damagePlayer(dmg,'ranged'); // 重装兵远程攻击
          }
        }
      }
      continue;
    }

    // 狙击手：保持距离，远程扣血
    if(e.kind==='sniper'){
      const preferMinSq=(e.preferDist-1)*(e.preferDist-1);
      if(distSq<preferMinSq){
        moveEntity(ep,-dx,-dz,e.speed*speedMul,dt);
      } else if(distSq<=attackRangeSq){
        if(isPlayerObstructed(ep)) doPatrol(ep,e,dt,3,2);
        else {
          e.state='attack'; e.attackTimer+=dt;
          if(e.attackTimer>=e.attackRate){
            e.attackTimer=0;
            damagePlayer(e.attackDmg,'ranged'); // 狙击手远程攻击
          }
        }
      } else {
        doPatrol(ep,e,dt,3,2);
      }
      continue;
    }

    // 普通兵 & 狂战士：近身
    if(distSq<attackRangeSq){
      // 检查是否有墙阻挡敌人和玩家之间的直线
      const wallObstructed=isPlayerObstructed(ep);
      if(wallObstructed){
        e.state='chase'; moveEntity(ep,dx,dz,e.speed*speedMul,dt);
      } else {
        e.state='attack'; e.attackTimer+=dt;
        if(e.attackTimer>=e.attackRate){
          e.attackTimer=0;
          const dmg=e.kind==='berserker'?e.attackDmg:e.attackDmg+Math.floor(Math.random()*3);
          P.streak=0;
          document.getElementById('kill-streak').textContent='';
          damagePlayer(dmg,'melee'); // 普通兵/狂战士近战攻击
        }
      }
    } else if(distSq<400){
      e.state='chase'; moveEntity(ep,dx,dz,e.speed*speedMul,dt);
    } else {
      doPatrol(ep,e,dt,4,1.5);
    }
  }

  // 波次系统
  tickWave(dt);

  renderer.render(scene,camera);
}

requestAnimationFrame(loop);

// ═══════════════════════════════════════════════
// 角色定义（在所有Three.js和函数初始化之后）
// ═══════════════════════════════════════════════
const CHARS={
  reaper:{
    id:'reaper',name:'REAPER',title:'突击手',color:'#e94560',
    weapon:'突击步枪 · 30发 · 全自动',
    stats:{speed:3,hp:2,firepower:3},
    passive:'战意：击杀后1秒射速+30%，叠3层',
