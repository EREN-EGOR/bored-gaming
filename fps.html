const CHAR_ORDER=['reaper','fortress','phantom','hawk','cowboy','volt','pyro','grave','blade'];
let selectedChar=null;

// 应用角色属性到 P
function applyCharacter(id){
  const c=CHARS[id];
  P.charId=id;
  if(id==='fortress'){ P.maxHp=150; P.hp=150; }
  else if(id==='pyro'){ P.maxHp=130; P.hp=130; }
  else if(id==='grave'){ P.maxHp=125; P.hp=125; }
  else { P.maxHp=100; P.hp=100; }
  P.maxJumps=1;
  const wp=c.wp;
  P.ammo=wp.ammo; P.maxAmmo=wp.maxAmmo; P.reserve=wp.reserve;
  P.fireRate=wp.fireRate;
  P.dmgMin=wp.dmgMin; P.dmgMax=wp.dmgMax;
  P.reloadTime=wp.reloadTime;
  P.spread=wp.spread;
  P.shotCount=wp.shotCount;
  P.fullAuto=wp.fullAuto;
  P.muzzleColor=wp.muzzleColor;
  switchGunModel(id);
  switchMeleeWeapon(id);
  muzzleFlash.color.setHex(wp.muzzleColor);
  muzzleSprite.material.color.setHex(wp.muzzleColor);
  const skillIcons={reaper:'💉',fortress:'🩸',phantom:'💨',hawk:'🏹',cowboy:'🎯',volt:'⚡',pyro:'🔥',grave:'⛓',blade:'⚔'};
  const skillCds={reaper:15,fortress:20,phantom:8,hawk:12,cowboy:25,volt:20,pyro:14,grave:20,blade:10};
  const iconEl=document.getElementById('skill-icon');
  const nameEl=document.getElementById('skill-name');
  const keyEl=document.getElementById('skill-key');
  if(iconEl) iconEl.textContent=skillIcons[id]||'⚡';
  if(nameEl) nameEl.textContent=c.name;
  if(keyEl) keyEl.style.color=c.color;
  const ammoLabel=document.getElementById('ammo-label');
  if(ammoLabel) ammoLabel.textContent=id==='pyro'?'FUEL':id==='grave'?'IMPACT':'AMMO';
  P.skillMaxCd=skillCds[id]||15;
  P.skillCd=0;
  P.skillActive=false; P.skillTimer=0;
  P.reaperStacks=0; P.reaperStackTimer=0;
  P.fortressLifesteal=false;
  P.hawkCharging=false; P.hawkCharge=0;
  P.hawkBowActive=false; P.hawkBowAmmo=3;
  P.cowboyAimTargets=[]; P.cowboyAimPhase=0;
  P.voltHitCount=0; P.voltOverloadReady=false;
  P.graveImpact=0; P.graveCharging=false;
  // ── 刺客专属状态 ──
  P.bladeFury=false; P.bladeFuryTimer=0;
  P.bladeBlocking=false;
  P.bladeCharges=3; P.bladeChargeTimers=[];
  updateSkillUI();
  updateHpUI();
  updateAmmoUI();
  // 刺客：初始化技能UI为存量显示
  if(id==='blade') updateBladeSkillUI();
  // 刺客无弹药，隐藏弹药HUD（掘墓者需要显示冲击层数）
  if(id==='blade'){
    document.getElementById('ammo-wrap').style.display='none';
  } else {
    document.getElementById('ammo-wrap').style.display='';
  }
}

// 生成选角卡片
(function buildCards(){
  const container=document.getElementById('cards');
  CHAR_ORDER.forEach(id=>{
    const c=CHARS[id];
    const card=document.createElement('div');
    card.className='char-card';
    card.dataset.id=id;
    const statBar=(label,val,color)=>`
      <div class="stat-row">
        <span class="stat-label">${label}</span>
        <div class="stat-bar"><div class="stat-fill" style="width:${val/5*100}%;background:${color}"></div></div>
      </div>`;
    card.innerHTML=`
      <div class="cname" style="color:${c.color}">${c.name}</div>
      <div class="ctitle">${c.title}</div>
      <div class="cweapon">${c.weapon}</div>
      ${statBar('速度',c.stats.speed,'#00ffaa')}
      ${statBar('生命',c.stats.hp,'#e94560')}
      ${statBar('火力',c.stats.firepower,'#f0a500')}
      <div class="skill-row">
        <div class="skill-text"><b>被动</b> ${c.passive}</div>
        <div class="skill-text" style="margin-top:4px"><b>主动</b> ${c.active}</div>
      </div>`;
    card.addEventListener('click',()=>{
      document.querySelectorAll('.char-card').forEach(el=>el.classList.remove('selected'));
      card.classList.add('selected');
      selectedChar=id;
      document.getElementById('confirm-btn').disabled=false;
      const q=document.getElementById('char-quote');
      q.style.opacity=0;
      setTimeout(()=>{q.textContent=c.quote;q.style.opacity=1;},200);
    });
    container.appendChild(card);
  });
})();

document.getElementById('confirm-btn').onclick=()=>{
  if(!selectedChar) return;
  applyCharacter(selectedChar);
  document.getElementById('char-select').style.display='none';
  // 显示游戏HUD
  ['xhair','wave-hud','hp-wrap','ammo-wrap','score-wrap','skill-ui'].forEach(id=>{
    document.getElementById(id).style.display='';
  });
  // 刺客无弹药：隐藏弹药HUD
  if(selectedChar==='blade') document.getElementById('ammo-wrap').style.display='none';
  // 初始化药剂UI（游戏开始时没有药剂）
  updateMedkitUI();
  gameStarted=true;
  lastTime=performance.now();
  canvas.requestPointerLock();
  setTimeout(()=>startWave(1), 1000);
};
